# Nav2 Navigation Parameters для rob_box
# Main Pi - автономная навигация
# На основе стандартного nav2_params.yaml из ROS2 Humble

bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odom
    bt_loop_duration: 10
    # #4435: 20 мс (дефолт Humble) под нагрузкой Main Pi (load 10–18) не хватало на подтверждение
    # цели FollowPath: BtActionNode по таймауту сбрасывал future и не знал goal handle, его halt()
    # отменить цель не мог — controller_server 108 с вёл «сироту». Ожидание подтверждения в BT
    # не блокирует (узел возвращает RUNNING), поэтому 1 с безопасна. Дыру сужает, но не закрывает:
    # остаток гасит ControllerHalt в rob_box_mcp_tools/tools/navigation.py.
    default_server_timeout: 1000
    enable_groot_monitoring: false
    groot_zmq_publisher_port: 1666
    groot_zmq_server_port: 1667
    default_nav_to_pose_bt_xml: "/config/nav2/behavior_trees/navigate_to_pose_w_replanning.xml"
    default_nav_through_poses_bt_xml: "/config/nav2/behavior_trees/navigate_through_poses.xml"
    plugin_lib_names:
    - nav2_compute_path_to_pose_action_bt_node
    - nav2_compute_path_through_poses_action_bt_node
    - nav2_smooth_path_action_bt_node
    - nav2_follow_path_action_bt_node
    - nav2_spin_action_bt_node
    - nav2_wait_action_bt_node
    - nav2_back_up_action_bt_node
    - nav2_drive_on_heading_bt_node
    - nav2_clear_costmap_service_bt_node
    - nav2_is_stuck_condition_bt_node
    - nav2_goal_reached_condition_bt_node
    - nav2_goal_updated_condition_bt_node
    - nav2_globally_updated_goal_condition_bt_node
    - nav2_is_path_valid_condition_bt_node
    - nav2_initial_pose_received_condition_bt_node
    - nav2_reinitialize_global_localization_service_bt_node
    - nav2_rate_controller_bt_node
    - nav2_distance_controller_bt_node
    - nav2_speed_controller_bt_node
    - nav2_truncate_path_action_bt_node
    - nav2_truncate_path_local_action_bt_node
    - nav2_goal_updater_node_bt_node
    - nav2_recovery_node_bt_node
    - nav2_pipeline_sequence_bt_node
    - nav2_round_robin_node_bt_node
    - nav2_transform_available_condition_bt_node
    - nav2_time_expired_condition_bt_node
    - nav2_path_expiring_timer_condition
    - nav2_distance_traveled_condition_bt_node
    - nav2_single_trigger_bt_node
    - nav2_goal_updated_controller_bt_node
    - nav2_is_battery_low_condition_bt_node
    - nav2_navigate_through_poses_action_bt_node
    - nav2_navigate_to_pose_action_bt_node
    - nav2_remove_passed_goals_action_bt_node
    - nav2_planner_selector_bt_node
    - nav2_controller_selector_bt_node
    - nav2_goal_checker_selector_bt_node
    - nav2_controller_cancel_bt_node
    - nav2_path_longer_on_approach_bt_node
    - nav2_wait_cancel_bt_node
    - nav2_spin_cancel_bt_node
    - nav2_back_up_cancel_bt_node
    - nav2_drive_on_heading_cancel_bt_node

controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 20.0  # High frequency for responsive control, ICP latency handled by transform_tolerance
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.08  # Increased from 0.05 - more relaxed progress check
      movement_time_allowance: 30.0  # Increased from 20.0 - more time for smoother motion
    general_goal_checker:
      stateful: true
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.25  # Increased from 0.15 - don't overshoot trying to be too precise
      yaw_goal_tolerance: 0.20  # Increased from 0.15 (~11 deg) - smoother final rotation
    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: true
      min_vel_x: -0.1
      min_vel_y: 0.0
      max_vel_x: 0.15  # Reduced for smoother approach
      max_vel_y: 0.0
      # 0.6 (было 0.8): меньше заносит корму на косяк, когда DWB доворачивает в узком проёме
      # (HIL 05.11, #4365: t2 — проём 0.85 на восток 2/2, см. docs/research/2026-11-05-nav2-hil-tuning.md).
      max_vel_theta: 0.6
      min_speed_xy: 0.05  # 50 mm/s - minimum speed due to min_duty=0.06
      max_speed_xy: 0.15
      min_speed_theta: 0.0  # Allow fine heading corrections while still moving forward
      acc_lim_x: 0.15  # Original working value from e367f09
      acc_lim_y: 0.0
      acc_lim_theta: 1.0  # Faster yaw response reduces stop-turn-go oscillation
      decel_lim_x: -0.15  # Original working value from e367f09
      decel_lim_y: 0.0
      decel_lim_theta: -1.0  # Symmetric with angular acceleration for cleaner curves
      vx_samples: 20
      vy_samples: 0  # Differential drive cannot move sideways
      vtheta_samples: 40  # More samples for better trajectory selection
      sim_time: 1.5  # Increased from 1.2 - plan smoother trajectories
      linear_granularity: 0.05
      angular_granularity: 0.025
      transform_tolerance: 0.5  # Increased from 0.3 - tolerate ICP latency
      xy_goal_tolerance: 0.25  # Match general_goal_checker
      trans_stopped_velocity: 0.03  # Don't classify slow arc motion as a full stop
      short_circuit_trajectory_evaluation: true
      stateful: true
      # ObstacleFootprint вместо BaseObstacle: BaseObstacle смотрит одну клетку под
      # центром (с прямоугольником это вписанный радиус 0.30 — углы 0.43 не видит),
      # ObstacleFootprint — все клетки контура габарита по траектории.
      critics: ["RotateToGoal", "Oscillation", "ObstacleFootprint", "GoalAlign", "PathAlign", "PathDist", "GoalDist"]
      # 0.04 (было 0.02): стоимость клеток под контуром заметнее — держит корпус по центру проёма.
      ObstacleFootprint.scale: 0.04
      RotateToGoal.scale: 8.0  # Keep final alignment, but stop dominating normal path following
      RotateToGoal.slowing_factor: 5.0
      # lookahead_time — НЕ проверка столкновения (dwb_critics/rotate_to_goal.cpp): курс
      # траектории оценивается в момент lookahead_time, а при -1 — в её конце (sim_time
      # 1.5 с). Столкновение разворота на месте ловит ObstacleFootprint по всем позам
      # траектории. 1.0 с (> 0 по решению Шифу 04.11) — внутри горизонта sim_time 1.5 с.
      RotateToGoal.lookahead_time: 1.0
      Oscillation.scale: 0.5  # Reduced from default (1.0) - less strict oscillation detection
      # Курс по пути перед проёмом (HIL 05.11): при 24 / 0.15 DWB подводил корпус к проёму
      # 0.8–0.9 м наискось (до 21°), защита стопила по косяку. 48 / 0.325 (дефолт Nav2) —
      # точка на пути дальше носа, корпус входит по оси.
      PathAlign.scale: 48.0
      PathAlign.forward_point_distance: 0.325
      GoalAlign.scale: 12.0  # Avoid in-place pre-alignment far away from the goal
      GoalDist.scale: 20.0
      PathDist.scale: 32.0  # было 25: ближе к линии пути (она идёт по центру проёма)

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_footprint
      use_sim_time: false
      rolling_window: true
      width: 5
      height: 5
      resolution: 0.05
      transform_tolerance: 1.0  # Increased from 0.5 — LiDAR scans can be ~0.83s behind TF after restart
      tf_buffer_duration: 30.0  # Keep TF history 30s — prevents drops when TF buffer is fresh after restart
      # Габарит — прямоугольник по замеру рулеткой (Шифу 04.11): 0.61 м вдоль хода,
      # 0.605 м поперёк. Совпадает с мешем base_link.stl (x −0.3036…+0.3064,
      # y ±0.303): центр корпуса смещён от base_footprint вперёд на 1.4 мм.
      # Вписанный радиус 0.3025, описанный 0.43 (был круг robot_radius 0.45:
      # в проём 0.9 м центр не пускал, сим шаг 6 — DWB 5/15 против 25/25).
      footprint: "[[0.3064, 0.3025], [0.3064, -0.3025], [-0.3036, -0.3025], [-0.3036, 0.3025]]"
      # Запас 2 см. Сим 04.11 (по 3 прогона polygon/turn90/dead_end): 0.01 — тупик 1.1 м
      # 2/3 и зазор 0.043; 0.03 — всё 3/3, зазор в тупике 0.081; от 0.05 — проём 0.8
      # 1/3, разворот в тупике 0/3; 0.10 — проём 0.9 0/3. HIL 05.11 (#4365): с 0.03 в проёме
      # 0.85 DWB пишет «No valid trajectories … Trajectory Hits Obstacle» (на бок 0.092 м),
      # с 0.02 (и критиками выше) проём 0.85 на восток проходит. Тупик с 0.02 не мерян.
      footprint_padding: 0.02
      plugins: ["voxel_layer", "inflation_layer"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        # Считается от препятствия до центра робота: ближе вписанного радиуса
        # 0.3225 (0.3025 + padding) — INSCRIBED, дальше спад до 0.57.
        # 0.57 = описанный радиус 0.459 (с padding) + ~0.10 м — тот же запас, что
        # был у круга (0.45 + 0.10): стоимость не обрывается раньше угла корпуса
        # при развороте. В проёме 0.9 м по оси (0.45 от стен) — ~177 из 252.
        inflation_radius: 0.57
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: true
        publish_voxel_map: false
        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 16
        max_obstacle_height: 2.0
        mark_threshold: 0
        # В local costmap оставляем только LiDAR scan, чтобы исключить stale depth
        # наблюдения и проверить, исчезнут ли ложные obstacle hits и oscillation.
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      static_layer:
        map_subscribe_transient_local: true
        enabled: false
      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_footprint
      use_sim_time: false
      # Габарит — тот же прямоугольник, что у local_costmap (замер 04.11)
      footprint: "[[0.3064, 0.3025], [0.3064, -0.3025], [-0.3036, -0.3025], [-0.3036, 0.3025]]"
      footprint_padding: 0.02  # как у local_costmap
      resolution: 0.05
      transform_tolerance: 1.0  # Increased from 0.5 — LiDAR scans can be ~0.83s behind TF after restart
      tf_buffer_duration: 30.0  # Keep TF history 30s — prevents drops when TF buffer is fresh after restart
      track_unknown_space: true
      # Rolling window mode для работы без статической карты
      # Размер 50x50м покрывает типичную область работы робота
      rolling_window: true
      width: 50
      height: 50
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        # Считается от препятствия до центра робота: ближе вписанного радиуса
        # 0.3225 (0.3025 + padding) — INSCRIBED, дальше спад до 0.57.
        # 0.57 = описанный радиус 0.459 (с padding) + ~0.10 м — тот же запас, что
        # был у круга (0.45 + 0.10): стоимость не обрывается раньше угла корпуса
        # при развороте. В проёме 0.9 м по оси (0.45 от стен) — ~177 из 252.
        inflation_radius: 0.57
      always_send_full_costmap: true

planner_server:
  ros__parameters:
    expected_planner_frequency: 20.0
    use_sim_time: false
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.5
      use_astar: true
      allow_unknown: true

smoother_server:
  ros__parameters:
    use_sim_time: false
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true

behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
      # simulate_ahead_time здесь НЕ ставить: Spin (Humble, spin.cpp) читает его без
      # префикса плагина — ниже, на уровне behavior_server. Ключ spin.simulate_ahead_time
      # (0.0 с 28.02.2026) Nav2 не читал, проверка всё время шла с 0.5 с.
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    # odom, как local costmap (costmap_topic выше): Spin/BackUp ищут позу робота в этой
    # costmap. С map при сдвиге map→odom больше полуокна (2.5 м) — «Pose Goes Off Grid.
    # Collision Ahead - Exiting Spin» без всякого препятствия (HIL 05.11, #4365).
    global_frame: odom
    robot_base_frame: base_footprint
    transform_tolerance: 0.5  # Increased for ICP latency tolerance
    use_sim_time: false
    # Проверка столкновения Spin/BackUp/DriveOnHeading вперёд по времени (Шифу 04.11:
    # при развороте проверять). Общая для трёх behavior. 2.0 с — дефолт Nav2: при
    # 0.6 рад/с это 1.2 рад впереди, а торможение с 0.6 рад/с при 0.6 рад/с² — 0.3 рад,
    # т.е. 0.5 с покрывали ровно тормозной угол без запаса на задержку costmap (5 Гц)
    # и ICP. Ложных отказов больше не станет: симуляция обрезается остатком угла
    # (Spin) или пути (BackUp), отказ = столкновение в пределах самой команды.
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.6  # Original value from e367f09
    min_rotational_vel: 0.2  # Allow slow spins
    rotational_acc_lim: 0.6  # Original value from e367f09, match DWB

waypoint_follower:
  ros__parameters:
    use_sim_time: false
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: true
      waypoint_pause_duration: 200

velocity_smoother:
  ros__parameters:
    use_sim_time: false
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: "OPEN_LOOP"
    max_velocity: [0.2, 0.0, 0.8]  # не в цепочке на роботе (NAV2_SMOOTH_CMD_VEL=false)
    min_velocity: [-0.15, 0.0, -0.8]  # Symmetric limits
    max_accel: [0.2, 0.0, 1.0]  # Match DWB acceleration limits
    max_decel: [-0.2, 0.0, -1.0]  # Match DWB deceleration limits
    odom_topic: "odom"
    odom_duration: 0.1
    deadband_velocity: [0.02, 0.0, 0.05]  # Small deadband: linear 2cm/s, angular ~3deg/s
    velocity_timeout: 1.0

lifecycle_manager_navigation:
  ros__parameters:
    use_sim_time: false
    autostart: true
    node_names: [
      'controller_server',
      'smoother_server',
      'planner_server',
      'behavior_server',
      'bt_navigator',
      'waypoint_follower',
      'velocity_smoother'
    ]
