# Nav2 Navigation Parameters для rob_box
# Main Pi - автономная навигация
# На основе стандартного nav2_params.yaml из ROS2 Humble

bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20
    enable_groot_monitoring: false
    groot_zmq_publisher_port: 1666
    groot_zmq_server_port: 1667
    default_nav_to_pose_bt_xml: "/config/nav2/behavior_trees/navigate_to_pose_w_replanning.xml"
    default_nav_through_poses_bt_xml: "/config/nav2/behavior_trees/navigate_through_poses.xml"
    plugin_lib_names:
    - nav2_compute_path_to_pose_action_bt_node
    - nav2_compute_path_through_poses_action_bt_node
    - nav2_smooth_path_action_bt_node
    - nav2_follow_path_action_bt_node
    - nav2_spin_action_bt_node
    - nav2_wait_action_bt_node
    - nav2_back_up_action_bt_node
    - nav2_drive_on_heading_bt_node
    - nav2_clear_costmap_service_bt_node
    - nav2_is_stuck_condition_bt_node
    - nav2_goal_reached_condition_bt_node
    - nav2_goal_updated_condition_bt_node
    - nav2_globally_updated_goal_condition_bt_node
    - nav2_is_path_valid_condition_bt_node
    - nav2_initial_pose_received_condition_bt_node
    - nav2_reinitialize_global_localization_service_bt_node
    - nav2_rate_controller_bt_node
    - nav2_distance_controller_bt_node
    - nav2_speed_controller_bt_node
    - nav2_truncate_path_action_bt_node
    - nav2_truncate_path_local_action_bt_node
    - nav2_goal_updater_node_bt_node
    - nav2_recovery_node_bt_node
    - nav2_pipeline_sequence_bt_node
    - nav2_round_robin_node_bt_node
    - nav2_transform_available_condition_bt_node
    - nav2_time_expired_condition_bt_node
    - nav2_path_expiring_timer_condition
    - nav2_distance_traveled_condition_bt_node
    - nav2_single_trigger_bt_node
    - nav2_goal_updated_controller_bt_node
    - nav2_is_battery_low_condition_bt_node
    - nav2_navigate_through_poses_action_bt_node
    - nav2_navigate_to_pose_action_bt_node
    - nav2_remove_passed_goals_action_bt_node
    - nav2_planner_selector_bt_node
    - nav2_controller_selector_bt_node
    - nav2_goal_checker_selector_bt_node
    - nav2_controller_cancel_bt_node
    - nav2_path_longer_on_approach_bt_node
    - nav2_wait_cancel_bt_node
    - nav2_spin_cancel_bt_node
    - nav2_back_up_cancel_bt_node
    - nav2_drive_on_heading_cancel_bt_node

controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 20.0  # High frequency for responsive control, ICP latency handled by transform_tolerance
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.08  # Increased from 0.05 - more relaxed progress check
      movement_time_allowance: 30.0  # Increased from 20.0 - more time for smoother motion
    general_goal_checker:
      stateful: true
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.25  # Increased from 0.15 - don't overshoot trying to be too precise
      yaw_goal_tolerance: 0.20  # Increased from 0.15 (~11 deg) - smoother final rotation
    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: true
      min_vel_x: -0.1
      min_vel_y: 0.0
      max_vel_x: 0.15  # Reduced for smoother approach
      max_vel_y: 0.0
      max_vel_theta: 0.6  # ~34 deg/s - stable value from e367f09
      min_speed_xy: 0.05  # 50 mm/s - minimum speed due to min_duty=0.06
      max_speed_xy: 0.15
      min_speed_theta: 0.1  # Stable value from e367f09 (week ago)
      acc_lim_x: 0.15  # Original working value from e367f09
      acc_lim_y: 0.0
      acc_lim_theta: 0.6  # Original working value from e367f09
      decel_lim_x: -0.15  # Original working value from e367f09
      decel_lim_y: 0.0
      decel_lim_theta: -0.6  # Original working value from e367f09
      vx_samples: 20
      vy_samples: 0  # Differential drive cannot move sideways
      vtheta_samples: 40  # More samples for better trajectory selection
      sim_time: 1.5  # Increased from 1.2 - plan smoother trajectories
      linear_granularity: 0.05
      angular_granularity: 0.025
      transform_tolerance: 0.5  # Increased from 0.3 - tolerate ICP latency
      xy_goal_tolerance: 0.25  # Match general_goal_checker
      trans_stopped_velocity: 0.10  # Reduced from 0.15 - detect stop earlier
      short_circuit_trajectory_evaluation: true
      stateful: true
      critics: ["RotateToGoal", "Oscillation", "BaseObstacle", "GoalAlign", "PathAlign", "PathDist", "GoalDist"]
      BaseObstacle.scale: 0.02
      RotateToGoal.scale: 32.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0  # Отключить проверку столкновения при повороте у цели
      Oscillation.scale: 0.5  # Reduced from default (1.0) - less strict oscillation detection
      PathAlign.scale: 40.0  # Increased from 32.0 - prefer following path smoothly
      PathAlign.forward_point_distance: 0.15  # Increased from 0.1 - look further ahead
      GoalAlign.scale: 20.0  # Reduced from 24.0 - less aggressive goal alignment
      GoalDist.scale: 20.0
      PathDist.scale: 25.0

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      use_sim_time: false
      rolling_window: true
      width: 5
      height: 5
      resolution: 0.05
      transform_tolerance: 0.5  # Tolerate ICP odometry processing delay (30-125ms)
      # Круговой footprint для skid-steer: не меняется при вращении!
      # Робот ~600x600мм → диагональ 0.85м → радиус 0.42м, с запасом 0.35м
      robot_radius: 0.35
      plugins: ["voxel_layer", "inflation_layer"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.40  # Уменьшен: robot_radius 0.35 + 0.40 = 0.75м от центра
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: true
        publish_voxel_map: true
        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 16
        max_obstacle_height: 2.0
        mark_threshold: 0
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      static_layer:
        map_subscribe_transient_local: true
        enabled: false
      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      use_sim_time: false
      # Круговой footprint для skid-steer (соответствует local_costmap)
      robot_radius: 0.35
      resolution: 0.05
      transform_tolerance: 0.5  # Tolerate ICP odometry processing delay
      track_unknown_space: true
      # Rolling window mode для работы без статической карты
      # Размер 50x50м покрывает типичную область работы робота
      rolling_window: true
      width: 50
      height: 50
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.40  # Уменьшен: robot_radius 0.35 + 0.40 = 0.75м от центра
      always_send_full_costmap: true

planner_server:
  ros__parameters:
    expected_planner_frequency: 20.0
    use_sim_time: false
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.5
      use_astar: true
      allow_unknown: true

smoother_server:
  ros__parameters:
    use_sim_time: false
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true

behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
      simulate_ahead_time: 0.0  # Отключить проверку столкновения при spin (круговой footprint безопасен)
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    global_frame: map
    robot_base_frame: base_link
    transform_tolerance: 0.5  # Increased for ICP latency tolerance
    use_sim_time: false
    simulate_ahead_time: 0.5  # Increased for higher accelerations
    max_rotational_vel: 0.6  # Original value from e367f09
    min_rotational_vel: 0.2  # Allow slow spins
    rotational_acc_lim: 0.6  # Original value from e367f09, match DWB

waypoint_follower:
  ros__parameters:
    use_sim_time: false
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: true
      waypoint_pause_duration: 200

velocity_smoother:
  ros__parameters:
    use_sim_time: false
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: "OPEN_LOOP"
    max_velocity: [0.2, 0.0, 0.6]  # Match DWB limits: linear 0.2, angular 0.6 rad/s
    min_velocity: [-0.15, 0.0, -0.6]  # Symmetric limits
    max_accel: [0.2, 0.0, 0.6]  # Match DWB acceleration limits
    max_decel: [-0.2, 0.0, -0.6]  # Match DWB deceleration limits
    odom_topic: "odom"
    odom_duration: 0.1
    deadband_velocity: [0.02, 0.0, 0.05]  # Small deadband: linear 2cm/s, angular ~3deg/s
    velocity_timeout: 1.0

lifecycle_manager_navigation:
  ros__parameters:
    use_sim_time: false
    autostart: true
    node_names: [
      'controller_server',
      'smoother_server',
      'planner_server',
      'behavior_server',
      'bt_navigator',
      'waypoint_follower',
      'velocity_smoother'
    ]
