# Global Costmap Configuration для rob_box
# Глобальная карта препятствий (вся карта из SLAM)

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      use_sim_time: False
      robot_radius: 0.17
      resolution: 0.05
      track_unknown_space: True
      # Rolling window mode для работы без статической карты
      # Размер 50x50м покрывает типичную область работы робота
      rolling_window: true
      width: 50
      height: 50
      plugins: ["obstacle_layer", "inflation_layer"]

      # Фильтры
      filters: []

      # Obstacle Layer - динамические препятствия
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan

        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0

      # Inflation Layer
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.55

      always_send_full_costmap: True
