# twist_mux configuration для rob_box
# Мультиплексирование команд скорости с приоритизацией

twist_mux:
  ros__parameters:
    # Источники команд (в порядке приоритета - priority: 0-255, чем выше тем приоритетнее)
    topics:
      # 1. Emergency Stop (наивысший приоритет)
      emergency_stop:
        topic: cmd_vel_emergency
        timeout: 0.1
        priority: 255

      # 2. Joystick/Gamepad (высокий приоритет - оператор с физическим пультом)
      joystick:
        topic: cmd_vel_joy
        timeout: 0.5
        priority: 100

      # 2.5 Quest (Meta Quest / WebXR teleop, Phase 1.3) — ниже joystick,
      # выше web_ui/voice: VR-оператор не должен перебивать физический пульт,
      # но важнее web-UI и voice (визуальный контекст > текстовый).
      quest:
        topic: cmd_vel_quest
        timeout: 0.5
        priority: 40

      # 3. Web UI / Mobile App (средний приоритет - оператор через веб)
      web_ui:
        topic: cmd_vel_web
        timeout: 1.0
        priority: 50

      # 4. Voice Commands (низкий-средний приоритет - может быть кто угодно)
      voice:
        topic: cmd_vel_voice
        timeout: 1.0
        priority: 25

      # 5. Nav2 Navigation (самый низкий приоритет - автономия)
      navigation:
        topic: cmd_vel
        timeout: 0.5
        priority: 10

    # Locks (блокировка источников с приоритетом ниже)
    # joystick_lock: joystick_control_node публикует True на /joystick_lock,
    # пока оператор держит ARM (вооружён) — это блокирует web(50)/voice(25)/
    # nav2(10), чтобы робота НЕ перехватывали автономные источники, пока
    # оператор работает пультом (issue #1344 — «поворот приходит сам»).
    # timeout=0.0 → lock «липкий»: последнее значение сохраняется, если нода
    # умрёт/зависнет (вооружён → автономия заблокирована до восстановления).
    #
    # teleop_lock + teleop_lock_watchdog (ADR-0080, #2191): зеркалят
    # /joystick_lock по семантике «у меня руль» — avatar_arbiter
    # (единственный владелец LockManager, ADR-0028 §4.2) публикует True
    # пока teleop_floor занят. Блокируют web_ui(50)/voice(25)/nav2(10).
    #
    # Гибрид (R2 ADR-0080): /teleop_lock sticky (timeout=0.0) — как
    # joystick_lock, безопасность; /teleop_lock_watchdog timeout=0.5 —
    # auto-release при падении avatar_arbiter без ручного ros2 topic pub.
    # twist_mux смотрит на КАЖДЫЙ lock независимо: достаточно одного True,
    # чтобы заблокировать нижестоящие источники.
    locks:
      joystick_lock:
        topic: /joystick_lock
        timeout: 0.0
        priority: 100
      teleop_lock:
        topic: /teleop_lock
        timeout: 0.0
        priority: 100
      teleop_lock_watchdog:
        topic: /teleop_lock_watchdog
        timeout: 0.5
        priority: 100
