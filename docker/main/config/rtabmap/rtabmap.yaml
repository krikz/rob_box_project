# RTAB-Map параметры
# Используются через: ros2 launch rtabmap_launch rtabmap.launch.py ... --ros-args --params-file /config/rtabmap/rtabmap.yaml
#
# ВАЖНО: Grid/Sensor НУЖНО передавать как явный ROS2-параметр (не через INI cfg:=),
# т.к. rtabmap принудительно сбрасывает Grid/Sensor=0 при subscribe_scan=true,
# если параметр не объявлен явно через ROS2 param server.
# Нода запускается в namespace /rtabmap → полный путь /rtabmap/rtabmap

/**:
  ros__parameters:
    queue_size: 10
    approx_sync: true  # КРИТИЧНО! Exact sync не работает - timestamps не совпадают

# Параметры для ноды /rtabmap/rtabmap (namespace=rtabmap, node=rtabmap)
/rtabmap/rtabmap:
  ros__parameters:
    # Основные параметры
    queue_size: 10

    # Режим работы: LiDAR ICP одометрия + OAK-D RGB-D для 3D карты и loop closure
    Mem/IncrementalMemory: true
    Mem/InitWMWithAllNodes: false

    # Подписки - ВАЖНО: boolean без кавычек!
    subscribe_scan: true
    subscribe_rgbd: true    # Подписываемся на /rgbd_image (пресинхронизовано rtabmap-sync на Vision Pi)
    subscribe_rgb: false
    subscribe_depth: false  # false = используем pre-synced rgbd_image, не отдельные топики
    subscribe_stereo: false

    # Grid mapping: оба сенсора (лидар + depth камера)
    # Grid/Sensor: "2" ДОЛЖЕН быть здесь как явный ROS2 параметр (НЕ в INI)
    # чтобы rtabmap не сбросил его в 0 при subscribe_scan=true
    Grid/FromDepth: "false"  # ICP одометрия использует лидар
    Grid/Sensor: "2"         # 2 = лидар + depth камера (было 0 = только лидар)
    Grid/CellSize: "0.05"    # 5см разрешение сетки
    Grid/RangeMax: "10.0"    # Используем лидар до 10м
    Grid/RangeMin: "0.2"     # Минимальная дистанция
    Grid/MaxObstacleHeight: "1.5"  # Препятствия выше 1.5м игнорируем
    Grid/MinGroundHeight: "-0.1"   # Фильтруем пол (точки ниже -0.1м от base_footprint)

    # Оптимизация для 2D лидара
    Reg/Strategy: "1"        # ICP (Iterative Closest Point)
    Icp/PointToPlane: "false"  # 2D ICP
    Icp/Iterations: "30"
    Icp/Epsilon: "0.001"
    Icp/MaxTranslation: "0.3"
    Icp/MaxRotation: "0.78"  # ~45 градусов
    Icp/CorrespondenceRatio: "0.05"  # Понижено с 0.4 до 0.05 для работы при малом количестве точек

    # Loop closure для навигации
    Mem/LaserScanNormalK: "0"  # Отключено для 2D лидара
    RGBD/ProximityPathMaxNeighbors: "10"
    RGBD/OptimizeFromGraphEnd: "false"
