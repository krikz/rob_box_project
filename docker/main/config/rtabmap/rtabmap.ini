; RTAB-Map configuration file
; Format: [Section] Key=value
; Generated from args:= parameters that were not applying due to single-string argv bug
; See: docker-compose.yaml rtabmap command
;
; Reference: http://wiki.ros.org/rtabmap_ros/Tutorials/Advanced%20Parameter%20Tuning

[Grid]
; 2 = LiDAR + Depth camera (0 = LiDAR only, 1 = Depth camera only)
Sensor=2
CellSize=0.05
MaxObstacleHeight=1.5
MinGroundHeight=-0.1
RangeMin=0.2
RangeMax=10.0
; Depth camera provides 3D grid data (Grid/Sensor:2)
FromDepth=false

[Icp]
CorrespondenceRatio=0.05
Epsilon=0.001
Iterations=30
MaxCorrespondenceDistance=0.1
MaxRotation=0.78
MaxTranslation=0.3
PointToPlane=false
VoxelSize=0.05

[Mem]
IncrementalMemory=true
InitWMWithAllNodes=false
LaserScanNormalK=0

[Odom]
ResetCountdown=1

[Optimizer]
GravitySigma=0

[RGBD]
NeighborLinkRefining=true
OptimizeFromGraphEnd=true
OptimizeMaxError=5.0
ProximityBySpace=true
ProximityPathMaxNeighbors=10

[Reg]
Force3DoF=true
Strategy=1
