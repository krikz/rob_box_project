# Использует переменные из .env файла:
# - ROS_DISTRO: версия ROS 2 (humble, jazzy, и т.д.)
# - IMAGE_TAG: тег ветки (latest, dev, rc-X.Y.Z)
# - BASE_IMAGE_PREFIX: ghcr.io/krikz/rob_box_base
# - SERVICE_IMAGE_PREFIX: ghcr.io/krikz/rob_box

services:
  # Zenoh Router - центральный роутер для связи между Pi и облаком
  zenoh-router:
    image: eclipse/zenoh:1.6.2
    container_name: zenoh-router
    network_mode: host
    environment:
      - RUST_LOG=zenoh=info
      - ROBOT_ID=${ROBOT_ID}  # ID робота для namespace при публикации в облако
    volumes:
      - ./config:/config:ro
      - ./scripts/zenoh-router:/scripts:ro
    entrypoint: ["/bin/sh", "/scripts/start_zenoh_router.sh"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8000/@/local/router || exit 1"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 30s
    labels:
      logging: "promtail"

  # twist_mux - мультиплексирование команд скорости с приоритизацией
  twist-mux:
    # Tag tracked in docker/main/.image-versions.{env} — updated by CI after each build
    image: ${SERVICE_IMAGE_PREFIX:-ghcr.io/krikz/rob_box}:twist-mux-${ROS_DISTRO:-humble}-${TWIST_MUX_TAG:-${IMAGE_TAG}}
    container_name: twist-mux
    network_mode: host
    environment:
      - ROS_DOMAIN_ID=0
      - RMW_IMPLEMENTATION=rmw_zenoh_cpp
      - RUST_LOG=zenoh=info
      - ROS_AUTOMATIC_DISCOVERY_RANGE=LOCALHOST
      - ROBOT_ID=${ROBOT_ID}  # Для генерации namespace
      - ZENOH_SESSION_CONFIG_URI=/tmp/zenoh_session_config.json5  # Сгенерированный конфиг
      - LD_LIBRARY_PATH=/opt/ros/humble/opt/zenoh_cpp_vendor/lib:/opt/ros/humble/lib/aarch64-linux-gnu:/opt/ros/humble/lib
    volumes:
      - ./config:/config:ro
      - ./scripts:/ros_scripts:ro
      - ./scripts/twist_mux:/scripts:ro
    command: ["/ros_scripts/ros_with_namespace.sh", "/scripts/start_twist_mux.sh"]
    depends_on:
      - zenoh-router
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f twist_mux || exit 1"]
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 3
    labels:
      logging: "promtail"

  # micro-ROS Agent - связь с ESP32 Sensor Hub по UART
  # Транслирует сообщения между ROS2 (DDS/Zenoh) и micro-ROS (XRCE-DDS)
  micro-ros-agent:
    # Tag tracked in docker/main/.image-versions.{env} — updated by CI after each build
    image: ${SERVICE_IMAGE_PREFIX:-ghcr.io/krikz/rob_box}:micro-ros-agent-${ROS_DISTRO:-humble}-${MICRO_ROS_AGENT_TAG:-${IMAGE_TAG}}
    container_name: micro-ros-agent
    network_mode: host
    privileged: true  # Нужен для доступа к serial устройствам
    environment:
      - ROS_DOMAIN_ID=0
      - RMW_IMPLEMENTATION=rmw_zenoh_cpp
      - RUST_LOG=zenoh=info
      - ROS_AUTOMATIC_DISCOVERY_RANGE=LOCALHOST
      - ROBOT_ID=${ROBOT_ID}  # Для генерации namespace
      - ZENOH_SESSION_CONFIG_URI=/tmp/zenoh_session_config.json5  # Сгенерированный конфиг
      - LD_LIBRARY_PATH=/opt/ros/humble/opt/zenoh_cpp_vendor/lib:/opt/ros/humble/lib/aarch64-linux-gnu:/opt/ros/humble/lib
      # micro-ROS специфичные переменные
      - MICROROS_SERIAL_PORT=/dev/ttyUSB0  # ESP32 USB serial (измените на /dev/ttyAMA0 для GPIO UART)
      - MICROROS_BAUDRATE=115200
    volumes:
      - ./config:/config:ro
      - ./scripts:/ros_scripts:ro
      - ./scripts/micro_ros_agent:/scripts:ro
    devices:
      - /dev/ttyUSB0:/dev/ttyUSB0  # ESP32 через USB (измените при необходимости)
    command: ["/ros_scripts/ros_with_namespace.sh", "/scripts/start_micro_ros_agent.sh"]
    depends_on:
      - zenoh-router
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f micro_ros_agent || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 3
    labels:
      logging: "promtail"

  # Robot State Publisher - публикует TF дерево робота из URDF
  robot-state-publisher:
    # Tag tracked in docker/main/.image-versions.{env} — updated by CI after each build
    image: ${SERVICE_IMAGE_PREFIX:-ghcr.io/krikz/rob_box}:robot-state-publisher-${ROS_DISTRO:-humble}-${ROBOT_STATE_PUBLISHER_TAG:-${IMAGE_TAG}}
    container_name: robot-state-publisher
    network_mode: host
    environment:
      - ROS_DOMAIN_ID=0
      - RMW_IMPLEMENTATION=rmw_zenoh_cpp
      - RUST_LOG=zenoh=info
      - ROS_AUTOMATIC_DISCOVERY_RANGE=LOCALHOST
      - ROBOT_ID=${ROBOT_ID}  # Для генерации namespace
      - ZENOH_SESSION_CONFIG_URI=/tmp/zenoh_session_config.json5  # Сгенерированный конфиг
      - LD_LIBRARY_PATH=/opt/ros/humble/opt/zenoh_cpp_vendor/lib:/opt/ros/humble/lib/aarch64-linux-gnu:/opt/ros/humble/lib
    volumes:
      - ./config:/config:ro
      - ./scripts:/ros_scripts:ro
      - ./scripts/robot_state_publisher:/scripts:ro
      - ../../src/rob_box_description:/workspace/src/rob_box_description:ro
    command: ["/ros_scripts/ros_with_namespace.sh", "/scripts/start_robot_state_publisher.sh"]
    depends_on:
      - zenoh-router
    restart: unless-stopped
    labels:
      logging: "promtail"

  rtabmap:
    # Tag tracked in docker/main/.image-versions.{env} — updated by CI after each build
    image: ${SERVICE_IMAGE_PREFIX:-ghcr.io/krikz/rob_box}:rtabmap-${ROS_DISTRO:-humble}-${RTABMAP_TAG:-${IMAGE_TAG}}
    container_name: rtabmap
    network_mode: host
    environment:
      - ROS_DOMAIN_ID=0
      - QT_QPA_PLATFORM=offscreen
      - RMW_IMPLEMENTATION=rmw_zenoh_cpp
      - ZENOH_ROUTER_CHECK_ATTEMPTS=10  # Подключаемся к локальному router
      - RUST_LOG=zenoh=info
      # Zenoh configuration через JSON
      - ROS_AUTOMATIC_DISCOVERY_RANGE=LOCALHOST
      - ROBOT_ID=${ROBOT_ID}  # Для генерации namespace
      - ZENOH_SESSION_CONFIG_URI=/tmp/zenoh_session_config.json5  # Сгенерированный конфиг
      # КРИТИЧНО: Путь к библиотекам Zenoh (vendor устанавливает в нестандартный путь)
      - LD_LIBRARY_PATH=/opt/ros/${ROS_DISTRO:-humble}/opt/zenoh_cpp_vendor/lib:/opt/ros/${ROS_DISTRO:-humble}/lib/aarch64-linux-gnu:/opt/ros/${ROS_DISTRO:-humble}/lib
    volumes:
      - ./config:/config:ro
      - ./scripts:/ros_scripts:ro
      - ./scripts/rtabmap:/scripts:ro
      - ./maps:/maps
    # === RTAB-Map конфигурация: stable LiDAR SLAM on Main Pi ===
    # Ветка: feature/rtabmap-rgbd-lidar-3d
    #
    # Источники:
    # 1. http://wiki.ros.org/rtabmap_ros/Tutorials/SetupOnYourRobot
    # 2. rtabmap_demos: turtlebot3_scan.launch.py
    # 3. Анализ rtabmap.launch.py (строки 45-46)
    #
    # КЛЮЧЕВЫЕ ПАРАМЕТРЫ:
    # • subscribe_scan:=true - включает LaserScan (LiDAR для ICP одометрии и 2D grid)
    # • icp_odometry:=true  - ICP одометрия: лидар → icp_odom (надёжнее visual в коридорах)
    # • odom_guess_frame_id:=odom - wheel odometry как начальный guess для ICP
    # • Grid/Sensor=0       - occupancy grid только из LiDAR для стабильной карты
    # • Grid/MaxObstacleHeight=1.5 - учитывать препятствия до 1.5м
    # • Grid/MinGroundHeight=-0.1  - фильтровать пол (точки ниже -0.1м от base_footprint)
    # • Reg/Force3DoF=true  - 2D движение (только x, y, yaw)
    # • Reg/Strategy=1      - ICP регистрация для loop closure
    #
    # ТОПИК ПОТОК:
    #   Main Pi: rtabmap ← /scan (LiDAR)
    #   OAK-D intentionally excluded from Main Pi mapping until TF/timestamp path is stable again.
    command:
      - /ros_scripts/ros_with_namespace.sh
      - /scripts/start_rtabmap.sh
      - ros2
      - launch
      - rtabmap_launch
      - rtabmap.launch.py
      - depth:=false
      - subscribe_rgbd:=false
      - subscribe_scan:=true
      - scan_topic:=/scan
      - icp_odometry:=true
      - odom_guess_frame_id:=odom
      - vo_frame_id:=icp_odom
      - frame_id:=base_footprint
      - odom_frame_id:=icp_odom
      - odom_topic:=/odom
      - imu_topic:=/camera/imu/data
      - wait_imu_to_init:=false
      - apriltag_topic:=/detections
      - qos:=1
      - approx_sync:=true
      - rtabmap_viz:=false
      - rviz:=false
      - visual_odometry:=false
      # start_rtabmap.sh always injects localization:=true as the safe default.
      # Mapping mode is enabled later through an explicit ROS2 service call.
      - database_path:=/maps/rtabmap.db
      - wait_for_transform:=0.5
      - use_sim_time:=false
      - cfg:=/config/rtabmap/rtabmap.ini
      # Вокселизация cloud_map: уменьшает размер сообщения в ~100-1000x.
      # Предотвращает переполнение Zenoh TCP буфера при loop closure.
      # 0.3 = 3x крупнее вокселей чем 0.1 → ~27x меньше точек → ~27x меньший publish.
      # Для навигации 30cm вокселей достаточно — nav2 использует 2D costmap, не 3D облако.
      - cloud_output_voxels:=0.3
    depends_on:
      - zenoh-router
    restart: unless-stopped
    labels:
      logging: "promtail"

  # ROS2 Control Manager - управление моторами через VESC
  # VESC Nexus работает как hardware_interface плагин
  ros2-control:
    # Tag tracked in docker/main/.image-versions.{env} — updated by CI after each build
    image: ${SERVICE_IMAGE_PREFIX:-ghcr.io/krikz/rob_box}:ros2-control-${ROS_DISTRO:-humble}-${ROS2_CONTROL_TAG:-${IMAGE_TAG}}
    container_name: ros2-control
    network_mode: host
    privileged: true  # Для доступа к CAN интерфейсу
    environment:
      - ROS_DOMAIN_ID=0
      - RMW_IMPLEMENTATION=rmw_zenoh_cpp
      - RUST_LOG=zenoh=info
      - ROS_AUTOMATIC_DISCOVERY_RANGE=LOCALHOST
      - ROBOT_ID=${ROBOT_ID}  # Для генерации namespace
      - ZENOH_SESSION_CONFIG_URI=/tmp/zenoh_session_config.json5  # Сгенерированный конфиг
      - LD_LIBRARY_PATH=/opt/ros/humble/opt/zenoh_cpp_vendor/lib:/opt/ros/humble/lib/aarch64-linux-gnu:/opt/ros/humble/lib
      # CAN интерфейс (can0 или can1)
      - CAN_INTERFACE=can0
      - CONTROLLER_CONFIG=/config/controllers/controller_manager.yaml
    volumes:
      - ./config:/config:ro
      - ./scripts:/ros_scripts:ro
      - ./scripts/ros2_control:/scripts:ro
      - /dev:/dev  # Доступ к CAN устройствам
    command: ["/ros_scripts/ros_with_namespace.sh", "/scripts/start_ros2_control.sh"]
    depends_on:
      - zenoh-router
      - robot-state-publisher
      - twist-mux
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f ros2_control_node || exit 1"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 3
    labels:
      logging: "promtail"

  # LSLIDAR N10 - 2D LiDAR scanner
  lslidar:
    # Tag tracked in docker/main/.image-versions.{env} — updated by CI after each build
    image: ${SERVICE_IMAGE_PREFIX:-ghcr.io/krikz/rob_box}:lslidar-${ROS_DISTRO:-humble}-${LSLIDAR_TAG:-${IMAGE_TAG}}
    container_name: lslidar
    network_mode: host
    privileged: true  # Для доступа к USB/Serial устройству
    devices:
      - /dev/ttyACM0:/dev/ttyACM0  # LSLIDAR N10 USB CDC ACM device
    environment:
      - ROS_DOMAIN_ID=0
      - RMW_IMPLEMENTATION=rmw_zenoh_cpp
      - ROBOT_ID=${ROBOT_ID}  # Для генерации namespace
      - ZENOH_ROUTER_CHECK_ATTEMPTS=10
      - RUST_LOG=zenoh=info
      - ROS_AUTOMATIC_DISCOVERY_RANGE=LOCALHOST
      - ZENOH_SESSION_CONFIG_URI=/tmp/zenoh_session_config.json5  # Сгенерированный конфиг
    volumes:
      - ./config:/config:ro
      - ./scripts:/ros_scripts:ro
      - ./scripts/lslidar:/scripts:ro
      - /dev/shm:/dev/shm
    command: ["/ros_scripts/ros_with_namespace.sh", "/scripts/start_lslidar.sh"]
    depends_on:
      - zenoh-router
    restart: unless-stopped
    labels:
      logging: "promtail"

  # Internal Dialogue Agent - система внутреннего диалога робота
  perception:
    # Tag tracked in docker/main/.image-versions.{env} — updated by CI after each build
    image: ${SERVICE_IMAGE_PREFIX:-ghcr.io/krikz/rob_box}:perception-${ROS_DISTRO:-humble}-${PERCEPTION_TAG:-${IMAGE_TAG}}
    container_name: perception
    network_mode: host
    environment:
      - ROS_DOMAIN_ID=0
      - RMW_IMPLEMENTATION=rmw_zenoh_cpp
      - ZENOH_ROUTER_CHECK_ATTEMPTS=10
      - RUST_LOG=zenoh=info
      - ROS_AUTOMATIC_DISCOVERY_RANGE=LOCALHOST
      - ROBOT_ID=${ROBOT_ID}  # Для генерации namespace
      - ZENOH_SESSION_CONFIG_URI=/tmp/zenoh_session_config.json5  # Сгенерированный конфиг
      # Reflection parameters (v2.0 Event-Driven)
      - DIALOGUE_TIMEOUT=10.0  # секунды - тайм-аут диалога
      - URGENT_RESPONSE_TIMEOUT=2.0  # секунды - тайм-аут срочного ответа
      - ENABLE_SPEECH=true  # Включить речь робота
      # Context Aggregator parameters
      - CONTEXT_PUBLISH_RATE=2.0  # Hz - частота событий
      - MEMORY_WINDOW=60  # секунды - окно короткой памяти
      # Python
      - PYTHONUNBUFFERED=1
    env_file:
      - .env.secrets  # API keys: QWEN_API_KEY, DEEPSEEK_API_KEY (для fallback)
    volumes:
      - ./config:/config:ro
      - ./scripts:/ros_scripts:ro
      - ./scripts/perception:/scripts:ro
      - /dev/shm:/dev/shm
    # Memory limits отключены для Raspberry Pi (kernel не поддерживает cgroup memory limits)
    # mem_limit: 512m  # Perception - лёгкий контейнер
    # memswap_limit: 768m
    command: ["/ros_scripts/ros_with_namespace.sh", "/scripts/start_perception.sh"]
    depends_on:
      - zenoh-router
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'source /ws/install/setup.bash && ros2 node list | grep -q reflection_node'"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 3
    labels:
      logging: "promtail"

  # Nav2 Navigation Stack - автономная навигация
  nav2:
    # Tag tracked in docker/main/.image-versions.{env} — updated by CI after each build
    image: ${SERVICE_IMAGE_PREFIX:-ghcr.io/krikz/rob_box}:nav2-${ROS_DISTRO:-humble}-${NAV2_TAG:-${IMAGE_TAG}}
    container_name: nav2
    network_mode: host
    environment:
      - ROS_DOMAIN_ID=0
      - RMW_IMPLEMENTATION=rmw_zenoh_cpp
      - RUST_LOG=zenoh=info
      - ROS_AUTOMATIC_DISCOVERY_RANGE=LOCALHOST
      - ROBOT_ID=${ROBOT_ID}  # Для генерации namespace
      - ZENOH_SESSION_CONFIG_URI=/tmp/zenoh_session_config.json5  # Сгенерированный конфиг
      - LD_LIBRARY_PATH=/opt/ros/humble/opt/zenoh_cpp_vendor/lib:/opt/ros/humble/lib/aarch64-linux-gnu:/opt/ros/humble/lib
    volumes:
      - ./config:/config:ro
      - ./scripts:/ros_scripts:ro
      - ./scripts/nav2:/scripts:ro
      - ./maps:/maps:ro  # Карты из RTAB-Map
    command: ["/ros_scripts/ros_with_namespace.sh", "/scripts/start_nav2_direct.sh"]
    depends_on:
      - zenoh-router
      - robot-state-publisher
      - rtabmap
      - ros2-control
      - twist-mux
      - lslidar
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'bt_navigator' || exit 1"]
      interval: 15s
      timeout: 10s
      start_period: 60s
      retries: 3
    labels:
      logging: "promtail"

  # ============ Monitoring Agents ============
  # Агенты мониторинга для Main Pi
  # Отправляют метрики и логи на отдельную машину мониторинга
  # Можно отключить через: docker-compose --profile monitoring up -d

  # non-ROS service: мониторинговый агент (profile: monitoring).
  # Не использует ROS/Zenoh, depends_on: zenoh-router не требуется.
  # cAdvisor - мониторинг контейнеров (CPU, память, сеть)
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.52.1
    container_name: cadvisor
    profiles: ["monitoring"]
    network_mode: host
    privileged: true
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
      - /etc/machine-id:/etc/machine-id:ro
    command:
      - '--port=8080'
      - '--housekeeping_interval=30s'
      - '--docker_only=true'
      - '--store_container_labels=false'
    restart: unless-stopped

  # Promtail - сбор логов из Docker контейнеров и отправка на машину мониторинга
  # Teleoperation - джойстик управление роботом через SBUS
  teleop:
    image: ${SERVICE_IMAGE_PREFIX:-ghcr.io/krikz/rob_box}:teleop-${ROS_DISTRO:-humble}-${IMAGE_TAG:-local}
    container_name: teleop
    network_mode: host
    privileged: true  # Нужен для доступа к serial портам
    environment:
      - ROS_DOMAIN_ID=0
      - RMW_IMPLEMENTATION=rmw_zenoh_cpp
      - RUST_LOG=zenoh=info
      - ROS_AUTOMATIC_DISCOVERY_RANGE=LOCALHOST
      - ROBOT_ID=${ROBOT_ID}
      - ZENOH_SESSION_CONFIG_URI=/tmp/zenoh_session_config.json5
      - LD_LIBRARY_PATH=/opt/ros/humble/opt/zenoh_cpp_vendor/lib:/opt/ros/humble/lib/aarch64-linux-gnu:/opt/ros/humble/lib
    volumes:
      - ./config:/config:ro
      - ./scripts:/ros_scripts:ro
      - ./scripts/teleop:/scripts:ro
      - /dev/input:/dev/input  # Доступ к джойстику (для non-SBUS режима)
      - /dev:/dev  # Полный доступ к /dev для SBUS (номера ttyACM могут меняться)
    # privileged: true + /dev монтировано = автоматический доступ ко всем serial портам
    command: ["/ros_scripts/ros_with_namespace.sh", "/scripts/start_teleop.sh"]
    depends_on:
      - zenoh-router
      - twist-mux
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f joystick_control_node || exit 1"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 3
    labels:
      logging: "promtail"

  # non-ROS service: Loki log shipper (profile: monitoring).
  # Не использует ROS/Zenoh, depends_on: zenoh-router не требуется.
  promtail:
    image: grafana/promtail:2.9.2
    container_name: promtail
    profiles: ["monitoring"]
    network_mode: host
    environment:
      - LOKI_HOST=${LOKI_HOST:-monitoring-machine}
    volumes:
      - ./config/monitoring/promtail-config.yaml:/etc/promtail/config.yml:ro
      - /var/log:/var/log:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: -config.file=/etc/promtail/config.yml -config.expand-env=true
    restart: unless-stopped
