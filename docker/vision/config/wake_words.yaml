# wake_words.yaml — единственный источник истины (SSoT) вейк-слов (целевая §7.3,
# issue #1990). Namespace жёстко привязан к источнику аудио, а не только к тексту:
#
#   personality — слышит ТОЛЬКО /audio/speech_audio (ReSpeaker на роботе,
#                 люди рядом) → маршрут /voice/stt/result (личность).
#   operator    — слышит ТОЛЬКО /audio/quest_wake (микрофон шлема оператора,
#                 wake-поток) → маршрут /avatar/stt/result (агент оператора).
#
# Исключение issue #2097: «ТАРС» (имя личности из «Пикника на обочине»)
# присутствует в ОБОИХ namespace. В ReSpeaker это wake-word личности
# (маршрут /voice/stt/result, dialogue_node получает wake-event и
# strip'ает «тарс» из текста). В шлеме — wake-word агента оператора
# (маршрут /avatar/stt/result). STT-искажения для «ТАРС» наполняем по
# логам e2e только в operator namespace.
#
# Вейк-слово личности из микрофона шлема по-прежнему игнорируется.
#
# Порядок списков ВАЖЕН: strip_wake_word/has_wake_word матчат по \b-словам,
# длинные/специфичные варианты идут ПЕРВЫМИ, иначе «роб» съест «роб бокс».
#
# personality — байт-в-байт копия DEFAULT_WAKE_WORDS в
# src/rob_box_voice/rob_box_voice/core/dialogue_text.py (кодовая копия =
# фолбек для dev-env/юнит-тестов без этого файла). При правке списка — менять
# ОБА места в одном коммите (это инвариант test_wake_word_sync / #1252).

personality:
  - роб бокс
  - роббокс
  - робокос
  - rob box
  - робокс
  # STT-искажения «робокс» (e2e ww01): vosk/yandex слышат «робэкс» и т.п.
  - робэкс
  - робекс
  - робакс
  - рабокс
  - рубокс
  - роблокс
  - роберт
  - роббос
  - robbox
  - робот
  - робок
  - рабок
  - робак
  - рыбок
  - робик
  - робо
  - рома
  - бот
  - роб
  # wake-имя личности «ТАРС» (issue #2097): «Пикник на обочине». В personality
  # держим только канонические написания; STT-искажения («тарз», «тас») идут
  # в operator namespace (целевая §14.1, наполняем по логам e2e).
  - тарс
  - tars

# Вейк оператора. STT-искажения («тарз», «тас», «target», ...) НЕ придумываем —
# наполняем по логам e2e, как собирали для «роббокс» (целевая §14.1).
operator:
  - тарс
  - tars
