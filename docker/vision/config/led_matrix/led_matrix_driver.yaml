# LED Matrix Driver Configuration
# Низкоуровневый драйвер для управления физической цепочкой LED
# через SPI на Raspberry Pi 5 (Vision Pi)
#
# Использует библиотеку pi5neo для WS2812B/NeoPixel LED

led_matrix_driver:
  ros__parameters:
    # Общее количество светодиодов в цепочке
    # Main display: 5× 5×5 = 125 LED
    # Передние панели: 2× 8×8 = 128 LED
    # Задние панели: 2× 8×8 = 128 LED
    # Итого: 381 LED
    num_leds: 381

    # Скорость SPI в кГц (обычно 1000 для WS2812B)
    spi_speed_khz: 1000

    # SPI устройство (Raspberry Pi 5)
    # spidev0.0 - первый SPI интерфейс (GPIO 10 MOSI)
    spi_device: '/dev/spidev0.0'

    # Топик для получения данных от композитора
    input_topic: 'led_matrix/data'

    # Яркость 0-255. 25 (~10%) — как было; поднимать вместе с рендером,
    # который задаёт яркость сцены по её бюджету тока.
    brightness: 25

    # Ограничитель тока: бак 5 В x 30 Вт = 6 А, лимит с запасом 25%.
    # Кадр, который по оценке тянет больше, гасится одним коэффициентом.
    # <= 0 выключает ограничитель.
    max_current_ma: 4500.0
    # Паспорт WS2812B: ~20 мА на канал при 255 и ~1 мА покоя на светодиод.
    # Замерить на линии 5 В и поправить, если реальные цифры другие.
    ma_per_channel: 20.0
    idle_ma_per_led: 1.0

    # Пауза между записями для защёлки WS2812 (секунды). Раньше после
    # каждой записи был сон 100 мс внутри pi5neo — потолок ~9 кадров/с.
    min_frame_interval_s: 0.0003

    # Каждое сообщение — вся лента: держим только последнее.
    queue_depth: 1
