# =============================================================================
# ROS2 Parameters YAML — Voice Assistant
# Правильный формат: имя_ноды: → ros__parameters: → плоские ключи
# Вложенные dict-параметры пишутся через точку: vosk.model_path: "..."
# =============================================================================

# -----------------------------------------------------------------------------
# AudioNode: захват звука, VAD, wake word engine, DOA lock
# -----------------------------------------------------------------------------
audio_node:
  ros__parameters:
    device_name: "ReSpeaker"
    sample_rate: 16000
    channels: 1
    chunk_size: 512

    vad_threshold: 500.0
    speech_continuation: 1.5
    speech_prefetch: 0.5
    speech_min_duration: 0.3
    speech_max_duration: 15.0

    # ===== Wake Word Engine (TASK-048) =====
    use_wake_word_engine: true
    wake_word_model_paths: ["/models/wakeword/robbot.onnx"]
    wake_word_threshold: 0.5
    wake_word_timeout_sec: 8.0

    # ===== DOA Lock (TASK-048) =====
    doa_lock_enabled: true
    doa_tolerance_degrees: 45
    dialogue_window_seconds: 30.0

# -----------------------------------------------------------------------------
# STTNode: Speech-to-Text (Vosk offline + Yandex fallback)
# -----------------------------------------------------------------------------
stt_node:
  ros__parameters:
    aec_mode: "hardware"
    wake_words: ["робок", "робот", "роббокс"]
    model_path: "/models/vosk-model-small-ru-0.22"
    sample_rate: 16000
    yandex_language: "ru-RU"
    yandex_model: "general"
    eou_profile: "balanced"

# -----------------------------------------------------------------------------
# TTSNode: Text-to-Speech (Yandex Cloud gRPC v3 — anton voice)
# -----------------------------------------------------------------------------
tts_node:
  ros__parameters:
    provider: "yandex"
    yandex_voice: "anton"
    yandex_speed: 1.0
    silero_speaker: "baya"
    silero_sample_rate: 48000
    silero_put_accent: true
    silero_put_yo: true
    silero_put_stress_homo: true
    silero_put_yo_homo: true
    chipmunk_mode: true
    normalize_text: true
    volume_db: -3.0

# -----------------------------------------------------------------------------
# DialogueNode: LLM агент (DeepSeek / Qwen через OpenAI-compatible API)
# -----------------------------------------------------------------------------
dialogue_node:
  ros__parameters:
    provider: "deepseek"
    enable_fallback: false
    enable_mcp_tools: true
    base_url: "https://api.deepseek.com"
    model: "deepseek-chat"
    temperature: 0.7
    max_tokens: 500
    system_prompt_file: "master_prompt_compact.txt"
    history_max_turns: 10
    agent_max_turns: 20
    dialogue_timeout: 30.0
    llm_timeout_sec: 35.0
    verbose_llm: true

# -----------------------------------------------------------------------------
# SoundNode: аудио эффекты / триггеры
# -----------------------------------------------------------------------------
sound_node:
  ros__parameters:
    sound_pack_dir: "/ws/sound_pack"
    volume_db: -12.0
    trigger_animations: true
    animation_topic: "/animations/trigger"

# -----------------------------------------------------------------------------
# LEDNode: RGB подсветка ReSpeaker
# -----------------------------------------------------------------------------
led_node:
  ros__parameters:
    auto_mode: true
    brightness: 16
    use_direction: true
    effect_speed: 0.1

# -----------------------------------------------------------------------------
# CommandNode: управление движением (отключено — команды в пустом списке)
# -----------------------------------------------------------------------------
command_node:
  ros__parameters:
    max_linear_speed: 0.3
    max_angular_speed: 1.0
    command_timeout_sec: 0.5
