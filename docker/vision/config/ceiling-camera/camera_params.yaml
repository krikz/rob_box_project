/**:
  ros__parameters:
    # USB Camera settings
    video_device: "/dev/video0"
    framerate: 5.0  # СНИЖЕНО с 10.0 до 5.0 Hz для уменьшения нагрузки на Vision Pi
    image_width: 1280
    image_height: 720

    # Используем MJPEG для прямой публикации сжатых изображений без CPU overhead
    # Если камера не поддерживает MJPEG, usb_cam автоматически fallback на yuyv
    pixel_format: "mjpeg"  # ИЗМЕНЕНО с "yuyv" - публикует напрямую в compressed topic
    av_device_format: "MJPG"  # Формат устройства для MJPEG

    # Camera info
    camera_name: "ceiling_camera"
    camera_frame_id: "ceiling_camera_optical_frame"
    camera_info_url: "file:///root/.ros/camera_info/ceiling_camera.yaml"  # Калибровка (default uncalibrated)

    # Image transport settings
    # При pixel_format: mjpeg публикуется только compressed topic без декодирования
    io_method: "mmap"

    # Auto exposure (можно настроить)
    autoexposure: true
    autofocus: false
