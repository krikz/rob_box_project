/**:
  ros__parameters:
    # USB Camera settings (v4l2_camera)
    video_device: "/dev/video0"
    framerate: 15.0        # Increased from 5fps: rtabmap CPU freed, bandwidth OK
    image_size: [640, 480]      # Reduced from 1280x720: adequate for Telegram/monitoring
    pixel_format: "YUYV"

    # Camera info
    camera_frame_id: "ceiling_camera_optical_frame"
    camera_info_url: "file:///root/.ros/camera_info/ceiling_camera.yaml"  # Калибровка (default uncalibrated)
