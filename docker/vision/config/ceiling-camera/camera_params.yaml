/**:
  ros__parameters:
    # USB Camera settings
    video_device: "/dev/video0"
    framerate: 15.0        # Increased from 5fps: rtabmap CPU freed, bandwidth OK
    image_width: 640           # Reduced from 1280: adequate for Telegram/monitoring
    image_height: 480          # Reduced from 720: 640x480@5fps@YUV422 = 3 MB/s vs 18 MB/s
    pixel_format: "yuyv"

    # Camera info
    camera_name: "ceiling_camera"
    # usb_cam 0.8 читает frame_id; ключ camera_frame_id он не объявляет, и до
    # 04.11.2026 кадры шли с frame_id "default_cam" (замер: ros2 topic echo
    # /ceiling_camera/image_raw, ros2 param get ... frame_id → default_cam).
    frame_id: "ceiling_camera_optical_frame"
    camera_info_url: "file:///root/.ros/camera_info/ceiling_camera.yaml"  # Калибровка (default uncalibrated)

    # Image transport settings
    # Публикуем в raw, а сжатие будет через image_transport
    io_method: "mmap"

    # Auto exposure (можно настроить)
    autoexposure: true
    autofocus: false
