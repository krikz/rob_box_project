apriltag:
  ros__parameters:
    # Основные параметры
    image_transport: compressed  # ✅ ИЗМЕНЕНО: используем сжатые изображения для снижения нагрузки на Zenoh
    family: 36h11          # Семейство тегов (стандартное)
    size: 0.16             # Размер тега в метрах (16 см)
    profile: false         # Отключить профилирование

    # Параметры детекции (ОПТИМИЗИРОВАНО для снижения CPU)
    max_hamming: 0         # Максимальное количество исправленных бит
    detector:
      threads: 1           # ОПТИМИЗАЦИЯ: 1 поток для минимального CPU (было 2)
      decimate: 2.0        # ОПТИМИЗАЦИЯ: Уменьшаем разрешение в 2 раза (~50% CPU экономии, было 1.0)
      blur: 0.0            # Без размытия
      refine: true         # Уточнение границ (можно отключить для еще большей экономии)
      sharpening: 0.25     # Умеренное повышение резкости
      debug: false         # Отключить отладочные изображения

    # Метод оценки позы
    pose_estimation_method: "pnp"  # Используем метод PnP

    # Опционально: настройка конкретных тегов
    # tag:
    #   ids: [0, 1, 2, 3]
    #   frames: ["tag0", "tag1", "tag2", "tag3"]
    #   sizes: [0.16, 0.16, 0.16, 0.16]
