# ADR-0089 Phase 1: SSoT для активных HEF моделей AI HAT+.
#
# Этот файл монтируется в vision-hailo контейнер по /config/hailo_models.yaml
# и парсится start_vision_hailo.sh (через python3 -c с yaml.safe_load).
# Любые изменения должны проходить через PR — НЕ править на проде руками.
#
# Структура:
#   vision_hailo_node.<param>: параметры для ros2 Node.
#   models.<model_name>: список активных HEF с метаданными (для Phase 2/3).
#
# Phase 1 PoC использует только vision_hailo_node.hailo_enabled = false
# (stub-режим), чтобы протестировать downstream-pipeline до установки
# реального HEF на Vision Pi. Реальные HEF подключаются в Phase 1.5
# переключением hailo_enabled=true + hef_path=...
#
# Соответствие: docker/vision/scripts/vision-hailo/start_vision_hailo.sh
#               docker/vision/vision-hailo/Dockerfile
#               src/rob_box_perception/rob_box_perception/vision_hailo_node.py
#               docs/adr/0089-ai-hat-plus-deployment.md §3 touchpoint #11

vision_hailo_node:
  # Real inference: true только когда HEF загружен на /opt/rob_box/models/.
  # Phase 1.5 acceptance: hailo_enabled=true + yolov8n.hef → ≥30 FPS.
  # Default остаётся false, чтобы smoke-test pipeline оставался воспроизводимым.
  hailo_enabled: false

  # Путь к HEF файлу. Игнорируется если hailo_enabled=false.
  # Phase 1.5: /opt/rob_box/models/yolov8n.hef (Hailo-8L/8, HailoRT 4.18+).
  hef_path: ""

  # Период stub-событий (секунды). В real-режиме не используется.
  stub_period_sec: 2.0

  # Confidence threshold [0.0, 1.0]. Ниже — drop.
  confidence_threshold: 0.5

  # Подписка (ADR-0104, шов «Взгляд»).
  #
  # Старое: жёсткая строка ``input_topic`` дублировалась в трёх местах
  # (нода, YAML, bash) и расходилась с реальным топиком OAK-D.
  # Теперь выбор источника — ЕДИНСТВЕННЫЙ параметр ``gaze_source``:
  #   - oak_d           → /camera/camera/color/image_raw      (Image msg)
  #   - ceiling_camera  → /ceiling_camera/image_raw/compressed (CompressedImage msg)
  #   - stub            → синтетический кадр (CI/smoke)
  # Топик/msg-type/транспорт спрятаны внутри ``rob_box_perception.gaze``
  # (см. OakDSource, CeilingCameraSource). Согласовано с
  # ``docker/vision/config/oak-d/oak_d_config.yaml`` (i_rs_compat:true →
  # rgb→color, namespace=camera → /camera/camera/color/image_raw).
  #
  # input_topic сохранён в YAML для back-compat с уже задеплоенными
  # инструментами (diagnose.sh, force_publish.sh и т.д.), но НЕ
  # читается нодой напрямую.
  gaze_source: oak_d
  input_topic: /camera/camera/color/image_raw

  # Сколько секунд ждать первый кадр от real-источника (ADR-0104,
  # capability-honest). При hailo_enabled=true нода fail-fast'ит
  # если источник не отдал кадр за это время.
  first_frame_timeout_sec: 10.0

  # Публикация VisionEvent.
  output_topic: /vision/hailo/events

# Лицевая нода (ADR-0089 Phase 2, issue #2599 PR-A). Отдельный процесс
# с retinaface_mobilenet_v1.hef. Публикует VisionEvent event_type="face"
# на тот же output_topic (embedding_id/display_name пустые — это PR-B).
# См. docker/vision/scripts/vision-hailo/start_vision_face.sh.
vision_face_node:
  # Real inference: true только когда retinaface HEF загружен.
  # Default false — stub-режим (события помечены event_type="stub").
  hailo_enabled: false

  # Путь к retinaface_mobilenet_v1.hef. Игнорируется если hailo_enabled=false.
  hef_path: ""

  # Период stub-событий (секунды). В real-режиме не используется.
  stub_period_sec: 2.0

  # Confidence threshold для face-score (RetinaFace softmax).
  confidence_threshold: 0.6

  # IoU порог NMS (single-class).
  nms_iou_threshold: 0.45

  # Источник кадра — тот же шов «Взгляд» (ADR-0104), что у vision_hailo_node.
  gaze_source: oak_d
  input_topic: /camera/camera/color/image_raw

  # Сколько секунд ждать первый кадр (capability-honest).
  first_frame_timeout_sec: 10.0

  # Тот же топик, что у person-детекции (issue #2599 acceptance).
  output_topic: /vision/hailo/events

# Модели (Phase 1.5+). Phase 1 PoC оставляет список пустым.
models:
  # YOLOv8n — person detection. 3.5 TOPS, 100+ FPS.
  # Источник: https://github.com/hailo-ai/hailo_model_zoo (yolov8n)
  yolov8n_person:
    enabled: false
    hef: /opt/rob_box/models/yolov8n.hef
    confidence_threshold: 0.5
    nms_iou_threshold: 0.45

  # RetinaFace — face detection. 4.6 TOPS, 50+ FPS.
  # Источник: https://github.com/hailo-ai/hailo_model_zoo (retinaface)
  retinaface:
    enabled: false
    hef: /opt/rob_box/models/retinaface_mobilenet_v1.hef
    confidence_threshold: 0.6

  # ArcFace-MobileFaceNet — face embedding. 2.8 TOPS, 60+ FPS, 128-dim.
  # Источник: https://github.com/hailo-ai/hailo_model_zoo (arcface_mobilefacenet)
  arcface:
    enabled: false
    hef: /opt/rob_box/models/arcface_mobilefacenet.hef
    embedding_dim: 128
