# depthai_ros_driver v2.12.2-humble configuration
# Node path: /camera/camera (namespace='camera', name='camera')
# Topics published with i_rs_compat:true:
#   /camera/camera/color/image_raw      — colour image
#   /camera/camera/color/camera_info    — colour camera_info
#   /camera/camera/depth/image_rect_raw — aligned depth (rs_compat renames stereo→depth)
#
# Bandwidth optimizations (2026-03-03):
#   i_low_bandwidth: true  — on-chip H.264 encoding on OAK-D before USB transfer
#                            reduces eth0 Vision Pi → Main Pi from ~89 MB/s to ~15-20 MB/s
#                            source: https://docs.luxonis.com/software/ros/depthai-ros/driver/
#   i_enable_lazy_publisher: true — skip publishing when no subscriber
#   i_max_q_size: 1               — minimal buffer = lower latency

/camera/camera:
  ros__parameters:
    camera:
      i_nn_type: none              # КРИТИЧЕСКИ ВАЖНО: отключаем нейронную сеть
      i_pipeline_type: "RGBD"
      i_rgb_resolution: "720p"     # Снижено с 1080p для Raspberry Pi
      i_stereo_width: 640
      i_stereo_height: 400
      i_fps: 10.0                  # Снижено с 15: уменьшает сетевую нагрузку ~33%
      i_enable_ir: false
      i_laser_dot_brightness: 0
      i_floodlight_brightness: 0
      i_publish_tf_from_calibration: false
      i_tf_base_frame: "camera_link"
      i_enable_imu: true           # IMU для RTAB-Map ICP odometry
      i_enable_preview: false
      i_enable_diagnostics: false
      i_usb_speed: "SUPER"
      i_rs_compat: true              # RealSense-совместимые имена топиков:
                                   # rgb→color, stereo→depth
    rgb:
      i_low_bandwidth: true            # H.264 on-chip encoding → ~5-8 MB/s vs ~28 MB/s raw
      i_low_bandwidth_quality: 85      # 85% quality — достаточно для AprilTag + SLAM
      i_publish_compressed: false
      i_fps: 10.0
      i_max_q_size: 1                  # минимальный буфер, меньше задержка
      i_interleaved: false
      i_board_socket_id: 0
      i_enable_lazy_publisher: true    # не публиковать без подписчиков
      i_publish_topic: true
      i_keep_preview_aspect_ratio: false
    stereo:
      i_low_bandwidth: true            # H.264 on-chip encoding для depth → ~3-5 MB/s vs ~18 MB/s
      i_low_bandwidth_quality: 90      # depth: выше quality чем RGB — SLAM чувствителен к артефактам
      i_publish_compressed: false
      i_fps: 10.0
      i_max_q_size: 1
      i_enable_lazy_publisher: true
      i_publish_topic: true
      i_output_disparity: false
      i_get_base_device_timestamp: false
      i_add_exposure_offset: false
      i_exposure_offset: 0
      i_alpha_scaling: 0.0
      i_align_depth: true          # Align depth to RGB frame for RGBD SLAM
    left:
      i_low_bandwidth: false
      i_fps: 10.0
      i_max_q_size: 1
      i_enable_lazy_publisher: true    # не используется rtabmap напрямую
      i_publish_topic: false           # отключаем left/right raw — не нужны для SLAM
    right:
      i_low_bandwidth: false
      i_fps: 10.0
      i_max_q_size: 1
      i_enable_lazy_publisher: true
      i_publish_topic: false           # отключаем left/right raw — не нужны для SLAM
