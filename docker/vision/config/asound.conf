# ALSA configuration for ReSpeaker 4 Mic Array (UAC1.0)
# Enables dmix software mixing — allows TTS and sound effects to play simultaneously
# Card: hw:1,0 (card 1 = ArrayUAC10, device 0)

pcm.dmix_respeaker {
    type dmix
    ipc_key 2886
    ipc_perm 0666
    slave {
        pcm "hw:1,0"
        rate 16000
        channels 2
        period_size 1024
        buffer_size 8192
    }
}

pcm.!default {
    type plug
    slave.pcm "dmix_respeaker"
}

ctl.!default {
    type hw
    card 1
}
