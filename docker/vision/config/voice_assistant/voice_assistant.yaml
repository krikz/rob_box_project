/**:
  ros__parameters:
    # ===== FLAT OVERRIDES (доходят до нод напрямую) =====
    # NB: вложенные секции ниже (audio_node:, dialogue_node: и т.д.)
    # создают DOTTED имена (напр. dialogue_node.faq_mode_enabled),
    # которые ноды НЕ читают. Параметры, которые ДОЛЖНЫ дойти,
    # указываем здесь flat.
    faq_mode_enabled: true
    faq_event_config_file: ""   # Отключено
    history_excluded_tools:
      - "handle_navigation"
      - "handle_music"

    # LLM model override — FLAT, доходит до dialogue_node напрямую
    provider: "deepseek"
    model: "deepseek-v4-pro"

    # ===== Audio Node =====
    audio_node:
      # Устройство
      device_name: "ReSpeaker"  # Автопоиск по имени
      sample_rate: 16000
      channels: 1  # 1-channel firmware с AEC
      chunk_size: 512
      format: "PCM16"

      # VAD параметры
      vad_threshold: 500  # ReSpeaker builtin VAD (0-1000)
      vad_debounce_ms: 300

      # Обнаружение фраз (phrase boundary detection)
      speech_continuation: 1.5  # Время тишины для завершения фразы (сек)
      speech_min_duration: 0.3  # Минимальная длительность фразы (сек)
      speech_max_duration: 15.0  # Максимальная длительность фразы (сек)

      # DoA (Direction of Arrival)
      publish_doa: true
      doa_rate_hz: 5.0

      # ReSpeaker USB tuning
      respeaker_params:
        AGCONOFF: 3  # AGC: 0=off, 1-3=levels
        AGCMAXGAIN: 30  # Max AGC gain (dB)
        AGCDESIREDLEVEL: 10  # Target level
        VOICEACTIVITY: 1  # VAD: 1=enable
        SPEECH_DETECTED: 1  # Use built-in VAD

    # ===== LED Node =====
    led_node:
      # Режимы работы
      auto_mode: true  # Автопереключение по /voice/state
      brightness: 16  # 0-31

      # Цвета для состояний
      colors:
        idle:
          - 0
          - 50
          - 100
        listening:
          - 0
          - 255
          - 0
        thinking:
          - 100
          - 0
          - 200
        speaking:
          - 255
          - 100
          - 0
        error:
          - 255
          - 0
          - 0
        success:
          - 0
          - 255
          - 50
        wake:
          - 255
          - 255
          - 0

      # Эффекты
      use_direction: true  # Направление DoA для спин/wipe
      effect_speed: 0.1  # Скорость анимации

    # ===== STT Node (Speech-to-Text) =====
    stt_node:
      # AEC mode: 'hardware' = доверяем XVF-3000 (можно перебивать робота!)
      #           'software' = выкидываем фразы пока TTS играет (безопасно но нельзя перебить)
      aec_mode: "hardware"
      # Wake words для мгновенного STOP TTS (barge-in). Должны совпадать с dialogue_node!
      wake_words: ["робок", "робот", "роббокс"]

      provider: "vosk"  # vosk | whisper | yandex | google

      # Vosk (RECOMMENDED: Fast, offline, real-time)
      vosk:
        model_path: "/models/vosk-model-small-ru-0.22"
        confidence_threshold: 0.7  # Если ниже - fallback на Yandex
        sample_rate: 16000

      # Whisper (Alternative: Better accuracy, slower)
      whisper:
        model: "base"  # tiny | base | small | medium | large
        device: "cpu"
        language: "ru"
        # Model size comparison:
        # tiny: 39MB, 70% accuracy, <1s
        # base: 74MB, 80% accuracy, 1-2s (RECOMMENDED)
        # small: 244MB, 85% accuracy, 2-3s

      # Yandex Cloud (Fallback for low confidence)
      yandex:
        folder_id: "YOUR_FOLDER_ID"  # Заменить!
        api_key: "YOUR_API_KEY"      # Заменить!
        language: "ru-RU"
        model: "general"  # general | general:rc | general:deprecated
        audio_encoding: "LINEAR16_PCM"
        sample_rate: 16000
        use_when_confidence_below: 0.7  # Fallback trigger

    # ===== TTS Node (Text-to-Speech) =====
    tts_node:
      provider: "piper"  # piper | silero | yandex | google

      # Piper TTS (RECOMMENDED: Fast, high quality, offline)
      piper:
        model_path: "/models/ru_RU-dmitri-medium.onnx"
        voice_speed: 1.0  # 0.5-2.0
        # Alternative voices:
        # ru_RU-dmitri-medium (male, clear)
        # ru_RU-irina-medium (female, warm)

      # Silero TTS (Alternative: More voices, slower)
      silero:
        speaker: "baya"  # aidar (male) | baya (female) | kseniya | xenia | eugene (NEW in v5!)
        sample_rate: 48000  # v5: повышено для лучшего качества (было 24000 в v4)
        device: "cpu"

        # Silero v5: новые флаги для расстановки ударений (НОВОЕ!)
        put_accent: true        # Ударения в обычных словах
        put_yo: true            # Автоматическая буква ё
        put_stress_homo: true   # Ударения в омографах (замОк/зАмок)
        put_yo_homo: true       # Ударения в омографах с ё

      # Yandex Cloud (Fallback: Best quality with emotions)
      yandex:
        folder_id: "YOUR_FOLDER_ID"  # Заменить!
        api_key: "YOUR_API_KEY"      # Заменить!
        voice: "anton"  # anton | alena | oksana | jane
        emotion: "neutral"  # neutral | good | evil
        speed: 1  # 0.1-3.0 (медленнее для робота)
        format: "lpcm"
        sample_rate: 16000
        use_for_important: true  # Использовать для важных сообщений

      # Громкость
      volume_db: -15.0

      # Кэш
      cache_enabled: true
      cache_dir: "/cache/tts"
      cache_max_size_mb: 500

    # ===== Dialogue Node (LLM) =====
    dialogue_node:
      provider: "deepseek"  # qwen | deepseek | openai | ollama
      model: "deepseek-v4-pro"  # Overrides PROVIDERS default
      enable_fallback: false  # ОТКЛЮЧЕНО: нет доступа к Qwen
      enable_mcp_tools: true  # ВНИМАНИЕ! Может включать reasoning mode в DeepSeek

      # Qwen API
      qwen:
        api_key: ""  # Используется QWEN_API_KEY из переменных окружения
        base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
        model: "qwen-turbo"
        temperature: 0.7
        max_tokens: 500
        stream: true

      # DeepSeek API
      deepseek:
        api_key: ""  # Используется DEEPSEEK_API_KEY из переменных окружения
        base_url: "https://api.deepseek.com"
        model: "deepseek-v4-flash"
        temperature: 0.7
        max_tokens: 500  # Увеличено для творческих задач (рэп, стихи)
        stream: true

      # Промпт система
      system_prompt_file: "master_prompt_compact.txt"  # Агентный промпт с tool calls (только имя файла!)
      history_max_turns: 20  # Скользящее окно: 20 пар (user+assistant) = 40 сообщений
      dialogue_timeout: 300.0  # Таймаут сессии: 5 минут без wake word → IDLE
      llm_timeout_sec: 90.0    # Таймаут одного LLM-вызова (total = ×3 = 270s)
      faq_mode_enabled: true
      faq_event_config_file: ""   # Отключено

      # Тайминги
      response_timeout_sec: 30.0
      stream_chunk_timeout_sec: 5.0

      # Накопление запросов (Query Queue System)
      query_accumulation_timeout: 2.5  # секунд для накопления запросов перед обработкой

      # Лимит ходов агента (tool-call turns)
      # Музыка в несколько инструментов + speak_text + Clock.bpm = легко 10+ ходов
      agent_max_turns: 20

      # Инструменты, чьи тёрны исключаются из истории диалога.
      # Предотвращает баг DeepSeek V3 multi-turn FC pattern-completion:
      # модель видит save_waypoint(X)->"X сохранена!" в истории и при следующем
      # похожем запросе пропускает вызов инструментов, просто копируя паттерн.
      # handle_music тоже исключаем: DeepSeek pattern-completion на 3-м муз. тёрне.
      history_excluded_tools:
        - "handle_navigation"
        - "handle_music"

    # ===== Sound Node (Аудио эффекты) =====
    sound_node:
      sound_pack_dir: "/ws/sound_pack"
      volume_db: -12.0  # Громкость в dB (-12dB ≈ 24% громкости)
      trigger_animations: true
      animation_topic: "/animations/trigger"

    # ===== Command Node (Управление роботом) =====
    command_node:
      # Подписки на топики
      subscriptions:
        odometry: "/odom"
        battery: "/battery_state"
        scan: "/scan"

      # Публикации
      publishers:
        cmd_vel: "/cmd_vel"
        goal_pose: "/goal_pose"

      # Лимиты скорости
      max_linear_speed: 0.3  # м/с
      max_angular_speed: 1.0  # рад/с

      # Команды движения
      command_timeout_sec: 0.5  # Таймаут для cmd_vel

      # Парсинг команд (список строк pattern|action|params через разделитель)
      # ВРЕМЕННО ОТКЛЮЧЕНО для новогоднего выступления - команды движения закомментированы
      command_patterns:
        # - "вперед|робот вперед|forward|move_forward|0.5|0.0"
        # - "назад|робот назад|back|move_backward|0.5|0.0"
        # - "налево|робот налево|left|turn_left|0.0|90.0"
        # - "направо|робот направо|right|turn_right|0.0|90.0"
        # - "стоп|робот стоп|stop|stop|0.0|0.0"
        # - "домой|робот домой|go home|return_home|0.0|0.0"
        []  # Пустой список - команды отключены
