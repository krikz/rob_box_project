# tts_node.yaml — per-node ROS2 config (issue #1004 fix, ADR-0004)
#
# ЖИВОЙ конфиг для docker-деплоя (см. audio_node.yaml).
# Все ключи соответствуют declare_parameter() в tts_node.py 1:1.
# Секреты (minimax_api_key/minimax_group_id/yandex_api_key) — пусто →
# fallback на ENV; в YAML секреты не хранятся.

tts_node:
  ros__parameters:
    provider: minimax
    silero_speaker: aidar
    silero_sample_rate: 48000
    synthesis_max_workers: 2
    synthesis_max_queue: 16
    minimax_api_key: ''
    minimax_group_id: ''
    # Issue #1780 / issue #1004 — дефолтные emotion / pitch / volume /
    # pronunciation_dict для MiniMax T2A v2. Нейтральные дефолты сохраняют
    # текущее поведение (поля НЕ передаются в API, см. minimax_tts.py):
    #   emotion = ""             → не передавать
    #   pitch  = 0               → 0 = «не передавать»; иначе int semitones
    #   volume = 0.0             → 0.0 = «не передавать»; иначе [1.0, 10.0]
    #   pronunciation_dict = ""  → MiniMax-словарь произношения (JSON)
    # Допустимые значения emotion (MiniMax T2A v2 voice_setting.emotion):
    #   happy | neutral | sad | angry | fearful | disgusted | surprised
    # Прокидывание значений в ``TTSSettings`` — в карточке t_4e98182a.
    minimax_emotion: ''
    minimax_pitch: 0
    minimax_volume: 0.0
    minimax_pronunciation_dict: ''
    normalize_text: true
    chipmunk_mode: false
    pitch_shift: 1.0
    volume_db: -3.0
    silero_put_accent: true
    silero_put_yo: true
    silero_put_stress_homo: true
    silero_put_yo_homo: true
    yandex_api_key: ''
    yandex_voice: anton
    yandex_speed: 1.0
    # Issue #1780 / issue #1004 — флаг «ssml-aware» режима для Yandex.
    # При True — Yandex-провайдер должен передавать вход как SSML
    # (``<speak>...<emotion>happy</emotion>...</speak>``) и использовать
    # ``<emotion>`` / ``<prosody pitch=...>`` теги, поддерживаемые
    # Yandex gRPC v3. Сейчас False (legacy: текст → Hints(voice, speed)).
    # Полная интеграция — в карточке t_c401ecaa; флаг уже здесь, чтобы
    # YAML был валиден и можно было безопасно переключать.
    yandex_ssml_aware: false
    chunk_max_chars_yandex: 250
    chunk_max_chars_silero: 800
    chunk_max_chars_minimax: 5000
    chunk_max_retries: 3
    chunk_min_chars: 50
    minimax_voice: male-qn-qingse
    minimax_model: speech-02-hd
    minimax_language: ru
    minimax_speed: 1.0
    minimax_sample_rate: 32000
    minimax_format: pcm
    minimax_timeout: 30.0
    minimax_max_retries: 2
    minimax_retry_backoff_ms: 500
    minimax_streaming: false
    # Issue #1780 — emotion / pitch / volume / pronunciation_dict. См.
    # подробности в src/rob_box_voice/config/tts_node.yaml и в
    # tts_node.py:declare_parameter.
    minimax_emotion: neutral
    minimax_pitch: ''
    minimax_volume: ''
    minimax_pronunciation_dict: ''
    # Issue #1229 — файл персистентного состояния фактического провайдера
    # TTS (после фолбека minimax→yandex). tts_node пишет сюда {provider,
    # dead_providers} при смене провайдера; при рестарте контейнера кэш
    # «мёртвых» восстанавливается, и LLM-контекст [TTS] сразу показывает
    # реального провайдера (не номинального minimax). Пустая строка —
    # отключить персистентность.
    provider_state_file: /data/tts_provider_state.json
    audio_topic: /voice/audio/speech
    audio_output_sample_rate: 16000
    audio_qos_reliability: best_effort
    audio_qos_depth: 10
