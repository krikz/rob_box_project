# mcp_server.yaml — per-node ROS2 config ноды mcp_server (ADR-0004: <node>: ros__parameters:).
#
# Две копии: docker/vision/config/voice_assistant/ (живой, docker) и src/rob_box_voice/config/ —
# менять синхронно (сверяет test_music_engine_flag.py). Ключи = declare_parameter()
# в rob_box_mcp_tools/mcp_server.py. Флаг music_engine — в music_engine.yaml (общий с dialogue_node).

mcp_server:
  ros__parameters:
    # Clock.latency Renardo при v2 (#3328): 0.5 с — опоздавших бандлов в scsynth 0 вместо
    # ~250/мин при 0.25 (замеры PR-2 #3329, PR-4 #3330). При v1 не применяется.
    music_v2_clock_latency: 0.5
    # ADR-0149 PR-10: фоновый ризонер плана сета (MiniMax, общий кошелёк с голосом — решение Шифу В1).
    # false — ноль вызовов LLM, сет целиком seeded. Дедлайн — до nearly_finished трека 1.
    music_v2_reasoner: true
    music_v2_reasoner_deadline_s: 45.0
    # Выкрик hype_line на первом треке по профилю LLM — решение Шифу В2: по умолчанию тишина.
    music_v2_hype_line: false
