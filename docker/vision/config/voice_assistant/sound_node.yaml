# sound_node.yaml — per-node ROS2 config (issue #1004 fix, ADR-0004)
#
# ЖИВОЙ конфиг для docker-деплоя (см. audio_node.yaml).
# Все ключи соответствуют declare_parameter() в sound_node.py 1:1.

sound_node:
  ros__parameters:
    sound_pack_dir: /ws/sound_pack
    volume_db: -12.0
    trigger_animations: true
    animation_topic: /animations/trigger
