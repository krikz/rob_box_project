# scenarios/00_barge_in.yaml
# Регрессионные тесты barge-in — commit 37527df (dialogue_id propagation)
#
# ЗАПУСКАЕТСЯ ПЕРВЫМ (00_): холодный старт, нет накопленной истории.
# Именно на холодную эти артефакты воспроизводились на реальном роботе.
#
# Ключевой инвариант (TASK-047, AC):
#   После нового dialogue_id — speak_text от старого диалога НЕ воспроизводится.
#   Прерывающий запрос обрабатывается как новый диалог: новый LLM вызов,
#   новая цепочка tool_calls, conversation_history очищена.
#
# Механика в тестах:
#   inject_stt_no_wait   — запускает первый диалог (fire-and-forget)
#   wait_for_speaking    — ждём пока нода реально начнёт говорить (speak_text вызван)
#   inject_vad: true     — сигнал начала новой речи → interrupt_agent_loop=True
#   inject_stt           — прерывающий запрос + ожидание ответа + assert
#   assert_quiet_after_ms — КЛЮЧЕВОЙ ИНВАРИАНТ: после прерывания НИ ОДНОГО
#                           нового response (старый диалог не досказывает)
#   assert_idle          — ВЕРИФИКАЦИЯ AC: нода вернулась в state=idle без зависания
#
# Окно прерывания предсказуемо: mock speak_text публикует response сразу,
# а MCP result — только после tts_sim_s (0.6-3.0s). Barge-in вставляем
# между ними: старый диалог ещё «говорит», а нода уже обрабатывает прерывание.

scenarios:

  # ──────────────────────────────────────────────────────────────────────────
  # Сценарий A: реальный баг с робота
  # Пользователь просит анекдот → перебивает вопросом о памяти.
  # ОЖИДАЕМО: только ответ о памяти.
  # БАГ WAS: анекдот дорассказывался → потом память → итого память ДВАЖДЫ.
  # ──────────────────────────────────────────────────────────────────────────
  - name: barge_in_joke_then_memory
    timeout_s: 90
    description: >
      Сценарий A (реальный баг): просим анекдот → во время обработки LLM
      прерываем вопросом о памяти. Робот должен остановиться и ответить только
      про память. assert_quiet_after_ms проверяет КЛЮЧЕВОЙ инвариант: старый
      диалог (анекдот) НЕ продолжает speak_text после нового dialogue_id.
    steps:
      # Запускаем первый диалог — НЕ ждём ответа, нода уходит в DIALOGUE
      # Минимум 3 слова: dialogue_node фильтрует фразы < 3 слов (word_count < 3)
      - inject_stt_no_wait: "робок расскажи анекдот про журавлика"

      # Ждём пока робот действительно начнёт говорить (speak_text вызван).
      # Симулирует реальный сценарий: пользователь прерывает ПОСЛЕ начала ответа.
      # wait_for_speaking блокируется на _response_event (speak_text → response pub).
      - wait_for_speaking: true
        timeout_s: 30

      # VAD-прерывание: пользователь начал говорить → interrupt_agent_loop=True
      - inject_vad: true
      - wait_ms: 150
      - inject_vad: false

      # Прерывающий запрос — очищает трекинг, ждёт ответ нового диалога
      - inject_stt: "робок о чём мы с тобой говорили в прошлый раз"
        timeout_s: 45
        assert_response_not_empty: true
        assert_tool_called: "memory_context"

      # КЛЮЧЕВОЙ ИНВАРИАНТ: после ответа про память НЕ должно прийти НИ ОДНОГО
      # нового response — старый анекдот не досказывается, память не дублируется.
      - assert_quiet_after_ms: 5000

      # ВЕРИФИКАЦИЯ AC: диалог завершился, нода вернулась в idle без зависания.
      - assert_idle: true
        timeout_s: 30

  # ──────────────────────────────────────────────────────────────────────────
  # Сценарий B: быстрое прерывание — три запроса подряд, обрабатывается
  # только последний (AC TASK-047). БЫЛО: все три диалога обрабатывались
  # параллельно, голосовые ответы перемешивались.
  # ──────────────────────────────────────────────────────────────────────────
  - name: barge_in_rapid_triple_interrupt
    timeout_s: 90
    description: >
      Сценарий B (AC): 'расскажи историю' → 'нет нет подожди' → 'лучше скажи
      который час'. ОЖИДАЕМО: обрабатывается только последний запрос (время),
      старые диалоги отменяются, голоса не перемешиваются.
      ВНИМАНИЕ: 'стоп' в тест-конфиге — silence-команда, поэтому средний
      прерыватель сформулирован без него ('нет нет подожди'), чтобы диалог
      реально прервался новым wake-запросом, а не замолчал.
    steps:
      # Первый запрос — длинный ответ (история), fire-and-forget
      - inject_stt_no_wait: "робок расскажи интересную историю про космос"

      # Ждём пока робот начнёт рассказывать (speak_text вызван)
      - wait_for_speaking: true
        timeout_s: 30

      # Быстрое прерывание №1 (пользователь перебивает рассказ)
      - inject_stt_no_wait: "робок нет нет подожди"

      # Даём ноде войти в DIALOGUE для прерывания №1
      - wait_ms: 300

      # Быстрое прерывание №2 — финальный запрос про время (ждём ответ)
      - inject_stt: "робок лучше скажи который час"
        timeout_s: 45
        assert_response_not_empty: true

      # КЛЮЧЕВОЙ ИНВАРИАНТ: после ответа про время НИ ОДНОГО нового response
      # (старые диалоги отменены, голоса не перемешиваются)
      - assert_quiet_after_ms: 5000

      # ВЕРИФИКАЦИЯ AC: нода вернулась в idle без зависания
      - assert_idle: true
        timeout_s: 30

  # ──────────────────────────────────────────────────────────────────────────
  # Сценарий C: прерывание во время ожидания listen_for_response.
  # Робот задал вопрос (listen_for_response), пользователь вместо ответа
  # делает barge-in с коротким завершающим запросом.
  # ОЖИДАЕМО: старый listen отменяется, новый диалог стартует и завершается чисто.
  # ──────────────────────────────────────────────────────────────────────────
  - name: barge_in_during_listen_for_response
    timeout_s: 90
    description: >
      Сценарий C: робот ждёт listen_for_response → barge-in короткого запроса.
      Нода должна обработать новый диалог без зависания. Возврат в idle.
    steps:
      # Запрос который спровоцирует speak_text + listen_for_response
      - inject_stt: "робок загадай мне загадку и подожди мой ответ"
        timeout_s: 50
        assert_response_not_empty: true

      # Нода в LISTENING state (listen_for_response active)
      - wait_ms: 500

      # Barge-in: пользователь передумал отвечать на загадку
      - inject_vad: true
      - wait_ms: 150
      - inject_vad: false

      # Короткий завершающий запрос — гарантирует 1 speak_text + IDLE (без listen).
      # Минимум 3 слова (word_count filter). timeout_s увеличен: нода могла
      # застрять в dialogue после listen_for_response barge-in.
      - inject_stt: "робок как тебя зовут"
        timeout_s: 45
        assert_response_not_empty: true

      # КЛЮЧЕВОЙ ИНВАРИАНТ: старый listen_for_response отменён, новых response нет
      - assert_quiet_after_ms: 5000

      # ВЕРИФИКАЦИЯ AC: нода вернулась в idle без зависания
      - assert_idle: true
        timeout_s: 30
