# scenarios/00_barge_in.yaml
# Регрессионные тесты barge-in — commit 37527df (dialogue_id propagation)
#
# ЗАПУСКАЕТСЯ ПЕРВЫМ (00_): холодный старт, нет накопленной истории.
# Именно на холодную эти артефакты воспроизводились на реальном роботе.
#
# Ключевой инвариант:
#   После нового dialogue_id — speak_text от старого диалога НЕ публикуется.
#   Прерывающий запрос обрабатывается как новый диалог: новый LLM вызов,
#   новая цепочка tool_calls, conversation_history очищена.
#
# Механика в тестах:
#   inject_stt_no_wait   — запускает первый диалог (fire-and-forget)
#   wait_ms N            — ждём пока нода перейдёт в DIALOGUE state (LLM думает)
#   inject_vad: true     — сигнал начала новой речи → interrupt_agent_loop=True
#   inject_stt           — прерывающий запрос + ожидание ответа + assert

scenarios:

  # ──────────────────────────────────────────────────────────────────────────
  # Сценарий A (было: barge_in_joke_then_memory) — S8 Task 8.2
  # (scheduler-segments-merge plan, issue #968).
  #
  # ⚠️ ЧЕСТНОСТЬ (ADR-0018): этот сплит НЕ прогонялся — нет стенда на машине
  # воркера. Подготовлен по спеке плана; raw-вывод и зелёный статус — за тем,
  # кто прогоняет e2e.
  #
  # Раньше это был ОДИН сценарий, утверждавший «робот должен остановиться» —
  # ровно то поведение, которое спек (SCHEDULER_DESIGN.md §2.3/§4) отменяет
  # для НЕ-императивных перебиваний под barge_in_policy=classify (этот
  # конфиг теперь включён в voice_assistant_test.yaml). Разделён на два по
  # вердикту quick_decide (scheduler/quick_decide.py):
  #   - barge_in_replace — явный императив («стоп») → REPLACE → останавливается.
  #   - barge_in_merge    — топик-вопрос (не императив) → PENDING_LLM → НЕ
  #                          останавливается, куплет/фраза доигрывает.
  # ──────────────────────────────────────────────────────────────────────────
  - name: barge_in_replace
    timeout_s: 90
    description: >
      Явный императив («стоп») во время ответа — REPLACE, регресс старого
      поведения: TTS глушится, LLM отвечает заново на новый запрос.
      Используем "стоп", не "хватит"/"замолчи" — те перехватываются ЕЩЁ
      РАНЬШЕ отдельным is_silence_command-гейтом (dialogue_text.py,
      DEFAULT_SILENCE_COMMANDS) и не доходят даже до LLM — тестировали бы
      не ту ветку. "стоп" — единственный из
      quick_decide._REPLACE_IMPERATIVES, который туда не попадает (см.
      test_barge_in_policy.py::test_replace_verdict_stops_tts_and_dispatches).
    steps:
      # Запускаем первый диалог — НЕ ждём ответа, нода уходит в DIALOGUE
      # Минимум 3 слова: dialogue_node фильтрует фразы < 3 слов (word_count < 3)
      - inject_stt_no_wait: "робок расскажи анекдот про журавлика"

      # Ждём пока робот действительно начнёт говорить (speak_text вызван).
      - wait_for_speaking: true
        timeout_s: 30

      # VAD-прерывание: пользователь начал говорить → interrupt_agent_loop=True
      - inject_vad: true
      - wait_ms: 150
      - inject_vad: false

      # Явный императив + новая тема в одной фразе — REPLACE останавливает
      # TTS, но полный текст всё равно уходит в LLM (stop_tts управляет
      # только STOP-публикацией, не тем, что видит LLM).
      - inject_stt: "робок стоп, расскажи про память"
        timeout_s: 45
        assert_response_not_empty: true
        assert_tool_called: "memory_context"

  - name: barge_in_merge
    timeout_s: 90
    description: >
      Топик-вопрос («о чём мы говорили») во время ответа — НЕ императив,
      quick_decide отдаёт PENDING_LLM. Под barge_in_policy=classify это
      значит: текущий сегмент НЕ глушится (assert_tts_not_stopped), LLM
      получает [ACTIVE TASKS]/[SEGMENT PLAN] и отвечает сама. Это ровно тот
      случай, который раньше ошибочно ожидал «робот должен остановиться».
    steps:
      - inject_stt_no_wait: "робок расскажи анекдот про журавлика"

      - wait_for_speaking: true
        timeout_s: 30

      - inject_vad: true
      - wait_ms: 150
      - inject_vad: false

      # Прерывающий запрос — НЕ императив. STOP не должен уйти в
      # /voice/tts/control между этими двумя инъекциями.
      - inject_stt: "робок о чём мы с тобой говорили в прошлый раз"
        timeout_s: 45
        assert_response_not_empty: true
        assert_tool_called: "memory_context"
        assert_tts_not_stopped: true

  # ──────────────────────────────────────────────────────────────────────────
  # Сценарии B и C НЕ входили в Task 8.2 (план трогает только сценарий A) —
  # оставлены как есть. Не проверялись под barge_in_policy=classify, но их
  # единственный assert (assert_response_not_empty, без assert_no_stop) не
  # зависит от того, был ли STOP — должны остаться зелёными в любом случае.
  # ──────────────────────────────────────────────────────────────────────────

  # ──────────────────────────────────────────────────────────────────────────
  # Сценарий B: barge-in сразу после ответа — второй запрос обрабатывается чисто.
  # Надёжнее inject_stt_no_wait: первый диалог ЗАВЕРШИЛСЯ (assert_response),
  # потом VAD + второй STT. Нода обрабатывает только второй без загрязнения.
  # ──────────────────────────────────────────────────────────────────────────
  - name: barge_in_replace_request
    timeout_s: 90
    description: >
      Сценарий B: fire-and-forget анекдот → barge-in пока говорит → замена запросом.
      Паттерн inject_stt_no_wait + wait_for_speaking (как сценарий A) — надёжнее:
      VAD-прерывание происходит ПОКА робот говорит, а не после.
      Второй запрос (статус батареи) обрабатывается как новый диалог.
    steps:
      # Запускаем анекдот без ожидания ответа
      - inject_stt_no_wait: "робок расскажи смешной анекдот"

      # Ждём пока робот начнёт говорить (speak_text вызван)
      - wait_for_speaking: true
        timeout_s: 25

      # Barge-in: пользователь перебивает пока робот говорит
      - inject_vad: true
      - wait_ms: 150
      - inject_vad: false

      # Второй запрос — другая тема, должна открыть новый диалог
      - inject_stt: "робок какой у тебя заряд батареи"
        timeout_s: 45
        assert_response_not_empty: true

  # ──────────────────────────────────────────────────────────────────────────
  # Сценарий C: прерывание во время ожидания listen_for_response.
  # Робот задал вопрос (listen_for_response), пользователь вместо ответа
  # делает barge-in с коротким завершающим запросом.
  # ОЖИДАЕМО: старый listen отменяется, новый диалог стартует и завершается чисто.
  # Выбран короткий barge-in "назови своё имя" — гарантирует 1 speak_text,
  # без listen_for_response → чистый IDLE после.
  # ──────────────────────────────────────────────────────────────────────────
  - name: barge_in_during_listen_for_response
    timeout_s: 90
    description: >
      Сценарий C: робот ждёт listen_for_response → barge-in короткого запроса.
      Нода должна обработать новый диалог без зависания. Возврат в idle.
    steps:
      # Запрос который спровоцирует speak_text + listen_for_response
      - inject_stt: "робок загадай мне загадку и подожди мой ответ"
        timeout_s: 50
        assert_response_not_empty: true

      # Нода в LISTENING state (listen_for_response active)
      - wait_ms: 500

      # Barge-in: пользователь передумал отвечать на загадку
      - inject_vad: true
      - wait_ms: 150
      - inject_vad: false

      # Короткий завершающий запрос — гарантирует 1 speak_text + IDLE (без listen).
      # Минимум 3 слова (word_count filter). timeout_s увеличен: нода могла
      # застрять в dialogue после listen_for_response barge-in.
      - inject_stt: "робок как тебя зовут"
        timeout_s: 45
        assert_response_not_empty: true
