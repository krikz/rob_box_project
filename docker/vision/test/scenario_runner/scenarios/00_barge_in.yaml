# scenarios/00_barge_in.yaml
# Регрессионные тесты barge-in — commit 37527df (dialogue_id propagation)
#
# ЗАПУСКАЕТСЯ ПЕРВЫМ (00_): холодный старт, нет накопленной истории.
# Именно на холодную эти артефакты воспроизводились на реальном роботе.
#
# Ключевой инвариант:
#   После нового dialogue_id — speak_text от старого диалога НЕ публикуется.
#   Прерывающий запрос обрабатывается как новый диалог: новый LLM вызов,
#   новая цепочка tool_calls, conversation_history очищена.
#
# Механика в тестах:
#   inject_stt_no_wait   — запускает первый диалог (fire-and-forget)
#   wait_ms N            — ждём пока нода перейдёт в DIALOGUE state (LLM думает)
#   inject_vad: true     — сигнал начала новой речи → interrupt_agent_loop=True
#   inject_stt           — прерывающий запрос + ожидание ответа + assert

scenarios:

  # ──────────────────────────────────────────────────────────────────────────
  # Сценарий A: реальный баг с робота
  # Пользователь просит анекдот → перебивает вопросом о памяти.
  # ОЖИДАЕМО: только ответ о памяти.
  # БАГ WAS: анекдот дорассказывался → потом память → итого память ДВАЖДЫ.
  # ──────────────────────────────────────────────────────────────────────────
  - name: barge_in_joke_then_memory
    description: >
      Сценарий A (реальный баг): просим анекдот → во время обработки LLM
      прерываем вопросом о памяти. Робот должен остановиться и ответить только
      про память. memory_context должен быть вызван одним ответом (не дважды).
    steps:
      # Запускаем первый диалог — НЕ ждём ответа, нода уходит в DIALOGUE
      - inject_stt_no_wait: "расскажи анекдот"

      # Ждём пока LLM начнёт обрабатывать (нода в DIALOGUE, llm_processing=True)
      # DeepSeek обычно 2-5s → 2000ms гарантирует что мы внутри LLM-вызова
      - wait_ms: 2000

      # VAD-прерывание: пользователь начал говорить → interrupt_agent_loop=True
      - inject_vad: true
      - wait_ms: 150
      - inject_vad: false

      # Прерывающий запрос — очищает трекинг, ждёт ответ нового диалога
      - inject_stt: "о чём мы с тобой говорили в прошлый раз"
        timeout_s: 45
        assert_response_not_empty: true
        assert_tool_called: "memory_context"

  # ──────────────────────────────────────────────────────────────────────────
  # Сценарий B: замена запроса в середине обработки
  # Один barge-in — обрабатывается только последний запрос.
  # ──────────────────────────────────────────────────────────────────────────
  - name: barge_in_replace_request
    description: >
      Сценарий B: начали запрос → barge-in с другим запросом.
      Обрабатывается только последний (статус батареи).
      Ответ на первый запрос (история) не должен прийти после barge-in.
    steps:
      # Первый диалог — длинный контент, гарантированно занимает > 1s LLM
      - inject_stt_no_wait: "расскажи подробную историю про приключения робота в лесу"

      # LLM в процессе — достаточно долгий запрос
      - wait_ms: 1800

      # Barge-in — пользователь передумал
      - inject_vad: true
      - wait_ms: 150
      - inject_vad: false

      # Новый запрос — короткий, конкретный инструментальный вызов.
      # assert_tool_called не используем: LLM может объединить оба запроса и ответить
      # сначала speak_text перед вызовом get_robot_status (query accumulation).
      # Достаточно assert_response_not_empty — barge-in был обработан, ответ пришёл.
      - inject_stt: "какой у тебя заряд батареи"
        timeout_s: 45
        assert_response_not_empty: true

  # ──────────────────────────────────────────────────────────────────────────
  # Сценарий C: прерывание во время ожидания listen_for_response
  # Робот задал вопрос (listen_for_response), пользователь вместо ответа
  # делает barge-in с другим запросом.
  # ОЖИДАЕМО: старый listen отменяется, новый диалог стартует чисто.
  # ──────────────────────────────────────────────────────────────────────────
  - name: barge_in_during_listen_for_response
    description: >
      Сценарий C: робот задал вопрос + ждёт listen_for_response → пользователь
      не отвечает, делает barge-in с новым запросом. Нода должна обработать
      новый диалог без зависания. Возврат в idle — обязательный.
    steps:
      # Запрос который спровоцирует speak_text + listen_for_response
      - inject_stt: "загадай мне загадку и подожди мой ответ"
        timeout_s: 35
        assert_response_not_empty: true

      # listen_for_response mock вернул "Слушаю...", нода в LISTENING
      # Даём settle-time
      - wait_ms: 1500

      # Barge-in: пользователь передумал отвечать на загадку
      - inject_vad: true
      - wait_ms: 150
      - inject_vad: false

      # Новый запрос — полностью другая тема, нода должна начать новый диалог
      - inject_stt: "лучше расскажи мне анекдот"
        timeout_s: 40
        assert_response_not_empty: true
