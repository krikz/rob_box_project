# scenarios/00_barge_in.yaml
# Регрессионные тесты barge-in — commit 37527df (dialogue_id propagation)
#
# ЗАПУСКАЕТСЯ ПЕРВЫМ (00_): холодный старт, нет накопленной истории.
# Именно на холодную эти артефакты воспроизводились на реальном роботе.
#
# Ключевой инвариант:
#   После нового dialogue_id — speak_text от старого диалога НЕ публикуется.
#   Прерывающий запрос обрабатывается как новый диалог: новый LLM вызов,
#   новая цепочка tool_calls, conversation_history очищена.
#
# Механика в тестах:
#   inject_stt_no_wait   — запускает первый диалог (fire-and-forget)
#   wait_ms N            — ждём пока нода перейдёт в DIALOGUE state (LLM думает)
#   inject_vad: true     — сигнал начала новой речи → interrupt_agent_loop=True
#   inject_stt           — прерывающий запрос + ожидание ответа + assert

scenarios:

  # ──────────────────────────────────────────────────────────────────────────
  # Сценарий A: реальный баг с робота
  # Пользователь просит анекдот → перебивает вопросом о памяти.
  # ОЖИДАЕМО: только ответ о памяти.
  # БАГ WAS: анекдот дорассказывался → потом память → итого память ДВАЖДЫ.
  # ──────────────────────────────────────────────────────────────────────────
  - name: barge_in_joke_then_memory
    description: >
      Сценарий A (реальный баг): просим анекдот → во время обработки LLM
      прерываем вопросом о памяти. Робот должен остановиться и ответить только
      про память. memory_context должен быть вызван одним ответом (не дважды).
    steps:
      # Запускаем первый диалог — НЕ ждём ответа, нода уходит в DIALOGUE
      # Минимум 3 слова: dialogue_node фильтрует фразы < 3 слов (word_count < 3)
      - inject_stt_no_wait: "расскажи анекдот про журавлика"

      # Ждём пока робот действительно начнёт говорить (speak_text вызван).
      # Симулирует реальный сценарий: пользователь прерывает ПОСЛЕ начала ответа.
      # wait_for_speaking блокируется на _response_event (speak_text → response pub).
      - wait_for_speaking: true
        timeout_s: 30

      # VAD-прерывание: пользователь начал говорить → interrupt_agent_loop=True
      - inject_vad: true
      - wait_ms: 150
      - inject_vad: false

      # Прерывающий запрос — очищает трекинг, ждёт ответ нового диалога
      - inject_stt: "о чём мы с тобой говорили в прошлый раз"
        timeout_s: 45
        assert_response_not_empty: true
        assert_tool_called: "memory_context"
