# scenarios/02_tool_call.yaml
# Сценарии с вызовом MCP инструментов
#
# mock-llm возвращает tool_calls ответ через set_llm_responses.
# Формат: строка Starting with "TOOL_CALL:" описывает инструмент.
# dialogue_node → _execute_tool_calls → mock mcp_adapter → результат → снова LLM.
#
# Для полного теста tool call flow нужен mock MCP adapter.
# Пока тестируем что dialogue_node не падает при tool_calls ответе.

llm_rules:
  - trigger: "навигация"
    response: "Начинаю навигацию к указанной точке."
  - trigger: "где ты"
    response: "Я нахожусь в комнате номер один."
  - trigger: "стоп"
    response: "Остановился."

default_response: "Выполняю команду."

scenarios:

  - name: navigation_command
    description: "Команда к навигации → ответ о начале движения"
    steps:
      - inject_stt: "поехали на кухню, навигация"
        timeout_s: 20
        assert_response_contains: "навигац"

  - name: status_query
    description: "Вопрос о местоположении"
    steps:
      - inject_stt: "где ты сейчас"
        timeout_s: 15
        assert_response_contains: "комнат"

  - name: stop_command
    description: "Команда стоп"
    steps:
      - inject_stt: "стоп остановись"
        timeout_s: 10
        assert_response_contains: "Останов"

  - name: scripted_llm_response
    description: "Тест с заранее заданным ответом mock-llm (через /admin/set_responses)"
    steps:
      - set_llm_responses:
          - "Это заранее заданный тестовый ответ номер один."
      - inject_stt: "любой вопрос"
        timeout_s: 15
        assert_response_contains: "заранее заданный"
