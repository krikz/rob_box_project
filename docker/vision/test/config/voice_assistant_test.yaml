# voice_assistant_test.yaml — конфигурация dialogue_node для тестового окружения
#
# Переопределяет prod-конфиг:
#   - LLM base_url → mock-llm (localhost:8765)
#   - wake_words → пуст (всё идёт в LLM без wake word)
#   - enable_mcp_tools → false (упрощаем тест)
#   - enable_fallback → false (только один провайдер)

/dialogue_node:
  ros__parameters:
    # Mock LLM вместо реального API
    provider: "qwen"
    api_key: "test-key-not-real"
    base_url: "http://localhost:8765/v1"
    model: "mock-model"
    temperature: 0.0      # Детерминированность (мок и так возвращает фиксированное)
    max_tokens: 200
    streaming: true

    enable_fallback: false
    enable_mcp_tools: false
    internet_available: true  # Не переходить в fallback режим

    # Пустой список wake_words → любая фраза идёт в LLM
    wake_words: ""
    silence_words: "стоп,тихо,замолчи"

    # Системный промпт для тестов
    system_prompt: "Ты тестовый робот ROBBOX. Отвечай кратко и по делу."

    # История разговора
    max_history_messages: 10
    history_window_tokens: 2000

    # Таймауты
    llm_timeout_sec: 10.0
    max_iterations: 5
