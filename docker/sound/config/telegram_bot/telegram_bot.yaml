# Rob Box Telegram Bot Configuration
# Монтируется в контейнер как /config/telegram_bot/telegram_bot.yaml
telegram_node:
  ros__parameters:
    # Movement safety limits
    max_linear_speed: 0.3      # m/s
    max_angular_speed: 0.5     # rad/s
    move_duration: 0.5         # seconds per button press

    # Camera topics
    # NOTE: with i_rs_compat: true, oak-d renames rgb→color
    camera_topic: "/camera/camera/color/image_raw/compressed"
    camera_depth_topic: "/camera/camera/depth/image_rect_raw/compressedDepth"
    camera_up_topic: "/ceiling_camera/image_raw/compressed"
    camera_cache_ttl: 5.0      # seconds — discard frames older than this
    # Камеры — только по запросу фото (OAK-D/потолочная не крутятся впустую)
    camera_wait_s: 5.0        # сколько ждать первый кадр после подписки
    camera_linger_s: 10.0     # держать подписку после последнего запроса

    # LLM чата — не здесь: телеграм-агент живёт в dialog_node (telegram_* в dialog_node.yaml, ADR-0150 PR-12a).

    # Voice message STT
    voice_stt_method: "yandex"  # yandex | whisper
    voice_stt_language: "ru-RU"

    # Telegram polling
    telegram_poll_timeout: 30   # seconds
