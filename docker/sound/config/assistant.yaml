# Профиль продукта РОББОКС (ADR-0167 §2.4, шаг Ш1б): что делает ядро диалога этим роботом.
# Формат и загрузчик - в ядре (rob_box_dialog.profile, format 4); профиль - у робота, ядро его только читает.
# В контейнере voice-assistant каталог монтируется в /config (./config:/config:ro), хост: dialog_node profile_path.
# Ключей провайдеров здесь нет и не будет - они в окружении.
format: 4
name: РОББОКС
# Таблица вейков рядом с профилем: personality (ReSpeaker) и operator (шлем), формат ядра.
wake_words: wake_words.yaml
# Персона Личности (Ш1б-3): кто он и какой характер - в основу промпта ядра (rob_box_dialog.prompts) на свои места.
persona: persona.txt
# Персона агента-оператора ТАРС (Ш1б-4): кто он и откуда им управляют, заключительный абзац - в основу правил
# оператора ядра (rob_box_dialog/prompts/operator.txt). Чат Telegram берёт имя продукта из name.
operator_persona: operator_persona.txt
# Владельцы тулов (Ш1в): у робота есть все порты ядра (rob_box_dialog.owners.TOOL_OWNERS). Тул владельца, которого
# здесь нет, модель не видит ни в одном срезе - колонка, например, не перечислит navigation, mapping, people.
owners:
  - speech
  - hearing
  - memory
  - clock
  - web
  - music
  - sound
  - face
  - speaker_id
  - people
  - navigation
  - mapping
  - battery
  - perception
  - faq
  - telemetry
  - ros
  - vesc
