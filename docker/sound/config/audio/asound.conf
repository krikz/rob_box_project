# ALSA configuration for ReSpeaker 4 Mic Array (UAC1.0)
# Enables dmix software mixing — allows TTS, sound effects and SuperCollider to play simultaneously
# Uses card NAME (ArrayUAC10) instead of number — number can change across reboots!

pcm.dmix_respeaker {
    type dmix
    ipc_key 2886
    ipc_perm 0666
    slave {
        pcm "hw:CARD=ArrayUAC10,DEV=0"
        rate 16000
        channels 2
        period_size 1024
        buffer_size 8192
    }
}

pcm.!default {
    type plug
    slave.pcm "dmix_respeaker"
}

ctl.!default {
    type hw
    card ArrayUAC10
}
