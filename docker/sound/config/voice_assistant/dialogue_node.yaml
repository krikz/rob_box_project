# dialogue_node.yaml — per-node ROS2 config (issue #1004 fix, ADR-0004)
#
# ЖИВОЙ конфиг для docker-деплоя (см. audio_node.yaml).
# Все ключи соответствуют declare_parameter() в dialogue_node.py 1:1
# (включая per-provider секции <name>.base_url/model/... — объявляются
# динамически для minimax/deepseek/mimo/qwen).
#
# LLM: приоритетная цепочка провайдеров (issue #1089). Первый = primary,
# остальные = fallbacks. Смена провайдера = одна строка llm_providers.

dialogue_node:
  ros__parameters:
    # wake_words намеренно НЕ здесь: списки — в docker/sound/config/wake_words.yaml
    # (SSoT, issue #1990). Нода читает его через wake_words_file: namespace
    # personality — единственный источник вейк-слов личности (ReSpeaker →
    # /voice/stt/utterance). Кодовая DEFAULT_WAKE_WORDS — фолбек для dev-env без
    # файла (список байт-в-байт тот же).
    wake_words_file: /config/wake_words.yaml
    dialogue_timeout: 300.0
    # TODO(legacy-config): 2026-09-15 — отложенный rollout deepseek primary.
    # Документация (docstring'и в src/rob_box_harness/rob_box_harness/providers/*.py,
    # docs/guides/examples/minimax_llm.yaml) говорит [deepseek, minimax, mimo],
    # решение Шифу О5 (21.10, #3746): runtime = [deepseek, minimax], MiniMax — фолбек (см. ADR-0043).
    # При обновлении — синхронизировать test_dialogue_configs_route_to_deepseek_first
    # (src/rob_box_voice/test/test_dialogue_shell.py) в том же коммите.
    # первый = primary, остальные = fallbacks
    llm_providers: "deepseek,minimax"
    # ADR-0150 §4.5 (#3696 ч.5): провайдеры, отвечающие ОДНОЙ командой (поле speech, решение О4); форму запроса
    # выбирает код по capabilities адаптера (DeepSeek → tool_choice, MiniMax → json_in_text) — core/command_bridge.py.
    # С 22.10 включено по умолчанию (решение Шифу 22.10 05:50Z, #3698): значение — одно, в коде
    # rob_box_dialog.knowledge.COMMAND_PROVIDERS_DEFAULT ("deepseek"), здесь ключа нет. Провайдер вне списка
    # (MiniMax-фолбек) идёт старым путём v1 на speak_text. Выключить — вернуть ключ: llm_command_providers: ""
    # Параметр читается при сборке LLM-цепочки: смена — перезапуском ноды, не ros2 param set.
    enable_mcp_tools: true

    # Бэклог-аккумулятор фоновой речи без wake-слова.
    accumulate_no_wake_enabled: true

    # ADR-0139 §2.6 / issue #3024 — face→voice hint: см. src/config/dialogue_node.yaml
    face_voice_hint:
      enabled: true
      window_sec: 30.0
      similarity_high_threshold: 0.78
      similarity_low_threshold: 0.65
      buffer_capacity: 8

    # Issue #XXXX — «новая сессия» / «сбрось всё» / Telegram «/clear»:
    # сброс контекста текущего диалога без вызова LLM. Фразы по умолчанию
    # заданы в коде (_DEFAULT_NEW_SESSION_PHRASES); при необходимости
    # список можно переопределить здесь.
    new_session_enabled: true
    # new_session_phrases:
    # - новая сессия
    # - сбрось всё

    # ═══════════════════════════════════════════════════════════════
    #  LLM Provider sections — one per provider (опционально; пусто →
    #  well-known defaults из _LLM_PROVIDER_REGISTRY в dialogue_node.py)
    # ═══════════════════════════════════════════════════════════════

    # MiniMax (primary — vision-capable, tools, streaming).
    # Модель здесь НЕ задаётся: ``minimax.model`` ROS-параметр объявлен, но
    # провайдер строит каталог (``assembly.build_agent`` → ``build_provider``)
    # и берёт имя из ``rob_box_llm.providers.minimax.MiniMaxProvider.DEFAULT_MODEL``
    # — единственная точка (сейчас MiniMax-M3; M3.1-Flash адаптер умеет, но не
    # включён — решение Шифу 20.10, см. issue #3670). Строка ``model:`` тут
    # раньше была мёртвой и врала, что смена модели — правка yaml.
    minimax:
      api_key: ""                  # MINIMAX_API_KEY env (или явно)
      base_url: "https://api.minimax.io/v1"
      temperature: 0.7
      max_tokens: 3000   # см. #1883: 500 режет tool-call пополам
      timeout_s: 90.0

    # DeepSeek (fallback — дешёвый, быстрый, надёжный)
    deepseek:
      api_key: ""                  # DEEPSEEK_API_KEY env (или явно)
      base_url: "https://api.deepseek.com"
      model: "deepseek-v4-flash"
      temperature: 0.7
      max_tokens: 3000   # см. #1883: 500 режет tool-call пополам
      timeout_s: 90.0

    # MiMo (Xiaomi — fallback #2). Раскомментируй и добавь "mimo" в
    # llm_providers когда API ключ готов.
    # mimo:
    #   api_key: ""
    #   base_url: "https://api.xiaomimimo.com/v1"
    #   model: "mimo-v2.5"
    #   temperature: 0.7
    #   max_tokens: 500
    #   timeout_s: 90.0

    # Qwen (Alibaba — запасной, OpenAI-совместимый).
    # qwen:
    #   api_key: ""
    #   base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
    #   model: "qwen-turbo"
    #   temperature: 0.7
    #   max_tokens: 500
    #   timeout_s: 90.0

    # Промпт система
    system_prompt_file: master_prompt_compact.txt
    # Срез тулов хода (≤ 12 схем) задаёт код по снимку и словам человека — rob_box_dialog.tools_view
    # (ADR-0150 PR-6); скиллов, их фрагментов и сужения по флагу больше нет.
    history_max_turns: 20
    verbose_llm: true
    llm_streaming: true
    faq_mode_enabled: true
    faq_event_config_file: ""   # Например: /config/voice_assistant/event_mode.yaml
    # Инструменты, чьи тёрны исключаются из истории диалога (issue DeepSeek
    # pattern-completion: handle_navigation + handle_music).
    # handle_navigation / handle_music — фасады, удалённые вместе со
    # скиллами Compositor'а: фильтр по ним не отсекал ничего.
    history_excluded_tools:
    - move_direction
    # Диалоговая история harness'а. ДОЛЖНА лежать на смонтированном томе:
    # ``~/.rob_box/voice.db`` — это /root внутри контейнера, том туда не
    # смонтирован, поэтому весь контекст разговора умирал вместе с
    # контейнером (проверено на vision 29.08: файл создан в 15:29 вместе с
    # контейнером, 69 ходов, ни одного старше).
    #
    # Это НЕ ``/data/voice_memory.db``: там живёт VoiceMemory из
    # mcp_server, и схемы конфликтуют — у harness'а ``waypoints.name``
    # PRIMARY KEY, у VoiceMemory ``waypoints`` с ``map_id NOT NULL`` и FK
    # на maps; ``faq_items`` расходятся так же (created_at vs indexed_at).
    # ``CREATE TABLE IF NOT EXISTS`` промолчал бы, а вставки бы падали.
    # Два стора остаются двумя сторами — но оба переживают рестарт.
    sqlite_db_path: /data/harness_voice.db
    speaker_id_enabled: true
    speaker_db_path: /data/speakers.db
    # Issue #2809 -- см. src/rob_box_voice/config/dialogue_node.yaml
    identity_question_session_gap_sec: 120.0
    identity_answer_window_sec: 180.0
    # Issue #2829 (ADR-0131) -- см. src/rob_box_voice/config/dialogue_node.yaml
    speaker_resolve_timeout_sec: 2.5
    startup_greeting_sec: 12.0
    startup_greeting_text: "Я на связи, все системы в норме!"
    tool_provider: ros_mcp
    api_key: ''
