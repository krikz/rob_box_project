# Sound Pi (10.1.1.12 eth0 / .22 wlan0) — третий узел робота (ADR-0159).
# Голосовой стек (voice-assistant, supercollider, voice-action-server) переехал
# сюда с Vision Pi: на этом узле ReSpeaker (микрофон + колонки + LED-кольцо) и
# TTL-USB конвертер сенсорного хаба. Всё остальное общается с ним топиками
# через Zenoh и compose-зависимостями с другими узлами не связано.
#
# Волна 2 (ADR-0159 PR-7, решение Шифу 20.10 — В9): сюда же переехали avatar-arbiter,
# quest и telegram-bot — им не нужны устройства Vision Pi (только топики), а Vision
# оставляет за собой тяжёлое: камеры и распознавание лиц.
#
# Общие шаблоны конфигов и скрипты лежат в docker/common; узел отличается
# только ZENOH_LISTEN_IP (здесь) и ZENOH_CONNECT_ENDPOINTS (сервис zenoh-router).
# Дефолт = адрес eth0 этого Pi; переопределение — в .env.
x-zenoh-listen-ip: &zenoh_listen_ip "ZENOH_LISTEN_IP=${ZENOH_LISTEN_IP:-10.1.1.12}"

services:
  # Zenoh Router Sound Pi. Вариант Б (ADR-0159 §2.2, решение Шифу В3): прямой
  # линк на Vision Pi плюс линк на Main Pi — голосовой трафик (/voice/*, TTS,
  # LED, рация Quest) идёт одним хопом, а при выдернутом кабеле Vision путь
  # остаётся через Main. Откат на «звезду» (вариант А) — убрать второй адрес.
  # Namespace НЕ используется здесь - он добавляется только на Main Pi при отправке в облако
  zenoh-router:
    image: eclipse/zenoh:1.6.2
    container_name: zenoh-router-sound
    # См. комментарий у zenoh-router в docker/vision/docker-compose.yaml:
    # compose при `up -d` без сети не должен рефетчить уже лежащий образ.
    pull_policy: if_not_present
    network_mode: host
    # mem_limit ADR-0111: Zenoh router — лёгкий процесс (~60 MB RSS), 128 MB с запасом.
    mem_limit: 128m
    memswap_limit: 128m
    environment:
      - RUST_LOG=zenoh=info
      - *zenoh_listen_ip  # listen tcp/<IP>:7447
      # Куда подключается роутер (через запятую): Main Pi и Vision Pi по
      # Gigabit Ethernet, #iface=eth0 — принудительно через eth0, не WiFi
      - ZENOH_CONNECT_ENDPOINTS=${ZENOH_CONNECT_ENDPOINTS:-tcp/10.1.1.10:7447#iface=eth0,tcp/10.1.1.11:7447#iface=eth0}
    volumes:
      - ../common/config:/common_config:ro
      - ../common/scripts/zenoh-router:/scripts:ro
    entrypoint: ["/bin/sh", "/scripts/start_zenoh_router.sh"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8000/@/local/router || exit 1"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 30s
    labels:
      logging: "promtail"

  # non-ROS service: аудиосервер SuperCollider (scsynth).
  # Не публикует/подписывается на ROS-топики, depends_on: zenoh-router не требуется.
  #
  # 🔴 issue #1807 — ОСТОРОЖНО с одиночным `docker restart supercollider`.
  # Вся палитра SynthDef (~300 определений) живёт только в памяти scsynth,
  # грузит её процесс sclang из СОСЕДНЕГО контейнера voice-assistant — один
  # раз, при своём собственном старте. Если перезапустить только этот
  # контейнер, scsynth поднимется пустым (RootNode и ничего больше), а
  # voice-assistant не перезапускался и повторно грузить нечего не станет:
  # робот немеет ПОЛНОСТЬЮ, при этом healthcheck ниже (`pgrep scsynth`)
  # зелёный, оба контейнера healthy, в логах чисто.
  #
  # Митигация: foxdot_init.sc (в voice-assistant) следит за
  # Server.default.serverRunning и сам перезаливает всю запомненную палитру,
  # если ловит переход true→false→true — см. комментарий там же. Но это
  # подстраховка, а не гарантия (например, если оба контейнера рестартуют
  # одновременно при деплое — sclang перезагрузится и перезальёт всё штатно
  # через собственный прелоад, это ок). Проверить фактическое состояние
  # можно метрикой `supercollider_synthdefs_count` (issue #1809): она
  # опрашивает сам scsynth через OSC /status и покажет реальное число
  # загруженных SynthDef, а не число файлов на диске — значение в разы ниже
  # ожидаемого (~300) означает пустую палитру НЕЗАВИСИМО от healthcheck.
  #
  # Безопасный путь при необходимости рестарта: `docker compose restart
  # supercollider voice-assistant` (оба вместе), не только supercollider.
  supercollider:
    image: ${SERVICE_IMAGE_PREFIX:-ghcr.io/krikz/rob_box}:supercollider-${IMAGE_TAG:-local}
    container_name: supercollider
    pull_policy: if_not_present
    network_mode: host
    # mem_limit ADR-0111 (issue #2621): 179 MB RSS замер, даём 512 MB
    mem_limit: 512m
    memswap_limit: 512m
    privileged: true  # Для доступа к ALSA audio
    ipc: host      # Share host IPC namespace so dmix SHM is shared with voice-assistant
    shm_size: '256m'  # JACK использует /dev/shm для mmap (~107MB), default 64MB недостаточно
    devices:
      - /dev/snd:/dev/snd  # ALSA audio devices (shared via dmix)
    ulimits:
      memlock: -1  # Разрешаем JACK блокировать память (требуется для RT audio)
      rtprio: 99   # RT-приоритет для JACK
    volumes:
      - ./scripts/supercollider:/scripts:ro
      - ./config/audio/asound.conf:/etc/asound.conf:ro  # dmix config для совместного использования ALSA
      # Renardo samples — supercollider должен читать WAV файлы по тому же пути,
      # что и renardo в voice-assistant. Раньше это был named-volume
      # renardo_samples, который наполнял init-контейнер из отдельного образа
      # voice-resources; теперь сэмплы кладёт на хост Ресурсный пак (запись
      # renardo-samples в scripts/resource_pack/manifest.yaml, тот же шаг
      # деплоя, что и STT/TTS-модели), а сюда они приходят bind-mount'ом.
      # Путь ВНУТРИ контейнера не изменился.
      # :ro — сэмплы меняет только хост; scsynth туда писать незачем.
      - /opt/rob_box/samples:/root/.config/renardo/samples:ro
      # Кэш генераций (ADR-0158 PR-2): трек библиотеки играет на деке — scsynth читает его wav
      # (track.16k.wav рядом с track.mp3) по тому же пути, что у voice-assistant (./data/voice → /data).
      - ./data/voice/music_library:/data/music_library:ro
      # Shared synthdefs — sclang/Renardo в voice-assistant компилирует .scsyndef сюда,
      # scsynth должен читать их по тому же пути (иначе "bassguitar.scsyndef could not be opened")
      - sc_synthdefs:/root/.local/share/SuperCollider/synthdefs
    command: ["/scripts/start_supercollider.sh"]
    environment:
      # Размер блока scsynth (-z), issue #3114. Дефолт 1024 — поведение до
      # #3114; допустимо 64|128|256|512|1024 (см. start_supercollider.sh).
      # Менять только по замеру scripts/music/scsynth_block_bench.sh на Pi.
      - SCSYNTH_BLOCK_SIZE=${SCSYNTH_BLOCK_SIZE:-1024}
    # depends_on НЕТ осознанно. Раньше здесь висел
    # `voice-resources-init: {condition: service_completed_successfully,
    # required: false}` — ожидание one-shot init-контейнера, который тянул
    # с registry отдельный образ с сэмплами (issue #2610, PR #2634).
    # Сэмплы теперь лежат на хосте до `docker compose up`, ждать нечего:
    # bind-mount либо наполнен, либо пуст, и во втором случае музыка честно
    # уходит в synth-only — ровно то же поведение, что давал `required: false`,
    # но без обращения к registry на старте стека.
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pgrep scsynth || exit 1"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 3
    labels:
      logging: "promtail"

  # Здесь был `voice-resources-init` — one-shot init-контейнер, который
  # копировал сэмплы из образа voice-resources в named-volume
  # renardo_samples. Удалён вместе с образом: сэмплы кладёт на хост
  # Ресурсный пак (шаг деплоя «Ensure STT/TTS models + Renardo samples»),
  # потребители видят их bind-mount'ом /opt/rob_box/samples.

  voice-assistant:
    # Tag tracked in docker/sound/.image-versions.{env} — updated by CI after each build
    # Format: VOICE_ASSISTANT_TAG=env-gitsha (e.g. test-abc1234) → immutable, pinned to specific build
    image: ${SERVICE_IMAGE_PREFIX:-ghcr.io/krikz/rob_box}:voice-assistant-${ROS_DISTRO:-humble}-${VOICE_ASSISTANT_TAG:-${IMAGE_TAG}}
    container_name: voice-assistant
    pull_policy: if_not_present
    network_mode: host
    privileged: true  # Для доступа к USB audio и ReSpeaker
    ipc: host      # Share host IPC namespace so dmix SHM is shared with supercollider
    devices:
      - /dev/snd:/dev/snd  # ALSA audio devices
      - /dev/bus/usb:/dev/bus/usb  # USB для ReSpeaker
    environment:
      - ROS_DOMAIN_ID=0
      - ROS_DISTRO=humble  # Для source /opt/ros/$ROS_DISTRO/setup.bash
      - RMW_IMPLEMENTATION=rmw_zenoh_cpp
      - ZENOH_ROUTER_CHECK_ATTEMPTS=10
      - RUST_LOG=zenoh=info
      - ROS_AUTOMATIC_DISCOVERY_RANGE=LOCALHOST
      - ROBOT_ID=${ROBOT_ID}  # Для генерации namespace
      - ZENOH_SESSION_CONFIG_URI=/tmp/zenoh_session_config.json5  # Сгенерированный конфиг
      - *zenoh_listen_ip  # адрес локального роутера для session config
      # Audio settings
      - ALSA_CARD=ReSpeaker
      - TTS_CACHE_DIR=/cache/tts
      # Python для audio
      - PYTHONUNBUFFERED=1
      # VoiceMemory + Ollama
      # ollama остался на Vision Pi (profile ai); с Sound Pi — по адресу узла.
      # Переопределение — OLLAMA_HOST_URL в .env (ADR-0159 §2.3).
      - OLLAMA_BASE_URL=${OLLAMA_HOST_URL:-http://10.1.1.11:11434}
      - VOICE_MEMORY_DB_PATH=/data/voice_memory.db
      # Issue #1777 / #1763 — timezone для get_current_time tool. TZ нужен
      # для glibc strftime() и лог-timestamps, ROBOT_TIMEZONE — для
      # Python zoneinfo в GetCurrentTimeTool. Europe/Moscow по умолчанию,
      # override через .env.secrets или env_file.
      - TZ=${ROBOT_TIMEZONE:-Europe/Moscow}
      - ROBOT_TIMEZONE=${ROBOT_TIMEZONE:-Europe/Moscow}
      # Agent skills feature flag (set to false to revert to flat tool mode)
      - USE_SKILLS=true
      # OpenAI SDK logging (set to debug for HTTP traffic dump, info for request-level, off for silent)
      - OPENAI_LOG=info
      # Executor spin diagnostics (mcp_server): logs wakeups + ready-entity distribution every ~10s.
      # 1 = on (diagnosing idle CPU spin); 0 = off.
      - MCP_SPIN_DIAG=${MCP_SPIN_DIAG:-0}
      # Renardo paths (MusicSkill uses these to load reference docs and search samples)
      - RENARDO_REF_PATH=/renardo_ref/RENARDO_REFERENCE.md
      - RENARDO_SAMPLES_PATH=/root/.config/renardo/samples
      # /mcp/execute sender authentication (see rob_box_mcp_tools/mcp_auth.py).
      # dialogue_node and mcp_server run in THIS container, so they share the
      # secret through a file on the /data volume — created automatically on
      # first start, unreadable from other hosts. Set ROB_BOX_MCP_TOKEN here
      # instead if the nodes are ever split across containers.
      - ROB_BOX_MCP_TOKEN_FILE=/data/.mcp_token
      # Timezone для системного вывода времени (issue #1763).
      # - TZ — для всех C-библиотек и os.environ процессов (date, strftime, glibc-функции).
      # - ROBOT_TIMEZONE — для Python zoneinfo в GetCurrentTimeTool.execute().
      # По умолчанию Europe/Moscow, т.к. робот обслуживает русскоязычного оператора.
      - TZ=${ROBOT_TIMEZONE:-Europe/Moscow}
      - ROBOT_TIMEZONE=${ROBOT_TIMEZONE:-Europe/Moscow}
      # issue #2184 — стек мониторинга поднят на build-машине katana, не в
      # этой compose-сети: docker-DNS сюда не достаёт, и дефолты вида
      # http://prometheus:9090 с робота не резолвились (из-за чего молча не
      # работали operator.admin-тулзы container_status / read_logs(loki) /
      # show_metrics). Задаём адрес явно.
      - MONITORING_HOST=${MONITORING_HOST:-10.1.1.249}
      - PROMETHEUS_URL=${PROMETHEUS_URL:-http://${MONITORING_HOST:-10.1.1.249}:9090}
      - LOKI_URL=${LOKI_URL:-http://${MONITORING_HOST:-10.1.1.249}:3100}
      - GRAFANA_URL=${GRAFANA_URL:-http://${MONITORING_HOST:-10.1.1.249}:3000}
    env_file:
      - .env.secrets  # API keys: MIMO_API_KEY, DEEPSEEK_API_KEY (для fallback), YANDEX_API_KEY, YANDEX_FOLDER_ID, KIE_API (ADR-0158, генерация музыки)
    volumes:
      - ./config:/config:ro
      - ../common/scripts:/ros_scripts:ro
      - ../common/config:/common_config:ro
      - ./scripts/voice_assistant:/scripts:ro
      - /dev/shm:/dev/shm
      # Кэш для TTS (persistent)
      - ./cache/tts:/cache/tts
      # ALSA dmix config (allows TTS + sound effects to play simultaneously)
      - ./config/audio/asound.conf:/etc/asound.conf:ro
      # Sound pack
      - ../../sound_pack:/ws/sound_pack:ro
      # STT/TTS модели с хоста (Ресурсный пак, Этап 3 —
      # docs/plans/2026-09-15-resource-pack.md §6.1).
      # РАНЬШЕ Vosk (44 МиБ) и Silero v5 (139 МиБ) были запечены в образ
      # voice-base ступенью скачивания в его Dockerfile. Теперь их кладёт на
      # хост apply_resource_pack.sh (шаг деплоя «Ensure STT/TTS models»), а
      # сюда они приходят bind-mount'ом. Путь ВНУТРИ контейнера не изменился:
      # stt_node.yaml:8 (`/models/vosk-model-small-ru-0.22`) и tts_node.py:1853
      # (`/models/silero/v5_ru.pt`) читают то же самое место.
      # :ro — модели меняет только хост; контейнеру писать туда незачем.
      # Каталог /opt/rob_box/models тот же по имени, что на Vision Pi монтируют
      # vision-hailo/vision-face (там лежат .hef), но на Sound Pi это ЕГО
      # каталог на ЕГО хосте — STT/TTS-модели сюда кладёт деплой (ADR-0159 PR-4).
      - /opt/rob_box/models:/models:ro
      # VoiceMemory persistent storage
      - ./data/voice:/data
      # Renardo samples — кладёт на хост Ресурсный пак (запись renardo-samples
      # в scripts/resource_pack/manifest.yaml), сюда приходят bind-mount'ом.
      # Путь ВНУТРИ контейнера не изменился. БЕЗ :ro, в отличие от
      # supercollider: renardo_gatherer/FoxDot при инициализации пишет в этот
      # каталог свои служебные файлы.
      - /opt/rob_box/samples:/root/.config/renardo/samples
      # Библиотека партитур (ADR-0154 PR-5, В7 «б» — решение Шифу 07.10): ресурсный пак на хосте, как сэмплы;
      # путь внутри тот же, что по умолчанию в engine/score_library.py (ROB_BOX_SCORE_LIBRARY перекрывает).
      # Каталога нет — Docker создаст пустой, сет играет хуки RTTTL (честная строка в логе dj_set).
      - /opt/rob_box/scores:/opt/rob_box/scores:ro
      # Shared synthdefs — sclang/Renardo компилирует SynthDefs сюда, scsynth в контейнере
      # supercollider читает их по тому же пути (issue 986)
      - sc_synthdefs:/root/.local/share/SuperCollider/synthdefs
      # Renardo/FoxDot reference documentation for MusicSkill LLM context
      - ../../local_test/RENARDO_REFERENCE.md:/renardo_ref/RENARDO_REFERENCE.md:ro
      # DB migrations (applied idempotently at startup by WaypointStore, FAQStore, etc.)
      - ../../migrations:/migrations:ro
    mem_limit: 5g  # Voice Assistant + Animations
    memswap_limit: 6g  # RAM 5 GB + swap до 1 GB (issue #2676, ADR-0122)
    # 5 GiB (↑ с 4 GiB после #2676) потому что при cold-start всех 9 нод
    # одновременно + Silero v5 warm-load + Yandex gRPC + PyTorch + Vosk
    # RSS прыгает в 3.4-3.9 GB с пиками до 99.6% от 4 GB (см. ADR-0122,
    # issue #2676: docker stats показывал MEM USAGE 3.417 GiB / 4 GiB =
    # 85.42%, ПРЫГАЛО до 99.64% → каскадные SIGKILL exit code -9 у
    # tts_node / stt_node / speaker_id_node каждые ~30 с).
    #
    # memswap_limit: 6g разрешает контейнеру занять до 5 GB RAM + 1 GB
    # swap поверх. На Vision Pi сейчас dphys-swapfile 2 GB (file-based,
    # медленный), zram-swap по ADR-0111 ещё не поднят — но даже file-based
    # swap даёт буфер на короткие пики, чтобы OOM-killer не убивал ноды
    # сразу. После раскатки zram (ADR-0111, issue #2621) этот лимит станет
    # более эффективным; до тех пор это страховка от каскадных SIGKILL.
    #
    # Долгосрочное решение (НЕ в этой карточке — backend work, см.
    # issue #2676 "Proposed fix §2"): вынести тяжёлые ноды (Vosk STT,
    # Silero, MiniMax T2A, mcp_server) в отдельные контейнеры с
    # собственными лимитами → конкуренция за RAM внутри одного
    # cgroup уйдёт.
    #
    # 4 GiB because the container hosts 9 respawn-able nodes including:
    #   - audio_node (PyAudio + ReSpeaker 6ch buffers)
    #   - stt_node (Vosk model ~200-500 MB)
    #   - sound_node (sclang + scsynth + FoxDot pipeline ~300-500 MB)
    #   - tts_node (PyTorch + Silero v5 fallback model ~150-200 MB)
    #   - dialogue_node + mcp_server + animation_player + led + command
    # 2 GiB was hitting OOM kill (#929) when Silero v5 tried to lazy-load
    # after Yandex gRPC fallback.  Investigated 2026-07-30 in t_42726db6:
    # heap_snapshot_repro confirmed no leak in _synthesize_and_play itself
    # (+3.7 MB over 50 mock iterations = noise); root cause is the
    # combined RSS of all 9 nodes + PyTorch + Silero v5 > 2 GiB under
    # bursty dialogue traffic.  Bumping to 4 GiB gives ~1 GiB headroom
    # for Silero v5 load (and any one respawn transient).
    #
    # Gap G-933-B (PR #933 follow-up, t_5ef52557): since 2026-07-31 the
    # tts_node warm-loads Silero at __init__ in a background daemon thread,
    # so the model is resident for the entire container lifetime while
    # Yandex is primary.  Net RSS effect vs old lazy-load: roughly the
    # same peak (model is ~150-200 MB either way) but the user no longer
    # hears the cold-load pause on first fallback.  The 5 GiB ceiling
    # (raised from 4 GiB per ADR-0122 / issue #2676) comfortably holds
    # Yandex gRPC client (negligible) + warm Silero (~200 MB) + the other
    # 8 nodes with ~1 GiB headroom for dialogue bursts; memswap_limit=6g
    # adds a 1 GB swap cushion against transient spikes.
    command: ["/ros_scripts/ros_with_namespace.sh", "/bin/bash", "/scripts/start_voice_assistant.sh"]
    depends_on:
      zenoh-router:
        condition: service_healthy
      supercollider:
        condition: service_healthy
      # Зависимости на voice-resources-init больше нет: init-контейнер и его
      # образ удалены, сэмплы приезжают на хост до старта стека. Если их там
      # нет — MusicSkill скажет "samples not found", а dialogue/STT/TTS
      # не заметят (ровно прежняя деградация, но без pull с registry).
    restart: unless-stopped
    # Issue #2701: старый healthcheck (`pgrep -f 'python3.*voice'`) отвечал
    # healthy даже когда audio_node молчал часами — PortAudio переставал
    # звать audio_callback без исключения, процесс жил, ReSpeaker был
    # виден в lsusb. healthcheck_audio.sh (docker/sound/scripts/
    # voice_assistant/, смонтирован в /scripts выше) добавляет к
    # pgrep-проверке возраст heartbeat-файла, который audio_node
    # обновляет, пока захват реально жив (см.
    # AudioNode._touch_audio_heartbeat, audio_stall_timeout_s=5.0 default).
    healthcheck:
      test: ["CMD-SHELL", "/scripts/healthcheck_audio.sh"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 3
    labels:
      logging: "promtail"

  # Phase 4: isolated action/PASTE control plane. The current voice node can
  # migrate incrementally; this sidecar has an independent health lifecycle.
  voice-action-server:
    image: ${SERVICE_IMAGE_PREFIX:-ghcr.io/krikz/rob_box}:voice-assistant-${ROS_DISTRO:-humble}-${VOICE_ASSISTANT_TAG:-${IMAGE_TAG}}
    container_name: voice-action-server
    pull_policy: if_not_present
    network_mode: host
    # mem_limit ADR-0111 (issue #2621): 25 MB RSS замер, даём 128 MB
    mem_limit: 128m
    memswap_limit: 128m
    environment:
      - PYTHONUNBUFFERED=1
      - ACTION_SERVER_HOST=127.0.0.1
      - ACTION_SERVER_PORT=${ACTION_SERVER_PORT:-8765}
    command: ["/bin/bash", "-lc", "python3 -m rob_box_voice.action_server.http_server"]
    depends_on:
      voice-assistant:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python3 -c 'import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:${ACTION_SERVER_PORT:-8765}/healthz\")'"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 3
    labels:
      logging: "promtail"

  # ============ Avatar Supervisor (AV-9, ADR-0028) — ТАРС на Sound Pi (ADR-0159 В8) ============
  # Решение Шифу 19.10: ТАРС и личность пишут в один /data/harness_voice.db (ADR-0083 §E),
  # поэтому supervisor живёт на одном узле с voice-assistant (и mcp_server: .mcp_token снова
  # на одном хосте, В5 снята). avatar-arbiter приехал сюда следом, в волне 2 (В9, ниже).
  # Phase 1 monitor-only: publishes /avatar/state, no twist_mux /
  # dialogue_node mutation. Phase 2 (mode=active) — after voice_input_mode
  # lands in dialogue_node (расхождение #1 плана Quest).
  #
  # Build context: docker/sound/supervisor/Dockerfile — наследует
  # voice-assistant image (pytorch/renardo не пересобираются).
  supervisor:
    # supervisor-образ тегируется по IMAGE_TAG (манифест: image_versions: false)
    image: ${SERVICE_IMAGE_PREFIX:-ghcr.io/krikz/rob_box}:supervisor-${ROS_DISTRO:-humble}-${SUPERVISOR_TAG:-${IMAGE_TAG}}
    container_name: avatar-supervisor
    pull_policy: if_not_present
    network_mode: host
    # mem_limit ADR-0111 (issue #2621): 253 MB RSS замер, даём 512 MB
    mem_limit: 512m
    memswap_limit: 768m
    environment:
      - ROS_DOMAIN_ID=0
      - ROS_DISTRO=humble
      - RMW_IMPLEMENTATION=rmw_zenoh_cpp
      - ZENOH_ROUTER_CHECK_ATTEMPTS=10
      - RUST_LOG=zenoh=info
      - ROS_AUTOMATIC_DISCOVERY_RANGE=LOCALHOST
      - ROBOT_ID=${ROBOT_ID}
      - ZENOH_SESSION_CONFIG_URI=/tmp/zenoh_session_config.json5
      - *zenoh_listen_ip  # адрес локального роутера для session config
      - PYTHONUNBUFFERED=1
      # AV-9 Phase 1: monitor only. Phase 2 (active) requires voice_input_mode
      # in dialogue_node + AV-10 telegram refactor — see ADR-0028 §4.5.
      # P7-simple (2026-08-27): voice_input_mode уже принят в dialogue_node
      # (PR #1618) → включаем active, чтобы супервизор применял voice_input_mode
      # (SetVoiceMode). Teleop-FSM/floors остаются Phase 2 (NOT_IMPLEMENTED).
      - AVATAR_SUPERVISOR_MODE=active
      # issue #2184 — TarsPanelDispatcher ходит за метриками сам (Prometheus
      # /api/v1/query_range, Loki /loki/api/v1/query_range) и публикует ряды
      # точек в /avatar/tars/panel_data. Стек мониторинга живёт на katana,
      # не в этой compose-сети — адрес задаём явно (см. metrics_source.py).
      - MONITORING_HOST=${MONITORING_HOST:-10.1.1.249}
      - PROMETHEUS_URL=${PROMETHEUS_URL:-http://${MONITORING_HOST:-10.1.1.249}:9090}
      - LOKI_URL=${LOKI_URL:-http://${MONITORING_HOST:-10.1.1.249}:3100}
      - GRAFANA_URL=${GRAFANA_URL:-http://${MONITORING_HOST:-10.1.1.249}:3000}
    # issue #2111 — БЕЗ ЭТОГО У ТАРС НЕТ LLM ВООБЩЕ.
    # avatar_supervisor._build_operator_llm строит провайдеров из ключей в
    # окружении (MINIMAX_API_KEY / DEEPSEEK_API_KEY). У сервиса не было
    # env_file, поэтому в контейнере не было НИ ОДНОГО *_API_KEY, и на
    # роботе 2026-09-08 в логах висело:
    #   _build_operator_llm: deepseek build failed: missing API key
    #   _build_operator_llm: no LLM provider built (chain=['deepseek'])
    # Агент оператора принимал фразы из шлема и молча не мог ответить.
    # Тот же файл подключён у voice-assistant (выше) и telegram-bot (ниже, волна 2).
    env_file:
      - .env.secrets  # MINIMAX_API_KEY, DEEPSEEK_API_KEY — операторский LLM (ТАРС)
    volumes:
      - ./config:/config:ro
      - ../common/scripts:/ros_scripts:ro
      - ../common/config:/common_config:ro
      - ./scripts/supervisor:/scripts:ro
      # issue #1988 — память оператора и журнал ТАРС. После ADR-0083 §E
      # обе ноды (supervisor + voice-assistant) пишут в одну
      # ``/data/harness_voice.db``, различая факты через колонку ``agent``
      # (``operator`` / ``personality``, миграция 011_agent_namespace.sql).
      # Тот же host-path, что у voice-assistant (./data/voice → /data) — теперь и тот же УЗЕЛ.
      - ./data/voice:/data
      # issue #3299 — инструмент ТАРС ``list_faces`` читает лицевую базу.
      # Только чтение: пишет её vision-face на Vision Pi, supervisor не должен менять
      # базу даже случайно (ADR-0123). На Sound Pi каталог наполняет cutover-rsync;
      # синхронизации Vision→Sound в PR-2b НЕТ, пока он пуст, list_faces честно
      # отвечает «пуста на этом узле», а не «лиц нет».
      - ./data/faces:/data/faces:ro
    command: ["/ros_scripts/ros_with_namespace.sh", "/bin/bash", "/scripts/start_supervisor.sh"]
    depends_on:
      zenoh-router:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'supervisor_node' || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 3
    labels:
      logging: "promtail"

  # ============ Avatar Arbiter (ADR-0051 §2.2, issue #1987) — Sound Pi с волны 2 (ADR-0159 В9) ============
  # Отдельная нода без LLM: арбитр floor/FSM (LockManager, ModeManager,
  # агрегатор), сервисы /avatar_arbiter/{acquire_floor,release_floor,
  # set_avatar_mode}, публикация /avatar/state. Арбитраж вынесен из
  # supervisor (там остались голос + супервизор-агент оператора).
  #
  # Переиспользует supervisor-образ: тот собирает ВЕСЬ пакет
  # rob_box_supervisor (console_scripts: supervisor_node + avatar_arbiter).
  # Образ тот же, что у supervisor выше (тег SUPERVISOR_TAG) — второго образа и
  # второй копии скрипта нет: start_arbiter.sh лежит рядом со start_supervisor.sh
  # в ./scripts/supervisor (общий каталог, монтируется в /scripts у обоих).
  avatar-arbiter:
    image: ${SERVICE_IMAGE_PREFIX:-ghcr.io/krikz/rob_box}:supervisor-${ROS_DISTRO:-humble}-${SUPERVISOR_TAG:-${IMAGE_TAG}}
    container_name: avatar-arbiter
    pull_policy: if_not_present
    network_mode: host
    # mem_limit ADR-0111 (issue #2621): 230 MB RSS замер, даём 512 MB
    mem_limit: 512m
    memswap_limit: 512m
    environment:
      - ROS_DOMAIN_ID=0
      - ROS_DISTRO=humble
      - RMW_IMPLEMENTATION=rmw_zenoh_cpp
      - ZENOH_ROUTER_CHECK_ATTEMPTS=10
      - RUST_LOG=zenoh=info
      - ROS_AUTOMATIC_DISCOVERY_RANGE=LOCALHOST
      - ROBOT_ID=${ROBOT_ID}
      - ZENOH_SESSION_CONFIG_URI=/tmp/zenoh_session_config.json5
      - *zenoh_listen_ip  # адрес локального роутера для session config
      - PYTHONUNBUFFERED=1
      # Арбитр по умолчанию в active-режиме — это его единственная роль
      # (он не monitor-нода). Захват/освобождение floor + FSM работают.
      - AVATAR_ARBITER_MODE=active
    volumes:
      - ./config:/config:ro
      - ../common/scripts:/ros_scripts:ro
      - ../common/config:/common_config:ro
      - ./scripts/supervisor:/scripts:ro
    command: ["/ros_scripts/ros_with_namespace.sh", "/bin/bash", "/scripts/start_arbiter.sh"]
    depends_on:
      zenoh-router:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'avatar_arbiter' || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 3
    labels:
      logging: "promtail"

  # ============ Meta Quest WebXR-консоль (Phase 1.6, ADR-0027) — Sound Pi с волны 2 (ADR-0159 В9) ============
  # Лёгкий лёгкий сервис (caddy:2-alpine + aiohttp): статика WebXR-клиента +
  # reverse_proxy на rob_box_quest. Self-signed TLS, без certbot.
  #
  # Адрес для шлема сменился с 10.1.1.11 на 10.1.1.12 (eth0 Sound Pi): DNS-запись
  # quest.rob_box.local на роутере надо перевести на новый адрес. Порты host-сети
  # (443, 8443, 8766) на Sound Pi свободны (ss -ltn, 20.10); 8765 держит voice-action-server.
  # Видео не сырое: quest подписывается на *compressed* топики камер (JPEG/PNG, по запросу
  # шлема, см. rob_box_quest/streams/ros_demand.py) — с Vision Pi это идёт по Zenoh-линку Sound↔Vision.
  #
  # Build context: docker/sound/quest/Dockerfile — multi-stage:
  #   node:20-alpine (Vite build) → caddy:2-alpine (runtime + pip aiohttp).
  # Не использует voice-assistant image (нет тяги pytorch/Renardo, ~10GB).
  #
  # Зависимость: webxr_client/ (Phase 1.5) должен быть merged в текущую
  # ветку ДО сборки образа. Если его нет — COPY в Dockerfile упадёт
  # (явная ошибка зависимости, не silent degradation).
  quest:
    # Тег QUEST_TAG в .image-versions не пишется (манифест: image_versions: false),
    # поэтому образ берётся по ${IMAGE_TAG} (dev/test/latest), как и на Vision Pi.
    image: ${SERVICE_IMAGE_PREFIX:-ghcr.io/krikz/rob_box}:quest-${ROS_DISTRO:-humble}-${QUEST_TAG:-${IMAGE_TAG}}
    container_name: rob-box-quest
    pull_policy: if_not_present
    network_mode: host
    # mem_limit ADR-0111 (issue #2621): 266 MB RSS замер, даём 512 MB
    mem_limit: 512m
    memswap_limit: 512m
    build:
      context: .
      dockerfile: docker/sound/quest/Dockerfile
    environment:
      - ROS_DOMAIN_ID=0
      - ROS_DISTRO=humble
      - RMW_IMPLEMENTATION=rmw_zenoh_cpp
      - ROS_AUTOMATIC_DISCOVERY_RANGE=LOCALHOST
      - ROBOT_ID=${ROBOT_ID}
      - ZENOH_SESSION_CONFIG_URI=/tmp/zenoh_session_config.json5
      - *zenoh_listen_ip  # адрес локального роутера для session config
      - ZENOH_ROUTER_CHECK_ATTEMPTS=10
      - PYTHONUNBUFFERED=1
      - QUEST_HOST=${QUEST_HOST:-quest.rob_box.local}
      # IP в SAN самоподписанного сертификата (start_quest.sh): адрес eth0 Sound Pi.
      # Сертификат из тома quest-certs НЕ пересоздаётся, если файл уже есть.
      - QUEST_IP=${QUEST_IP:-10.1.1.12}
      - CERT_DAYS=${QUEST_CERT_DAYS:-365}
      # WS_PORT=8766 чтобы не конфликтовать с voice-action-server,
      # который по дефолту биндит 127.0.0.1:8765. В host-network оба
      # порта = 8765 → второй стартующий получает OSError EADDRINUSE
      # и aiohttp-сабтред падает → Caddy получает 404 на /quest (Phase 1.6).
      # Меняем только rob-box-quest на 8766, voice-action-server остаётся на 8765.
      - WS_PORT=${QUEST_WS_PORT:-8766}
      # Фиксированный PIN для dev-сессий. Если задан — используется вместо
      # случайного из generate_pin(). Чтобы перебить: export QUEST_PIN=XXXXXX
      # до docker compose up, либо через .env (QUEST_PIN=XXXXXX).
      - QUEST_PIN=${QUEST_PIN:-103856}
    volumes:
      # certs persist between restarts; монтируем именованный путь,
      # чтобы self-signed не пересоздавался на каждом redeploy
      - quest-certs:/certs
      # Конфиги Zenoh + scripts (DOCKER_STANDARDS: нет COPY config/scripts)
      - ./config:/config:ro
      - ../common/scripts:/ros_scripts:ro
      - ../common/config:/common_config:ro
      - ./scripts/quest:/scripts:ro
    command: ["/ros_scripts/ros_with_namespace.sh", "/bin/bash", "/scripts/start_quest.sh"]
    depends_on:
      zenoh-router:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      # pgrep проверяет оба ключевых процесса — Caddy + quest_node.
      # Если один упал, healthcheck fail → compose restart.
      test: ["CMD-SHELL", "pgrep -f 'caddy run' >/dev/null && pgrep -f 'ros2 run rob_box_quest' >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 3
    labels:
      logging: "promtail"

  # ============ Telegram Bot — Sound Pi с волны 2 (ADR-0159 В9) ============
  # Операторский интерфейс через Telegram
  # Управление роботом с телефона: фото, голос, движение, LLM чат
  # ОДИН getUpdates на токен: бот не должен жить одновременно на Vision и Sound
  # (409 Conflict). Деплой снимает старый контейнер с Vision (`compose down
  # --remove-orphans`) раньше, чем поднимает Sound.
  telegram-bot:
    # Tag tracked in docker/sound/.image-versions.{env} — updated by CI after each build
    image: ${SERVICE_IMAGE_PREFIX:-ghcr.io/krikz/rob_box}:telegram-bot-${ROS_DISTRO:-humble}-${TELEGRAM_BOT_TAG:-${IMAGE_TAG}}
    container_name: telegram-bot
    pull_policy: if_not_present
    network_mode: host
    environment:
      - ROS_DOMAIN_ID=0
      - RMW_IMPLEMENTATION=rmw_zenoh_cpp
      - ROBOT_ID=${ROBOT_ID}
      - ZENOH_ROUTER_CHECK_ATTEMPTS=10
      - RUST_LOG=zenoh=info
      - ROS_AUTOMATIC_DISCOVERY_RANGE=LOCALHOST
      - ZENOH_SESSION_CONFIG_URI=/tmp/zenoh_session_config.json5
      - *zenoh_listen_ip  # адрес локального роутера для session config
      - PYTHONUNBUFFERED=1
    env_file:
      - .env.secrets  # TELEGRAM_BOT_TOKEN, TELEGRAM_ALLOWED_USERS, DEEPSEEK_API_KEY, YANDEX_API_KEY, etc.
    volumes:
      - ./config:/config:ro
      - ../common/scripts:/ros_scripts:ro
      - ../common/config:/common_config:ro
      - ./scripts/telegram_bot:/scripts:ro
      # Vosk-модель с хоста (Ресурсный пак, ADR-0125) — тот же каталог, что
      # монтирует voice-assistant (выше, тот же compose). До 21.09.2026 telegram_bot/Dockerfile качал
      # ЭТУ ЖЕ модель на этапе сборки своего образа: одна модель жила в двух
      # образах, а сборка падала целиком при недоступном alphacephei.com.
      # Путь ВНУТРИ контейнера не изменился — voice_processor.py:40 читает
      # `/models/vosk-model-small-ru-0.22` (дефолт VOSK_MODEL_PATH).
      # :ro — модели кладёт только хост (шаг деплоя «Ensure STT/TTS models»).
      # Без тома бот стартует, но Vosk-фолбэк недоступен: STT остаётся на
      # одном Yandex, и об этом есть строка в логе (не молчаливая деградация).
      - /opt/rob_box/models:/models:ro
      # issue #3025: том лицевой базы, пишет её vision-face (Vision Pi, без :ro).
      # :ro гарантирует, что telegram-bot только ЧИТАЕТ (ADR-0123 §4: FaceStore
      # пишет только в своём контейнере).
      # НА SOUND PI это КОПИЯ-СНИМОК (cutover 19.10), а не живая база: пока нет
      # синхронизации Vision→Sound (карточка #3655), команды бота /faces и карточки
      # лиц показывают галерею на момент копирования и отстают от vision-face.
      - ./data/faces:/data/faces:ro
    mem_limit: 512m
    memswap_limit: 640m
    command: ["/ros_scripts/ros_with_namespace.sh", "/scripts/start_telegram_bot.sh"]
    depends_on:
      - zenoh-router
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f telegram_node || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 3
    labels:
      logging: "promtail"

  # ============ Sensor hub (ADR-0159 §2.4, решения Шифу В6/В7) ============
  # perception_bridge из образа perception (его же собирает Main Pi) читает
  # serial ESP32-сенсорхаба через TTL-USB конвертер и публикует /sensors/data.
  # Новой ноды нет, моста-агента нет (обычная ROS-нода + serial). Под profile `sensors` — по умолчанию НЕ
  # стартует: хаб пока не подключён. Включить: `docker compose --profile
  # sensors up -d sensor-bridge` (когда подключат ESP32 — отдельная задача:
  # снять perception_bridge с Main Pi, решить, кто слушает /sensors/data).
  # /dev/sensor_hub создаёт udev-правило из scripts/setup/setup_node.sh (роль sound).
  sensor-bridge:
    # Tag tracked in docker/sound/.image-versions.{env} — PERCEPTION_TAG пишет та же сборка, что и для Main Pi
    image: ${SERVICE_IMAGE_PREFIX:-ghcr.io/krikz/rob_box}:perception-${ROS_DISTRO:-humble}-${PERCEPTION_TAG:-${IMAGE_TAG}}
    container_name: sensor-bridge
    profiles: ["sensors"]
    pull_policy: if_not_present
    network_mode: host
    mem_limit: 128m
    memswap_limit: 128m
    devices:
      - /dev/sensor_hub:/dev/sensor_hub
    environment:
      - ROS_DOMAIN_ID=0
      - ROS_DISTRO=humble
      - RMW_IMPLEMENTATION=rmw_zenoh_cpp
      - ZENOH_ROUTER_CHECK_ATTEMPTS=10
      - RUST_LOG=zenoh=info
      - ROS_AUTOMATIC_DISCOVERY_RANGE=LOCALHOST
      - ROBOT_ID=${ROBOT_ID}  # Для генерации namespace
      - ZENOH_SESSION_CONFIG_URI=/tmp/zenoh_session_config.json5  # Сгенерированный конфиг
      - *zenoh_listen_ip  # адрес локального роутера для session config
      - PYTHONUNBUFFERED=1
      - SENSOR_UART_PORT=/dev/sensor_hub
      - SENSOR_UART_BAUD=115200
    volumes:
      - ../common/scripts:/ros_scripts:ro
      - ../common/config:/common_config:ro
    # Образ perception сам workspace не source'ит (это делает start_perception.sh),
    # поэтому ros2 run — через bash с обоими setup.bash. Запускаем ТОЛЬКО
    # perception_bridge, а не весь internal_dialogue_docker.launch.py:
    # context_aggregator и health_monitor остаются на Main Pi.
    command:
      - /ros_scripts/ros_with_namespace.sh
      - /bin/bash
      - -c
      - source /opt/ros/humble/setup.bash && source /ws/install/setup.bash && exec ros2 run rob_box_perception perception_bridge
    depends_on:
      zenoh-router:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f '[p]erception_bridge' || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 3
    labels:
      logging: "promtail"

  # ============ Monitoring Agents ============
  # Агенты мониторинга Sound Pi: метрики и логи уходят на машину мониторинга.
  # Включить: docker compose --profile monitoring up -d
  # Имена контейнеров (cadvisor-sound, promtail-sound) и лейбл host: sound-pi
  # отличаются от Vision/Main, чтобы три узла не сливались в Grafana/Loki.

  # non-ROS service: мониторинговый агент (profile: monitoring).
  # Не использует ROS/Zenoh, depends_on: zenoh-router не требуется.
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.52.1
    container_name: cadvisor-sound
    profiles: ["monitoring"]
    pull_policy: if_not_present
    network_mode: host
    privileged: true
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
      - /etc/machine-id:/etc/machine-id:ro
    command:
      - '--port=8080'
      - '--housekeeping_interval=30s'
      - '--docker_only=true'
      - '--store_container_labels=false'
    restart: unless-stopped

  # non-ROS service: Loki log shipper (profile: monitoring).
  # Не использует ROS/Zenoh, depends_on: zenoh-router не требуется.
  promtail:
    image: grafana/promtail:2.9.2
    container_name: promtail-sound
    profiles: ["monitoring"]
    pull_policy: if_not_present
    network_mode: host
    environment:
      - LOKI_HOST=${LOKI_HOST:-10.1.1.249}
    volumes:
      - ./config/monitoring/promtail-config.yaml:/etc/promtail/config.yml:ro
      - /var/log:/var/log:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: -config.file=/etc/promtail/config.yml -config.expand-env=true
    restart: unless-stopped

# Named volumes
volumes:
  # Shared SuperCollider synthdefs between voice-assistant (sclang/Renardo compiles .scsyndef)
  # and supercollider (scsynth reads them). Without this, scsynth can't find SynthDefs by name
  # → "bassguitar.scsyndef could not be opened" + negative node IDs (issue 986).
  sc_synthdefs:
  # Self-signed TLS-сертификат для rob_box_quest (Phase 1.6, ADR-0027 §4.1).
  # Без named-volume cert пересоздавался бы при каждом redeploy → пришлось
  # бы заново импортировать его в Meta Quest.
  # ВНИМАНИЕ (переезд с Vision Pi, ADR-0159 PR-7): на Sound Pi том называется
