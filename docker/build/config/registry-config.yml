version: 0.1
log:
  level: info
  formatter: text
  fields:
    service: registry

storage:
  delete:
    enabled: true
  # 🔴 FIX 16.08 (3-й инцидент за 2 дня): inmemory кэш blobdescriptor
  # теряет ссылки на blobs при рестарте/GC → manifests 404 при живых тегах,
  # деплой падает «No such image». Убрали — registry читает blobs с диска.
  # (см. decision #1316, инциденты 14.08/15.08/16.08)
  filesystem:
    rootdirectory: /var/lib/registry

http:
  addr: 0.0.0.0:5000
  headers:
    X-Content-Type-Options: [nosniff]
    Access-Control-Allow-Origin: ['*']
    Access-Control-Allow-Methods: ['HEAD', 'GET', 'OPTIONS', 'DELETE']
    Access-Control-Allow-Headers: ['Authorization', 'Accept', 'Content-Type']
    Access-Control-Max-Age: [1728000]
    Access-Control-Allow-Credentials: [true]
    Access-Control-Expose-Headers: ['Docker-Content-Digest']

health:
  storagedriver:
    enabled: true
    interval: 10s
    threshold: 3
