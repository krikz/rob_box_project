# APT-Cacher NG configuration
# Кэширование APT пакетов для ускорения сборки Docker образов

# Директория для кэша
CacheDir: /var/cache/apt-cacher-ng

# Порт для HTTP прокси
Port: 3142

# Логирование
LogDir: /var/log/apt-cacher-ng
Verbose: 1

# Время жизни кэша (в днях)
ExTreshold: 4

# Разрешить удаление файлов через веб-интерфейс
AllowUserPorts: 0

# Зеркала для различных дистрибутивов
Remap-debrep: file:deb_mirror*.gz /debian ; file:backends_debian
Remap-uburep: file:ubuntu_mirrors /ubuntu ; file:backends_ubuntu
Remap-debvol: file:debvol_mirror*.gz /debian-volatile ; file:backends_debvol
Remap-cygwin: file:cygwin_mirrors /cygwin
Remap-sfnet:  file:sfnet_mirrors
Remap-alxrep: file:archlx_mirrors /archlinux
Remap-fedora: file:fedora_mirrors
Remap-epel:   file:epel_mirrors
Remap-slrep:  file:sl_mirrors

# ROS 2 repositories
Remap-ros: http://packages.ros.org/ros2/ubuntu ; http://packages.ros.org

# Docker repositories
Remap-docker: https://download.docker.com

# Разрешить HTTPS соединения (используя CONNECT метод)
PassThroughPattern: .*

# Максимальный размер файла для кэширования (в МБ)
MaxDlSpeed: 0
MaxInresponseDuration: 30

# Предварительная загрузка популярных пакетов
# ExStartTradeOff: 500000

# Очистка кэша
ExThreshold: 4
ExAbortOnProblems: 1

# Отчеты доступны по http://localhost:3142/acng-report.html
ReportPage: acng-report.html

# Формат логов
VerboseLog: 1
