# APT-Cacher NG Configuration for Rob Box Build Machine
# Оптимизирована для параллельных Docker сборок (8 GitHub runners)
# 
# Документация: https://www.unix-ag.uni-kl.de/~bloch/acng/html/index.html
# Best practices: https://github.com/sameersbn/docker-apt-cacher-ng

# ============================================================================
# Базовые настройки
# ============================================================================

# Директория для кэша пакетов
CacheDir: /var/cache/apt-cacher-ng

# HTTP прокси порт (стандарт APT cache)
Port: 3142

# Слушать на всех сетевых интерфейсах (для Docker host networking)
BindAddress: 0.0.0.0

# PID файл для мониторинга здоровья контейнера
PidFile: /var/run/apt-cacher-ng/pid

# ============================================================================
# Оптимизация для параллельных сборок
# ============================================================================

# NOTE: Следующие директивы НЕ поддерживаются в apt-cacher-ng 3.7.5 (используется в mbentley/apt-cacher-ng:latest)
# Они доступны только в версии 3.8+. Раскомментируйте их при обновлении на более новую версию.
#
# PHttpThreads: 16          # Количество HTTP worker threads (для параллельных сборок)
# ConnectTimeout: 120       # Таймаут подключения к upstream репозиториям (секунды)
# NetworkTimeout: 300       # Таймаут передачи данных (секунды, важно для ARM64 QEMU)

# ВАЖНО: DlMaxRetries обязательна для apt-cacher-ng 3.7.5!
# Без неё все upstream запросы падают с 503 ошибкой
DlMaxRetries: 3

# Кэширование DNS запросов (снижает нагрузку на DNS при параллельных запросах)
DnsCacheSeconds: 3600

# Без ограничения скорости загрузки (максимальная производительность)
MaxDlSpeed: 0

# ============================================================================
# Управление кэшем
# ============================================================================

# Срок хранения пакетов в днях (10 дней оптимально для активной разработки)
# После этого срока файлы помечаются для удаления при следующей очистке
ExThreshold: 10

# Автоматическая экспирация при низком месте на диске (50MB минимум)
ExAbortOnProblems: 1

# ============================================================================
# Репозитории и зеркала
# ============================================================================

# Ubuntu repositories (используется для ROS 2 Humble на Ubuntu 22.04 ARM64)
# ИСПРАВЛЕНО: убрал file:ubuntu_mirrors т.к. файл отсутствует
# backends_ubuntu пустой, но это ОК - будет использоваться дефолтный
Remap-uburep: http://archive.ubuntu.com/ubuntu

# Debian repositories (базовые пакеты)
Remap-debrep: file:deb_mirror*.gz /debian ; file:backends_debian

# ROS 2 Humble repository (основной репозиторий для проекта)
Remap-rosrep: http://packages.ros.org/ros2/ubuntu

# Ubuntu Ports для ARM64 архитектуры
Remap-ubports: http://ports.ubuntu.com/ubuntu-ports

# ============================================================================
# HTTPS и Security
# ============================================================================

# Пропускать HTTPS соединения напрямую (без кэширования)
# Используется дефолтный паттерн из zzz_acng.conf: ^(.*):443$
# Это безопасно и позволяет работать с HTTPS репозиториями
PassThroughPattern: ^(.*):443$

# Разрешить подключения к нестандартным портам (для некоторых PPA)
AllowUserPorts: 0

# ============================================================================
# Логирование и мониторинг
# ============================================================================

# Директория для логов
LogDir: /var/log/apt-cacher-ng

# Уровень детализации логов (1 = основные события, 3 = максимальная детализация для отладки)
VerboseLog: 3

# Веб-интерфейс статистики и управления
ReportPage: acng-report.html

# ============================================================================
# Дополнительные настройки производительности
# ============================================================================

# NOTE: UseWgetDownload и StupidFS также не поддерживаются в версии 3.7.5
# Закомментированы для совместимости
# UseWgetDownload: 0        # Не использовать WGet style downloads
# StupidFS: 0               # Предварительная проверка файлов

# Не создавать символические ссылки (упрощает управление кэшем)
ForceManaged: 0

# ============================================================================
# Комментарии по удаленным устаревшим директивам
# ============================================================================

# MaxConns - удалена в современных версиях apt-cacher-ng
# SocketTimeout - удалена, используется NetworkTimeout
# LogLevel - удалена, используется VerboseLog
# CountQueries - удалена
# OptProxyTimeout - удалена
# OptProxyCheckInterval - удалена

# ============================================================================
# Версионная совместимость
# ============================================================================

# ⚠️ ВАЖНО: Docker образ mbentley/apt-cacher-ng:latest использует версию 3.7.5
# Следующие директивы доступны ТОЛЬКО в версии 3.8+ и закомментированы выше:
#   - PHttpThreads (управление worker threads)
#   - ConnectTimeout (таймаут подключения)
#   - NetworkTimeout (таймаут передачи данных)
#
# При обновлении Docker образа до версии с apt-cacher-ng 3.8+ раскомментируйте
# эти директивы в секции "Оптимизация для параллельных сборок"

# ============================================================================
# Проверка конфигурации
# ============================================================================

# После изменения конфигурации перезапустите контейнер:
#   docker compose restart apt-cacher-ng
#
# Проверьте статус:
#   curl http://localhost:3142/acng-report.html
#
# Проверьте логи:
#   docker logs build-apt-cache
