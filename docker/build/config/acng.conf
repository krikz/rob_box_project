# APT-Cacher NG configuration
# Минимальная конфигурация с поддерживаемыми директивами

# Директория для кэша
CacheDir: /var/cache/apt-cacher-ng

# Порт для HTTP прокси  
Port: 3142
BindAddress: 0.0.0.0

# Лимиты для параллельной сборки
# MaxConns - deprecated, удалена в новых версиях apt-cacher-ng
MaxDlSpeed: 0

# Таймауты (увеличены для стабильности)
# SocketTimeout - deprecated, используется значение по умолчанию
DnsCacheSeconds: 3600

# Логирование
LogDir: /var/log/apt-cacher-ng
VerboseLog: 1
# LogLevel - deprecated, используется значение по умолчанию

# Время жизни кэша (увеличено до 10 дней)
ExThreshold: 10

# AllowUserPorts - для прямого proxy режима (PassThroughPattern)
# Не нужно когда используется только кэширование
# AllowUserPorts: 1

# Стандартные зеркала (для Ubuntu ARM64)
Remap-debrep: file:deb_mirror*.gz /debian ; file:backends_debian
Remap-uburep: file:ubuntu_mirrors /ubuntu ; file:backends_ubuntu

# Дополнительные репозитории для ROS
Remap-rosrep: http://packages.ros.org/ros2/ubuntu

# HTTPS соединения
# PassThroughPattern закомментирован - используется дефолтный из zzz_acng.conf (^(.*):443$)
# Это позволяет кэшировать HTTP трафик, а HTTPS пропускать напрямую
# PassThroughPattern: .*

# Статистика и отчеты
ReportPage: acng-report.html
# CountQueries - deprecated, удалена в новых версиях

# Оптимизация производительности
# OptProxyTimeout - deprecated, используется значение по умолчанию
# OptProxyCheckInterval - deprecated, используется значение по умолчанию

# Предотвращение блокировки при множественных запросах
PidFile: /var/run/apt-cacher-ng/pid
