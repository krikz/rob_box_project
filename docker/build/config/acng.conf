# APT-Cacher NG configuration
# Оптимизировано для Docker buildx с 8 параллельными runners

# Директория для кэша
CacheDir: /var/cache/apt-cacher-ng

# Порт для HTTP прокси  
Port: 3142
BindAddress: 0.0.0.0

# Увеличиваем лимиты соединений для параллельной сборки
MaxConns: 20
MaxDlSpeed: 0

# Таймауты (увеличены для стабильности)
SocketTimeout: 300
DnsCacheSeconds: 3600

# Логирование
LogDir: /var/log/apt-cacher-ng
VerboseLog: 1
LogLevel: 3

# Время жизни кэша (увеличено до 10 дней)
ExThreshold: 10

# Разрешить удаление файлов через веб-интерфейс
AllowUserPorts: 1

# Стандартные зеркала (для Ubuntu ARM64)
Remap-debrep: file:deb_mirror*.gz /debian ; file:backends_debian
Remap-uburep: file:ubuntu_mirrors /ubuntu ; file:backends_ubuntu

# Дополнительные репозитории для ROS
Remap-rosrep: http://packages.ros.org/ros2/ubuntu

# Разрешить HTTPS соединения
PassThroughPattern: .*

# Статистика и отчеты
ReportPage: acng-report.html
CountQueries: 1

# Оптимизация производительности
OptProxyTimeout: 120
OptProxyCheckInterval: 10

# Предотвращение блокировки при множественных запросах
PidFile: /var/run/apt-cacher-ng/pid
