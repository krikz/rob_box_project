# Дополнение к дефолтному конфигу sameersbn/apt-cacher-ng: образ читает все
# *.conf из /etc/apt-cacher-ng, поэтому этот файл монтируется рядом с его
# acng.conf, а не вместо него (наш config/acng.conf не подключён — в нём
# Remap-uburep уводит на archive.ubuntu.com, а arm64 живёт на ports).
#
# upstream (ports.ubuntu.com) рвёт соединения под нагрузкой CI, дефолтных
# 2 повторов мало: apt получает 503 "Connection closed, check DlMaxRetries".
# 28.09.2026: run 36436904480, nav2 — 333 таких ответа за минуту.
DlMaxRetries: 10
NetworkTimeout: 60
