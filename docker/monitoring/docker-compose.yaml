# Использует переменные из .env файла:
# - ROBOT_ID: ID робота для фильтрации метрик и логов
# - MAIN_PI_IP: IP адрес Main Pi (по умолчанию 10.1.1.10)
# - VISION_PI_IP: IP адрес Vision Pi (по умолчанию 10.1.1.11)

services:
  # Init container to create Loki directories with proper permissions
  loki-init:
    image: busybox:latest
    container_name: loki-init
    volumes:
      - loki-data:/tmp/loki
    command: sh -c "mkdir -p /tmp/loki/rules /tmp/loki/chunks && chmod -R 777 /tmp/loki"
    restart: "no"

  # Prometheus - сбор метрик с обоих Raspberry Pi
  prometheus:
    image: prom/prometheus:v2.47.2
    container_name: prometheus
    network_mode: host
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./config/prometheus_rules.yml:/etc/prometheus/prometheus_rules.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=7d'
      - '--web.listen-address=:9090'
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/-/healthy || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

  # Loki - агрегация логов с обоих Raspberry Pi
  loki:
    image: grafana/loki:2.9.2
    container_name: loki
    network_mode: host
    volumes:
      - ./config/loki-config.yaml:/etc/loki/local-config.yaml:ro
      - loki-data:/tmp/loki
    command: -config.file=/etc/loki/local-config.yaml
    depends_on:
      loki-init:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3100/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

  # Grafana - визуализация метрик и логов
  grafana:
    image: grafana/grafana:10.2.0
    container_name: grafana
    network_mode: host
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-robbox}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_HTTP_PORT=3000
      - GF_PATHS_PROVISIONING=/etc/grafana/provisioning
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/etc/grafana/provisioning/dashboards/rob_box_dashboard.json
    volumes:
      - ./config/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./config/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
      - tempo
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

  # Issue #1234, этап 2 — OpenTelemetry Collector: приём OTLP-трейсов от
  # voice-нод (dialogue/tts/stt) и экспорт в Tempo. Слушает 4317 (gRPC) и
  # 4318 (HTTP) на host-сети; voice-ноды шлют на OTEL_EXPORTER_OTLP_ENDPOINT
  # (default http://10.1.1.249:4317).
  otel-collector:
    image: otel/opentelemetry-collector:0.105.0
    container_name: otel-collector
    network_mode: host
    volumes:
      - ./config/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    command:
      - '--config=/etc/otelcol/config.yaml'
    restart: unless-stopped
    healthcheck:
      # Дистрибутив collector'а — distroless (нет wget/curl/shell); используем
      # собственный validate-режим бинарника для проверки конфига/живости.
      test: ["CMD", "/otelcol", "validate", "--config=/etc/otelcol/config.yaml"]
      interval: 15s
      timeout: 5s
      retries: 3

  # Issue #1234, этап 2 — Tempo: хранилище трейсов (retention 24h).
  # HTTP API :3200 (datasource для Grafana); OTLP gRPC/HTTP :4321/:4322
  # (приём от otel-collector; 4317 занят collector'ом на host-сети).
  tempo:
    image: grafana/tempo:2.6.0
    container_name: tempo
    network_mode: host
    volumes:
      - ./config/tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo
    command: ['-config.file=/etc/tempo.yaml']
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3200/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

volumes:
  prometheus-data:
  loki-data:
  grafana-data:
  tempo-data:
