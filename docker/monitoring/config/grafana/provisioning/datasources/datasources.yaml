{
  "apiVersion": 1,
  "datasources": [
    {
      "name": "Loki",
      "type": "loki",
      "access": "proxy",
      "url": "http://localhost:3100",
      "isDefault": true,
      "jsonData": {
        "maxLines": 1000
      }
    },
    {
      "name": "Prometheus",
      "type": "prometheus",
      "access": "proxy",
      "url": "http://localhost:9090",
      "isDefault": false
    },
    {
      "name": "Tempo",
      "type": "tempo",
      "access": "proxy",
      "url": "http://localhost:3200",
      "isDefault": false,
      "jsonData": {
        "httpMethod": "GET",
        "serviceMap": {
          "datasourceUid": "prometheus"
        }
      }
    }
  ]
}
