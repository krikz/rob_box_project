name: E2E Voice Test

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'test'
        type: choice
        options:
          - test
          - staging
      voice_file:
        description: 'Voice command file path on build machine'
        required: false
        default: '/tmp/voice_new.ogg'
      volume:
        description: 'Speaker volume (percent)'
        required: false
        default: '125'
      record_seconds:
        description: 'Recording duration (seconds)'
        required: false
        default: '90'

jobs:
  e2e-voice:
    runs-on: [self-hosted, linux, x64, build-machine]
    timeout-minutes: 10

    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg sshpass

      - name: Pre-flight check
        run: |
          echo "=== Host PA ==="
          sshpass -p 'open' ssh -o StrictHostKeyChecking=no ros2@10.1.1.249 \
            "pactl info | head -3"
          echo "=== Robot status ==="
          sshpass -p 'open' ssh -o StrictHostKeyChecking=no ros2@10.1.1.21 \
            "docker ps --filter name=voice-assistant --format '{{.Status}}'" || echo "UNREACHABLE"
          echo "=== Voice file ==="
          sshpass -p 'open' ssh -o StrictHostKeyChecking=no ros2@10.1.1.249 \
            "ls -la ${{ inputs.voice_file }}" || echo "NOT FOUND"

      - name: Wait for silence
        run: |
          echo "Waiting 15s for robot to finish any current speech..."
          sleep 15

      - name: Record and play via SSH
        run: |
          RID="${{ github.run_id }}"
          REC="dialog_e2e_${RID}.wav"
          S="sshpass -p 'open' ssh -o StrictHostKeyChecking=no ros2@10.1.1.249"

          echo "Starting recording..."
          $S "timeout ${{ inputs.record_seconds }} parec --format=s16le --channels=1 --rate=16000 /tmp/$REC" &
          RECPID=$!
          sleep 3

          echo "EQ + play..."
          $S "ffmpeg -y -i /tmp/voice_new.ogg -af highpass=f=200,volume=1.5,alimiter=limit=0.95 -ac 1 -ar 16000 /tmp/voice_eq.wav" 2>/dev/null
          $S "pactl set-sink-volume @DEFAULT_SINK@ ${{ inputs.volume }}%"
          $S "paplay /tmp/voice_eq.wav && echo PLAY_DONE || echo PLAY_FAIL"

          echo "Waiting for robot response..."
          sleep 80

          kill $RECPID 2>/dev/null || true
          wait $RECPID 2>/dev/null || true
          echo "Recording done"

      - name: Fetch recording
        run: |
          RID="${{ github.run_id }}"
          REC="dialog_e2e_${RID}.wav"
          sshpass -p 'open' scp -o StrictHostKeyChecking=no \
            ros2@10.1.1.249:/tmp/$REC /tmp/$REC
          ls -la /tmp/$REC

      - name: Collect robot logs
        run: |
          RID="${{ github.run_id }}"
          LOG="/tmp/voice_e2e_${RID}.log"
          sshpass -p 'open' ssh -o StrictHostKeyChecking=no ros2@10.1.1.21 \
            "docker logs voice-assistant --since 10m 2>&1" > "$LOG" || \
            echo "Failed to collect logs" > "$LOG"
          echo "Log lines: $(wc -l < "$LOG")"

      - name: Upload recording
        uses: actions/upload-artifact@v4
        with:
          name: e2e-voice-recording-${{ github.run_id }}
          path: /tmp/dialog_e2e_${{ github.run_id }}.wav
          retention-days: 7

      - name: Upload logs
        uses: actions/upload-artifact@v4
        with:
          name: e2e-voice-logs-${{ github.run_id }}
          path: /tmp/voice_e2e_${{ github.run_id }}.log
          retention-days: 7

      - name: Summary
        run: |
          echo "## E2E Voice Test Complete" >> $GITHUB_STEP_SUMMARY
          echo "- Environment: ${{ inputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "- Volume: ${{ inputs.volume }}%" >> $GITHUB_STEP_SUMMARY
          echo "- Run URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" >> $GITHUB_STEP_SUMMARY
