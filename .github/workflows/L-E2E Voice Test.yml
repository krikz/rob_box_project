name: E2E Voice Test

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'test'
        type: choice
        options:
          - test
          - staging
      voice_file:
        description: 'Voice command file path on build machine'
        required: false
        default: '/tmp/voice_new.ogg'
      volume:
        description: 'Speaker volume (percent)'
        required: false
        default: '125'
      record_seconds:
        description: 'Recording duration (seconds)'
        required: false
        default: '90'

jobs:
  e2e-voice:
    runs-on: [self-hosted, linux, x64, build-machine]
    timeout-minutes: 10

    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq pulseaudio-utils ffmpeg sshpass

      - name: Start PulseAudio
        run: |
          # Runner runs as root, PA socket is under /run/user/1000/ (0700, ros2)
          # Use sudo -u ros2 to access the user session
          sudo -u ros2 pactl info | head -5

      - name: Pre-flight check
        run: |
          echo "=== Environment ==="
          echo "PulseAudio: $(pactl info | grep 'Server Name' || echo 'NOT RUNNING')"
          echo "Default sink: $(pactl get-default-sink || echo 'NONE')"
          echo "=== Robot status ==="
          sshpass -p 'open' ssh -o StrictHostKeyChecking=no ros2@10.1.1.21 \
            "docker ps --filter name=voice-assistant --format '{{.Status}}'" || echo "UNREACHABLE"
          echo "=== Voice file ==="
          ls -la ${{ inputs.voice_file }} || echo "NOT FOUND"

      - name: Wait for silence
        run: |
          echo "Waiting 15s for robot to finish any current speech..."
          sleep 15

      - name: Record and play voice command
        run: |
          RECORD_FILE="/tmp/dialog_e2e_${{ github.run_id }}.wav"
          echo "Recording to $RECORD_FILE for ${{ inputs.record_seconds }}s..."

          # Start recording as ros2 user (has PA access)
          sudo -u ros2 timeout ${{ inputs.record_seconds }} parec \
            --format=s16le --channels=1 --rate=16000 \
            "$RECORD_FILE" &
          RECORD_PID=$!
          sleep 2

          # EQ processing + play as ros2 user
          echo "Processing voice with EQ..."
          ffmpeg -y -i ${{ inputs.voice_file }} \
            -af 'highpass=f=200,volume=1.5,alimiter=limit=0.95' \
            -ac 1 -ar 16000 /tmp/voice_eq.wav 2>&1 | tail -1

          sudo -u ros2 pactl set-sink-volume @DEFAULT_SINK@ ${{ inputs.volume }}%
          echo "Playing voice command..."
          sudo -u ros2 paplay /tmp/voice_eq.wav && echo "PLAY_DONE" || echo "PLAY_FAIL"

          # Wait for robot response
          echo "Waiting for robot response..."
          sleep 80

          # Stop recording
          kill $RECORD_PID 2>/dev/null || true
          wait $RECORD_PID 2>/dev/null || true

          ls -la "$RECORD_FILE"
          echo "RECORD_FILE=$RECORD_FILE" >> $GITHUB_ENV

      - name: Collect robot logs
        run: |
          LOG_FILE="/tmp/voice_e2e_${{ github.run_id }}.log"
          sshpass -p 'open' ssh -o StrictHostKeyChecking=no ros2@10.1.1.21 \
            "docker logs voice-assistant --since 10m 2>&1" > "$LOG_FILE" || \
            echo "Failed to collect logs" > "$LOG_FILE"
          echo "Log lines: $(wc -l < "$LOG_FILE")"
          echo "LOG_FILE=$LOG_FILE" >> $GITHUB_ENV

      - name: Upload recording
        uses: actions/upload-artifact@v4
        with:
          name: e2e-voice-recording-${{ github.run_id }}
          path: ${{ env.RECORD_FILE }}
          retention-days: 7

      - name: Upload logs
        uses: actions/upload-artifact@v4
        with:
          name: e2e-voice-logs-${{ github.run_id }}
          path: ${{ env.LOG_FILE }}
          retention-days: 7

      - name: Summary
        run: |
          echo "## E2E Voice Test Complete" >> $GITHUB_STEP_SUMMARY
          echo "- Recording: $(stat -c%s $RECORD_FILE) bytes" >> $GITHUB_STEP_SUMMARY
          echo "- Log: $(wc -l < $LOG_FILE) lines" >> $GITHUB_STEP_SUMMARY
          echo "- Environment: ${{ inputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "- Volume: ${{ inputs.volume }}%" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Download artifacts from the run summary page." >> $GITHUB_STEP_SUMMARY
