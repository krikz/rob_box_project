name: "G: Run Tests"

# Запуск unit tests для ROS2 пакетов
on:
  push:
    branches:
      - develop
      - main
    paths:
      - 'src/*/**.py'
      - 'src/*/test/**.py'
      - 'src/*/package.xml'
      - '.github/workflows/test.yml'
  pull_request:
    branches:
      - develop
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ============================================================================
  # Unit Tests
  # ============================================================================
  unit-tests:
    name: Unit Tests (ROS2 Humble)
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Cache colcon build
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/test_ws/build
            ${{ github.workspace }}/test_ws/install
          key: colcon-humble-v2-${{ runner.os }}-${{ hashFiles('src/rob_box_voice/package.xml', 'src/rob_box_animations/package.xml', 'src/rob_box_perception/package.xml') }}
                      colcon-humble-v2-
          restore-keys: |
            colcon-humble-${{ runner.os }}-


      - name: Set up ROS2 Humble
        uses: ros-tooling/setup-ros@v0.7
        with:
          required-ros-distributions: humble

      - name: Install Python dependencies
        run: |
          set -eo pipefail
          sudo python3 -m pip install --upgrade pip

          # pytest >= 8 — MUST use --force-reinstall because apt-installed
          # python3-pytest 6.2.5 at /usr/lib/python3/dist-packages/ takes
          # precedence over /usr/local/lib/python3.10/dist-packages/ in
          # Python's sys.path.  Without --force-reinstall, colcon test
          # loads 6.2.5 → ModuleNotFoundError: _pytest.scope.
          sudo pip install --force-reinstall 'pytest>=8' pytest-asyncio pytest-cov pytest-mock

          sudo pip install openai httpx

          # ---- verify pytest >= 8 ----
          python3 -c "import pytest, sys; v=pytest.__version__; assert tuple(int(x) for x in v.split('.')) >= (8,0), f'pytest too old: {v}'; print(f'pytest: {v} ({pytest.__file__}) sys.path[0]={sys.path[0]}')"

          # ---- purge user-site leftovers ----
          rm -rf ~/.local/lib/python3.10/site-packages/_pytest*  2>/dev/null || true
          rm -rf ~/.local/lib/python3.10/site-packages/pytest*    2>/dev/null || true
          rm -rf ~/.local/lib/python3.10/site-packages/pytest_*   2>/dev/null || true

      - name: Install ROS2 test dependencies
        run: |
          set -eo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            ros-humble-ament-cmake-pytest \
            ros-humble-launch-testing \
            ros-humble-launch-testing-ament-cmake

          # apt may reinstall python3-pytest 6.2.5 as a dep → re-force
          sudo pip install --force-reinstall 'pytest>=8' pytest-asyncio pytest-cov pytest-mock

          # ---- final verify: MUST be >= 8 ----
          python3 -c "import pytest; v=pytest.__version__; assert tuple(int(x) for x in v.split('.')) >= (8,0), f'pytest too old after apt: {v}'; print(f'OK pytest={v} ({pytest.__file__})')"

      - name: Build workspace
        run: |
          source /opt/ros/humble/setup.bash

          # Create workspace — exclude vendor submodules (not our code to lint)
          mkdir -p ${{ github.workspace }}/test_ws/src
          rsync -av --exclude='ros2leds' --exclude='vesc_nexus' --exclude='robot_sensor_hub_msg' src/ ${{ github.workspace }}/test_ws/src/

          # Build packages (use --packages-up-to to include dependencies)
          cd ${{ github.workspace }}/test_ws
          colcon build --symlink-install \
            --packages-up-to rob_box_voice rob_box_animations rob_box_perception \
            --cmake-args -DCMAKE_BUILD_TYPE=Release

      - name: Run unit tests
        run: |
          set -eo pipefail
          source /opt/ros/humble/setup.bash
          source ${{ github.workspace }}/test_ws/install/setup.bash

          cd ${{ github.workspace }}/test_ws

          # Force pip-installed pytest>=8 before apt's 6.2.5
          export PYTHONPATH="/usr/local/lib/python3.10/dist-packages:$PYTHONPATH"
          # Disable launch_testing plugin: it was compiled for pytest 6,
          # implements a hook that no longer exists in pytest 9 → plugin loader crashes.
          # We re-enable only the plugins we actually need via --pytest-args.
          export PYTEST_DISABLE_PLUGIN_AUTOLOAD=1
          python3 -c "import pytest; v=pytest.__version__; assert v >= '8', f'WRONG pytest: {v}'; print(f'colcon pytest: {v} ({pytest.__file__})')"

          # Run tests — NO `|| true`, failures MUST surface
          # PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 stops pytest from auto-loading
          # the apt-installed `launch_testing` plugin (compiled for pytest 6,
          # breaks with pytest 9). We re-enable only the plugins we need.
          colcon test \
            --packages-select rob_box_voice rob_box_animations rob_box_perception \
            --event-handlers console_direct+ \
            --pytest-args "-p pytest_asyncio -p pytest_cov -p pytest_mock" \
            --return-code-on-test-failure

      - name: Display test results
        if: always()
        run: |
          set -eo pipefail
          source /opt/ros/humble/setup.bash
          cd ${{ github.workspace }}/test_ws
          colcon test-result --all --verbose

      - name: Generate coverage report
        if: always()
        run: |
          cd ${{ github.workspace }}/test_ws

          # Find coverage files
          find build -name "*.coverage" -type f

          # Combine coverage if exists
          if [ -f "build/rob_box_voice/coverage.xml" ]; then
            echo "Coverage report generated"
            cat build/rob_box_voice/coverage.xml
          fi

      - name: Upload coverage to artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: |
            ${{ github.workspace }}/test_ws/build/*/coverage.xml
            ${{ github.workspace }}/test_ws/build/*/htmlcov/
          retention-days: 30

  # ============================================================================
  # Integration Tests (optional, only on develop/main)
  # ============================================================================
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-22.04
    if: github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Cache colcon build
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/test_ws/build
            ${{ github.workspace }}/test_ws/install
          key: colcon-humble-v3-${{ runner.os }}-${{ hashFiles('src/rob_box_voice/package.xml', 'src/rob_box_animations/package.xml', 'src/rob_box_perception/package.xml') }}
          restore-keys: |
            colcon-humble-${{ runner.os }}-

      - name: Set up ROS2 Humble
        uses: ros-tooling/setup-ros@v0.7
        with:
          required-ros-distributions: humble

      - name: Install Python dependencies
        run: |
          set -eo pipefail
          sudo python3 -m pip install --upgrade pip
          sudo pip install --force-reinstall 'pytest>=8' pytest-asyncio pytest-cov
          sudo pip install openai httpx
          python3 -c "import pytest; assert pytest.__version__>='8', f'pytest={pytest.__version__}'"

      - name: Build workspace
        run: |
          set -eo pipefail
          source /opt/ros/humble/setup.bash
          mkdir -p ${{ github.workspace }}/test_ws/src
          rsync -av --exclude='ros2leds' --exclude='vesc_nexus' --exclude='robot_sensor_hub_msg' src/ ${{ github.workspace }}/test_ws/src/
          cd ${{ github.workspace }}/test_ws
          colcon build --symlink-install \
            --packages-up-to rob_box_voice rob_box_animations rob_box_perception \
            --cmake-args -DCMAKE_BUILD_TYPE=Release

      - name: Run integration tests
        run: |
          set -eo pipefail
          source /opt/ros/humble/setup.bash
          source ${{ github.workspace }}/test_ws/install/setup.bash
          cd ${{ github.workspace }}/test_ws
          export PYTHONPATH="/usr/local/lib/python3.10/dist-packages:$PYTHONPATH"
          python3 -c "import pytest; assert pytest.__version__>='8'"
          colcon test \
            --packages-select rob_box_voice \
            --pytest-args '-m integration' \
            --event-handlers console_direct+ \
            --return-code-on-test-failure

  # ============================================================================
  # Test Summary
  # ============================================================================
  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [unit-tests]
    if: always()

    steps:
      - name: Generate summary
        run: |
          echo "## 🧪 Test Results Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Test Suite | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Unit Tests | ${{ needs.unit-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ needs.unit-tests.result }}" != "success" ]; then
            echo "⚠️ **Tests failed!** Check logs above for details." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### 🔧 Quick Debug" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
            echo "# Run tests locally" >> $GITHUB_STEP_SUMMARY
            echo "cd ~/voice_ws" >> $GITHUB_STEP_SUMMARY
            echo "colcon test --packages-select rob_box_voice" >> $GITHUB_STEP_SUMMARY
            echo "colcon test-result --verbose" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          else
            echo "✅ All tests passed!" >> $GITHUB_STEP_SUMMARY
          fi
