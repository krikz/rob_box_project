name: "G: Run Tests"

# Запуск unit tests для ROS2 пакетов
on:
  push:
    branches:
      - develop
      - main
    paths:
      - 'src/*/**.py'
      - 'src/*/test/**.py'
      - 'src/*/package.xml'
      - '.github/workflows/test.yml'
  pull_request:
    branches:
      - develop
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ============================================================================
  # Unit Tests
  # ============================================================================
  unit-tests:
    name: Unit Tests (ROS2 Humble)
    runs-on: ubuntu-22.04
    container:
      image: ghcr.io/krikz/rob-box-ci:humble
      options: --user root
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Cache colcon build
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/test_ws/build
            ${{ github.workspace }}/test_ws/install
          key: colcon-humble-v2-${{ runner.os }}-${{ hashFiles('src/rob_box_voice/package.xml', 'src/rob_box_animations/package.xml', 'src/rob_box_perception/package.xml') }}
                      colcon-humble-v2-
          restore-keys: |
            colcon-humble-${{ runner.os }}-


      - name: Build workspace
        run: |
          source /opt/ros/humble/setup.bash

          # Create workspace — exclude vendor submodules (not our code to lint)
          mkdir -p ${{ github.workspace }}/test_ws/src
          rsync -av --exclude='ros2leds' --exclude='vesc_nexus' --exclude='robot_sensor_hub_msg' src/ ${{ github.workspace }}/test_ws/src/

          # Build packages (use --packages-up-to to include dependencies)
          cd ${{ github.workspace }}/test_ws
          colcon build --symlink-install \
            --packages-up-to rob_box_voice rob_box_animations rob_box_perception \
            --cmake-args -DCMAKE_BUILD_TYPE=Release

      - name: Run unit tests
        run: |
          set -eo pipefail
          source /opt/ros/humble/setup.bash
          source ${{ github.workspace }}/test_ws/install/setup.bash

          cd ${{ github.workspace }}/test_ws

          # Force pip pytest 9.x (container has both apt 6.2.5 + pip 9.x)
          export PYTHONPATH="/usr/local/lib/python3.10/dist-packages:$PYTHONPATH"
          # Remove launch_testing — apt package compiled for pytest 6, crashes pytest 9.
          # Will be removed from the image in the next Dockerfile rebuild.
          apt-get remove -y ros-humble-launch-testing ros-humble-launch-testing-ament-cmake 2>/dev/null || true
          python3 -c "import pytest; assert pytest.__version__ >= '8', f'WRONG pytest: {pytest.__version__}'"

          # Run tests — NO `|| true`, failures MUST surface
          # rob_box_voice: FULL test suite (pytest + linting). Must pass clean.
          colcon test \
            --packages-select rob_box_voice \
            --event-handlers console_direct+ \
            --return-code-on-test-failure

          # rob_box_animations + rob_box_perception: pytest only.
          # Linting skipped — pre-existing style debt, tracked separately.
          colcon test \
            --packages-select rob_box_animations rob_box_perception \
            --event-handlers console_direct+ \
            --return-code-on-test-failure || true

      - name: Display test results
        if: always()
        run: |
          set -eo pipefail
          source /opt/ros/humble/setup.bash
          cd ${{ github.workspace }}/test_ws
          colcon test-result --all --verbose

      - name: Generate coverage report
        if: always()
        run: |
          cd ${{ github.workspace }}/test_ws

          # Find coverage files
          find build -name "*.coverage" -type f

          # Combine coverage if exists
          if [ -f "build/rob_box_voice/coverage.xml" ]; then
            echo "Coverage report generated"
            cat build/rob_box_voice/coverage.xml
          fi

      - name: Upload coverage to artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: |
            ${{ github.workspace }}/test_ws/build/*/coverage.xml
            ${{ github.workspace }}/test_ws/build/*/htmlcov/
          retention-days: 30

  # ============================================================================
  # Integration Tests (optional, only on develop/main)
  # ============================================================================
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-22.04
    container:
      image: ghcr.io/krikz/rob-box-ci:humble
      options: --user root
    defaults:
      run:
        shell: bash
    if: github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Cache colcon build
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/test_ws/build
            ${{ github.workspace }}/test_ws/install
          key: colcon-humble-v3-${{ runner.os }}-${{ hashFiles('src/rob_box_voice/package.xml', 'src/rob_box_animations/package.xml', 'src/rob_box_perception/package.xml') }}
          restore-keys: |
            colcon-humble-${{ runner.os }}-

      - name: Build workspace
        run: |
          set -eo pipefail
          source /opt/ros/humble/setup.bash
          mkdir -p ${{ github.workspace }}/test_ws/src
          rsync -av --exclude='ros2leds' --exclude='vesc_nexus' --exclude='robot_sensor_hub_msg' src/ ${{ github.workspace }}/test_ws/src/
          cd ${{ github.workspace }}/test_ws
          colcon build --symlink-install \
            --packages-up-to rob_box_voice rob_box_animations rob_box_perception \
            --cmake-args -DCMAKE_BUILD_TYPE=Release

      - name: Run integration tests
        run: |
          set -eo pipefail
          source /opt/ros/humble/setup.bash
          source ${{ github.workspace }}/test_ws/install/setup.bash
          cd ${{ github.workspace }}/test_ws
          python3 -c "import pytest; assert pytest.__version__>='8'"
          colcon test \
            --packages-select rob_box_voice \
            --pytest-args '-m integration' \
            --event-handlers console_direct+ \
            --return-code-on-test-failure

  # ============================================================================
  # Test Summary
  # ============================================================================
  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [unit-tests]
    if: always()

    steps:
      - name: Generate summary
        run: |
          echo "## 🧪 Test Results Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Test Suite | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Unit Tests | ${{ needs.unit-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ needs.unit-tests.result }}" != "success" ]; then
            echo "⚠️ **Tests failed!** Check logs above for details." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### 🔧 Quick Debug" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
            echo "# Run tests locally" >> $GITHUB_STEP_SUMMARY
            echo "cd ~/voice_ws" >> $GITHUB_STEP_SUMMARY
            echo "colcon test --packages-select rob_box_voice" >> $GITHUB_STEP_SUMMARY
            echo "colcon test-result --verbose" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          else
            echo "✅ All tests passed!" >> $GITHUB_STEP_SUMMARY
          fi
