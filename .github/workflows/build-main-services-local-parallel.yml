          LOCAL_TAG="${LOCAL_PREFIX}:${SERVICE}-${ROS_DISTRO}-${{ needs.prepare.outputs.docker_tag }}"

          echo "Building ${SERVICE}..."
          echo "GHCR Tag: ${GHCR_TAG}"
          echo "Local Tag: ${LOCAL_TAG}"

          docker buildx build \
