name: Build Main Pi Services (Local Parallel)

# Сборка Main Pi сервисов на self-hosted runner с параллельными jobs
on:
  push:
    branches:
      - develop
      - 'feature/**'
      - 'copilot/**'
    paths:
      - 'docker/main/**'
      - '.github/workflows/build-main-services-local-parallel.yml'
  workflow_dispatch:
  workflow_call:

env:
  LOCAL_REGISTRY: localhost:5000
  GHCR_REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/rob_box
  LOCAL_PREFIX: localhost:5000/krikz/rob_box
  ROS_DISTRO: humble

jobs:
  # Определение тега и общая подготовка
  prepare:
    runs-on: self-hosted
    outputs:
      docker_tag: ${{ steps.set-config.outputs.docker_tag }}
      local_registry: ${{ steps.set-config.outputs.local_registry }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set build configuration
        id: set-config
        run: |
          # Определяем тег на основе ветки
          BRANCH_NAME="${GITHUB_REF#refs/heads/}"
          if [ "$BRANCH_NAME" = "main" ]; then
            DOCKER_TAG="latest"
          elif [ "$BRANCH_NAME" = "develop" ]; then
            DOCKER_TAG="dev"
          elif [[ "$BRANCH_NAME" == feature/* ]]; then
            DOCKER_TAG="test"
          elif [[ "$BRANCH_NAME" == copilot/* ]]; then
            DOCKER_TAG="test"
          else
            DOCKER_TAG="dev"
          fi

          echo "docker_tag=${DOCKER_TAG}" >> $GITHUB_OUTPUT
          echo "local_registry=${LOCAL_REGISTRY}" >> $GITHUB_OUTPUT

  # Отдельные jobs для каждого сервиса (собираются параллельно)
  build-rtabmap:
    needs: prepare
    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container
          use: true

      - name: Build rtabmap
        run: |
          SERVICE="rtabmap"
          GHCR_TAG="${IMAGE_PREFIX}:${SERVICE}-${ROS_DISTRO}-${{ needs.prepare.outputs.docker_tag }}"
          LOCAL_TAG="${LOCAL_PREFIX}:${SERVICE}-${ROS_DISTRO}-${{ needs.prepare.outputs.docker_tag }}"

          echo "Building ${SERVICE}..."
          echo "GHCR Tag: ${GHCR_TAG}"
          echo "Local Tag: ${LOCAL_TAG}"

          docker buildx build \
            --platform linux/arm64 \
            --file docker/main/${SERVICE}/Dockerfile \
            --tag "${GHCR_TAG}" \
            --tag "${LOCAL_TAG}" \
            --load \
            --build-arg="BASE_IMAGE=ghcr.io/krikz/rob_box_base:rtabmap" \
            .

          echo "✅ Built ${SERVICE} successfully"

  build-robot-state-publisher:
    needs: prepare
    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Docker Buildx
