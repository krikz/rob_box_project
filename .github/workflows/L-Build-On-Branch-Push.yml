name: "L: Build On Branch Push"

# GATE-4 (issue #1475, ADR-0022 extension): автоматический триггер
# L-Build-All-Services при push в develop или main. До этого фикса:
#   - L-Build-All-Services.yml срабатывал ТОЛЬКО от workflow_dispatch
#     (e2e-process на round-ветке) или workflow_call (G-Auto-merge to Main);
#   - push в develop триггерил ТОЛЬКО G-Auto-merge to Main, который создавал
#     PR в main (не билдил);
#   - результат: после merge любого PR в develop develop-HEAD оставался
#     не пересобранным → deploy тащил старый .image-versions.dev → робот
#     получал старые образы (issue #1475, evidence: PR #1434 merge
#     18.08 23:00 MSK → на роботе до сих пор dev-ddd09e51 от 17:49 MSK).
#
# Этот workflow — push-триггер: после merge любого PR в develop (или main)
# автоматически запускается L-Build-All-Services, который собирает Main Pi
# и Vision Pi сервисы параллельно и обновляет .image-versions.dev (или
# .image-versions при push в main) с dev-<sha> тегами.
#
# Race-safety: race с e2e-process workflow_dispatch уже handled в
# scripts/ci/push-image-versions.sh (pull --rebase + retry). Этот workflow
# может стартовать параллельно — оба запишут в одну ветку, race resolved.
#
# Также: agent-flow-merge-gate.sh после MERGED detection делает backup-trigger
# через `gh workflow run` (agent-flow-post-merge-build.sh) — на случай если
# push-trigger пропустит событие (GitHub rate limit, eventual consistency).
on:
  push:
    branches:
      - develop
      - main

# Не блокируем PR — это build для develop/main после merge.
permissions:
  contents: write  # Required for git push of .image-versions files

env:
  LOCAL_REGISTRY: localhost:5000
  LOCAL_PREFIX: localhost:5000/krikz/rob_box
  ROS_DISTRO: humble

jobs:
  build-all:
    # Self-hosted runner (rob-box) — содержит docker registry и доступ к .21.
    runs-on: [self-hosted, rob-box]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Trigger L-Build-All-Services
        # Reusable workflow call вместо копирования jobs: единая точка правды.
        # Race с e2e-process workflow_dispatch → scripts/ci/push-image-versions.sh
        # делает pull --rebase + retry на push в .image-versions.
        uses: ./.github/workflows/L-Build-All-Services.yml
        with:
          push_to_registry: 'true'
          build_base_images: 'false'
