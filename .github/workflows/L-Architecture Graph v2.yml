name: "L: Architecture Graph v2"

on:
  workflow_run:
    workflows: ["L: Architecture Audit"]
    types: [completed]
  workflow_dispatch:
    inputs:
      audit_run_id:
        description: "Audit workflow run ID to render (optional for manual rerun)"
        required: false
        default: ""

permissions:
  actions: read
  contents: read

jobs:
  graph:
    name: Publish Mermaid architecture graph
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Resolve audit run
        id: audit
        env:
          MANUAL_RUN_ID: ${{ inputs.audit_run_id }}
          EVENT_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          RUN_ID="$EVENT_RUN_ID"
          if [ -n "$MANUAL_RUN_ID" ]; then RUN_ID="$MANUAL_RUN_ID"; fi
          test -n "$RUN_ID"
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Download runtime audit evidence
        uses: actions/download-artifact@v4
        with:
          name: architecture-local-runtime
          path: architecture
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.audit.outputs.run_id }}

      - name: Checkout audit revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Render Mermaid graphs
        run: |
          python tools/architecture_runtime_graph.py \
            --runtime architecture/runtime.json \
            --inventory architecture/inventory.json \
            --output-dir architecture

      - name: Upload Mermaid graphs
        uses: actions/upload-artifact@v4
        with:
          name: architecture-mermaid
          path: |
            architecture/runtime-overview.mmd
            architecture/runtime-graph.mmd

      - name: Publish diagram
        run: |
          {
            echo "## ROS2 runtime architecture diagram"
            echo "Source audit run: ${{ steps.audit.outputs.run_id }}"
            echo
            printf '%s\\n' '```mermaid'
            cat architecture/runtime-overview.mmd
            printf '%s\\n' '```'
            echo
            echo "Full graph: runtime-graph.mmd is in the architecture-mermaid artifact."
          } >> "$GITHUB_STEP_SUMMARY"
