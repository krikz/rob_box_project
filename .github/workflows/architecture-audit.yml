name: Architecture Audit

on:
  workflow_dispatch:
    inputs:
      runtime:
        description: "Collect a real ROS2 runtime graph"
        required: false
        default: false
        type: boolean
      runtime_host:
        description: "ROS2 host reachable by SSH; empty = ROS2 is on the runner"
        required: false
        default: "10.1.1.21"
        type: string
      runtime_user:
        description: "SSH user for the ROS2 host"
        required: false
        default: "ros2"
        type: string
      runtime_topics:
        description: "Comma-separated topics for verbose inspection; empty = all discovered topics"
        required: false
        default: ""
        type: string
  pull_request:
    paths:
      - "src/**"
      - "docker/**"
      - "tools/architecture_*.py"
      - "architecture/ownership.yml"
      - "docs/design/ARCHITECTURE_AUDIT.md"
      - ".github/workflows/architecture-audit.yml"
  push:
    branches: [develop]
    paths:
      - "src/**"
      - "docker/**"
      - "tools/architecture_*.py"
      - "architecture/ownership.yml"
      - "docs/design/ARCHITECTURE_AUDIT.md"
      - ".github/workflows/architecture-audit.yml"
  schedule:
    - cron: "17 2 * * *"

permissions:
  contents: read

concurrency:
  group: architecture-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Static architecture inventory
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install scanner dependency
        run: python -m pip install --disable-pip-version-check pyyaml
      - name: Run architecture scanner
        run: |
          mkdir -p architecture
          python tools/architecture_audit.py --output architecture/inventory.json --markdown architecture/inventory.md
      - name: Run structural findings
        run: |
          python tools/architecture_findings.py architecture/inventory.json --json architecture/findings.json --markdown architecture/findings.md
      - name: Validate inventory
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path("architecture/inventory.json").read_text())
          required={"schema_version","containers","packages","launches","python","classes","ros_interfaces","topics","summary"}
          missing=required-data.keys()
          if missing:
              raise SystemExit(f"Missing inventory keys: {sorted(missing)}")
          if data["schema_version"] < 2:
              raise SystemExit("Inventory schema is older than required schema_version=2")
          print("Inventory OK:", data["summary"])
          PY
      - name: Upload static evidence
        uses: actions/upload-artifact@v4
        with:
          name: architecture-static
          path: |
            architecture/inventory.json
            architecture/inventory.md
            architecture/findings.json
            architecture/findings.md
      - name: Publish static summary
        run: |
          {
            echo "## Architecture inventory"
            cat architecture/inventory.md
            echo
            cat architecture/findings.md
          } >> "$GITHUB_STEP_SUMMARY"

  runtime:
    name: Runtime ROS2 graph
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.runtime == true }}
    needs: static
    runs-on: [self-hosted, Linux, X64, rob-box]
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download static evidence
        uses: actions/download-artifact@v4
        with:
          name: architecture-static
          path: architecture
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check runtime prerequisites
        env:
          RUNTIME_HOST: ${{ inputs.runtime_host }}
        run: |
          if [ -n "$RUNTIME_HOST" ]; then
            command -v ssh
            ssh -o BatchMode=yes -o ConnectTimeout=10 "${{ inputs.runtime_user }}@$RUNTIME_HOST" "ros2 node list >/dev/null"
          else
            command -v ros2
          fi
      - name: Capture ROS2 runtime graph
        run: |
          args=(--output architecture/runtime.json)
          if [ -n "${{ inputs.runtime_topics }}" ]; then
            args+=(--topics "${{ inputs.runtime_topics }}")
          fi
          if [ -n "${{ inputs.runtime_host }}" ]; then
            args+=(--remote-host "${{ inputs.runtime_host }}" --remote-user "${{ inputs.runtime_user }}")
          fi
          python tools/architecture_runtime_snapshot.py "\${args[@]}"
      - name: Compare static and runtime
        run: python tools/architecture_runtime_diff.py architecture/inventory.json architecture/runtime.json
      - name: Upload runtime evidence
        uses: actions/upload-artifact@v4
        with:
          name: architecture-runtime
          path: |
            architecture/runtime.json
            architecture/runtime-diff.json
            architecture/runtime-diff.md
      - name: Publish runtime summary
        run: |
          {
            echo "## Runtime ROS2 graph"
            python - <<'PY'
            import json
            d=json.load(open("architecture/runtime.json"))
            print(f"- Source: {d.get('captured_from')}")
            print(f"- Nodes: {len(d.get('nodes', []))}")
            print(f"- Topics: {len(d.get('topics', []))}")
            print(f"- Services: {len(d.get('services', []))}")
            print(f"- Actions: {len(d.get('actions', []))}")
            PY
            echo
            cat architecture/runtime-diff.md
          } >> "$GITHUB_STEP_SUMMARY"
