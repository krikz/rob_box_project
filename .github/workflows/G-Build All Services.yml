name: "G: Build All Services"

# Полная сборка всех образов проекта на GitHub Actions
# (базовые + сервисы Main Pi + сервисы Vision Pi)
on:
  push:
    branches:
      - main  # Автосборка при пуше в main
  workflow_dispatch:  # Ручной запуск
  workflow_call:  # Вызов из других workflow (например, auto-merge)
  schedule:
    # Ночная сборка каждый день в 3:00 UTC (6:00 MSK)
    - cron: '0 3 * * *'

jobs:
  # Шаг 1: Собираем базовые образы
  build-base-images:
    uses: ./.github/workflows/G-Build Base Images.yml
    secrets: inherit
    permissions:
      contents: read
      packages: write

  # Шаг 2: Собираем сервисы Main Pi (зависят от базовых образов)
  build-main-services:
    needs: build-base-images
    uses: ./.github/workflows/G-Build Main Pi Services.yml
    secrets: inherit
    permissions:
      contents: read
      packages: write

  # Шаг 3: Собираем сервисы Vision Pi (зависят от базовых образов)
  build-vision-services:
    needs: build-base-images
    uses: ./.github/workflows/G-Build Vision Pi Services.yml
    secrets: inherit
    permissions:
      contents: read
      packages: write

  # Финальная проверка
  verify-all:
    runs-on: ubuntu-latest
    needs: [build-base-images, build-main-services, build-vision-services]
    steps:
      - name: All builds succeeded
        run: |
          echo "🎉 Полная сборка проекта завершена успешно!"
          echo ""
          echo "Базовые образы:"
          echo "  - ghcr.io/krikz/rob_box_base:ros2-zenoh"
          echo "  - ghcr.io/krikz/rob_box_base:rtabmap"
          echo "  - ghcr.io/krikz/rob_box_base:depthai"
          echo "  - ghcr.io/krikz/rob_box_base:pcl"
          echo ""
          echo "Main Pi сервисы:"
          echo "  - ghcr.io/krikz/rob_box:robot-state-publisher"
          echo "  - ghcr.io/krikz/rob_box:rtabmap"
          echo ""
          echo "Vision Pi сервисы:"
          echo "  - ghcr.io/krikz/rob_box:oak-d (with integrated AprilTag detection)"
          echo "  - ghcr.io/krikz/rob_box:lslidar"
