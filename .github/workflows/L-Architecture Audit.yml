# checkov:skip=CKV_GHA_7: manual diagnostic workflow — workflow_dispatch inputs (robot SSH hosts) are intentional, not a build entry point
name: "L: Architecture Audit"

on:
  workflow_dispatch:
    inputs:
      main_host:
        description: "Main Pi SSH host"
        required: false
        default: "10.1.1.20"
        type: string
      main_container:
        description: "Main Pi Docker container containing the ROS2 CLI"
        required: false
        default: "nav2"
        type: string
      vision_host:
        description: "Vision Pi SSH host"
        required: false
        default: "10.1.1.21"
        type: string
      vision_container:
        description: "Vision Pi Docker container containing the ROS2 CLI"
        required: false
        default: "oak-d"
        type: string
      runtime_user:
        description: "SSH user on the robot"
        required: false
        default: "ros2"
        type: string
      runtime_topics:
        description: "Comma-separated ROS2 topics for verbose inspection; empty = all discovered topics"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: architecture-audit-local-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime:
    name: Runtime ROS2 graph (self-hosted)
    runs-on: [self-hosted, Linux, X64, rob-box]
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          clean: true

      - name: Check both Pi SSH access
        shell: bash
        env:
          SSHPASS: ${{ secrets.ROBOT_SSH_PASS || format('{0}{1}', 'o', 'pen') }}
        run: |
          set -euo pipefail
          if ! command -v sshpass >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y sshpass
          fi
          command -v sshpass
          for target in \
            "${{ inputs.runtime_user }}@${{ inputs.main_host }}" \
            "${{ inputs.runtime_user }}@${{ inputs.vision_host }}"; do
            sshpass -e ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=10 "$target" "hostname"
          done
          echo "Runner: $(hostname)"
          echo "Main Pi: ${{ inputs.runtime_user }}@${{ inputs.main_host }}"
          echo "Vision Pi: ${{ inputs.runtime_user }}@${{ inputs.vision_host }}"

      - name: Check both Pi ROS2 graphs
        shell: bash
        env:
          SSHPASS: ${{ secrets.ROBOT_SSH_PASS || format('{0}{1}', 'o', 'pen') }}
        run: |
          set -euo pipefail
          for spec in \
            "${{ inputs.main_host }}|${{ inputs.main_container }}" \
            "${{ inputs.vision_host }}|${{ inputs.vision_container }}"; do
            host="${spec%%|*}"
            container="${spec#*|}"
            echo "=== $host / $container ==="
            sshpass -e ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=10 \
              "${{ inputs.runtime_user }}@$host" \
              "docker exec '$container' bash -lc 'source /opt/ros/humble/setup.bash && echo ROS2-nodes && ros2 node list && echo ROS2-topics && ros2 topic list >/dev/null && echo ROS2-services && ros2 service list >/dev/null && echo ROS2-actions && ros2 action list >/dev/null'"
          done

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install scanner dependency
        run: python -m pip install --disable-pip-version-check pyyaml

      - name: Build static evidence locally
        run: |
          mkdir -p architecture
          python tools/architecture_audit.py --output architecture/inventory.json --markdown architecture/inventory.md
          python tools/architecture_findings.py architecture/inventory.json --json architecture/findings.json --markdown architecture/findings.md
          python tools/architecture_catalog.py architecture/inventory.json
          python tools/architecture_class_metrics.py

      - name: Capture both Pi ROS2 runtime graphs
        shell: bash
        env:
          SSHPASS: ${{ secrets.ROBOT_SSH_PASS || format('{0}{1}', 'o', 'pen') }}
        run: |
          set -euo pipefail
          capture() {
            local host="$1"
            local container="$2"
            local output="$3"
            local args=(--output "$output"
                        --remote-host "$host"
                        --remote-user "${{ inputs.runtime_user }}"
                        --remote-container "$container")
            if [ -n "${{ inputs.runtime_topics }}" ]; then
              args+=(--topics "${{ inputs.runtime_topics }}")
            fi
            python tools/architecture_runtime_snapshot.py "${args[@]}"
          }
          capture "${{ inputs.main_host }}" "${{ inputs.main_container }}" architecture/runtime-main.json
          capture "${{ inputs.vision_host }}" "${{ inputs.vision_container }}" architecture/runtime-vision.json

          python - <<'PY'
          import json
          from pathlib import Path

          main = json.loads(Path("architecture/runtime-main.json").read_text())
          vision = json.loads(Path("architecture/runtime-vision.json").read_text())

          def union_lines(*snapshots, key):
              out = []
              seen = set()
              for snapshot in snapshots:
                  for value in snapshot.get(key, []):
                      if value not in seen:
                          seen.add(value)
                          out.append(value)
              return sorted(out)

          topic_info = {}
          for snapshot in (main, vision):
              for topic, info in snapshot.get("topic_info", {}).items():
                  if topic not in topic_info:
                      topic_info[topic] = info
                      continue
                  merged = topic_info[topic]
                  for field in ("publishers", "subscribers"):
                      existing = {(x.get("node"), x.get("namespace")) for x in merged.get(field, [])}
                      for endpoint in info.get(field, []):
                          key = (endpoint.get("node"), endpoint.get("namespace"))
                          if key not in existing:
                              merged.setdefault(field, []).append(endpoint)
                  merged["present"] = bool(merged.get("present") or info.get("present"))

          merged = {
              "schema_version": 4,
              "captured_at_unix": max(main.get("captured_at_unix", 0), vision.get("captured_at_unix", 0)),
              "captured_from": "remote:MainPi+VisionPi",
              "ros_domain_id": main.get("ros_domain_id") or vision.get("ros_domain_id"),
              "rmw_implementation": main.get("rmw_implementation") or vision.get("rmw_implementation"),
              "nodes": union_lines(main, vision, key="nodes"),
              "topics": union_lines(main, vision, key="topics"),
              "services": union_lines(main, vision, key="services"),
              "actions": union_lines(main, vision, key="actions"),
              "topic_info": topic_info,
              "captures": [
                  {"host": "${{ inputs.main_host }}", "pi": "Main Pi", "container": "${{ inputs.main_container }}", "snapshot": "runtime-main.json"},
                  {"host": "${{ inputs.vision_host }}", "pi": "Vision Pi", "container": "${{ inputs.vision_container }}", "snapshot": "runtime-vision.json"}
              ]
          }
          Path("architecture/runtime.json").write_text(json.dumps(merged, ensure_ascii=False, indent=2) + "\n")
          print(json.dumps({
              "main_nodes": len(main.get("nodes", [])),
              "vision_nodes": len(vision.get("nodes", [])),
              "union_nodes": len(merged["nodes"]),
              "union_topics": len(merged["topics"])
          }, ensure_ascii=False, sort_keys=True))
          PY

      - name: Compare static and runtime
        run: python tools/architecture_runtime_diff.py architecture/inventory.json architecture/runtime.json

      - name: Render runtime architecture graph
        run: |
          python tools/architecture_runtime_graph.py \
            --runtime architecture/runtime.json \
            --inventory architecture/inventory.json \
            --repo-root . \
            --output-dir architecture

      - name: Upload local architecture evidence
        uses: actions/upload-artifact@v4
        with:
          name: architecture-local-runtime
          path: |
            architecture/inventory.json
            architecture/inventory.md
            architecture/findings.json
            architecture/findings.md
            architecture/node-catalog.md
            architecture/topic-catalog.md
            architecture/class-metrics.json
            architecture/class-metrics.md
            architecture/runtime.json
            architecture/runtime-main.json
            architecture/runtime-vision.json
            architecture/runtime-diff.json
            architecture/runtime-diff.md
            architecture/runtime-overview.mmd
            architecture/runtime-graph.mmd
            architecture/runtime-graph.md

      - name: Publish runtime summary
        run: |
          {
            echo "## Robot runtime ROS2 graph"
            python -c 'import json; d=json.load(open("architecture/runtime.json")); print("- Source: " + str(d.get("captured_from"))); print("- Nodes (union): " + str(len(d.get("nodes", [])))); [print("- " + c["pi"] + ": " + c["host"] + " / " + c["container"]) for c in d.get("captures", [])]; print("- Topics: " + str(len(d.get("topics", [])))); print("- Services: " + str(len(d.get("services", [])))); print("- Actions: " + str(len(d.get("actions", []))))'
            echo
            cat architecture/runtime-diff.md
          } >> "$GITHUB_STEP_SUMMARY"

          # Container map + one collapsible diagram per container + placement
          # evidence (tools/architecture_runtime_graph.py).
          {
            echo
            cat architecture/runtime-graph.md
          } >> "$GITHUB_STEP_SUMMARY"
