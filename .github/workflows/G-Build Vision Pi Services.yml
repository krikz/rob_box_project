name: "G: Build Vision Pi Services"

# Собираем сервисы Vision Pi
on:
  push:
    branches:
      - develop        # Автосборка при пуше в develop
      - 'feature/**'   # Автосборка для feature веток (для тестирования)
      - 'feat/**'      # Автосборка для feat веток (сокращённый префикс)
      - 'copilot/**'   # Автосборка для copilot веток (AI-ассистированная разработка)
    paths:
      - 'docker/vision/**'
      - '.github/workflows/G-Build Vision Pi Services.yml'
  workflow_dispatch:  # Ручной запуск (вкладка Actions -> Build Vision Pi Services -> Run workflow)
  workflow_call:      # Вызов из других workflow (например, build-all.yml)

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/rob_box
  ROS_DISTRO: humble  # Изменить при переходе на другую версию ROS 2 (jazzy, kilted, и т.д.)
  # Локальный registry для self-hosted runners - НЕ ИСПОЛЬЗУЕТСЯ на GitHub cloud runners
  # LOCAL_BASE_REGISTRY устанавливается только в self-hosted jobs индивидуально
  LOCAL_BASE_REGISTRY: ""

jobs:
  # Определение тега Docker на основе ветки
  determine-tag:
    runs-on: ubuntu-latest
    outputs:
      docker_tag: ${{ steps.set-tag.outputs.docker_tag }}
      full_tag: ${{ steps.set-tag.outputs.full_tag }}
    steps:
      - name: Determine Docker tag
        id: set-tag
        run: |
          BRANCH_NAME="${GITHUB_REF#refs/heads/}"
          ROS_DISTRO="${{ env.ROS_DISTRO }}"

          # Определяем базовый тег на основе ветки
          if [ "$BRANCH_NAME" = "main" ]; then
            BRANCH_TAG="latest"
          elif [ "$BRANCH_NAME" = "develop" ]; then
            BRANCH_TAG="dev"
          elif [[ "$BRANCH_NAME" == feature/* ]] || [[ "$BRANCH_NAME" == feat/* ]]; then
            # Feature/feat ветки получают тег 'test'
            BRANCH_TAG="test"
          elif [[ "$BRANCH_NAME" == copilot/* ]]; then
            # Copilot ветки получают тег 'test' (аналогично feature веткам)
            BRANCH_TAG="test"
          elif [[ "$BRANCH_NAME" == release/* ]]; then
            VERSION="${BRANCH_NAME#release/}"
            BRANCH_TAG="rc-${VERSION}"
          elif [[ "$BRANCH_NAME" == hotfix/* ]]; then
            VERSION="${BRANCH_NAME#hotfix/}"
            BRANCH_TAG="hotfix-${VERSION}"
          else
            BRANCH_TAG="test"
          fi

          # Полный тег: ros_distro-branch_tag
          FULL_TAG="${ROS_DISTRO}-${BRANCH_TAG}"

          echo "docker_tag=${BRANCH_TAG}" >> "$GITHUB_OUTPUT"
          echo "full_tag=${FULL_TAG}" >> "$GITHUB_OUTPUT"
          echo "Branch: $BRANCH_NAME"
          echo "ROS Distro: $ROS_DISTRO"
          echo "Branch Tag: $BRANCH_TAG"
          echo "Full Tag: $FULL_TAG"
  # OAK-D Camera
  build-oak-d:
    needs: determine-tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU for multi-arch builds
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}
          tags: |
            type=raw,value=oak-d-${{ needs.determine-tag.outputs.full_tag }}
            type=raw,value=oak-d-${{ env.ROS_DISTRO }}-latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=oak-d-${{ env.ROS_DISTRO }}-

      - name: Build and push oak-d
        uses: docker/build-push-action@v5
        with:
          context: docker/vision
          file: docker/vision/oak-d/Dockerfile
          platforms: linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          build-args: |
            BASE_IMAGE=${{ env.LOCAL_BASE_REGISTRY || 'ghcr.io/krikz/rob_box_base' }}:depthai
          cache-to: type=gha,mode=max

  # LED Matrix System
  build-led-matrix:
    needs: determine-tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive  # Важно! ros2leds это submodule

      - name: Set up QEMU for multi-arch builds
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}
          tags: |
            type=raw,value=led-matrix-${{ needs.determine-tag.outputs.full_tag }}
            type=raw,value=led-matrix-${{ env.ROS_DISTRO }}-latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=led-matrix-${{ env.ROS_DISTRO }}-

      - name: Build and push led-matrix
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/vision/led_matrix/Dockerfile
          platforms: linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BASE_IMAGE=${{ env.LOCAL_BASE_REGISTRY || 'ghcr.io/krikz/rob_box_base' }}:ros2-zenoh
            ROS2LEDS_SHA=${{ hashFiles('src/ros2leds/**') }}

  # Ceiling Camera (USB UVC)
  build-ceiling-camera:
    needs: determine-tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU for multi-arch builds
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}
          tags: |
            type=raw,value=ceiling-camera-${{ needs.determine-tag.outputs.full_tag }}
            type=raw,value=ceiling-camera-${{ env.ROS_DISTRO }}-latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=ceiling-camera-${{ env.ROS_DISTRO }}-

      - name: Build and push ceiling-camera
        uses: docker/build-push-action@v5
        with:
          context: docker/vision
          file: docker/vision/ceiling-camera/Dockerfile
          platforms: linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Voice Assistant (ReSpeaker + Animations)
  build-voice-assistant:
    needs: determine-tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU for multi-arch builds
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}
          tags: |
            type=raw,value=voice-assistant-${{ needs.determine-tag.outputs.full_tag }}
            type=raw,value=voice-assistant-${{ env.ROS_DISTRO }}-latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=voice-assistant-${{ env.ROS_DISTRO }}-

      - name: Build and push voice-assistant
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/vision/voice_assistant/Dockerfile
          platforms: linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BASE_IMAGE=${{ env.LOCAL_BASE_REGISTRY || 'ghcr.io/krikz/rob_box_base' }}:ros2-zenoh

  # Telegram Bot (Operator interface via Telegram)
  build-telegram-bot:
    needs: determine-tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU for multi-arch builds
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}
          tags: |
            type=raw,value=telegram-bot-${{ needs.determine-tag.outputs.full_tag }}
            type=raw,value=telegram-bot-${{ env.ROS_DISTRO }}-latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=telegram-bot-${{ env.ROS_DISTRO }}-

      - name: Build and push telegram-bot
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/vision/telegram_bot/Dockerfile
          platforms: linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BASE_IMAGE=${{ env.LOCAL_BASE_REGISTRY || 'ghcr.io/krikz/rob_box_base' }}:ros2-zenoh

  # SuperCollider Server (for Renardo/FoxDot real-time music)
  build-supercollider:
    needs: determine-tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU for multi-arch builds
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}
          tags: |
            type=raw,value=supercollider-${{ needs.determine-tag.outputs.docker_tag }}
            type=raw,value=supercollider-latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=supercollider-

      - name: Build and push supercollider
        uses: docker/build-push-action@v5
        with:
          context: docker/vision/supercollider
          file: docker/vision/supercollider/Dockerfile
          platforms: linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  verify-build:
    runs-on: ubuntu-latest
    needs: [build-oak-d, build-led-matrix, build-ceiling-camera, build-voice-assistant, build-telegram-bot, build-supercollider]
    steps:
      - name: Verify all builds succeeded
        run: echo "✅ All Vision Pi services built successfully!"
