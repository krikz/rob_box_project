name: "L: Deploy and Verify"

# Автоматизированный деплой и проверка работоспособности робота на self-hosted runner
# Требует: self-hosted runner с доступом к локальной сети (10.1.1.x) и Raspberry Pi устройствам
# - Останавливает контейнеры на обоих Pi
# - Обновляет код из выбранной ветки
# - Подтягивает свежие образы
# - Запускает контейнеры
# - Проверяет логи и ROS2 топики
# - Создает issue при ошибках

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Целевое окружение'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging
          - test
          - local
      registry_source:
        description: 'Источник Docker образов'
        required: true
        default: 'github'
        type: choice
        options:
          - skip
          - github
          - local
      dry_run:
        description: 'Сухой прогон (без реального деплоя)'
        required: false
        default: false
        type: boolean

jobs:
  deploy-and-verify:
    # Всегда используем self-hosted runner, так как:
    # - Raspberry Pi устройства в локальной сети (10.1.1.x) недоступны из GitHub hosted runners
    # - Требуется SSH доступ к устройствам
    # - Локальный registry (10.1.1.249:5000) доступен только на self-hosted машине
    runs-on: [self-hosted, rob-box]
    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1
          clean: true

      - name: Setup SSH and Environment
        id: setup
        run: |
          echo "Setting up deployment environment..."

          # Настройка переменных окружения
          case "${{ inputs.environment }}" in
            production)
              echo "IMAGE_TAG=latest" >> $GITHUB_ENV
              echo "vision_pi_ip=10.1.1.11" >> $GITHUB_ENV
              echo "main_pi_ip=10.1.1.10" >> $GITHUB_ENV
              ;;
            staging)
              echo "IMAGE_TAG=dev" >> $GITHUB_ENV
              echo "vision_pi_ip=10.1.1.11" >> $GITHUB_ENV
              echo "main_pi_ip=10.1.1.10" >> $GITHUB_ENV
              ;;
            test)
              echo "IMAGE_TAG=test" >> $GITHUB_ENV
              echo "vision_pi_ip=10.1.1.11" >> $GITHUB_ENV
              echo "main_pi_ip=10.1.1.10" >> $GITHUB_ENV
              ;;
            local)
              echo "IMAGE_TAG=local" >> $GITHUB_ENV
              echo "vision_pi_ip=10.1.1.11" >> $GITHUB_ENV
              echo "main_pi_ip=10.1.1.10" >> $GITHUB_ENV
              ;;
          esac

          # Настройка источника образов
          case "${{ inputs.registry_source }}" in
            github)
              echo "SERVICE_IMAGE_PREFIX=ghcr.io/krikz/rob_box" >> $GITHUB_ENV
              echo "registry_display=GitHub Container Registry (ghcr.io)" >> $GITHUB_ENV
              ;;
            local)
              echo "SERVICE_IMAGE_PREFIX=10.1.1.249:5000/krikz/rob_box" >> $GITHUB_ENV
              echo "registry_display=Local Build Machine Registry (10.1.1.249:5000)" >> $GITHUB_ENV
              ;;
            skip)
              echo "SERVICE_IMAGE_PREFIX=ghcr.io/krikz/rob_box" >> $GITHUB_ENV
              echo "registry_display=Skipping pull (using existing local images)" >> $GITHUB_ENV
              ;;
          esac

          echo "branch=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          echo "timestamp=$(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_OUTPUT

          echo "VISION_FINDINGS_FILE=${RUNNER_TEMP}/vision_deployment_findings.jsonl" >> $GITHUB_ENV
          echo "MAIN_FINDINGS_FILE=${RUNNER_TEMP}/main_deployment_findings.jsonl" >> $GITHUB_ENV
          : > "${RUNNER_TEMP}/vision_deployment_findings.jsonl"
          : > "${RUNNER_TEMP}/main_deployment_findings.jsonl"

          # SSH options: timeout protection against WiFi flakiness / Pi unresponsiveness
          # ConnectTimeout=10      — fail fast if Pi unreachable
          # ServerAliveInterval=5  — send keepalive every 5s to detect broken connections
          # ServerAliveCountMax=3  — drop after 3 missed keepalives (15s)
          echo "SSH_OPTS=-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=10 -o ServerAliveInterval=5 -o ServerAliveCountMax=3" >> $GITHUB_ENV

          # Установка sshpass для автоматической аутентификации
          sudo apt-get update -qq
          sudo apt-get install -y sshpass

      - name: Verify SSH Tools and Connectivity
        if: '!inputs.dry_run'
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🔍 Verifying SSH tools and connectivity..."
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""
          
          # Проверка наличия необходимых инструментов
          echo "1. Checking SSH tools availability..."
          TOOLS_OK=true
          
          if ! command -v ssh &> /dev/null; then
            echo "❌ ERROR: 'ssh' command not found in runner"
            echo "   The SSH client is not installed or not in PATH"
            TOOLS_OK=false
          else
            echo "✅ ssh: $(which ssh)"
            ssh -V 2>&1 | head -1
          fi
          
          if ! command -v sshpass &> /dev/null; then
            echo "❌ ERROR: 'sshpass' command not found in runner"
            echo "   sshpass was not installed correctly"
            TOOLS_OK=false
          else
            echo "✅ sshpass: $(which sshpass)"
          fi
          
          if [ "$TOOLS_OK" = false ]; then
            echo ""
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "❌ DEPLOYMENT FAILED: Missing required SSH tools"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo ""
            echo "Required packages are not available in the runner."
            echo "Please check the 'Setup SSH and Environment' step for installation errors."
            exit 1
          fi
          
          echo ""
          echo "2. Checking network connectivity..."
          
          # Проверка сетевой доступности хостов
          CONNECTIVITY_OK=true
          
          echo "Testing Vision Pi (${{ env.vision_pi_ip }})..."
          if ping -c 1 -W 2 ${{ env.vision_pi_ip }} &> /dev/null; then
            echo "✅ Vision Pi is reachable via ICMP"
          else
            echo "⚠️  Vision Pi is NOT reachable via ICMP (ping)"
            CONNECTIVITY_OK=false
          fi
          
          # Проверка доступности SSH порта
          if timeout 3 bash -c "</dev/tcp/${{ env.vision_pi_ip }}/22" 2>/dev/null; then
            echo "✅ Vision Pi SSH port (22) is open"
          else
            echo "❌ Vision Pi SSH port (22) is NOT accessible"
            CONNECTIVITY_OK=false
          fi
          
          echo ""
          echo "Testing Main Pi (${{ env.main_pi_ip }})..."
          if ping -c 1 -W 2 ${{ env.main_pi_ip }} &> /dev/null; then
            echo "✅ Main Pi is reachable via ICMP"
          else
            echo "⚠️  Main Pi is NOT reachable via ICMP (ping)"
            CONNECTIVITY_OK=false
          fi
          
          # Проверка доступности SSH порта
          if timeout 3 bash -c "</dev/tcp/${{ env.main_pi_ip }}/22" 2>/dev/null; then
            echo "✅ Main Pi SSH port (22) is open"
          else
            echo "❌ Main Pi SSH port (22) is NOT accessible"
            CONNECTIVITY_OK=false
          fi
          
          echo ""
          
          if [ "$CONNECTIVITY_OK" = false ]; then
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "❌ DEPLOYMENT FAILED: Target hosts unreachable"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo ""
            echo "The Raspberry Pi devices are not accessible from this runner."
            echo ""
            echo "Possible reasons:"
            echo "  • GitHub Actions runners cannot reach private network IPs (10.1.1.x)"
            echo "  • This workflow requires a self-hosted runner on the same network"
            echo "  • Devices may be powered off or network is down"
            echo "  • Firewall blocking connections"
            echo ""
            echo "Solutions:"
            echo "  1. Use a self-hosted GitHub Actions runner on the local network"
            echo "  2. Set up a VPN connection from GitHub runners to your network"
            echo "  3. Use SSH tunneling or a bastion host with public IP"
            echo ""
            echo "Target IPs:"
            echo "  • Vision Pi: ${{ env.vision_pi_ip }}"
            echo "  • Main Pi: ${{ env.main_pi_ip }}"
            echo ""
            exit 1
          fi
          
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "✅ All connectivity checks passed"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

      - name: Dry Run Notice
        if: inputs.dry_run
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🔍 DRY RUN MODE - No actual deployment"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""
          echo "Branch: ${{ github.ref_name }}"
          echo "Environment: ${{ inputs.environment }}"
          echo "Image Tag: ${{ env.IMAGE_TAG }}"
          echo "Registry: ${{ env.registry_display }}"
          echo "Vision Pi: ${{ env.vision_pi_ip }}"
          echo "Main Pi: ${{ env.main_pi_ip }}"
          echo ""

      # ==================== VISION PI DEPLOYMENT ====================

      - name: "[Vision Pi] Stop Containers"
        if: '!inputs.dry_run'
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🛑 Stopping Vision Pi containers..."
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

          sshpass -p 'open' ssh $SSH_OPTS ros2@${{ env.vision_pi_ip }} \
            'cd ~/rob_box_project/docker/vision && docker compose down --remove-orphans --timeout 20' \
            || echo "⚠️  Warning: Failed to stop containers (may not be running)"

      - name: "[Vision Pi] Update Code"
        if: '!inputs.dry_run'
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "📥 Updating Vision Pi code from branch: ${{ github.ref_name }}"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

          # Retry git operations (Pi WiFi to github.com can be flaky)
          # Use reset --hard because this is a robot deployment, not a dev workstation.
          # The branch may have been force-pushed (e.g. e2e test rounds reuse branches),
          # so git pull would fail on divergent histories.
          for attempt in 1 2 3; do
            sshpass -p 'open' ssh $SSH_OPTS ros2@${{ env.vision_pi_ip }} \
              "cd ~/rob_box_project && \
               git fetch origin && \
               git checkout ${{ github.ref_name }} && \
               git reset --hard origin/${{ github.ref_name }}" \
              && break
            echo "⚠️  Attempt $attempt failed, retrying in 5s..."
            sleep 5
          done

      - name: "[Vision Pi] Pull Docker Images"
        if: '!inputs.dry_run && inputs.registry_source != ''skip'''
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "📦 Pulling Docker images on Vision Pi..."
          echo "   Registry: ${{ env.registry_display }}"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

          sshpass -p 'open' ssh $SSH_OPTS ros2@${{ env.vision_pi_ip }} \
            "cd ~/rob_box_project/docker/vision && \
             export IMAGE_TAG=${{ env.IMAGE_TAG }} && \
             export SERVICE_IMAGE_PREFIX=${{ env.SERVICE_IMAGE_PREFIX }} && \
             if [ '${{ inputs.registry_source }}' != 'local' ] && [ -f .image-versions.${{ env.IMAGE_TAG }} ]; then set -a && . .image-versions.${{ env.IMAGE_TAG }} && set +a; fi && \
             docker compose pull --ignore-pull-failures" \
            || echo "⚠️  Warning: Some images may not be available"

      - name: "[Vision Pi] Start Containers"
        if: '!inputs.dry_run'
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🚀 Starting Vision Pi containers..."
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

          sshpass -p 'open' ssh $SSH_OPTS ros2@${{ env.vision_pi_ip }} \
            "cd ~/rob_box_project/docker/vision && \
             export IMAGE_TAG=${{ env.IMAGE_TAG }} && \
             export SERVICE_IMAGE_PREFIX=${{ env.SERVICE_IMAGE_PREFIX }} && \
             if [ '${{ inputs.registry_source }}' != 'local' ] && [ -f .image-versions.${{ env.IMAGE_TAG }} ]; then set -a && . .image-versions.${{ env.IMAGE_TAG }} && set +a; fi && \
             docker compose up -d --pull never"

      # ==================== MAIN PI DEPLOYMENT ====================

      - name: "[Main Pi] Stop Containers"
        if: '!inputs.dry_run'
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🛑 Stopping Main Pi containers..."
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

          sshpass -p 'open' ssh $SSH_OPTS ros2@${{ env.main_pi_ip }} \
            'cd ~/rob_box_project/docker/main && docker compose down --remove-orphans --timeout 20' \
            || echo "⚠️  Warning: Failed to stop containers (may not be running)"

      - name: "[Main Pi] Update Code"
        if: '!inputs.dry_run'
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "📥 Updating Main Pi code from branch: ${{ github.ref_name }}"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

          # Retry git operations (Pi WiFi to github.com can be flaky)
          # Use reset --hard because this is a robot deployment, not a dev workstation.
          # The branch may have been force-pushed (e.g. e2e test rounds reuse branches),
          # so git pull would fail on divergent histories.
          for attempt in 1 2 3; do
            sshpass -p 'open' ssh $SSH_OPTS ros2@${{ env.main_pi_ip }} \
              "cd ~/rob_box_project && \
               git fetch origin && \
               git checkout ${{ github.ref_name }} && \
               git reset --hard origin/${{ github.ref_name }}" \
              && break
            echo "⚠️  Attempt $attempt failed, retrying in 5s..."
            sleep 5
          done

      - name: "[Main Pi] Pull Docker Images"
        if: '!inputs.dry_run && inputs.registry_source != ''skip'''
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "📦 Pulling Docker images on Main Pi..."
          echo "   Registry: ${{ env.registry_display }}"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

          sshpass -p 'open' ssh $SSH_OPTS ros2@${{ env.main_pi_ip }} \
            "cd ~/rob_box_project/docker/main && \
             export IMAGE_TAG=${{ env.IMAGE_TAG }} && \
             export SERVICE_IMAGE_PREFIX=${{ env.SERVICE_IMAGE_PREFIX }} && \
             if [ '${{ inputs.registry_source }}' != 'local' ] && [ -f .image-versions.${{ env.IMAGE_TAG }} ]; then set -a && . .image-versions.${{ env.IMAGE_TAG }} && set +a; fi && \
             docker compose pull --ignore-pull-failures" \
            || echo "⚠️  Warning: Some images may not be available"

      - name: "[Main Pi] Start Containers"
        if: '!inputs.dry_run'
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🚀 Starting Main Pi containers..."
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

          sshpass -p 'open' ssh $SSH_OPTS ros2@${{ env.main_pi_ip }} \
            "cd ~/rob_box_project/docker/main && \
             export IMAGE_TAG=${{ env.IMAGE_TAG }} && \
             export SERVICE_IMAGE_PREFIX=${{ env.SERVICE_IMAGE_PREFIX }} && \
             if [ '${{ inputs.registry_source }}' != 'local' ] && [ -f .image-versions.${{ env.IMAGE_TAG }} ]; then set -a && . .image-versions.${{ env.IMAGE_TAG }} && set +a; fi && \
             docker compose up -d --pull never"

      # ==================== INITIALIZATION WAIT ====================

      - name: "Wait for Container Initialization"
        if: '!inputs.dry_run'
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "⏳ Waiting for containers to initialize..."
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          sleep 30
          echo "✅ Initialization wait complete"

      # ==================== POST-DEPLOY CLEANUP ====================

      - name: "[Vision Pi] Cleanup Docker Artifacts"
        if: '!inputs.dry_run'
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🧹 Cleaning up unused Docker artifacts on Vision Pi..."
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

          sshpass -p 'open' ssh $SSH_OPTS ros2@${{ env.vision_pi_ip }} \
            "docker system df && \
             docker image prune -af && \
             docker builder prune -af && \
             docker system df" \
            || echo "⚠️  Warning: Docker cleanup failed on Vision Pi"

      - name: "[Main Pi] Cleanup Docker Artifacts"
        if: '!inputs.dry_run'
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🧹 Cleaning up unused Docker artifacts on Main Pi..."
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

          sshpass -p 'open' ssh $SSH_OPTS ros2@${{ env.main_pi_ip }} \
            "docker system df && \
             docker image prune -af && \
             docker builder prune -af && \
             docker system df" \
            || echo "⚠️  Warning: Docker cleanup failed on Main Pi"

      # ==================== HEALTH CHECKS ====================

      - name: "[Vision Pi] Check Container Status"
        if: '!inputs.dry_run'
        id: vision_status
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🔍 Checking Vision Pi container status..."
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

          STATUS=$(sshpass -p 'open' ssh $SSH_OPTS ros2@${{ env.vision_pi_ip }} \
