            if [ ! -z "$CRITICAL" ]; then
              CRITICAL_COUNT=$((CRITICAL_COUNT + 1))
              CRITICAL_SAMPLE=$(printf "%s\n" "$CRITICAL" | sed '/^[[:space:]]*$/d' | head -1)
              echo "  ❌ CRITICAL errors found in $container"
              echo "=== $container CRITICAL ERRORS ===" >> $LOGS_FILE
              echo "$CRITICAL" >> $LOGS_FILE
