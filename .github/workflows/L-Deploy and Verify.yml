          # This is intentional and not a DRY violation.
          
          # Common patterns (used on both Pi)
          EXCLUDE_COMMON="Serial port /dev/ttyUSB0|Loki.*connection|entry too far behind"
          EXCLUDE_COMMON="$EXCLUDE_COMMON|could not inspect container|could not fetch logs"
          EXCLUDE_COMMON="$EXCLUDE_COMMON|Scouting delay elapsed|No such container"
          # Promtail connection errors when monitoring system is not available
          EXCLUDE_COMMON="$EXCLUDE_COMMON|error sending batch.*loki.*push|Post.*loki.*push"
          EXCLUDE_COMMON="$EXCLUDE_COMMON|context deadline exceeded|dial tcp.*3100.*no route to host"
          
