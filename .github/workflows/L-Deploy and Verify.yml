                >> "$MAIN_FINDINGS_FILE"
            fi
          fi

      # ==================== ISSUE CREATION (DISABLED: creates too many duplicates) ====================
      # To re-enable, remove 'if: false' and restore the original condition below

      - name: "Analyze Results and Create Issue"
        if: false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🚨 Issues detected, checking for new deployment problems..."
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

          CANDIDATES_FILE="${RUNNER_TEMP}/deployment_issue_candidates.json"
          OPEN_ISSUES_FILE="${RUNNER_TEMP}/open_deployment_issues.json"
          NEW_ISSUES_FILE="${RUNNER_TEMP}/new_deployment_issues.json"

          python3 .github/scripts/deployment_issue_dedup.py prepare \
            --findings-file "$VISION_FINDINGS_FILE" \
            --findings-file "$MAIN_FINDINGS_FILE" \
            --branch "${{ github.ref_name }}" \
            --workflow-run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --timestamp "${{ steps.setup.outputs.timestamp }}" \
            --vision-pi-ip "${{ env.vision_pi_ip }}" \
            --main-pi-ip "${{ env.main_pi_ip }}" \
            > "$CANDIDATES_FILE"

          gh issue list \
            --repo "${{ github.repository }}" \
            --state open \
            --label deployment \
            --limit 200 \
            --json number,title,body,url \
            > "$OPEN_ISSUES_FILE"

          python3 .github/scripts/deployment_issue_dedup.py filter \
            --candidates-file "$CANDIDATES_FILE" \
            --issues-file "$OPEN_ISSUES_FILE" \
            > "$NEW_ISSUES_FILE"

          TOTAL_FOUND=$(jq 'length' "$CANDIDATES_FILE")
          TOTAL_NEW=$(jq 'length' "$NEW_ISSUES_FILE")
          TOTAL_SKIPPED=$((TOTAL_FOUND - TOTAL_NEW))

          echo "Found deployment problems: $TOTAL_FOUND"
          echo "Skipped as existing duplicates: $TOTAL_SKIPPED"
          echo "New issues to create: $TOTAL_NEW"

          if [ "$TOTAL_NEW" -eq 0 ]; then
            echo "✅ No new deployment issues found; all problems already tracked"
            exit 0
          fi

          jq -c '.[]' "$NEW_ISSUES_FILE" | while read -r issue; do
            TITLE=$(echo "$issue" | jq -r '.title')
            ASSIGNEE=$(echo "$issue" | jq -r '.assignee')
            BODY_FILE=$(mktemp)
            echo "$issue" | jq -r '.body' > "$BODY_FILE"

            LABEL_ARGS=()
            while IFS= read -r label; do
              LABEL_ARGS+=(--label "$label")
            done < <(echo "$issue" | jq -r '.labels[]')

            gh issue create \
              --repo "${{ github.repository }}" \
              --title "$TITLE" \
              --body-file "$BODY_FILE" \
              --assignee "$ASSIGNEE" \
              "${LABEL_ARGS[@]}"

            rm -f "$BODY_FILE"
            echo "✅ Created issue: $TITLE"
          done

      # ==================== SUMMARY ====================

      - name: "Deployment Summary"
        id: deploy_summary
        if: always() && !inputs.dry_run
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "📊 DEPLOYMENT SUMMARY"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""
          echo "Branch: ${{ github.ref_name }}"
          echo "Environment: ${{ inputs.environment }}"
          echo "Image Tag: ${{ env.IMAGE_TAG }}"
          echo "Registry: ${{ env.registry_display }}"
          echo "Timestamp: ${{ steps.setup.outputs.timestamp }}"
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "Vision Pi (${{ env.vision_pi_ip }})"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "Containers Healthy: ${{ steps.vision_status.outputs.vision_healthy || 'unknown' }}"
          echo "Failed Containers: ${{ steps.vision_status.outputs.failed_count || '0' }}"
          echo "Critical Errors: ${{ steps.vision_logs.outputs.critical_count || '0' }}"
          echo "Warnings: ${{ steps.vision_logs.outputs.warning_count || '0' }}"
          echo "Topics Status: ${{ steps.vision_topics.outputs.topics_healthy || 'unknown' }}"
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "Main Pi (${{ env.main_pi_ip }})"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "Containers Healthy: ${{ steps.main_status.outputs.main_healthy || 'unknown' }}"
          echo "Failed Containers: ${{ steps.main_status.outputs.failed_count || '0' }}"
          echo "Critical Errors: ${{ steps.main_logs.outputs.critical_count || '0' }}"
          echo "Warnings: ${{ steps.main_logs.outputs.warning_count || '0' }}"
          echo "Topics Status: ${{ steps.main_topics.outputs.topics_healthy || 'unknown' }}"
          echo ""

          # Определяем общий статус
          # Ретро 22.08 #1522 (round-179 false-positive): если run был отменён
          # пользователем или job прервался до Check Container Status —
          # outputs vision_healthy/main_healthy пустые, и старое условие
          # ложно срабатывало на "❌ DEPLOYMENT COMPLETED WITH ISSUES" +
          # создавался deploy-issue. Теперь распознаём отменённый/прерванный run
          # явно: ни success, ни issues → отдельный статус "cancelled".
          if [ "${{ steps.wait_init.conclusion }}" = "cancelled" ] || \
             [ "${{ steps.wait_init.conclusion }}" = "skipped" ]; then
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "⚠️  DEPLOYMENT RUN CANCELLED OR SKIPPED"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "Run was cancelled by user or interrupted before health checks completed."
            echo "Container Status: ${{ steps.vision_status.outputs.vision_healthy || 'unknown' }} / ${{ steps.main_status.outputs.main_healthy || 'unknown' }}"
            echo "No deploy-issue will be created — this is not a deployment failure."
            echo "deploy_status=cancelled" >> "$GITHUB_OUTPUT"
          elif [ "${{ steps.vision_status.outputs.vision_healthy }}" == "true" ] && \
               [ "${{ steps.main_status.outputs.main_healthy }}" == "true" ] && \
               [ "${{ steps.vision_logs.outputs.critical_count || 0 }}" -eq 0 ] && \
               [ "${{ steps.main_logs.outputs.critical_count || 0 }}" -eq 0 ]; then
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "✅ DEPLOYMENT SUCCESSFUL"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "deploy_status=success" >> "$GITHUB_OUTPUT"
          else
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "❌ DEPLOYMENT COMPLETED WITH ISSUES"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "Check the logs above and created GitHub issue for details"
            echo "deploy_status=issues" >> "$GITHUB_OUTPUT"
          fi

      # ==================== ISSUE CREATION (retro 14.08 t_d01fe536 + 15.08 t_feca724c) ====================
      # Ретро 14.08 t_d01fe536: deploy round-109 упал на compose-конфликте
      # voice-resources-init ('DEPLOYMENT COMPLETED WITH ISSUES', Critical: 0 /
      # Failed Containers: 0) — issue НЕ создавался, потому что старый шаг
      # «Analyze Results and Create Issue» выше отключён (if: false, плодил
      # дубликаты) и срабатывал только на critical-findings из логов. Теперь
      # ЛЮБОЙ 'DEPLOYMENT COMPLETED WITH ISSUES' → один issue на (branch, env, день),
      # дедуп по маркеру в body.
      # Ретро 15.08 t_feca724c: issues создавались БЕЗ метки hermes → агентный
      # триаж их не видел, карточек не было, воркеры не обрабатывали (#1246/#1260
      # висели OPEN сутками). Теперь при создании проставляем hermes (триаж
      # превратит в kanban-карточку) + agent:devops (роль воркера — деплой-проблемы
      # это зона devops). deploy-sweep пропускает такие issue (нет
      # deploy-problem-сигнатуры) — они идут в триаж, а не в auto-close.

      - name: "🚨 Create Deployment Issue (any issues)"
        if: always() && !inputs.dry_run && steps.deploy_summary.outputs.deploy_status == 'issues'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🚨 Deployment completed with issues — creating GitHub issue..."
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

          BRANCH="${{ github.ref_name }}"
          ENV_NAME="${{ inputs.environment }}"
          TS="${{ steps.setup.outputs.timestamp }}"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          MARKER="deploy-fail:${BRANCH}:${ENV_NAME}:$(date -u +%Y-%m-%d)"

          # DoD (branch z-{agent}/deploy-verify-catch-restarting): issue должен
          # содержать имя контейнера, его State.Status и хвост логов, а не только
          # ссылку на run. vision_status_summary.txt/main_status_summary.txt
          # (из "[Vision/Main Pi] Check Container Status") и
          # vision_logs.txt/main_logs.txt (из "[Vision/Main Pi] Check Container
          # Logs") — файлы в рабочей директории джобы, живут между шагами одного
          # job на self-hosted runner (checkout --clean был только один раз в
          # начале job).
          DIAGNOSTICS_FILE="$(mktemp)"
          : > "$DIAGNOSTICS_FILE"
          for f in vision_status_summary.txt main_status_summary.txt; do
            if [ -s "$f" ]; then
              SCOPE_LABEL="Vision Pi"; [ "$f" = "main_status_summary.txt" ] && SCOPE_LABEL="Main Pi"
              {
                echo "### ${SCOPE_LABEL}: unhealthy/restart-looping containers"
                echo '```'
                cat "$f"
                echo '```'
                echo ''
              } >> "$DIAGNOSTICS_FILE"
            fi
          done
          for f in vision_logs.txt main_logs.txt; do
            if [ -s "$f" ]; then
              SCOPE_LABEL="Vision Pi"; [ "$f" = "main_logs.txt" ] && SCOPE_LABEL="Main Pi"
              {
                echo "### ${SCOPE_LABEL}: log tail (critical/warning findings)"
                echo '```'
                tail -c 4000 "$f"
                echo '```'
                echo ''
              } >> "$DIAGNOSTICS_FILE"
            fi
          done

          # Дедуп: открытый issue с тем же маркером уже есть → не плодим дубликат,
          # только комментируем новый run (ретро 14.08: старый шаг был отключён
          # именно из-за дубликатов).
          EXISTING="$(gh issue list --repo "${{ github.repository }}" --label deployment --state open --limit 200 --json number,body 2>/dev/null | jq --arg m "$MARKER" '[.[] | select(.body | contains($m))][0].number // empty' 2>/dev/null || true)"
          if [ -n "$EXISTING" ]; then
            echo "✅ Issue #${EXISTING} already tracks ${BRANCH}/${ENV_NAME} today — skip create, comment run"
            # Ретро 15.08 t_feca724c: старые deploy-issues (созданные до фикса)
            # не имеют hermes-метки → триаж их не видит. Догоняем метки здесь,
            # чтобы существующий issue тоже стал kanban-карточкой.
            gh issue edit "$EXISTING" --repo "${{ github.repository }}" --add-label hermes --add-label agent:devops >/dev/null 2>&1 || true
            COMMENT_FILE="$(mktemp)"
            {
              echo "Ещё один failing deploy run: $RUN_URL"
              echo ''
              cat "$DIAGNOSTICS_FILE"
            } > "$COMMENT_FILE"
            gh issue comment "$EXISTING" --repo "${{ github.repository }}" --body-file "$COMMENT_FILE" >/dev/null 2>&1 || true
            rm -f "$COMMENT_FILE" "$DIAGNOSTICS_FILE"
            exit 0
          fi

          BODY_FILE="$(mktemp)"
          {
            printf '%s\n' \
              '## 🚨 Deployment Completed With Issues' \
              '' \
              "<!-- deploy-signature: ${MARKER} -->" \
              '' \
              "**Branch:** \`${BRANCH}\`" \
              "**Environment:** \`${ENV_NAME}\`" \
              "**Timestamp:** ${TS}" \
              "**Workflow Run:** ${RUN_URL}" \
              '' \
              'Deployment completed with issues (non-success status). See details below and the workflow log.' \
              ''
            cat "$DIAGNOSTICS_FILE"
          } > "$BODY_FILE"
          rm -f "$DIAGNOSTICS_FILE"

          gh issue create \
            --repo "${{ github.repository }}" \
            --title "🚨 Deploy issues on ${BRANCH} (${ENV_NAME}) — $(date -u +%Y-%m-%d)" \
            --body-file "$BODY_FILE" \
            --label deployment \
            --label hermes \
            --label agent:devops \
            >/dev/null 2>&1 \
            && echo "✅ Created deployment issue for ${BRANCH} (${ENV_NAME}) [labels: deployment, hermes, agent:devops]" \
            || echo "⚠️  Failed to create deployment issue (may already exist)"
          rm -f "$BODY_FILE"

      - name: "Dry Run Summary"
        if: inputs.dry_run
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "✅ DRY RUN COMPLETED"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""
          echo "This was a dry run. No actual deployment was performed."
          echo "The workflow would have deployed:"
          echo "  Branch: ${{ github.ref_name }}"
          echo "  Environment: ${{ inputs.environment }}"
          echo "  Image Tag: ${{ env.IMAGE_TAG }}"
          echo "  Registry: ${{ env.registry_display }}"
          echo "  Vision Pi: ${{ env.vision_pi_ip }}"
          echo "  Main Pi: ${{ env.main_pi_ip }}"
          echo ""
          echo "To perform actual deployment, run without dry_run flag."
