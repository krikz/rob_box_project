          fi

      - name: "[Vision Pi] Check ROS2 Topics"
        if: '!inputs.dry_run'
        id: vision_topics
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "📡 Checking ROS2 topics on Vision Pi..."
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

          # Проверяем топики OAK-D камеры
          echo "Checking oak-d container topics..."
          TOPICS=$(sshpass -p 'open' ssh $SSH_OPTS ros2@${{ env.vision_pi_ip }} \
            "docker exec oak-d bash -c 'source /opt/ros/humble/setup.bash && ros2 topic list 2>/dev/null'" || echo "")

          if [ -z "$TOPICS" ]; then
            echo "❌ No topics found (ROS2 may not be initialized yet)"
            echo "topics_healthy=false" >> $GITHUB_OUTPUT
            jq -nc \
              --arg environment "${{ inputs.environment }}" \
              --arg scope "vision" \
              --arg container "oak-d" \
              --arg kind "topic_check" \
              --arg severity "critical" \
              --arg summary "No ROS2 topics found" \
              --arg raw_text "No ROS2 topics found in oak-d container" \
              '{environment:$environment, scope:$scope, container:$container, kind:$kind, severity:$severity, summary:$summary, raw_text:$raw_text}' \
              >> "$VISION_FINDINGS_FILE"
          else
            echo "Topics found:"
            echo "$TOPICS" | grep -E "(oak|camera|rgb|depth)" || echo "  (no camera topics)"

            # Проверяем наличие критически важных топиков
            # Примечание: OAK-D публикует в /camera/camera/color/* (ретро 12.08:
            # старое имя /camera/rgb/image_raw/compressed устарело — монитор
            # плодил ложные Warning-issues #953/#1046, камера работала).
            EXPECTED_TOPICS="/camera/camera/color/image_raw/compressed"
            MISSING_TOPICS=""

            for topic in $EXPECTED_TOPICS; do
              if ! echo "$TOPICS" | grep -q "$topic"; then
                MISSING_TOPICS="$MISSING_TOPICS $topic"
              fi
            done

            if [ ! -z "$MISSING_TOPICS" ]; then
              echo "⚠️  Missing expected topics:$MISSING_TOPICS"
              echo "topics_healthy=partial" >> $GITHUB_OUTPUT
