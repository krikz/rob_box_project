          # Promtail warnings about monitoring system
          EXCLUDE_WARN_COMMON="$EXCLUDE_WARN_COMMON|error sending batch.*loki|enable watchConfig"
          
          # Main Pi inherits from common + adds specific patterns
          EXCLUDE_WARN_MAIN="$EXCLUDE_WARN_COMMON|could not find a connection.*tree"
