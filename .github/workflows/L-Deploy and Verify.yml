            LOGS=$(printf "%s\n---[...SKIPPED MIDDLE LOGS...]---\n%s" "$LOGS_START" "$LOGS_END")

            # Проверяем на критические ошибки через helper c дедуп/false-positive правилами.
            CRITICAL=$(printf "%s\n" "$LOGS" | \
