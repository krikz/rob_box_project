name: "G: Validate Docker Compose"

# Автоматическая проверка Docker Compose конфигураций на соответствие стандартам
# Запускается при каждом PR или push в develop/main
on:
  push:
    branches:
      - develop
      - main
    paths:
      - 'docker/main/docker-compose.yaml'
      - 'docker/vision/docker-compose.yaml'
      - 'docker/sound/**'
      - 'docker/common/**'
      - 'docs/development/DOCKER_STANDARDS.md'
      - '.github/workflows/validate-docker-compose.yml'
  pull_request:
    branches:
      - develop
      - main
    paths:
      - 'docker/main/docker-compose.yaml'
      - 'docker/vision/docker-compose.yaml'
      - 'docker/sound/**'
      - 'docker/common/**'
      - 'docs/development/DOCKER_STANDARDS.md'
  workflow_dispatch:  # Ручной запуск

permissions:
  contents: read

jobs:
  # ADR-0159 (PR-2b): один job на три узла — матрица по каталогам docker/{main,vision,sound}
  # вместо копий job'а. Имя проверки (`Validate Main Pi Docker Compose` и т.д.)
  # осталось прежним для main/vision, чтобы не сломать required status checks.
  validate-compose:
    name: Validate ${{ matrix.title }} Docker Compose
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - pi: main
            title: Main Pi
          - pi: vision
            title: Vision Pi
          - pi: sound
            title: Sound Pi
    env:
      PI: ${{ matrix.pi }}
      COMPOSE_FILE_PATH: docker/${{ matrix.pi }}/docker-compose.yaml
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Validate YAML syntax (${{ matrix.title }})
        run: |
          echo "📋 Проверка синтаксиса YAML для $PI..."
          docker run --rm -v "$PWD:/workspace" -w /workspace -e COMPOSE_FILE_PATH alpine sh -c '
            apk add --no-cache python3 py3-yaml
            python3 -c "import os, yaml; yaml.safe_load(open(os.environ[\"COMPOSE_FILE_PATH\"]))"
          '
          echo "✅ Синтаксис YAML корректен"

      - name: Check Docker Compose validity (${{ matrix.title }})
        run: |
          echo "🔍 Проверка валидности Docker Compose для $PI..."
          cd "docker/$PI"
          # Create dummy .env.secrets file if it doesn't exist
          touch .env.secrets
          docker compose config > /dev/null
          echo "✅ Docker Compose конфигурация валидна"
          # Sound Pi: sensor-bridge живёт под profile `sensors` (ADR-0159 §2.4) —
          # без явного профиля `config` его не проверяет, поэтому проверяем отдельно.
          if [ "$PI" = "sound" ]; then
            docker compose --profile sensors --profile monitoring config > /dev/null
            echo "✅ profiles sensors + monitoring тоже валидны"
          fi

      - name: Validate standards compliance (${{ matrix.title }})
        run: |
          echo "📏 Проверка соответствия стандартам для $PI..."

          # Проверка network_mode: host
          if ! grep -q "network_mode: host" "$COMPOSE_FILE_PATH"; then
            echo "❌ Ошибка: не найден 'network_mode: host'"
            exit 1
          fi
          echo "✅ network_mode: host присутствует"

          # Проверка restart: unless-stopped
          if ! grep -q "restart: unless-stopped" "$COMPOSE_FILE_PATH"; then
            echo "❌ Ошибка: не найден 'restart: unless-stopped'"
            exit 1
          fi
          echo "✅ restart: unless-stopped присутствует"

          # Проверка стандартных environment переменных
          for var in ROS_DOMAIN_ID RMW_IMPLEMENTATION ZENOH_CONFIG ROS_AUTOMATIC_DISCOVERY_RANGE; do
            if ! grep -q "$var" "$COMPOSE_FILE_PATH"; then
              echo "⚠️  Предупреждение: переменная $var не найдена"
            fi
          done
          echo "✅ Основные environment переменные проверены"

          # Проверка правильной структуры volumes (новая архитектура)
          # Должно быть: ./config:/config/shared и ./config/{service}:/config/{service}
          # НЕ должно быть: ./{service}/config:/config/{service} (старая структура)
          if grep -q "\\./.*/config:/config/" "$COMPOSE_FILE_PATH"; then
            echo "❌ Ошибка: найдена старая структура volumes (./{service}/config:/config/)"
            echo "   Должно быть: ./config/{service}:/config/{service}"
            exit 1
          fi
          echo "✅ Структура volumes соответствует стандарту"

          # Проверка что используется ./config:/config/shared
          if ! grep -q "./config:/config/shared" "$COMPOSE_FILE_PATH"; then
            echo "⚠️  Предупреждение: не найден маунт ./config:/config/shared"
          fi

          # Проверка правильной структуры скриптов (новая архитектура)
          # Должно быть: ./scripts/{service}:/scripts
          # НЕ должно быть: ./{service}/scripts:/scripts (старая структура)
          if grep -q "\\./.*/scripts:/scripts" "$COMPOSE_FILE_PATH"; then
            echo "❌ Ошибка: найдена старая структура volumes (./{service}/scripts:/scripts)"
            echo "   Должно быть: ./scripts/{service}:/scripts"
            exit 1
          fi
          echo "✅ Структура скриптов соответствует стандарту"

          # Проверка что нет монтирования src папки (только Main Pi проверял это раньше;
          # правило общее — код должен быть в образе)
          if grep -q "src:/workspace/src" "$COMPOSE_FILE_PATH"; then
            echo "❌ Ошибка: найдено монтирование src папки (должно быть в образе)"
            exit 1
          fi
          echo "✅ Нет монтирования src папки"

          # Проверки, специфичные для oak-d (только Vision Pi)
          if [ "$PI" = "vision" ]; then
            if ! grep -A 10 "oak-d:" "$COMPOSE_FILE_PATH" | grep -q "mem_limit:"; then
              echo "⚠️  Предупреждение: не найден mem_limit для oak-d"
            else
              echo "✅ Memory limits для oak-d настроены"
            fi

            if ! grep -A 15 "oak-d:" "$COMPOSE_FILE_PATH" | grep -q "LD_LIBRARY_PATH"; then
              echo "⚠️  Предупреждение: не найден LD_LIBRARY_PATH в oak-d"
            else
              echo "✅ LD_LIBRARY_PATH в oak-d настроен"
            fi
          fi

  validate-structure:
    name: Validate Project Structure
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Check required files
        run: |
          echo "📂 Проверка структуры проекта..."

          # Проверка наличия обязательных файлов
          required_files=(
            "docs/development/DOCKER_STANDARDS.md"
            "docs/development/AGENT_GUIDE.md"
            "docker/main/docker-compose.yaml"
            "docker/vision/docker-compose.yaml"
            # ADR-0159 PR-2b: третий узел
            "docker/sound/docker-compose.yaml"
            "docker/sound/config/wake_words.yaml"
            "docker/sound/config/audio/asound.conf"
            "docker/sound/scripts/voice_assistant/start_voice_assistant.sh"
            "docker/sound/scripts/supercollider/start_supercollider.sh"
            # ADR-0159 В4 (PR-2a): общие для всех Pi шаблоны и скрипты Zenoh
            "docker/common/config/zenoh_router_config.json5"
            "docker/common/config/zenoh_session_config.json5"
            "docker/common/scripts/ros_with_namespace.sh"
            "docker/common/scripts/zenoh-router/start_zenoh_router.sh"
          )

          for file in "${required_files[@]}"; do
            if [ ! -f "$file" ]; then
              echo "❌ Отсутствует обязательный файл: $file"
              exit 1
            fi
            echo "✅ $file"
          done

          echo ""
          echo "✅ Все обязательные файлы присутствуют"

      - name: Check service directories structure
        run: |
          echo "📁 Проверка структуры директорий сервисов..."

          # Каталоги сборки сервисов: <pi>/<каталог>. zenoh-router — образ
          # eclipse/zenoh из compose, своего Dockerfile нет (ADR-0159 PR-2a);
          # apriltag удалён (интегрирован в oak-d). Голосовой стек и supervisor
          # собираются для Sound Pi из docker/sound (ADR-0159 PR-3). Полную
          # сверку всех Dockerfile манифеста с диском делает
          # tests/unit/test_workflow_refactor_acceptance.py.
          for dir in \
              main/robot_state_publisher main/rtabmap main/lslidar main/perception \
              vision/oak-d \
              sound/voice_base sound/voice_assistant sound/supercollider sound/supervisor; do
            if [ ! -d "docker/$dir" ]; then
              echo "❌ Отсутствует директория сервиса: docker/$dir"
              exit 1
            fi
            if [ ! -f "docker/$dir/Dockerfile" ]; then
              echo "❌ Отсутствует Dockerfile в: docker/$dir"
              exit 1
            fi
            echo "✅ docker/$dir"
          done

          echo ""
          echo "✅ Структура директорий сервисов корректна"

  summary:
    name: Validation Summary
    runs-on: ubuntu-latest
    needs: [validate-compose, validate-structure]
    if: always()
    steps:
      - name: Check validation results
        run: |
          echo "📊 Итоги валидации Docker Compose конфигураций:"
          echo ""
          echo "Compose (main/vision/sound): ${{ needs.validate-compose.result }}"
          echo "Structure: ${{ needs.validate-structure.result }}"
          echo ""

          if [[ "${{ needs.validate-compose.result }}" == "success" ]] && \
             [[ "${{ needs.validate-structure.result }}" == "success" ]]; then
            echo "✅ Все проверки пройдены успешно!"
            echo "🎉 Docker Compose конфигурации соответствуют стандартам проекта"
          else
            echo "❌ Некоторые проверки провалились. См. детали выше."
            exit 1
          fi
