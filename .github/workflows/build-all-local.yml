name: Build All Services (Self-Hosted)

# Полная локальная сборка всех сервисов на self-hosted runner
# Включает базовые образы + Main Pi + Vision Pi сервисы
on:
  workflow_dispatch:  # Ручной запуск
    inputs:
      build_base_images:
        description: 'Build base images first'
        required: false
        default: 'false'
        type: boolean
      push_to_registry:
        description: 'Push to local registry (localhost:5000)'
        required: false
        default: 'true'
        type: boolean
      main_services:
        description: 'Main Pi services (comma-separated or "all")'
        required: false
        default: 'all'
        type: string
      vision_services:
        description: 'Vision Pi services (comma-separated or "all")'
        required: false
        default: 'all'
        type: string

env:
  LOCAL_REGISTRY: localhost:5000
  LOCAL_PREFIX: localhost:5000/krikz/rob_box
  ROS_DISTRO: humble

jobs:
  # Определение конфигурации сборки
  prepare:
    runs-on: self-hosted
    outputs:
      docker_tag: ${{ steps.config.outputs.docker_tag }}
      build_base: ${{ steps.config.outputs.build_base }}
      push_local: ${{ steps.config.outputs.push_local }}
      main_services: ${{ steps.config.outputs.main_services }}
      vision_services: ${{ steps.config.outputs.vision_services }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set build configuration
        id: config
        run: |
          # Определяем тег
          BRANCH_NAME="${GITHUB_REF#refs/heads/}"
          if [ "$BRANCH_NAME" = "main" ]; then
            DOCKER_TAG="latest"
          elif [ "$BRANCH_NAME" = "develop" ]; then
            DOCKER_TAG="dev"
          else
            DOCKER_TAG="local"
          fi
          
          echo "docker_tag=${DOCKER_TAG}" >> $GITHUB_OUTPUT
          echo "build_base=${{ github.event.inputs.build_base_images }}" >> $GITHUB_OUTPUT
          echo "push_local=${{ github.event.inputs.push_to_registry }}" >> $GITHUB_OUTPUT
          
          # Main Pi сервисы
          MAIN_INPUT="${{ github.event.inputs.main_services }}"
          if [ -z "$MAIN_INPUT" ] || [ "$MAIN_INPUT" = "all" ]; then
            MAIN_SERVICES="rtabmap,robot-state-publisher,lslidar,perception"
          else
            MAIN_SERVICES="$MAIN_INPUT"
          fi
          echo "main_services=${MAIN_SERVICES}" >> $GITHUB_OUTPUT
          
          # Vision Pi сервисы
          VISION_INPUT="${{ github.event.inputs.vision_services }}"
          if [ -z "$VISION_INPUT" ] || [ "$VISION_INPUT" = "all" ]; then
            VISION_SERVICES="oak-d,apriltag,voice-assistant"
          else
            VISION_SERVICES="$VISION_INPUT"
          fi
          echo "vision_services=${VISION_SERVICES}" >> $GITHUB_OUTPUT
          
          echo "🔧 Build Configuration:"
          echo "  Branch: $BRANCH_NAME"
          echo "  Docker Tag: $DOCKER_TAG"
          echo "  Build Base Images: ${{ github.event.inputs.build_base_images }}"
          echo "  Push to Local Registry: ${{ github.event.inputs.push_to_registry }}"
          echo "  Main Services: $MAIN_SERVICES"
          echo "  Vision Services: $VISION_SERVICES"

  # Сборка базовых образов (опционально)
  build-base-images:
    needs: prepare
    runs-on: self-hosted
    if: needs.prepare.outputs.build_base == 'true'
    strategy:
      matrix:
        base_image: [ros2-zenoh, rtabmap, depthai, pcl]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build base image ${{ matrix.base_image }}
        run: |
          BASE_IMAGE="${{ matrix.base_image }}"
          DOCKER_TAG="${{ needs.prepare.outputs.docker_tag }}"
          
          # Теги
          GHCR_TAG="ghcr.io/${{ github.repository_owner }}/rob_box_base:${BASE_IMAGE}-${DOCKER_TAG}"
          LOCAL_TAG="${{ env.LOCAL_PREFIX }}_base:${BASE_IMAGE}-${DOCKER_TAG}"
          
          echo "Building base image: $BASE_IMAGE"
          echo "GHCR Tag: $GHCR_TAG"
          echo "Local Tag: $LOCAL_TAG"
          
          # Сборка
          docker buildx build \
            --platform linux/arm64 \
            --context docker/base \
            --file docker/base/Dockerfile.${BASE_IMAGE} \
            --tag "${GHCR_TAG}" \
            --tag "${LOCAL_TAG}" \
            --load \
            --build-arg="APT_PROXY=http://host.docker.internal:3142" \
            .
          
          # Push в локальный registry
          if [ "${{ needs.prepare.outputs.push_local }}" = "true" ]; then
            docker push "$LOCAL_TAG"
            echo "✅ Pushed $BASE_IMAGE to local registry"
          fi

  # Сборка Main Pi сервисов
  build-main-services:
    needs: [prepare, build-base-images]
    runs-on: self-hosted
    if: always() && (needs.build-base-images.result == 'success' || needs.build-base-images.result == 'skipped')
    strategy:
      matrix:
        service: ${{ fromJson(format('[{0}]', join(split(needs.prepare.outputs.main_services, ','), '","'))) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Main Pi service ${{ matrix.service }}
        run: |
          SERVICE="${{ matrix.service }}"
          DOCKER_TAG="${{ needs.prepare.outputs.docker_tag }}"
          
          # Проверяем что сервис существует
          if [ ! -d "docker/main/${SERVICE}" ]; then
            echo "⚠️ Service docker/main/${SERVICE} not found, skipping..."
            exit 0
          fi
          
          # Теги
          GHCR_TAG="ghcr.io/${{ github.repository_owner }}/rob_box:${SERVICE}-${{ env.ROS_DISTRO }}-${DOCKER_TAG}"
          LOCAL_TAG="${{ env.LOCAL_PREFIX }}:${SERVICE}-${{ env.ROS_DISTRO }}-${DOCKER_TAG}"
          
          echo "🔨 Building Main Pi service: $SERVICE"
          
          # Сборка
          docker buildx build \
            --platform linux/arm64 \
            --context docker/main \
            --file docker/main/${SERVICE}/Dockerfile \
            --tag "${GHCR_TAG}" \
            --tag "${LOCAL_TAG}" \
            --load \
            --build-arg="BASE_IMAGE=ghcr.io/${{ github.repository_owner }}/rob_box_base:ros2-zenoh" \
            --build-arg="APT_PROXY=http://host.docker.internal:3142" \
            .
          
          # Push в локальный registry
          if [ "${{ needs.prepare.outputs.push_local }}" = "true" ]; then
            docker push "$LOCAL_TAG"
            echo "✅ Pushed $SERVICE to local registry"
          fi

  # Сборка Vision Pi сервисов
  build-vision-services:
    needs: [prepare, build-base-images]
    runs-on: self-hosted
    if: always() && (needs.build-base-images.result == 'success' || needs.build-base-images.result == 'skipped')
    strategy:
      matrix:
        service: ${{ fromJson(format('[{0}]', join(split(needs.prepare.outputs.vision_services, ','), '","'))) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Vision Pi service ${{ matrix.service }}
        run: |
          SERVICE="${{ matrix.service }}"
          DOCKER_TAG="${{ needs.prepare.outputs.docker_tag }}"
          
          # Проверяем что сервис существует
          if [ ! -d "docker/vision/${SERVICE}" ]; then
            echo "⚠️ Service docker/vision/${SERVICE} not found, skipping..."
            exit 0
          fi
          
          # Определяем базовый образ
          case "$SERVICE" in
            "oak-d"|"apriltag")
              BASE_IMAGE="ghcr.io/${{ github.repository_owner }}/rob_box_base:depthai"
              ;;
            "lslidar")
              BASE_IMAGE="ghcr.io/${{ github.repository_owner }}/rob_box_base:pcl"
              ;;
            *)
              BASE_IMAGE="ghcr.io/${{ github.repository_owner }}/rob_box_base:ros2-zenoh"
              ;;
          esac
          
          # Теги
          GHCR_TAG="ghcr.io/${{ github.repository_owner }}/rob_box:${SERVICE}-${{ env.ROS_DISTRO }}-${DOCKER_TAG}"
          LOCAL_TAG="${{ env.LOCAL_PREFIX }}:${SERVICE}-${{ env.ROS_DISTRO }}-${DOCKER_TAG}"
          
          echo "🎥 Building Vision Pi service: $SERVICE"
          echo "Base Image: $BASE_IMAGE"
          
          # Сборка
          docker buildx build \
            --platform linux/arm64 \
            --context docker/vision \
            --file docker/vision/${SERVICE}/Dockerfile \
            --tag "${GHCR_TAG}" \
            --tag "${LOCAL_TAG}" \
            --load \
            --build-arg="BASE_IMAGE=${BASE_IMAGE}" \
            --build-arg="APT_PROXY=http://host.docker.internal:3142" \
            .
          
          # Push в локальный registry
          if [ "${{ needs.prepare.outputs.push_local }}" = "true" ]; then
            docker push "$LOCAL_TAG"
            echo "✅ Pushed $SERVICE to local registry"
          fi

  # Итоговая сводка
  summary:
    needs: [prepare, build-base-images, build-main-services, build-vision-services]
    runs-on: self-hosted
    if: always()
    steps:
      - name: Build Summary
        run: |
          echo "🎉 Complete Local Build Finished!"
          echo ""
          echo "📊 Build Configuration:"
          echo "  Docker Tag: ${{ needs.prepare.outputs.docker_tag }}"
          echo "  Base Images: ${{ needs.prepare.outputs.build_base }}"
          echo "  Local Registry: ${{ needs.prepare.outputs.push_local }}"
          echo "  Main Services: ${{ needs.prepare.outputs.main_services }}"
          echo "  Vision Services: ${{ needs.prepare.outputs.vision_services }}"
          echo ""
          echo "🏗️ Build Results:"
          echo "  Base Images: ${{ needs.build-base-images.result }}"
          echo "  Main Services: ${{ needs.build-main-services.result }}"
          echo "  Vision Services: ${{ needs.build-vision-services.result }}"
          echo ""
          echo "🚀 Next Steps:"
          echo "  1. Images are available in local registry: localhost:5000"
          echo "  2. Update Raspberry Pi docker-compose.yaml to use local images"
          echo "  3. Pull images on Raspberry Pi: docker-compose pull"
          echo ""
          echo "📱 Usage on Raspberry Pi:"
          echo "  # Main Pi"
          echo "  export IMAGE_TAG=${{ needs.prepare.outputs.docker_tag }}"
          echo "  export REGISTRY_PREFIX=10.1.1.5:5000/krikz/rob_box"
          echo "  docker-compose pull && docker-compose up -d"
          echo ""
          echo "  # Vision Pi"
          echo "  export IMAGE_TAG=${{ needs.prepare.outputs.docker_tag }}"
          echo "  export REGISTRY_PREFIX=10.1.1.5:5000/krikz/rob_box"
          echo "  docker-compose pull && docker-compose up -d"

      - name: Local Registry Contents
        if: needs.prepare.outputs.push_local == 'true'
        run: |
          echo ""
          echo "📦 Local Registry Contents:"
          curl -s http://localhost:5000/v2/_catalog | jq -r '.repositories[]' | head -20 | while read repo; do
            echo "  📁 $repo"
            curl -s "http://localhost:5000/v2/$repo/tags/list" | jq -r '.tags[]?' | head -5 | while read tag; do
              echo "    🏷️ $tag"
            done
          done