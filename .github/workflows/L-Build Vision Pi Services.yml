name: "L: Build Vision Pi Services"

# Локальная сборка сервисов Vision Pi на self-hosted runner
# Все сервисы собираются параллельно (до 8 одновременно)
on:
  workflow_dispatch:  # Ручной запуск
    inputs:
      push_to_registry:
        description: 'Push to local registry (localhost:5000)'
        required: false
        default: true
        type: boolean
  workflow_call:  # Вызов из других workflow
    inputs:
      push_to_registry:
        description: 'Push to local registry'
        required: false
        default: true
        type: boolean

permissions:
  contents: write  # Required for git push of .image-versions files

env:
  LOCAL_REGISTRY: localhost:5000
  GHCR_REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/krikz/rob_box
  LOCAL_PREFIX: localhost:5000/krikz/rob_box
  ROS_DISTRO: humble

jobs:
  # Определение тега
  prepare:
    runs-on: self-hosted
    outputs:
      docker_tag: ${{ steps.set-config.outputs.docker_tag }}
    steps:
      - name: Set build configuration
        id: set-config
        run: |
          # 🔴 FIX (06.08): для refs/tags/* используем DOCKER_TAG=latest
          # (release builds на тегах должны отслеживаться через .image-versions.latest).
          # Раньше refs/tags/* попадал в else → DOCKER_TAG=local → "file not found" warning.
          REF_NAME="${GITHUB_REF#refs/}"
          if [[ "$REF_NAME" == tags/v* ]]; then
            DOCKER_TAG="latest"
          elif [ "${REF_NAME#heads/}" = "main" ]; then
            DOCKER_TAG="latest"
          elif [ "${REF_NAME#heads/}" = "develop" ]; then
            DOCKER_TAG="dev"
          elif [[ "${REF_NAME#heads/}" == feature/* ]] || [[ "${REF_NAME#heads/}" == feat/* ]] || [[ "${REF_NAME#heads/}" == copilot/* ]]; then
            DOCKER_TAG="test"
          else
            DOCKER_TAG="local"
          fi
          echo "docker_tag=${DOCKER_TAG}" >> $GITHUB_OUTPUT
          echo "Docker Tag: $DOCKER_TAG (ref: $GITHUB_REF)"

  # Параллельная сборка всех сервисов Vision Pi (до 8 одновременно)
  build-oak-d:
    needs: prepare
    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive
          clean: true

      - name: Build oak-d
        run: |
          SERVICE="oak-d"
          GHCR_TAG="${IMAGE_PREFIX}:${SERVICE}-${ROS_DISTRO}-${{ needs.prepare.outputs.docker_tag }}"
          LOCAL_TAG="${LOCAL_PREFIX}:${SERVICE}-${ROS_DISTRO}-${{ needs.prepare.outputs.docker_tag }}"

          docker buildx build \
            --platform linux/arm64 \
            --file docker/vision/${SERVICE}/Dockerfile \
            --tag "${GHCR_TAG}" \
            --tag "${LOCAL_TAG}" \
            --load \
            --add-host=host.docker.internal:host-gateway \
            --build-arg="BASE_IMAGE=localhost:5000/krikz/rob_box_base:depthai" \
            --build-arg="APT_PROXY=http://host.docker.internal:3142" \
            docker/vision

          if [ "${{ inputs.push_to_registry }}" = "true" ]; then
            docker push "${LOCAL_TAG}"
          fi
          echo "✅ Built ${SERVICE}"

  build-led-matrix:
    needs: prepare
    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive
          clean: true

      - name: Build led-matrix
        run: |
          SERVICE="led_matrix"
          GHCR_TAG="${IMAGE_PREFIX}:led-matrix-${ROS_DISTRO}-${{ needs.prepare.outputs.docker_tag }}"
          LOCAL_TAG="${LOCAL_PREFIX}:led-matrix-${ROS_DISTRO}-${{ needs.prepare.outputs.docker_tag }}"

          # Получаем SHA субмодуля ros2leds для инвалидации кэша
          ROS2LEDS_SHA=$(git submodule status src/ros2leds | awk '{print $1}' | sed 's/^[+-]//')

          docker buildx build \
            --platform linux/arm64 \
            --file docker/vision/${SERVICE}/Dockerfile \
            --tag "${GHCR_TAG}" \
            --tag "${LOCAL_TAG}" \
            --load \
            --add-host=host.docker.internal:host-gateway \
            --build-arg="BASE_IMAGE=localhost:5000/krikz/rob_box_base:ros2-zenoh" \
            --build-arg="APT_PROXY=http://host.docker.internal:3142" \
            --build-arg="ROS2LEDS_SHA=${ROS2LEDS_SHA}" \
            .

          if [ "${{ inputs.push_to_registry }}" = "true" ]; then
            docker push "${LOCAL_TAG}"
          fi
          echo "✅ Built ${SERVICE}"

  build-ceiling-camera:
    needs: prepare
    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive
          clean: true

      - name: Build ceiling-camera
        run: |
          SERVICE="ceiling-camera"
          GHCR_TAG="${IMAGE_PREFIX}:${SERVICE}-${ROS_DISTRO}-${{ needs.prepare.outputs.docker_tag }}"
          LOCAL_TAG="${LOCAL_PREFIX}:${SERVICE}-${ROS_DISTRO}-${{ needs.prepare.outputs.docker_tag }}"

          docker buildx build \
            --platform linux/arm64 \
            --file docker/vision/${SERVICE}/Dockerfile \
            --tag "${GHCR_TAG}" \
            --tag "${LOCAL_TAG}" \
            --load \
            --add-host=host.docker.internal:host-gateway \
            --build-arg="BASE_IMAGE=localhost:5000/krikz/rob_box_base:ros2-zenoh" \
            --build-arg="APT_PROXY=http://host.docker.internal:3142" \
            docker/vision

          if [ "${{ inputs.push_to_registry }}" = "true" ]; then
            docker push "${LOCAL_TAG}"
          fi
          echo "✅ Built ${SERVICE}"

  build-voice-assistant:
    needs: [prepare, build-voice-base]
    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive
          clean: true  # Очистка working directory для корректного кеширования Docker

      - name: Build voice-assistant
        run: |
          SERVICE="voice_assistant"
          GHCR_TAG="${IMAGE_PREFIX}:voice-assistant-${ROS_DISTRO}-${{ needs.prepare.outputs.docker_tag }}"
          LOCAL_TAG="${LOCAL_PREFIX}:voice-assistant-${ROS_DISTRO}-${{ needs.prepare.outputs.docker_tag }}"

          # Вычисляем hash Python исходников для инвалидации кеша
          SOURCE_HASH=$(find src/rob_box_voice/rob_box_voice src/rob_box_animations/rob_box_animations -type f -name "*.py" | sort | xargs sha256sum | sha256sum | awk '{print $1}')

          docker buildx build \
            --platform linux/arm64 \
            --file docker/vision/${SERVICE}/Dockerfile \
            --tag "${GHCR_TAG}" \
            --tag "${LOCAL_TAG}" \
            --load \
            --add-host=host.docker.internal:host-gateway \
            --build-arg="BASE_IMAGE=${LOCAL_PREFIX}:voice-base-${ROS_DISTRO}-${{ needs.prepare.outputs.docker_tag }}" \
            --build-arg="APT_PROXY=http://host.docker.internal:3142" \
            --build-arg="SOURCE_HASH=${SOURCE_HASH}" \
            .

          if [ "${{ inputs.push_to_registry }}" = "true" ]; then
            docker push "${LOCAL_TAG}"
          fi
          echo "✅ Built ${SERVICE}"

  build-voice-resources:
    needs: prepare
    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive
          clean: true

      - name: Build voice-resources
        run: |
          SERVICE="voice_resources"
          IMAGE_NAME="voice-resources"
          GHCR_TAG="${IMAGE_PREFIX}:${IMAGE_NAME}-${ROS_DISTRO}-${{ needs.prepare.outputs.docker_tag }}"
          LOCAL_TAG="${LOCAL_PREFIX}:${IMAGE_NAME}-${ROS_DISTRO}-${{ needs.prepare.outputs.docker_tag }}"

          docker buildx build \
            --platform linux/arm64 \
            --file docker/vision/${SERVICE}/Dockerfile \
            --tag "${GHCR_TAG}" \
            --tag "${LOCAL_TAG}" \
            --load \
            --add-host=host.docker.internal:host-gateway \
            docker/vision

          if [ "${{ inputs.push_to_registry }}" = "true" ]; then
            docker push "${LOCAL_TAG}"
          fi
          echo "✅ Built ${IMAGE_NAME}"

  build-voice-base:
    needs: prepare
    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive
          clean: true

      - name: Build voice-base
        run: |
          SERVICE="voice_base"
          IMAGE_NAME="voice-base"
          GHCR_TAG="${IMAGE_PREFIX}:${IMAGE_NAME}-${ROS_DISTRO}-${{ needs.prepare.outputs.docker_tag }}"
          LOCAL_TAG="${LOCAL_PREFIX}:${IMAGE_NAME}-${ROS_DISTRO}-${{ needs.prepare.outputs.docker_tag }}"

          docker buildx build \
            --platform linux/arm64 \
            --file docker/vision/${SERVICE}/Dockerfile \
            --tag "${GHCR_TAG}" \
            --tag "${LOCAL_TAG}" \
            --load \
            --add-host=host.docker.internal:host-gateway \
            --build-arg="BASE_IMAGE=localhost:5000/krikz/rob_box_base:rtabmap" \
            --build-arg="APT_PROXY=http://host.docker.internal:3142" \
            docker/vision/${SERVICE}

          docker push "${LOCAL_TAG}"
          echo "✅ Built ${IMAGE_NAME}"

  build-telegram-bot:
    needs: prepare
    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive
          clean: true

      - name: Build telegram-bot
        run: |
          SERVICE="telegram_bot"
          GHCR_TAG="${IMAGE_PREFIX}:telegram-bot-${ROS_DISTRO}-${{ needs.prepare.outputs.docker_tag }}"
          LOCAL_TAG="${LOCAL_PREFIX}:telegram-bot-${ROS_DISTRO}-${{ needs.prepare.outputs.docker_tag }}"

          # Вычисляем hash Python исходников для инвалидации кеша
          SOURCE_HASH=$(find src/rob_box_telegram/rob_box_telegram -type f -name "*.py" | sort | xargs sha256sum | sha256sum | awk '{print $1}')

          docker buildx build \
            --platform linux/arm64 \
            --file docker/vision/${SERVICE}/Dockerfile \
            --tag "${GHCR_TAG}" \
            --tag "${LOCAL_TAG}" \
            --load \
            --add-host=host.docker.internal:host-gateway \
            --build-arg="BASE_IMAGE=localhost:5000/krikz/rob_box_base:ros2-zenoh" \
            --build-arg="APT_PROXY=http://host.docker.internal:3142" \
            --build-arg="SOURCE_HASH=${SOURCE_HASH}" \
            .

          if [ "${{ inputs.push_to_registry }}" = "true" ]; then
            docker push "${LOCAL_TAG}"
          fi
          echo "✅ Built ${SERVICE}"

  build-supercollider:
    needs: prepare
    runs-on: self-hosted
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive
          clean: true

      - name: Build supercollider
        run: |
          SERVICE="supercollider"
          GHCR_TAG="${IMAGE_PREFIX}:${SERVICE}-${{ needs.prepare.outputs.docker_tag }}"
          LOCAL_TAG="${LOCAL_PREFIX}:${SERVICE}-${{ needs.prepare.outputs.docker_tag }}"

          docker buildx build \
            --platform linux/arm64 \
            --file docker/vision/${SERVICE}/Dockerfile \
            --tag "${GHCR_TAG}" \
            --tag "${LOCAL_TAG}" \
            --load \
            --add-host=host.docker.internal:host-gateway \
            --build-arg="APT_PROXY=http://host.docker.internal:3142" \
            docker/vision/${SERVICE}

          if [ "${{ inputs.push_to_registry }}" = "true" ]; then
            docker push "${LOCAL_TAG}"
          fi
          echo "✅ Built ${SERVICE}"

  # Обновление .image-versions — SHA-тег после успешной сборки
  update-image-versions:
    needs: [prepare, build-oak-d, build-led-matrix, build-ceiling-camera, build-voice-base, build-voice-resources, build-voice-assistant, build-telegram-bot, build-supercollider]
    runs-on: self-hosted
    if: success() && inputs.push_to_registry != false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: false
          clean: true
          fetch-depth: 1

      - name: Tag with SHA and update .image-versions
        run: |
          DOCKER_TAG="${{ needs.prepare.outputs.docker_tag }}"
          SHORT_SHA=$(git rev-parse --short HEAD)
          NEW_TAG="${DOCKER_TAG}-${SHORT_SHA}"

          # Tag and push SHA-immutable images for each service
          tag_and_push() {
            local LOCAL_TAG="$1"
            local SHA_TAG="${LOCAL_TAG}-${SHORT_SHA}"
            docker tag "$LOCAL_TAG" "$SHA_TAG" && docker push "$SHA_TAG"
            echo "✅ $SHA_TAG"
          }

          tag_and_push "${LOCAL_PREFIX}:oak-d-${ROS_DISTRO}-${DOCKER_TAG}"
          tag_and_push "${LOCAL_PREFIX}:led-matrix-${ROS_DISTRO}-${DOCKER_TAG}"
          tag_and_push "${LOCAL_PREFIX}:ceiling-camera-${ROS_DISTRO}-${DOCKER_TAG}"
          tag_and_push "${LOCAL_PREFIX}:voice-resources-${ROS_DISTRO}-${DOCKER_TAG}"
          tag_and_push "${LOCAL_PREFIX}:voice-assistant-${ROS_DISTRO}-${DOCKER_TAG}"
          tag_and_push "${LOCAL_PREFIX}:telegram-bot-${ROS_DISTRO}-${DOCKER_TAG}"
          # supercollider excluded: tag naming is inconsistent (no ROS_DISTRO prefix)

          # Update .image-versions file
          VERSIONS_FILE="docker/vision/.image-versions.${DOCKER_TAG}"
          if [ -f "$VERSIONS_FILE" ]; then
            sed -i \
              -e "s|^OAK_D_TAG=.*|OAK_D_TAG=${NEW_TAG}|" \
              -e "s|^RTABMAP_SYNC_TAG=.*|RTABMAP_SYNC_TAG=${NEW_TAG}|" \
              -e "s|^LED_MATRIX_TAG=.*|LED_MATRIX_TAG=${NEW_TAG}|" \
              -e "s|^CEILING_CAMERA_TAG=.*|CEILING_CAMERA_TAG=${NEW_TAG}|" \
              -e "s|^VOICE_RESOURCES_TAG=.*|VOICE_RESOURCES_TAG=${NEW_TAG}|" \
              -e "s|^VOICE_ASSISTANT_TAG=.*|VOICE_ASSISTANT_TAG=${NEW_TAG}|" \
              -e "s|^TELEGRAM_BOT_TAG=.*|TELEGRAM_BOT_TAG=${NEW_TAG}|" \
              "$VERSIONS_FILE"

            git config user.email "ci@rob-box.local"
            git config user.name "Rob Box CI"
            git add "$VERSIONS_FILE"
            if ! git diff --cached --quiet; then
              BRANCH="${GITHUB_REF#refs/heads/}"
              git commit -m "ci: vision SHA tags → ${NEW_TAG} [skip ci]"
              git pull --rebase origin "$BRANCH"
              git push origin "$BRANCH"
              echo "✅ Committed .image-versions: all vision tags → ${NEW_TAG}"
            fi
          else
            echo "⚠️  $VERSIONS_FILE not found"
          fi

  # Итоговая сводка
  summary:
    needs: [prepare, build-oak-d, build-led-matrix, build-ceiling-camera, build-voice-base, build-voice-resources, build-voice-assistant, build-telegram-bot, build-supercollider]
    runs-on: self-hosted
    if: always()
    steps:
      - name: Build Summary
        run: |
          echo "🎉 Vision Pi Services Build Complete!"
          echo ""
          echo "Configuration:"
          echo "  Docker Tag: ${{ needs.prepare.outputs.docker_tag }}"
          echo "  Push to Registry: ${{ inputs.push_to_registry }}"
          echo ""
          echo "Services built:"
          echo "  ✅ oak-d"
          echo "  ✅ led-matrix"
          echo "  ✅ ceiling-camera"
          echo "  ✅ voice-base"
          echo "  ✅ voice-resources"
          echo "  ✅ voice-assistant"
          echo "  ✅ telegram-bot"
          echo "  ✅ supercollider"
