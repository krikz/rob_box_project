name: "L: Architecture Graph"

on:
  workflow_run:
    workflows: ["L: Architecture Audit"]
    types: [completed]
    branches: [develop]

permissions:
  actions: read
  contents: read

jobs:
  graph:
    name: Publish Mermaid architecture graph
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout audit revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Download runtime audit evidence
        uses: actions/download-artifact@v4
        with:
          name: architecture-local-runtime
          path: architecture
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Render Mermaid graphs
        run: |
          python tools/architecture_runtime_graph.py \
            --runtime architecture/runtime.json \
            --inventory architecture/inventory.json \
            --output-dir architecture

      - name: Upload Mermaid graphs
        uses: actions/upload-artifact@v4
        with:
          name: architecture-mermaid
          path: |
            architecture/runtime-overview.mmd
            architecture/runtime-graph.mmd

      - name: Publish diagram
        run: |
          {
            echo "## ROS2 runtime architecture diagram"
            echo "Generated from the completed Architecture Audit run: ${{ github.event.workflow_run.id }}"
            echo
            printf '%s\\n' '```mermaid'
            cat architecture/runtime-overview.mmd
            printf '%s\\n' '```'
            echo
            echo "Full Mermaid graph is available in the \\`architecture-mermaid\\` artifact."
          } >> "$GITHUB_STEP_SUMMARY"
