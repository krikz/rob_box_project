  # Итоговая сводка
  summary:
    needs:
      - prepare
      - build-robot-state-publisher
      - build-rtabmap
      - build-twist-mux
      - build-micro-ros-agent
      - build-ros2-control
      - build-nav2
      - build-lslidar
      - build-perception
    runs-on: self-hosted
    if: always()
    steps:
      - name: Build Summary
        run: |
          echo "🎉 Main Pi Services Build Complete!"
          echo ""
          echo "Configuration:"
          echo "  Docker Tag: ${{ needs.prepare.outputs.docker_tag }}"
          echo "  Push to Registry: ${{ inputs.push_to_registry }}"
          echo ""
          echo "Services built:"
          echo "  ✅ robot-state-publisher"
          echo "  ✅ rtabmap"
          echo "  ✅ twist-mux"
