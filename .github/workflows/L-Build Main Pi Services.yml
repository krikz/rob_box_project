  build-ros2-control:
    needs: prepare
    runs-on: [self-hosted, rob-box]
    steps:
      - name: Clean stale submodules
        run: |
          rm -rf src/ros2leds src/vesc_nexus 2>/dev/null || true
          git sparse-checkout disable 2>/dev/null || true
          git checkout --force HEAD 2>/dev/null || true

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          clean: true

      - name: Build ros2-control
        run: |
          SERVICE="ros2_control"
          GHCR_TAG="${IMAGE_PREFIX}:ros2-control-${ROS_DISTRO}-${{ needs.prepare.outputs.docker_tag }}"
          LOCAL_TAG="${LOCAL_PREFIX}:ros2-control-${ROS_DISTRO}-${{ needs.prepare.outputs.docker_tag }}"

          # Получаем SHA субмодуля vesc_nexus для инвалидации кэша
          VESC_NEXUS_SHA=$(git submodule status src/vesc_nexus | awk '{print $1}' | sed 's/^[+-]//')

          docker buildx build \
            --platform linux/arm64 \
            --file docker/main/${SERVICE}/Dockerfile \
            --tag "${GHCR_TAG}" \
            --tag "${LOCAL_TAG}" \
            --load \
            --add-host=host.docker.internal:host-gateway \
            --build-arg="BASE_IMAGE=localhost:5000/krikz/rob_box_base:rtabmap" \
            --build-arg="APT_PROXY=http://host.docker.internal:3142" \
            --build-arg="VESC_NEXUS_SHA=${VESC_NEXUS_SHA}" \
