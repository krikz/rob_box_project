name: "L: Build Main Pi Services"

# Локальная сборка сервисов Main Pi на self-hosted runner
# Все сервисы собираются параллельно (до 8 одновременно)
on:
  workflow_dispatch:  # Ручной запуск
    inputs:
      push_to_registry:
        description: 'Push to local registry (localhost:5000)'
        required: false
        default: 'true'
        type: boolean
  workflow_call:  # Вызов из других workflow
    inputs:
      push_to_registry:
        description: 'Push to local registry'
        required: false
        default: true
        type: boolean

permissions:
  contents: write  # Required for git push of .image-versions files

env:
  LOCAL_REGISTRY: localhost:5000
  IMAGE_PREFIX: ghcr.io/krikz/rob_box
  LOCAL_PREFIX: localhost:5000/krikz/rob_box
  ROS_DISTRO: humble

jobs:
  # Определение тега
  prepare:
    runs-on: [self-hosted, rob-box]
    outputs:
      docker_tag: ${{ steps.set-config.outputs.docker_tag }}
    steps:
      - name: Set build configuration
        id: set-config
        run: |
          # Issue #1041: на refs/tags/vX.Y.Z... strip refs/heads/ даёт refs/tags/v...,
          # что не матчит ни одну ветку — попадает в else → DOCKER_TAG=local,
          # а файла docker/main/.image-versions.local не существует.
          # Релизные теги v* мапим в latest (production), это согласовано с
          # L-Deploy and Verify.yml (production → IMAGE_TAG=latest).
          # РЕВЕРТ #1139 (13.08): SHA-теги снова коммитятся прямо в текущую ветку.
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]] && [[ "${GITHUB_REF_NAME}" == v* ]]; then
            DOCKER_TAG="latest"
          else
            BRANCH_NAME="${GITHUB_REF#refs/heads/}"
            if [ "$BRANCH_NAME" = "main" ]; then
              DOCKER_TAG="latest"
            elif [ "$BRANCH_NAME" = "develop" ]; then
              DOCKER_TAG="dev"
            elif [[ "$BRANCH_NAME" == feature/* ]] || [[ "$BRANCH_NAME" == feat/* ]] || [[ "$BRANCH_NAME" == copilot/* ]] || [[ "$BRANCH_NAME" == z-{e2e}/* ]] || [[ "$BRANCH_NAME" == z-{agent}/* ]]; then
              DOCKER_TAG="test"
            else
              DOCKER_TAG="local"
            fi
          fi
          echo "docker_tag=${DOCKER_TAG}" >> $GITHUB_OUTPUT
          echo "Docker Tag: $DOCKER_TAG"

# Issue #2280 (arch review 2026-09-09, кандидат 4): buildx-сборка вынесена
  # в composite action ./.github/actions/l-build-service (см. action.yml).
  # ВАЖНО (fix run #34366133083): composite — buildx-only. GitHub требует,
  # чтобы репозиторий был зачекаутен ДО вызова локального composite action
  # (иначе раннер не найдёт action.yml → "Did you forget to run
  # actions/checkout"). Поэтому каждый build-job начинается с clean-stale
  # submodules + checkout (как и до рефакторинга), затем опциональный
  # pre-step для специфичных cache-invalidation хешей (URDF_FILES_HASH —
  # per-job) и уже потом composite-call. Внутри composite: buildx --load
  # (образ в daemon — нужен update-image-versions) + docker push ТОЛЬКО
  # локального registry. GHCR не пушим на локальных test/dev сборках
  # (runner не залогинен в ghcr.io, issue #1503; buildx --push по GHCR-тегу
  # падал unauthorized — run #34368750126).
  # См. acceptance #2280.

  build-robot-state-publisher:
    needs: prepare
    runs-on: [self-hosted, rob-box]
    steps:
      - name: Clean stale submodules
        run: |
          rm -rf src/ros2leds src/vesc_nexus 2>/dev/null || true
          git sparse-checkout disable 2>/dev/null || true
          git checkout --force HEAD 2>/dev/null || true

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive
          clean: true

      - name: Compute URDF files hash (cache invalidation)
        # URDF/Xacro/package.xml/CMakeLists в src/rob_box_description меняют
        # кеш docker buildx → пересборка образа. Hash не нужен в других job'ах
        # (per-service hash), поэтому считается здесь, передаётся через
        # build-args как URDF_FILES_HASH=<hash>.
        id: urdf-hash
        run: |
          URDF_FILES_HASH=$(find src/rob_box_description -type f \
            \( -name "*.xacro" -o -name "*.urdf" -o -name "package.xml" -o -name "CMakeLists.txt" \) \
            | sort | xargs sha256sum | sha256sum | awk '{print $1}')
          echo "urdf_hash=${URDF_FILES_HASH}" >> "$GITHUB_OUTPUT"

      - name: Build robot-state-publisher
        uses: ./.github/actions/l-build-service
        with:
          service-name: robot-state-publisher
          dockerfile-path: docker/main/robot_state_publisher/Dockerfile
          build-context: '.'
          tags: |
            ${{ env.IMAGE_PREFIX }}:robot-state-publisher-${{ env.ROS_DISTRO }}-${{ needs.prepare.outputs.docker_tag }}
            ${{ env.LOCAL_PREFIX }}:robot-state-publisher-${{ env.ROS_DISTRO }}-${{ needs.prepare.outputs.docker_tag }}
          build-args: |
            BASE_IMAGE=localhost:5000/krikz/rob_box_base:ros2-zenoh-${{ env.ROS_DISTRO }}
            APT_PROXY=http://host.docker.internal:3142
            URDF_FILES_HASH=${{ steps.urdf-hash.outputs.urdf_hash }}

  build-rtabmap:
    needs: prepare
    runs-on: [self-hosted, rob-box]
    steps:
      - name: Clean stale submodules
        run: |
          rm -rf src/ros2leds src/vesc_nexus 2>/dev/null || true
          git sparse-checkout disable 2>/dev/null || true
          git checkout --force HEAD 2>/dev/null || true

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive
          clean: true

      - name: Build rtabmap
        uses: ./.github/actions/l-build-service
        with:
          service-name: rtabmap
          dockerfile-path: docker/main/rtabmap/Dockerfile
          build-context: docker/main/rtabmap
          tags: |
            ${{ env.IMAGE_PREFIX }}:rtabmap-${{ env.ROS_DISTRO }}-${{ needs.prepare.outputs.docker_tag }}
            ${{ env.LOCAL_PREFIX }}:rtabmap-${{ env.ROS_DISTRO }}-${{ needs.prepare.outputs.docker_tag }}
          build-args: |
            BASE_IMAGE=localhost:5000/krikz/rob_box_base:rtabmap-${{ env.ROS_DISTRO }}
            APT_PROXY=http://host.docker.internal:3142

  build-twist-mux:
    needs: prepare
    runs-on: [self-hosted, rob-box]
    steps:
      - name: Clean stale submodules
        run: |
          rm -rf src/ros2leds src/vesc_nexus 2>/dev/null || true
          git sparse-checkout disable 2>/dev/null || true
          git checkout --force HEAD 2>/dev/null || true

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive
          clean: true

      - name: Build twist-mux
        uses: ./.github/actions/l-build-service
        with:
          service-name: twist-mux
          dockerfile-path: docker/main/twist_mux/Dockerfile
          build-context: docker/main/twist_mux
          tags: |
            ${{ env.IMAGE_PREFIX }}:twist-mux-${{ env.ROS_DISTRO }}-${{ needs.prepare.outputs.docker_tag }}
            ${{ env.LOCAL_PREFIX }}:twist-mux-${{ env.ROS_DISTRO }}-${{ needs.prepare.outputs.docker_tag }}
          build-args: |
            BASE_IMAGE=localhost:5000/krikz/rob_box_base:ros2-zenoh-${{ env.ROS_DISTRO }}
            APT_PROXY=http://host.docker.internal:3142

  build-teleop:
    needs: prepare
    runs-on: [self-hosted, rob-box]
    steps:
      - name: Clean stale submodules
        run: |
          rm -rf src/ros2leds src/vesc_nexus 2>/dev/null || true
          git sparse-checkout disable 2>/dev/null || true
          git checkout --force HEAD 2>/dev/null || true

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive
          clean: true

      - name: Build teleop
        uses: ./.github/actions/l-build-service
        with:
          service-name: teleop
          dockerfile-path: docker/main/teleop/Dockerfile
          build-context: '.'
          tags: |
            ${{ env.IMAGE_PREFIX }}:teleop-${{ env.ROS_DISTRO }}-${{ needs.prepare.outputs.docker_tag }}
            ${{ env.LOCAL_PREFIX }}:teleop-${{ env.ROS_DISTRO }}-${{ needs.prepare.outputs.docker_tag }}
          build-args: |
            BASE_IMAGE=localhost:5000/krikz/rob_box_base:ros2-zenoh-${{ env.ROS_DISTRO }}
            APT_PROXY=http://host.docker.internal:3142

  build-ros2-control:
    needs: prepare
    runs-on: [self-hosted, rob-box]
    steps:
      - name: Clean stale submodules
        run: |
          rm -rf src/ros2leds src/vesc_nexus 2>/dev/null || true
          git sparse-checkout disable 2>/dev/null || true
          git checkout --force HEAD 2>/dev/null || true

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive
          clean: true

      - name: Build ros2-control
        uses: ./.github/actions/l-build-service
        with:
          service-name: ros2-control
          dockerfile-path: docker/main/ros2_control/Dockerfile
          build-context: '.'
          tags: |
            ${{ env.IMAGE_PREFIX }}:ros2-control-${{ env.ROS_DISTRO }}-${{ needs.prepare.outputs.docker_tag }}
            ${{ env.LOCAL_PREFIX }}:ros2-control-${{ env.ROS_DISTRO }}-${{ needs.prepare.outputs.docker_tag }}
          # vesc_nexus submodule → SHA инвалидирует кеш при обновлении субмодуля.
          # Composite action сам посчитает SHA и подмешает VESC_NEXUS_SHA=<sha>.
          compute-submodule-sha: src/vesc_nexus
          build-args: |
            BASE_IMAGE=localhost:5000/krikz/rob_box_base:rtabmap-${{ env.ROS_DISTRO }}
            APT_PROXY=http://host.docker.internal:3142

  build-nav2:
    needs: prepare
    runs-on: [self-hosted, rob-box]
    steps:
      - name: Clean stale submodules
        run: |
          rm -rf src/ros2leds src/vesc_nexus 2>/dev/null || true
          git sparse-checkout disable 2>/dev/null || true
          git checkout --force HEAD 2>/dev/null || true

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive
          clean: true

      - name: Build nav2
        uses: ./.github/actions/l-build-service
        with:
          service-name: nav2
          dockerfile-path: docker/main/nav2/Dockerfile
          build-context: docker/main/nav2
          tags: |
            ${{ env.IMAGE_PREFIX }}:nav2-${{ env.ROS_DISTRO }}-${{ needs.prepare.outputs.docker_tag }}
            ${{ env.LOCAL_PREFIX }}:nav2-${{ env.ROS_DISTRO }}-${{ needs.prepare.outputs.docker_tag }}
          build-args: |
            BASE_IMAGE=localhost:5000/krikz/rob_box_base:ros2-zenoh-${{ env.ROS_DISTRO }}
            APT_PROXY=http://host.docker.internal:3142

  build-lslidar:
    needs: prepare
    runs-on: [self-hosted, rob-box]
    steps:
      - name: Clean stale submodules
        run: |
          rm -rf src/ros2leds src/vesc_nexus 2>/dev/null || true
          git sparse-checkout disable 2>/dev/null || true
          git checkout --force HEAD 2>/dev/null || true

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive
          clean: true

      - name: Build lslidar
        uses: ./.github/actions/l-build-service
        with:
          service-name: lslidar
          dockerfile-path: docker/main/lslidar/Dockerfile
          build-context: docker/main
          tags: |
            ${{ env.IMAGE_PREFIX }}:lslidar-${{ env.ROS_DISTRO }}-${{ needs.prepare.outputs.docker_tag }}
            ${{ env.LOCAL_PREFIX }}:lslidar-${{ env.ROS_DISTRO }}-${{ needs.prepare.outputs.docker_tag }}
          build-args: |
            BASE_IMAGE=localhost:5000/krikz/rob_box_base:pcl-${{ env.ROS_DISTRO }}
            APT_PROXY=http://host.docker.internal:3142

  build-perception:
    needs: prepare
    runs-on: [self-hosted, rob-box]
    steps:
      - name: Clean stale submodules
        run: |
          rm -rf src/ros2leds src/vesc_nexus 2>/dev/null || true
          git sparse-checkout disable 2>/dev/null || true
          git checkout --force HEAD 2>/dev/null || true

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive
          clean: true

      - name: Build perception
        uses: ./.github/actions/l-build-service
        with:
          service-name: perception
          dockerfile-path: docker/main/perception/Dockerfile
          build-context: '.'
          tags: |
            ${{ env.IMAGE_PREFIX }}:perception-${{ env.ROS_DISTRO }}-${{ needs.prepare.outputs.docker_tag }}
            ${{ env.LOCAL_PREFIX }}:perception-${{ env.ROS_DISTRO }}-${{ needs.prepare.outputs.docker_tag }}
          build-args: |
            BASE_IMAGE=localhost:5000/krikz/rob_box_base:ros2-zenoh-${{ env.ROS_DISTRO }}
            APT_PROXY=http://host.docker.internal:3142

  update-image-versions:
    needs:
      - prepare
      - build-robot-state-publisher
      - build-rtabmap
      - build-twist-mux
      - build-teleop
      - build-ros2-control
      - build-nav2
      - build-lslidar
      - build-perception
    runs-on: [self-hosted, rob-box]
    if: success() && inputs.push_to_registry != false
    # Issue #t_dd49849b: 2.7h+ hang observed on concurrent runs (round-224+225+develop)
    # when git pull --rebase / git push blocked indefinitely under ref contention.
    # Hard 10-min cap surfaces the failure visibly (instead of stuck-in_progress).
    timeout-minutes: 10
    steps:
      - name: Clean stale submodules
        run: |
          rm -rf src/ros2leds src/vesc_nexus 2>/dev/null || true
          git sparse-checkout disable 2>/dev/null || true
          git checkout --force HEAD 2>/dev/null || true

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: false
          clean: true
          fetch-depth: 0

      - name: Tag with SHA and update .image-versions
        # Bugfix issue #1482: вместо `git rev-parse --short HEAD` используем
        # `${GITHUB_SHA::7}` — это commit, который ТРИГГЕРНУЛ workflow run,
        # неизменный на всём протяжении run и равный round-ветка HEAD в момент
        # dispatch/call. Прежний подход брал локальный HEAD, который мог
        # сместиться после `git pull --rebase` внутри scripts/ci/push-image-versions.sh
        # → .image-versions.test указывал на несуществующий image, робот не
        # обновлялся (доказательства в issue #1482 round-163 → stale-83d4064f).
        run: |
          DOCKER_TAG="${{ needs.prepare.outputs.docker_tag }}"
          SHORT_SHA="${GITHUB_SHA::7}"
          NEW_TAG="${DOCKER_TAG}-${SHORT_SHA}"

          # Tag and push SHA-immutable images to LOCAL registry only.
          # GHCR push убран — локальные develop/test сборки больше не публикуются
          # в ghcr.io (issue #1503 решён иначе: deploy читает из local registry
          # для develop/test, prod-push в GHCR — отдельный workflow на main).
          tag_and_push() {
            local LOCAL_TAG="$1"
            local LOCAL_SHA="${LOCAL_TAG}-${SHORT_SHA}"
            docker tag "$LOCAL_TAG" "$LOCAL_SHA" && docker push "$LOCAL_SHA"
            echo "✅ local  $LOCAL_SHA"
          }

          tag_and_push "${LOCAL_PREFIX}:robot-state-publisher-${ROS_DISTRO}-${DOCKER_TAG}"
          tag_and_push "${LOCAL_PREFIX}:rtabmap-${ROS_DISTRO}-${DOCKER_TAG}"
          tag_and_push "${LOCAL_PREFIX}:twist-mux-${ROS_DISTRO}-${DOCKER_TAG}"
          tag_and_push "${LOCAL_PREFIX}:ros2-control-${ROS_DISTRO}-${DOCKER_TAG}"
          tag_and_push "${LOCAL_PREFIX}:nav2-${ROS_DISTRO}-${DOCKER_TAG}"
          tag_and_push "${LOCAL_PREFIX}:lslidar-${ROS_DISTRO}-${DOCKER_TAG}"
          tag_and_push "${LOCAL_PREFIX}:perception-${ROS_DISTRO}-${DOCKER_TAG}"
          # teleop excluded: still uses IMAGE_TAG in docker-compose

          # Acceptance B (#1482): verify SHA-image is actually present in
          # registry BEFORE writing it to .image-versions — иначе deploy
          # тянет несуществующий тег, робот не обновляется.
          verify_in_registry() {
            local TAG="$1"
            local REPO="krikz/rob_box"
            local URL="http://${LOCAL_REGISTRY}/v2/${REPO}/manifests/${TAG}"
            local HTTP_CODE
            HTTP_CODE=$(curl -s -o /dev/null -w '%{http_code}' \
              -H 'Accept: application/vnd.docker.distribution.manifest.v2+json' \
              "$URL" || echo "000")
            if [ "$HTTP_CODE" != "200" ]; then
              echo "❌ Verify FAIL: ${TAG} missing in registry (HTTP ${HTTP_CODE})" >&2
              return 1
            fi
            echo "✅ Verify OK: ${TAG} present in registry"
            return 0
          }

          VERIFY_FAILED=0
          for SVC_TAG in \
            "robot-state-publisher-${ROS_DISTRO}-${NEW_TAG}" \
            "rtabmap-${ROS_DISTRO}-${NEW_TAG}" \
            "twist-mux-${ROS_DISTRO}-${NEW_TAG}" \
            "ros2-control-${ROS_DISTRO}-${NEW_TAG}" \
            "nav2-${ROS_DISTRO}-${NEW_TAG}" \
            "lslidar-${ROS_DISTRO}-${NEW_TAG}" \
            "perception-${ROS_DISTRO}-${NEW_TAG}"; do
            if ! verify_in_registry "$SVC_TAG"; then
              VERIFY_FAILED=1
            fi
          done
          if [ "$VERIFY_FAILED" -eq 1 ]; then
            echo "❌ Registry verify failed для одного или нескольких SHA-тегов" >&2
            exit 1
          fi

          VERSIONS_FILE="docker/main/.image-versions.${DOCKER_TAG}"
          if [ -f "$VERSIONS_FILE" ]; then
            sed -i \
              -e "s|^TWIST_MUX_TAG=.*|TWIST_MUX_TAG=${NEW_TAG}|" \
              -e "s|^MICRO_ROS_AGENT_TAG=.*|MICRO_ROS_AGENT_TAG=${NEW_TAG}|" \
              -e "s|^ROBOT_STATE_PUBLISHER_TAG=.*|ROBOT_STATE_PUBLISHER_TAG=${NEW_TAG}|" \
              -e "s|^RTABMAP_TAG=.*|RTABMAP_TAG=${NEW_TAG}|" \
              -e "s|^ROS2_CONTROL_TAG=.*|ROS2_CONTROL_TAG=${NEW_TAG}|" \
              -e "s|^LSLIDAR_TAG=.*|LSLIDAR_TAG=${NEW_TAG}|" \
              -e "s|^PERCEPTION_TAG=.*|PERCEPTION_TAG=${NEW_TAG}|" \
              -e "s|^NAV2_TAG=.*|NAV2_TAG=${NEW_TAG}|" \
              "$VERSIONS_FILE"

            git config user.email "ci@rob-box.local"
            git config user.name "Rob Box CI"
            git add "$VERSIONS_FILE"
            if ! git diff --cached --quiet; then
              # 🔴 РЕВЕРТ #1244 (15.08, decision #1316): SHA-теги коммитим
              # ПРЯМО в текущую ветку (develop) — ci/image-versions-* ветки
              # НЕ работают (деплой при local не грузит .image-versions,
              # тянет голые dev-теги → роботы получают старые образы).
              #
              # Issue #1388: race main↔vision — оба коммитят в одну ветку.
              # Зовём scripts/ci/push-image-versions.sh: pull --rebase + push с retry
              # и ФЕЙЛ при невосстановимой ошибке (раньше job просто молча терял коммит).
              #
              # Issue #1826: round-ветки (z-{e2e}/test-round-*) — это transient
              # branches для e2e-прогонов. SHA-tag коммит в round-ветку создаёт
              # infinite build chain: agent-flow триггерит L-Build → CI коммитит
              # SHA-tag в round → agent-flow видит новый HEAD → триггерит ещё
              # build. Loop. SHA-теги нужны только для develop/main, где их
              # читает deploy-flow. На round-ветках .image-versions.test
              # обновляется в локальном реестре и в deploy-flow читается
              # напрямую через IMAGE_TAG (не из .image-versions файла), поэтому
              # SHA-tag push в round НЕ нужен.
              CURRENT_BRANCH="$(git branch --show-current)"
              if [[ "${CURRENT_BRANCH}" =~ ^z-\{e2e\}/test-round- ]] || \
                 [[ "${CURRENT_BRANCH}" =~ ^z-\{e2e\}/wip- ]]; then
                echo "⏭️  Issue #1826: skip SHA-tag push for round branch ${CURRENT_BRANCH}"
                echo "   (prevents infinite build loop — agent-flow would re-trigger on each SHA commit)"
                echo "   SHA-tag ${NEW_TAG} already pushed to local registry; deploy on round uses IMAGE_TAG directly"
              else
                git commit -m "ci: main SHA tags → ${NEW_TAG} [skip ci]"
                bash scripts/ci/push-image-versions.sh "$CURRENT_BRANCH" main
              fi
            fi
          else
            echo "⚠️  $VERSIONS_FILE not found"
          fi

  # Итоговая сводка
  summary:
    needs:
      - prepare
      - build-robot-state-publisher
      - build-rtabmap
      - build-twist-mux
      - build-teleop
      - build-ros2-control
      - build-nav2
      - build-lslidar
      - build-perception
    runs-on: [self-hosted, rob-box]
    if: always()
    steps:
      - name: Build Summary
        run: |
          echo "🎉 Main Pi Services Build Complete!"
          echo ""
          echo "Configuration:"
          echo "  Docker Tag: ${{ needs.prepare.outputs.docker_tag }}"
          echo "  Push to Registry: ${{ inputs.push_to_registry }}"
          echo ""
          echo "Services built:"
          echo "  ✅ robot-state-publisher"
          echo "  ✅ rtabmap"
          echo "  ✅ twist-mux"
          echo "  ✅ teleop"
          echo "  ✅ ros2-control"
          echo "  ✅ nav2"
          echo "  ✅ lslidar"
          echo "  ✅ perception"
