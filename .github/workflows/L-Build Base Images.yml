name: "L: Build Base Images"

# Сборка базовых образов на self-hosted runner с локальным registry.
#
# Параллелизм: 4 базовых образа собираются параллельно. pcl зависит от
# ros2-zenoh (FROM <local-prefix>:ros2-zenoh-<distro>), поэтому job build-pcl
# имеет needs: build-ros2-zenoh. Это необходимая зависимость по данным
# (FROM), а не искусственная последовательность.
#
# Кэширование: каждый job использует предыдущий pushed образ из local
# registry как cache-from (cache-from: type=registry). Это даёт независимый
# cache key для каждой базы: SHA слоёв не зависит от других jobs.
#
# rmw_zenoh_cpp 0.1.8 вендорится в docker/base/vendor/*.deb (см. ARG
# RMW_ZENOH_VENDOR в Dockerfile'ах), что устраняет hot-fetch HTTP-only
# snapshots.ros.org при каждом cold build.
on:
  workflow_dispatch:  # Ручной запуск
    inputs:
      push_to_registry:
        description: 'Push to local registry (localhost:5000)'
        required: false
        default: 'true'
        type: boolean
      force_rebuild:
        description: 'Force rebuild without cache-from'
        required: false
        default: false
        type: boolean
  workflow_call:  # Вызов из других workflow (например, L-Build All Services)
    inputs:
      push_to_registry:
        description: 'Push to local registry'
        required: false
        default: true
        type: boolean
      force_rebuild:
        description: 'Force rebuild without cache-from'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

env:
  LOCAL_REGISTRY: localhost:5000
  GHCR_REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/krikz/rob_box_base
  LOCAL_PREFIX: localhost:5000/krikz/rob_box_base
  ROS_DISTRO: humble

jobs:
  # Сборка базового образа ROS 2 + Zenoh (общая база для всех)
  build-ros2-zenoh:
    runs-on: [self-hosted, rob-box]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive
          clean: true

      - name: Build ros2-zenoh base image
        env:
          FORCE_REBUILD: ${{ inputs.force_rebuild || 'false' }}
        run: |
          echo "🏗️ Building ros2-zenoh base image..."

          # Параллельно собирается 3 независимых образа (rtabmap, depthai, ros2-zenoh),
          # поэтому buildx запускаем с load и одним исполнителем. Кэш —
          # последний pushed образ из local registry.
          if [ "${FORCE_REBUILD}" = "true" ]; then
            CACHE_FLAGS="--no-cache"
          else
            CACHE_FLAGS="--cache-from type=registry,ref=${LOCAL_PREFIX}:ros2-zenoh-${ROS_DISTRO}"
          fi

          docker buildx build \
            --platform linux/arm64 \
            --file docker/base/Dockerfile.ros2-zenoh \
            --tag "${IMAGE_PREFIX}:ros2-zenoh-${ROS_DISTRO}-latest" \
            --tag "${LOCAL_PREFIX}:ros2-zenoh-${ROS_DISTRO}-latest" \
            --tag "${LOCAL_PREFIX}:ros2-zenoh-${ROS_DISTRO}" \
            --load \
            --add-host=host.docker.internal:host-gateway \
            --build-arg="APT_PROXY=http://host.docker.internal:3142" \
            ${CACHE_FLAGS} \
            docker/base

          if [ "${{ inputs.push_to_registry }}" = "true" ]; then
            docker push ${LOCAL_PREFIX}:ros2-zenoh-${ROS_DISTRO}-latest
            docker push ${LOCAL_PREFIX}:ros2-zenoh-${ROS_DISTRO}
          fi
          echo "✅ ros2-zenoh base image ready"

  # Сборка базового образа RTAB-Map (для SLAM)
  build-rtabmap:
    runs-on: [self-hosted, rob-box]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive
          clean: true

      - name: Build rtabmap base image
        env:
          FORCE_REBUILD: ${{ inputs.force_rebuild || 'false' }}
        run: |
          echo "🏗️ Building rtabmap base image..."

          if [ "${FORCE_REBUILD}" = "true" ]; then
            CACHE_FLAGS="--no-cache"
          else
            CACHE_FLAGS="--cache-from type=registry,ref=${LOCAL_PREFIX}:rtabmap-${ROS_DISTRO}"
          fi

          docker buildx build \
            --platform linux/arm64 \
            --file docker/base/Dockerfile.rtabmap \
            --tag "${IMAGE_PREFIX}:rtabmap-${ROS_DISTRO}-latest" \
            --tag "${LOCAL_PREFIX}:rtabmap-${ROS_DISTRO}-latest" \
            --tag "${LOCAL_PREFIX}:rtabmap-${ROS_DISTRO}" \
            --load \
            --add-host=host.docker.internal:host-gateway \
            --build-arg="APT_PROXY=http://host.docker.internal:3142" \
            ${CACHE_FLAGS} \
            docker/base

          if [ "${{ inputs.push_to_registry }}" = "true" ]; then
            docker push ${LOCAL_PREFIX}:rtabmap-${ROS_DISTRO}-latest
            docker push ${LOCAL_PREFIX}:rtabmap-${ROS_DISTRO}
          fi
          echo "✅ rtabmap base image ready"

  # Сборка базового образа DepthAI (для OAK-D камеры)
  build-depthai:
    runs-on: [self-hosted, rob-box]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive
          clean: true

      - name: Build depthai base image
        env:
          FORCE_REBUILD: ${{ inputs.force_rebuild || 'false' }}
        run: |
          echo "🏗️ Building depthai base image..."

          if [ "${FORCE_REBUILD}" = "true" ]; then
            CACHE_FLAGS="--no-cache"
          else
            CACHE_FLAGS="--cache-from type=registry,ref=${LOCAL_PREFIX}:depthai-${ROS_DISTRO}"
          fi

          docker buildx build \
            --platform linux/arm64 \
            --file docker/base/Dockerfile.depthai \
            --tag "${IMAGE_PREFIX}:depthai-${ROS_DISTRO}-latest" \
            --tag "${LOCAL_PREFIX}:depthai-${ROS_DISTRO}-latest" \
            --tag "${LOCAL_PREFIX}:depthai-${ROS_DISTRO}" \
            --load \
            --add-host=host.docker.internal:host-gateway \
            --build-arg="APT_PROXY=http://host.docker.internal:3142" \
            ${CACHE_FLAGS} \
            docker/base

          if [ "${{ inputs.push_to_registry }}" = "true" ]; then
            docker push ${LOCAL_PREFIX}:depthai-${ROS_DISTRO}-latest
            docker push ${LOCAL_PREFIX}:depthai-${ROS_DISTRO}
          fi
          echo "✅ depthai base image ready"

  # Сборка базового образа PCL (для лидаров)
  build-pcl:
    runs-on: [self-hosted, rob-box]
    needs: build-ros2-zenoh  # Зависит от ros2-zenoh базы (FROM ${BASE_IMAGE})
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive
          clean: true

      - name: Build pcl base image
        env:
          FORCE_REBUILD: ${{ inputs.force_rebuild || 'false' }}
        run: |
          echo "🏗️ Building pcl base image..."

          if [ "${FORCE_REBUILD}" = "true" ]; then
            CACHE_FLAGS="--no-cache"
          else
            CACHE_FLAGS="--cache-from type=registry,ref=${LOCAL_PREFIX}:pcl-${ROS_DISTRO}"
          fi

          docker buildx build \
            --platform linux/arm64 \
            --file docker/base/Dockerfile.pcl \
            --tag "${IMAGE_PREFIX}:pcl-${ROS_DISTRO}-latest" \
            --tag "${LOCAL_PREFIX}:pcl-${ROS_DISTRO}-latest" \
            --tag "${LOCAL_PREFIX}:pcl-${ROS_DISTRO}" \
            --load \
            --add-host=host.docker.internal:host-gateway \
            --build-arg="BASE_IMAGE=${LOCAL_PREFIX}:ros2-zenoh-${ROS_DISTRO}-latest" \
            --build-arg="APT_PROXY=http://host.docker.internal:3142" \
            ${CACHE_FLAGS} \
            docker/base

          if [ "${{ inputs.push_to_registry }}" = "true" ]; then
            docker push ${LOCAL_PREFIX}:pcl-${ROS_DISTRO}-latest
            docker push ${LOCAL_PREFIX}:pcl-${ROS_DISTRO}
          fi
          echo "✅ pcl base image ready"

  # Итоговая сводка
  summary:
    needs: [build-ros2-zenoh, build-rtabmap, build-depthai, build-pcl]
    runs-on: [self-hosted, rob-box]
    if: always()
    steps:
      - name: Build Summary
        run: |
          echo "🎉 Local Base Images Build Complete!"
          echo ""
          echo "📊 Build Results:"
          echo "  ros2-zenoh: ${{ needs.build-ros2-zenoh.result }}"
          echo "  rtabmap: ${{ needs.build-rtabmap.result }}"
          echo "  depthai: ${{ needs.build-depthai.result }}"
          echo "  pcl: ${{ needs.build-pcl.result }}"
          echo ""
          echo "📦 Images pushed to: ${LOCAL_REGISTRY}"
          echo ""
          echo "🏷️ Tags:"
          echo "  - ${LOCAL_PREFIX}:ros2-zenoh-${ROS_DISTRO}-latest"
          echo "  - ${LOCAL_PREFIX}:ros2-zenoh-${ROS_DISTRO}"
          echo "  - ${LOCAL_PREFIX}:rtabmap-${ROS_DISTRO}-latest"
          echo "  - ${LOCAL_PREFIX}:rtabmap-${ROS_DISTRO}"
          echo "  - ${LOCAL_PREFIX}:depthai-${ROS_DISTRO}-latest"
          echo "  - ${LOCAL_PREFIX}:depthai-${ROS_DISTRO}"
          echo "  - ${LOCAL_PREFIX}:pcl-${ROS_DISTRO}-latest"
          echo "  - ${LOCAL_PREFIX}:pcl-${ROS_DISTRO}"
