name: "L: Build Base Images"

# Сборка базовых образов на self-hosted runner с локальным registry.
#
# Параллелизм: 4 базовых образа собираются параллельно. pcl зависит от
# ros2-zenoh (FROM <local-prefix>:ros2-zenoh-<distro>), поэтому job build-pcl
# имеет needs: build-ros2-zenoh. Это необходимая зависимость по данным
# (FROM), а не искусственная последовательность.
#
# Сборка: через тот же composite ./.github/actions/l-build-service, что и
# сервисы (→ scripts/build/buildx_build.sh — тот же скрипт, что у
# ЛОКАЛЬНОЙ сборки `scripts/build/build.sh base <имя>`). Состав баз, теги и
# build-args — из docker/build-manifest.yaml (секция base_images), через
# `gen_build_matrix.py --mode base`.
#
# Почему не inline `docker buildx build`, как было: run 36351952819 — все
# три base-job'а упали за 0 секунд с
#   ERROR: unable to derive the IP value for host-gateway:
#          host-gateway is not supported by the docker-container driver
# composite делал `docker buildx use robbox-<host>` (docker-container), это
# запоминалось в ~/.docker раннер-контейнера, и голый buildx с
# --add-host=...:host-gateway в этом файле уезжал на тот же билдер. Теперь
# билдер передаётся явно (--builder), а host-gateway подменяется IP шлюза.
#
# Кэширование: registry-кеш buildx (<local>/rob_box_base:<имя>-buildcache,
# mode=max), как у сервисов. force_rebuild → --no-cache.
#
# rmw_zenoh_cpp 0.1.8 вендорится в docker/base/vendor/*.deb (см. ARG
# RMW_ZENOH_VENDOR в Dockerfile'ах), что устраняет hot-fetch HTTP-only
# snapshots.ros.org при каждом cold build.
on:
  workflow_dispatch:  # Ручной запуск
    inputs:
      push_to_registry:
        description: 'Push to local registry (localhost:5000)'
        required: false
        default: 'true'
        type: boolean
      force_rebuild:
        description: 'Force rebuild without cache-from'
        required: false
        default: false
        type: boolean
  workflow_call:  # Вызов из других workflow (например, L-Build All Services)
    inputs:
      push_to_registry:
        description: 'Push to local registry'
        required: false
        default: true
        type: boolean
      force_rebuild:
        description: 'Force rebuild without cache-from'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

env:
  LOCAL_REGISTRY: localhost:5000
  GHCR_REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/krikz/rob_box_base
  LOCAL_PREFIX: localhost:5000/krikz/rob_box_base
  ROS_DISTRO: humble

jobs:
  prepare:
    runs-on: [self-hosted, rob-box]
    outputs:
      bases: ${{ steps.gen.outputs.bases }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Ensure PyYAML (зависимость scripts/ci/gen_build_matrix.py)
        # Молчаливый фолбэк недопустим: пустой список баз = «собрано 0 образов»
        # при зелёном workflow.
        run: |
          python3 -c "import yaml" 2>/dev/null && exit 0
          python3 -m pip install --quiet --no-cache-dir --user pyyaml \
            || python3 -m pip install --quiet --no-cache-dir --user --break-system-packages pyyaml \
            || true
          python3 -c "import yaml; print('PyYAML', yaml.__version__)"

      - name: Resolve base images from docker/build-manifest.yaml
        id: gen
        run: |
          BASES="$(python3 scripts/ci/gen_build_matrix.py \
            --manifest docker/build-manifest.yaml \
            --mode base \
            --ros-distro "$ROS_DISTRO")"
          echo "bases=${BASES}" >> "$GITHUB_OUTPUT"
          echo "$BASES"

  # Сборка базового образа ROS 2 + Zenoh (общая база для всех)
  build-ros2-zenoh:
    needs: prepare
    runs-on: [self-hosted, rob-box]
    strategy:
      matrix:
        include: "${{ fromJSON(needs.prepare.outputs.bases)['ros2-zenoh'] }}"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive
          clean: true

      - name: Build ${{ matrix.name }} base image
        uses: ./.github/actions/l-build-service
        with:
          service-name: ${{ matrix.name }}
          dockerfile-path: ${{ matrix.dockerfile }}
          build-context: ${{ matrix.build_context }}
          tags: |
            ${{ matrix.tags }}
          build-args: |
            ${{ matrix.build_args }}
          # push_to_registry=false → только --load в daemon, без docker push.
          load: ${{ !inputs.push_to_registry && 'true' || 'false' }}
          no-cache: ${{ inputs.force_rebuild && 'true' || 'false' }}

  # Сборка базового образа RTAB-Map (для SLAM)
  build-rtabmap:
    needs: prepare
    runs-on: [self-hosted, rob-box]
    strategy:
      matrix:
        include: "${{ fromJSON(needs.prepare.outputs.bases)['rtabmap'] }}"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive
          clean: true

      - name: Build ${{ matrix.name }} base image
        uses: ./.github/actions/l-build-service
        with:
          service-name: ${{ matrix.name }}
          dockerfile-path: ${{ matrix.dockerfile }}
          build-context: ${{ matrix.build_context }}
          tags: |
            ${{ matrix.tags }}
          build-args: |
            ${{ matrix.build_args }}
          # push_to_registry=false → только --load в daemon, без docker push.
          load: ${{ !inputs.push_to_registry && 'true' || 'false' }}
          no-cache: ${{ inputs.force_rebuild && 'true' || 'false' }}

  # Сборка базового образа DepthAI (для OAK-D камеры)
  build-depthai:
    needs: prepare
    runs-on: [self-hosted, rob-box]
    strategy:
      matrix:
        include: "${{ fromJSON(needs.prepare.outputs.bases)['depthai'] }}"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive
          clean: true

      - name: Build ${{ matrix.name }} base image
        uses: ./.github/actions/l-build-service
        with:
          service-name: ${{ matrix.name }}
          dockerfile-path: ${{ matrix.dockerfile }}
          build-context: ${{ matrix.build_context }}
          tags: |
            ${{ matrix.tags }}
          build-args: |
            ${{ matrix.build_args }}
          # push_to_registry=false → только --load в daemon, без docker push.
          load: ${{ !inputs.push_to_registry && 'true' || 'false' }}
          no-cache: ${{ inputs.force_rebuild && 'true' || 'false' }}

  # Сборка базового образа PCL (для лидаров): FROM ros2-zenoh → needs.
  build-pcl:
    needs: [prepare, build-ros2-zenoh]
    runs-on: [self-hosted, rob-box]
    strategy:
      matrix:
        include: "${{ fromJSON(needs.prepare.outputs.bases)['pcl'] }}"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive
          clean: true

      - name: Build ${{ matrix.name }} base image
        uses: ./.github/actions/l-build-service
        with:
          service-name: ${{ matrix.name }}
          dockerfile-path: ${{ matrix.dockerfile }}
          build-context: ${{ matrix.build_context }}
          tags: |
            ${{ matrix.tags }}
          build-args: |
            ${{ matrix.build_args }}
          # push_to_registry=false → только --load в daemon, без docker push.
          load: ${{ !inputs.push_to_registry && 'true' || 'false' }}
          no-cache: ${{ inputs.force_rebuild && 'true' || 'false' }}

  # Итоговая сводка
  summary:
    needs: [build-ros2-zenoh, build-rtabmap, build-depthai, build-pcl]
    runs-on: [self-hosted, rob-box]
    if: always()
    steps:
      - name: Build Summary
        run: |
          echo "🎉 Local Base Images Build Complete!"
          echo ""
          echo "📊 Build Results:"
          echo "  ros2-zenoh: ${{ needs.build-ros2-zenoh.result }}"
          echo "  rtabmap: ${{ needs.build-rtabmap.result }}"
          echo "  depthai: ${{ needs.build-depthai.result }}"
          echo "  pcl: ${{ needs.build-pcl.result }}"
          echo ""
          echo "📦 Images pushed to: ${LOCAL_REGISTRY}"
          echo ""
          echo "🏷️ Tags:"
          echo "  - ${LOCAL_PREFIX}:ros2-zenoh-${ROS_DISTRO}-latest"
          echo "  - ${LOCAL_PREFIX}:ros2-zenoh-${ROS_DISTRO}"
          echo "  - ${LOCAL_PREFIX}:rtabmap-${ROS_DISTRO}-latest"
          echo "  - ${LOCAL_PREFIX}:rtabmap-${ROS_DISTRO}"
          echo "  - ${LOCAL_PREFIX}:depthai-${ROS_DISTRO}-latest"
          echo "  - ${LOCAL_PREFIX}:depthai-${ROS_DISTRO}"
          echo "  - ${LOCAL_PREFIX}:pcl-${ROS_DISTRO}-latest"
          echo "  - ${LOCAL_PREFIX}:pcl-${ROS_DISTRO}"
