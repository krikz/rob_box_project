name: "[L] Build All Services"

# Полная сборка всех образов на self-hosted runner с локальным registry
# Собирает базовые образы, Main Pi и Vision Pi сервисы параллельно
on:
  workflow_dispatch:  # Ручной запуск
    inputs:
      build_base_images:
        description: 'Build base images first'
        required: false
        default: 'false'
        type: boolean
      push_to_registry:
        description: 'Push to local registry (localhost:5000)'
        required: false
        default: 'true'
        type: boolean

env:
  LOCAL_REGISTRY: localhost:5000
  LOCAL_PREFIX: localhost:5000/krikz/rob_box
  ROS_DISTRO: humble

jobs:
  # Сборка базовых образов (если нужно)
  build-base-images:
    runs-on: self-hosted
    if: github.event.inputs.build_base_images == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build ros2-zenoh base image
        run: |
          echo "🏗️ Building ros2-zenoh base image..."
          
          docker buildx build \
            --platform linux/arm64 \
            --file docker/base/Dockerfile.ros2-zenoh \
            --tag "ghcr.io/krikz/rob_box_base:ros2-zenoh-latest" \
            --tag "localhost:5000/krikz/rob_box_base:ros2-zenoh-latest" \
            --load \
            --build-arg="APT_PROXY=http://host.docker.internal:3142" \
            docker/base
          
          if [ "${{ github.event.inputs.push_to_registry }}" = "true" ]; then
            docker push localhost:5000/krikz/rob_box_base:ros2-zenoh-latest
          fi
          echo "✅ ros2-zenoh base image ready"

      - name: Build rtabmap base image
        run: |
          echo "🏗️ Building rtabmap base image..."
          
          docker buildx build \
            --platform linux/arm64 \
            --file docker/base/Dockerfile.rtabmap \
            --tag "ghcr.io/krikz/rob_box_base:rtabmap-latest" \
            --tag "localhost:5000/krikz/rob_box_base:rtabmap-latest" \
            --load \
            --build-arg="APT_PROXY=http://host.docker.internal:3142" \
            docker/base
          
          if [ "${{ github.event.inputs.push_to_registry }}" = "true" ]; then
            docker push localhost:5000/krikz/rob_box_base:rtabmap-latest
          fi
          echo "✅ rtabmap base image ready"

      - name: Build depthai base image
        run: |
          echo "🏗️ Building depthai base image..."
          
          docker buildx build \
            --platform linux/arm64 \
            --file docker/base/Dockerfile.depthai \
            --tag "ghcr.io/krikz/rob_box_base:depthai-latest" \
            --tag "localhost:5000/krikz/rob_box_base:depthai-latest" \
            --load \
            --build-arg="APT_PROXY=http://host.docker.internal:3142" \
            docker/base
          
          if [ "${{ github.event.inputs.push_to_registry }}" = "true" ]; then
            docker push localhost:5000/krikz/rob_box_base:depthai-latest
          fi
          echo "✅ depthai base image ready"

      - name: Build pcl base image
        run: |
          echo "🏗️ Building pcl base image..."
          
          docker buildx build \
            --platform linux/arm64 \
            --file docker/base/Dockerfile.pcl \
            --tag "ghcr.io/krikz/rob_box_base:pcl-latest" \
            --tag "localhost:5000/krikz/rob_box_base:pcl-latest" \
            --load \
            --build-arg="BASE_IMAGE=ghcr.io/krikz/rob_box_base:ros2-zenoh" \
            --build-arg="APT_PROXY=http://host.docker.internal:3142" \
            docker/base
          
          if [ "${{ github.event.inputs.push_to_registry }}" = "true" ]; then
            docker push localhost:5000/krikz/rob_box_base:pcl-latest
          fi
          echo "✅ pcl base image ready"

  # Main Pi сервисы
  build-main-services:
    needs: build-base-images
    if: always() && (needs.build-base-images.result == 'success' || needs.build-base-images.result == 'skipped')
    uses: ./.github/workflows/[L] Build Main Pi Services.yml
    with:
      push_to_registry: ${{ github.event.inputs.push_to_registry == 'true' }}

  # Vision Pi сервисы
  build-vision-services:
    needs: build-base-images
    if: always() && (needs.build-base-images.result == 'success' || needs.build-base-images.result == 'skipped')
    uses: ./.github/workflows/[L] Build Vision Pi Services.yml
    with:
      push_to_registry: ${{ github.event.inputs.push_to_registry == 'true' }}

  # Итоговая сводка
  summary:
    needs: [build-base-images, build-main-services, build-vision-services]
    runs-on: self-hosted
    if: always()
    steps:
      - name: Build Summary
        run: |
          echo "🎉 Local Build Complete!"
          echo ""
          echo "📊 Build Results:"
          echo "  Base Images: ${{ needs.build-base-images.result }}"
          echo "  Main Services: ${{ needs.build-main-services.result }}"
          echo "  Vision Services: ${{ needs.build-vision-services.result }}"
          echo ""
          echo "📦 Local Registry Contents:"
          curl -s http://localhost:5000/v2/_catalog | jq -r '.repositories[]' | grep rob_box | while read repo; do
            echo "  📁 $repo"
            curl -s "http://localhost:5000/v2/$repo/tags/list" | jq -r '.tags[]?' | while read tag; do
              echo "    🏷️ $tag"
            done
          done
          
          echo ""
          echo "🚀 Next: On Raspberry Pi, set IMAGE_TAG=local and pull from 10.1.1.5:5000"
