name: "B: Build CI Image"

# Сборка CI-образа ghcr.io/krikz/rob-box-ci:humble (ROS2 Humble и все зависимости
# тестов — экономит ~10 мин на каждом PR) по cron раз в неделю, по пушу в develop
# и вручную. Образ ОДИН (тег :humble), его берёт G: Run Tests на PR в develop.
#
# #4078, решение Шифу 27.10: ИСТОЧНИК СБОРКИ — ТОЛЬКО develop.
# Что было: 27.10 cron (schedule) собрал :humble из docker/ci/Dockerfile ветки main,
# где нет audio_common_msgs / nav2_msgs, и все G: Run Tests на PR в develop упали
# до тестов. Теперь:
#   * push — как и раньше только ветка develop; собирается запустивший коммит;
#   * schedule и workflow_dispatch — checkout `ref: develop` ЯВНО. Без `ref` они
#     собрали бы «ветку запуска»: у schedule это всегда ветка по умолчанию (main),
#     у dispatch — ветка, выбранная в «Use workflow from»;
#   * теги humble-<sha> / develop и label revision берутся от собранного коммита, а
#     не от github.sha (у schedule он указывает на main и соврал бы про источник).
# Тег :humble остаётся один — тега по ветке (humble-develop) нет.
#
# ОГОВОРКА про cron. GitHub берёт cron из файла workflow на ветке по умолчанию
# (main): «Scheduled workflows run on the latest commit on the default branch»,
# https://docs.github.com/en/actions/reference/workflows-and-actions/events-that-trigger-workflows#schedule
# Поэтому правка этого файла в develop меняет вторничный cron (04:00 UTC) только
# после релиза develop→main. До релиза cron работает по старому файлу main и снова
# соберёт :humble с main — варианты на этот срок разбираются в #4078.

on:
  schedule:
    # Каждый вторник в 04:00 UTC
    - cron: '0 4 * * 2'
  workflow_dispatch:
  push:
    branches:
      - develop
    paths:
      - 'docker/ci/Dockerfile'
      - '.github/workflows/B-Build CI Image.yml'

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build & Push CI Image
    runs-on: ubuntu-22.04

    steps:
      # Источник — всегда develop (шапка файла). push: тот самый коммит develop, что
      # запустил сборку (фильтр branches выше пускает только develop); остальное —
      # кончик develop. `github.ref` / `github.sha` источником НЕ считаются.
      - name: Checkout develop
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'push' && github.sha || 'develop' }}

      # Что именно собираем: коммит из checkout, не github.sha. Теги и label ниже
      # берут его отсюда; в логе остаётся след, откуда собран образ.
      - name: Source commit
        id: src
        env:
          TRIGGER_EVENT: ${{ github.event_name }}
          TRIGGER_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
          echo "short=${sha:0:7}" >> "$GITHUB_OUTPUT"
          echo "Источник сборки: develop @ ${sha} (триггер ${TRIGGER_EVENT}, workflow из ${TRIGGER_REF})"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── Metadata ──────────────────────────────────────────────────
      # Тег ветки — константа develop: образ всегда с develop (раньше
      # `type=ref,event=branch` у cron давал тег `main`). Label revision задаём явно:
      # авто-label у schedule — sha main, а не собранного коммита.
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/rob-box-ci
          tags: |
            type=raw,value=humble
            type=raw,value=humble-${{ steps.src.outputs.short }}
            type=raw,value=develop
          labels: |
            org.opencontainers.image.revision=${{ steps.src.outputs.sha }}

      # ── Build & push ───────────────────────────────────────────────
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: docker/ci
          file: docker/ci/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── Verify ────────────────────────────────────────────────────
      # setup.bash читает $AMENT_TRACE_SETUP_FILES без дефолта — под `set -u`
      # падает («unbound variable»), поэтому -u снимаем только на source.
      # `ros2 --version` в Humble нет (exit 2) — проверяем, что ros2 находит
      # пакет. Уже раз чинили (4f957ffa2) и потеряли при мерже e434547e1.
      - name: Smoke test
        run: |
          docker pull ghcr.io/${{ github.repository_owner }}/rob-box-ci:humble
          docker run --rm ghcr.io/${{ github.repository_owner }}/rob-box-ci:humble \
            bash -c "
              set -euo pipefail
              set +u; source /opt/ros/humble/setup.bash; set -u
              python3 -c 'import pytest; assert pytest.__version__ >= \"8\"'
              python3 -c 'import openai, httpx; print(\"OK\")'
              python3 -c 'import cv2, msgpack, aiohttp, telegram, pytz, numpy; print(cv2.__version__, numpy.__version__)'
              python3 -c 'import pytest, xdist; print(pytest.__version__, xdist.__version__)'
              ros2 pkg prefix rclpy
              ros2 pkg prefix audio_common_msgs
              ros2 pkg prefix nav2_msgs
              echo '=== SMOKE TEST PASSED ==='
            "
