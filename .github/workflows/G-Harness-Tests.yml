name: "G: Harness Tests"

# Тесты пакета rob_box_harness (см. src/rob_box_harness/).
#
# Структура:
#   * unit-tests        — default-джоба, обязательная для merge. Запускает
#                         ``pytest -m 'not network'`` без интернета и без
#                         секретов. Это и есть «зелёный CI».
#   * integration-tests — ручной/опциональный запуск. По умолчанию делает
#                         replay (записанные фикстуры), реальный MiniMax
#                         API задействуется только если в env есть
#                         ``RUN_LIVE_NETWORK_TESTS=1`` + секрет
#                         ``MINIMAX_API_KEY``. Запускается через
#                         workflow_dispatch или по расписанию.
#
# Этот файл живёт рядом с G-Run Tests.yml (который гоняет colcon-тесты
# для ROS2-узлов). Эти два workflow-а дополняют друг друга.

on:
  push:
    branches:
      - feature/**
    paths:
      - 'src/rob_box_harness/**'
      - 'pytest.ini'
      - 'conftest.py'
      - '.github/workflows/G-Harness-Tests.yml'
  workflow_dispatch:
    inputs:
      mode:
        description: 'integration-tests mode'
        required: false
        type: choice
        default: 'replay'
        options:
          - replay
          - live

permissions:
  contents: read

# Отменяем предыдущие запуски на ту же ветку, чтобы не плодить очередь.
concurrency:
  group: harness-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ===========================================================================
  # Unit tests (обязательная джоба)
  # ===========================================================================
  unit-tests:
    name: Harness unit tests (no network)
    runs-on: ubuntu-22.04
    # Harness package only exists on feature branches — NEVER on develop/main.
    # This workflow only triggers on feature/** (see trigger above).
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Verify harness package exists
        run: |
          if [ ! -d "src/rob_box_harness" ]; then
            echo "::error::src/rob_box_harness/ is missing"
            echo "::error::This workflow only runs on feature/** branches"
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          # Кэш pip по requirements-dev.txt внутри harness.
          cache: 'pip'
          cache-dependency-path: |
            src/rob_box_harness/requirements-dev.txt
            src/rob_box_harness/setup.py

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov pytest-asyncio pytest-mock
          # rob_box_llm, rob_box_core and rob_box_voice MUST be installed FIRST —
          # rob_box_harness depends on them.
          if [ -d src/rob_box_core ]; then
            pip install -e src/rob_box_core
          fi
          if [ -d src/rob_box_voice ]; then
            pip install -e src/rob_box_voice
          fi
          if [ -d src/rob_box_llm ]; then
            pip install -e src/rob_box_llm
          fi
          pip install -e src/rob_box_harness

      - name: Run unit tests with coverage
        # Строго без сети: pytest-cov считает, network-тесты авто-скипаются
        # в conftest.py (потому что нет MINIMAX_API_KEY).
        env:
          # Никаких MINIMAX_API_KEY — unit-джоба обязана работать off-line.
          PIP_DISABLE_PIP_VERSION_CHECK: '1'
        run: |
          # Дополнительная страховка от случайного сетевого вызова: режем
          # исходящие HTTP(S) на уровне процесса. В hermetic-runner'е
          # GitHub Actions по умолчанию есть выход в сеть, поэтому явно
          # блокируем.
          set -euo pipefail
          pytest -m 'not network' -v \
            --junitxml=test-results/harness-unit/junit.xml \
            --cov-report=xml:coverage-reports/harness-unit-coverage.xml \
            --cov-report=html:coverage-reports/harness-unit-html \
            --cov-fail-under=70

      - name: Verify no outbound network (sanity)
        if: always()
        # Если pytest по какой-то причине всё-таки дёрнул сеть (баг в
        # conftest или тесте), упадём здесь. Проверяем счётчики pytest-asyncio
        # и наш conftest через exit-code.
        run: |
          echo "sanity check: unit-tests must not produce 'network' marker collected"
          # Перезапускаем pytest в --collect-only и считаем network-тесты:
          NET_COUNT=$(pytest -m network --collect-only -q 2>/dev/null | grep -cE "::" || true)
          if [ "$NET_COUNT" -gt 0 ]; then
            echo "::error::Найдено $NET_COUNT network-тестов, помеченных для default-выборки."
            echo "::error::Каждый @pytest.mark.network должен либо скипаться conftest-ом,"
            echo "::error::либо вызываться ТОЛЬКО через integration-tests job."
            exit 1
          fi
          echo "ok: 0 network tests in default collection"

      - name: Upload coverage to Codecov (optional)
        if: success()
        uses: codecov/codecov-action@v5
        with:
          files: coverage-reports/harness-unit-coverage.xml
          flags: harness-unit
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: harness-unit-test-results
          path: |
            test-results/harness-unit/
            coverage-reports/
          retention-days: 14
          if-no-files-found: warn

  # ===========================================================================
  # Integration tests (опциональная, ручная или по расписанию)
  # ===========================================================================
  integration-tests:
    name: Harness integration tests (replay + optional live)
    runs-on: ubuntu-22.04
    # Не запускаем на каждом PR — только вручную или раз в сутки. Это
    # убирает flaky-фактор из default-CI.
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    environment:
      name: harness-integration
      # Требует approval, если кто-то хочет live-режим с реальным API.
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Determine run mode
        id: mode
        run: |
          # По умолчанию — replay (только фикстуры, без сети). Чтобы
          # переключиться в live, нужен одновременно secret и env-флаг.
          if [ "${{ github.event.inputs.mode }}" = "live" ] && [ -n "${{ secrets.MINIMAX_API_KEY }}" ]; then
            echo "mode=live" >> "$GITHUB_OUTPUT"
            echo "::notice::Running LIVE network tests against MiniMax API"
          else
            echo "mode=replay" >> "$GITHUB_OUTPUT"
            echo "::notice::Running REPLAY mode (no real network calls)"
          fi

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            src/rob_box_harness/requirements-dev.txt
            src/rob_box_harness/setup.py

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov pytest-asyncio pytest-mock
          # rob_box_llm, rob_box_core and rob_box_voice MUST be installed FIRST —
          # rob_box_harness depends on them.
          if [ -d src/rob_box_core ]; then
            pip install -e src/rob_box_core
          fi
          if [ -d src/rob_box_voice ]; then
            pip install -e src/rob_box_voice
          fi
          if [ -d src/rob_box_llm ]; then
            pip install -e src/rob_box_llm
          fi
          pip install -e src/rob_box_harness

      - name: Run network/integration tests
        env:
          # Если live-режим — пробрасываем секрет. В replay-режиме
          # переменная остаётся пустой, и conftest auto-skip-нет network-тесты
          # только те, что явно требуют API.
          MINIMAX_API_KEY: ${{ steps.mode.outputs.mode == 'live' && secrets.MINIMAX_API_KEY || '' }}
          HARNESS_TEST_MODE: ${{ steps.mode.outputs.mode }}
        run: |
          set -euo pipefail
          # В integration-режиме хотим гонять и network-, и integration-маркеры.
          pytest -m 'network or integration' -v \
            --junitxml=test-results/harness-integration/junit.xml \
            --cov-fail-under=40

      - name: Upload integration test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: harness-integration-test-results
          path: test-results/harness-integration/
          retention-days: 14
          if-no-files-found: warn

  # ===========================================================================
  # Test summary (показывается в PR / Run Summary)
  # ===========================================================================
  test-summary:
    name: Harness test summary
    runs-on: ubuntu-latest
    needs: [unit-tests]
    if: always()
    steps:
      - name: Generate summary
        env:
          UNIT_RESULT: ${{ needs.unit-tests.result }}
        run: |
          {
            echo "## 🧪 Harness Tests"
            echo ""
            echo "| Job | Status |"
            echo "|-----|--------|"
            echo "| unit-tests | $UNIT_RESULT |"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$UNIT_RESULT" != "success" ]; then
            {
              echo "⚠️ **unit-tests не прошли!** Merge заблокирован."
              echo ""
              echo "### Локальная отладка"
              echo ""
              echo '```bash'
              echo "pip install -e src/rob_box_harness"
              echo "pytest -m 'not network' -v"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          else
            {
              echo "✅ unit-tests зелёные — merge разрешён."
              echo ""
              echo "ℹ️ `integration-tests` (replay/live) — ручной запуск через Actions → Run workflow."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
