name: "G: Auto-merge to Main"

on:
  push:
    branches:
      - develop

permissions: read-all

jobs:
  build-and-test:
    uses: ./.github/workflows/L-Build All Services.yml
    secrets: inherit
    with:
      build_base_images: false
      push_to_registry: true

  create-pr-to-main:
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - name: Create PR to main
        run: |
          gh pr create \
            --base main \
            --head develop \
            --title "chore: release develop to main" \
            --body "Auto-merge from develop" \
            --label release,autobuild \
            || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
