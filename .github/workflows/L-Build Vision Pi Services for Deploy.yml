name: "L: Build Vision Pi Services for Deploy"

# Сборка Vision Pi сервисов на self-hosted runner для последующего деплоя на робота.
# Образы пушатся в ghcr.io с SHA-тегами; .image-versions.latest обновляется автоматически,
# чтобы L-Deploy and Verify.yml мог задеплоить свежие образы на робота.
#
# Триггеры:
# - push в main — после каждого коммита в main (если что-то изменилось в docker/vision/ или src/)
# - workflow_dispatch — ручной запуск (например, после фикса без push в main)
# - schedule — раз в сутки в полночь UTC, на случай если push-триггер не сработал или пропустил
#
# Использует self-hosted Katana-раннер (native arm64 build, без QEMU).
on:
  push:
    branches:
      - main
    paths:
      - 'docker/vision/**'
      - 'src/**'
      - '.github/workflows/L-Build Vision Pi Services for Deploy.yml'
  workflow_dispatch:
    inputs:
      service:
        description: 'Какой сервис собирать (по умолчанию all)'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - oak-d
          - led-matrix
          - ceiling-camera
          - voice-base
          - voice-resources
          - voice-assistant
          - telegram-bot
          - supercollider
      force_rebuild:
        description: 'Пересобрать все образы (даже если уже есть в ghcr.io)'
        required: false
        default: false
        type: boolean
  schedule:
    # Каждый день в полночь UTC (= 03:00 MSK)
    - cron: '0 0 * * *'

permissions:
  contents: write  # Required for git push of .image-versions files

env:
  LOCAL_REGISTRY: localhost:5000
  GHCR_REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/rob_box
  LOCAL_PREFIX: localhost:5000/krikz/rob_box
  ROS_DISTRO: humble

jobs:
  # Подготовка: вычисляем SHA-тег, проверяем какие сервисы нужно собрать
  prepare:
    runs-on: [self-hosted, Linux, X64, rob-box]
    outputs:
      services_to_build: ${{ steps.detect.outputs.services }}
      docker_tag: latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive
          clean: true
          fetch-depth: 1

      - name: Detect services to build
        id: detect
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "short_sha=${SHORT_SHA}" >> $GITHUB_OUTPUT

          REQUESTED_SERVICE="${{ inputs.service || 'all' }}"
          FORCE_REBUILD="${{ inputs.force_rebuild || 'false' }}"

          # Список сервисов для проверки
          ALL_SERVICES=(oak-d led-matrix ceiling-camera voice-base voice-resources voice-assistant telegram-bot supercollider)

          if [ "$REQUESTED_SERVICE" = "all" ]; then
            SERVICES_TO_CHECK=("${ALL_SERVICES[@]}")
          else
            SERVICES_TO_CHECK=("$REQUESTED_SERVICE")
          fi

          # Проверяем какие уже есть в ghcr.io для текущего SHA
          MISSING_SERVICES=()
          for SERVICE in "${SERVICES_TO_CHECK[@]}"; do
            if [ "$FORCE_REBUILD" = "true" ]; then
              MISSING_SERVICES+=("$SERVICE")
              continue
            fi

            TAG="${SERVICE}-${ROS_DISTRO}-${SHORT_SHA}"

            # docker buildx imagetools inspect проверяет наличие манифеста в registry
            if docker buildx imagetools inspect "${IMAGE_PREFIX}:${TAG}" >/dev/null 2>&1; then
              echo "⏭  ${TAG} already exists in ghcr.io — skipping"
            else
              echo "📦 ${TAG} missing — will build"
              MISSING_SERVICES+=("$SERVICE")
            fi
          done

          # Сохраняем через JSON для передачи в needs
          if [ ${#MISSING_SERVICES[@]} -eq 0 ]; then
            echo "✅ All requested services already built for SHA ${SHORT_SHA}"
            echo "services=[]" >> $GITHUB_OUTPUT
          else
            SERVICES_JSON=$(printf '%s\n' "${MISSING_SERVICES[@]}" | jq -R . | jq -s 'map(select(length > 0))')
            echo "services=${SERVICES_JSON}" >> $GITHUB_OUTPUT
            echo "Missing services: ${MISSING_SERVICES[@]}"
          fi

  # Параллельная сборка всех сервисов Vision Pi
  build-oak-d:
    needs: prepare
    if: ${{ needs.prepare.outputs.services_to_build != '[]' && (contains(needs.prepare.outputs.services_to_build, 'oak-d') || needs.prepare.outputs.services_to_build == '[]') }}
    runs-on: [self-hosted, Linux, X64, rob-box]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build and push oak-d
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          GHCR_TAG="${IMAGE_PREFIX}:oak-d-${ROS_DISTRO}-latest"
          SHA_TAG="${IMAGE_PREFIX}:oak-d-${ROS_DISTRO}-${SHORT_SHA}"
          docker buildx build \
            --platform linux/arm64 \
            --file docker/vision/oak-d/Dockerfile \
            --tag "${GHCR_TAG}" \
            --tag "${SHA_TAG}" \
            --push \
            docker/vision
          echo "✅ Built ${SHA_TAG}"

  build-led-matrix:
    needs: prepare
    if: ${{ needs.prepare.outputs.services_to_build != '[]' && (contains(needs.prepare.outputs.services_to_build, 'led-matrix') || needs.prepare.outputs.services_to_build == '[]') }}
    runs-on: [self-hosted, Linux, X64, rob-box]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Build and push led-matrix
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          GHCR_TAG="${IMAGE_PREFIX}:led-matrix-${ROS_DISTRO}-latest"
          SHA_TAG="${IMAGE_PREFIX}:led-matrix-${ROS_DISTRO}-${SHORT_SHA}"
          docker buildx build \
            --platform linux/arm64 \
            --file docker/vision/led_matrix/Dockerfile \
            --tag "${GHCR_TAG}" \
            --tag "${SHA_TAG}" \
            --push \
            .
          echo "✅ Built ${SHA_TAG}"

  build-ceiling-camera:
    needs: prepare
    if: ${{ needs.prepare.outputs.services_to_build != '[]' && (contains(needs.prepare.outputs.services_to_build, 'ceiling-camera') || needs.prepare.outputs.services_to_build == '[]') }}
    runs-on: [self-hosted, Linux, X64, rob-box]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Build and push ceiling-camera
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          GHCR_TAG="${IMAGE_PREFIX}:ceiling-camera-${ROS_DISTRO}-latest"
          SHA_TAG="${IMAGE_PREFIX}:ceiling-camera-${ROS_DISTRO}-${SHORT_SHA}"
          docker buildx build \
            --platform linux/arm64 \
            --file docker/vision/ceiling-camera/Dockerfile \
            --tag "${GHCR_TAG}" \
            --tag "${SHA_TAG}" \
            --push \
            docker/vision
          echo "✅ Built ${SHA_TAG}"

  build-voice-base:
    needs: prepare
    if: ${{ needs.prepare.outputs.services_to_build != '[]' && (contains(needs.prepare.outputs.services_to_build, 'voice-base') || needs.prepare.outputs.services_to_build == '[]') }}
    runs-on: [self-hosted, Linux, X64, rob-box]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Build and push voice-base
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          GHCR_TAG="${IMAGE_PREFIX}:voice-base-${ROS_DISTRO}-latest"
          SHA_TAG="${IMAGE_PREFIX}:voice-base-${ROS_DISTRO}-${SHORT_SHA}"
          docker buildx build \
            --platform linux/arm64 \
            --file docker/vision/voice_base/Dockerfile \
            --tag "${GHCR_TAG}" \
            --tag "${SHA_TAG}" \
            --push \
            docker/vision/voice_base
          echo "✅ Built ${SHA_TAG}"

  build-voice-resources:
    needs: prepare
    if: ${{ needs.prepare.outputs.services_to_build != '[]' && (contains(needs.prepare.outputs.services_to_build, 'voice-resources') || needs.prepare.outputs.services_to_build == '[]') }}
    runs-on: [self-hosted, Linux, X64, rob-box]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Build and push voice-resources
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          GHCR_TAG="${IMAGE_PREFIX}:voice-resources-${ROS_DISTRO}-latest"
          SHA_TAG="${IMAGE_PREFIX}:voice-resources-${ROS_DISTRO}-${SHORT_SHA}"
          docker buildx build \
            --platform linux/arm64 \
            --file docker/vision/voice_resources/Dockerfile \
            --tag "${GHCR_TAG}" \
            --tag "${SHA_TAG}" \
            --push \
            docker/vision
          echo "✅ Built ${SHA_TAG}"

  build-voice-assistant:
    needs: prepare
    if: ${{ needs.prepare.outputs.services_to_build != '[]' && (contains(needs.prepare.outputs.services_to_build, 'voice-assistant') || needs.prepare.outputs.services_to_build == '[]') }}
    runs-on: [self-hosted, Linux, X64, rob-box]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Build and push voice-assistant
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          GHCR_TAG="${IMAGE_PREFIX}:voice-assistant-${ROS_DISTRO}-latest"
          SHA_TAG="${IMAGE_PREFIX}:voice-assistant-${ROS_DISTRO}-${SHORT_SHA}"
          docker buildx build \
            --platform linux/arm64 \
            --file docker/vision/voice_assistant/Dockerfile \
            --tag "${GHCR_TAG}" \
            --tag "${SHA_TAG}" \
            --push \
            .
          echo "✅ Built ${SHA_TAG}"

  build-telegram-bot:
    needs: prepare
    if: ${{ needs.prepare.outputs.services_to_build != '[]' && (contains(needs.prepare.outputs.services_to_build, 'telegram-bot') || needs.prepare.outputs.services_to_build == '[]') }}
    runs-on: [self-hosted, Linux, X64, rob-box]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Build and push telegram-bot
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          GHCR_TAG="${IMAGE_PREFIX}:telegram-bot-${ROS_DISTRO}-latest"
          SHA_TAG="${IMAGE_PREFIX}:telegram-bot-${ROS_DISTRO}-${SHORT_SHA}"
          docker buildx build \
            --platform linux/arm64 \
            --file docker/vision/telegram_bot/Dockerfile \
            --tag "${GHCR_TAG}" \
            --tag "${SHA_TAG}" \
            --push \
            .
          echo "✅ Built ${SHA_TAG}"

  build-supercollider:
    needs: prepare
    if: ${{ needs.prepare.outputs.services_to_build != '[]' && (contains(needs.prepare.outputs.services_to_build, 'supercollider') || needs.prepare.outputs.services_to_build == '[]') }}
    runs-on: [self-hosted, Linux, X64, rob-box]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Build and push supercollider
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          # supercollider не имеет ROS_DISTRO в имени (исторически)
          GHCR_TAG="${IMAGE_PREFIX}:supercollider-latest"
          SHA_TAG="${IMAGE_PREFIX}:supercollider-${SHORT_SHA}"
          docker buildx build \
            --platform linux/arm64 \
            --file docker/vision/supercollider/Dockerfile \
            --tag "${GHCR_TAG}" \
            --tag "${SHA_TAG}" \
            --push \
            docker/vision/supercollider
          echo "✅ Built ${SHA_TAG}"

  # Обновление .image-versions.latest — после успешной сборки
  update-image-versions:
    needs: [prepare, build-oak-d, build-led-matrix, build-ceiling-camera, build-voice-base, build-voice-resources, build-voice-assistant, build-telegram-bot, build-supercollider]
    if: success()
    runs-on: [self-hosted, Linux, X64, rob-box]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: false
          clean: true
          fetch-depth: 1

      - name: Tag with SHA and update .image-versions
        run: |
          DOCKER_TAG="latest"
          SHORT_SHA=$(git rev-parse --short HEAD)
          NEW_TAG="${DOCKER_TAG}-${SHORT_SHA}"

          # Tag and push SHA-immutable images for each service
          # (re-tag из latest в latest-<sha> для consistency с L-Build Vision Pi Services)
          tag_and_push() {
            local SOURCE_TAG="$1"
            local SERVICE_NAME="$2"
            local LOCAL_SHA_TAG="${SOURCE_TAG}-${SHORT_SHA}"

            if docker buildx imagetools inspect "${SOURCE_TAG}" >/dev/null 2>&1; then
              docker buildx imagetools create --tag "${LOCAL_SHA_TAG}" "${SOURCE_TAG}"
              docker buildx imagetools push "${LOCAL_SHA_TAG}"
              echo "✅ ${LOCAL_SHA_TAG}"
            else
              echo "⚠️  ${SOURCE_TAG} not found, skipping tag"
            fi
          }

          tag_and_push "${LOCAL_PREFIX}:oak-d-${ROS_DISTRO}-${DOCKER_TAG}" "oak-d"
          tag_and_push "${LOCAL_PREFIX}:led-matrix-${ROS_DISTRO}-${DOCKER_TAG}" "led-matrix"
          tag_and_push "${LOCAL_PREFIX}:ceiling-camera-${ROS_DISTRO}-${DOCKER_TAG}" "ceiling-camera"
          tag_and_push "${LOCAL_PREFIX}:voice-base-${ROS_DISTRO}-${DOCKER_TAG}" "voice-base"
          tag_and_push "${LOCAL_PREFIX}:voice-resources-${ROS_DISTRO}-${DOCKER_TAG}" "voice-resources"
          tag_and_push "${LOCAL_PREFIX}:voice-assistant-${ROS_DISTRO}-${DOCKER_TAG}" "voice-assistant"
          tag_and_push "${LOCAL_PREFIX}:telegram-bot-${ROS_DISTRO}-${DOCKER_TAG}" "telegram-bot"
          # supercollider excluded: tag naming is inconsistent (no ROS_DISTRO prefix)

          # Update .image-versions.latest файл
          VERSIONS_FILE="docker/vision/.image-versions.${DOCKER_TAG}"
          if [ -f "$VERSIONS_FILE" ]; then
            sed -i \
              -e "s|^OAK_D_TAG=.*|OAK_D_TAG=${NEW_TAG}|" \
              -e "s|^RTABMAP_SYNC_TAG=.*|RTABMAP_SYNC_TAG=${NEW_TAG}|" \
              -e "s|^LED_MATRIX_TAG=.*|LED_MATRIX_TAG=${NEW_TAG}|" \
              -e "s|^CEILING_CAMERA_TAG=.*|CEILING_CAMERA_TAG=${NEW_TAG}|" \
              -e "s|^VOICE_RESOURCES_TAG=.*|VOICE_RESOURCES_TAG=${NEW_TAG}|" \
              -e "s|^VOICE_ASSISTANT_TAG=.*|VOICE_ASSISTANT_TAG=${NEW_TAG}|" \
              -e "s|^TELEGRAM_BOT_TAG=.*|TELEGRAM_BOT_TAG=${NEW_TAG}|" \
              "$VERSIONS_FILE"

            git config user.email "ci@rob-box.local"
            git config user.name "Rob Box CI"
            git add "$VERSIONS_FILE"
            if ! git diff --cached --quiet; then
              BRANCH="${GITHUB_REF#refs/heads/}"
              git commit -m "ci: vision SHA tags → ${NEW_TAG} [skip ci]"
              git pull --rebase origin "$BRANCH"
              git push origin "$BRANCH"
              echo "✅ Committed .image-versions: all vision tags → ${NEW_TAG}"
            else
              echo "ℹ️  No changes to .image-versions"
            fi
          else
            echo "⚠️  $VERSIONS_FILE not found"
          fi

  # Итоговая сводка
  summary:
    needs: [prepare, build-oak-d, build-led-matrix, build-ceiling-camera, build-voice-base, build-voice-resources, build-voice-assistant, build-telegram-bot, build-supercollider]
    runs-on: [self-hosted, Linux, X64, rob-box]
    if: always()
    steps:
      - name: Build Summary
        run: |
          echo "🎉 Vision Pi Services Build Complete!"
          echo ""
          echo "Configuration:"
          echo "  Branch: ${{ github.ref }}"
          echo "  Service: ${{ inputs.service || 'all' }}"
          echo "  Force rebuild: ${{ inputs.force_rebuild || 'false' }}"
          echo ""
          echo "Build Results:"
          echo "  prepare: ${{ needs.prepare.result }}"
          echo "  oak-d: ${{ needs.build-oak-d.result }}"
          echo "  led-matrix: ${{ needs.build-led-matrix.result }}"
          echo "  ceiling-camera: ${{ needs.build-ceiling-camera.result }}"
          echo "  voice-base: ${{ needs.build-voice-base.result }}"
          echo "  voice-resources: ${{ needs.build-voice-resources.result }}"
          echo "  voice-assistant: ${{ needs.build-voice-assistant.result }}"
          echo "  telegram-bot: ${{ needs.build-telegram-bot.result }}"
          echo "  supercollider: ${{ needs.build-supercollider.result }}"
          echo "  update-image-versions: ${{ needs.update-image-versions.result }}"
          echo ""
          echo "🚀 Готово к деплою через:"
          echo "   gh workflow run 'L-Deploy and Verify.yml' --ref main -f environment=test -f registry_source=ghcr"