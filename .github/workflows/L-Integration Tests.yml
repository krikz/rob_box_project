name: "L: Integration Tests"

# Интеграционные тесты на self-hosted Pi runner (native arm64, без QEMU).
#
# Требования к машине:
#   - GitHub Actions runner зарегистрирован с label: self-hosted
#   - Docker + docker compose установлены
#   - Локальный registry доступен на localhost:5000
#     (образы уже собраны через L-Build Vision Pi Services)
#
# Запуск:
#   - Автоматически после L-Build Vision Pi Services
#   - Вручную через workflow_dispatch

on:
  workflow_run:
    workflows: ["L: Build Vision Pi Services"]
    types: [completed]
  workflow_dispatch:
    # Ветка выбирается в UI комбобоксе при запуске → github.ref_name.
    # Тег образа auto-derived из имени ветки (main→latest, develop→dev,
    # feature/*→test, иначе local). Никаких лишних inputs не нужно.

permissions:
  contents: read

env:
  LOCAL_REGISTRY: localhost:5000
  LOCAL_PREFIX: localhost:5000/krikz/rob_box
  GHCR_PREFIX: ghcr.io/krikz/rob_box
  ROS_DISTRO: lyrical
  TEST_DIR: docker/vision/test

jobs:
  integration-tests:
    name: Integration Tests (native arm64)
    runs-on: [self-hosted, rob-box]
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # Берём ту ветку, которую выбрали в UI (workflow_dispatch)
          # или ветку из завершённого workflow_run
          ref: ${{ github.event.workflow_run.head_branch || github.ref_name }}
          clean: true

      # ── Очистка старых контейнеров и артефактов ────────────────────────────
      - name: Cleanup previous test containers
        working-directory: ${{ env.TEST_DIR }}
        # НЕ --volumes: сохраняем voice-test_ollama-models (кэш модели ~350MB)
        run: |
          docker compose -f docker-compose.test.yml down --remove-orphans 2>/dev/null || true
          # Docker создаёт пустую директорию при монтировании несуществующего
          # файла — чистим только если это директория (артефакт), не трогаем файл
          if [ -d config/zenoh_router_test.json5 ]; then
            rm -rf config/zenoh_router_test.json5
            echo "Removed stale zenoh config directory artifact"
          fi

      # ── Проверка что нужные файлы есть после checkout ─────────────────────
      - name: Verify test files exist
        run: |
          echo "=== Test directory ==="
          ls -la ${{ env.TEST_DIR }}/
          echo "=== ollama/ ==="
          ls -la ${{ env.TEST_DIR }}/ollama/
          echo "=== config/ ==="
          ls -la ${{ env.TEST_DIR }}/config/
          echo "=== File type checks (stat) ==="
          stat ${{ env.TEST_DIR }}/ollama/entrypoint.sh
          stat ${{ env.TEST_DIR }}/config/zenoh_router_test.json5
          echo "=== Ensure regular files (not dirs) ==="
          test -f ${{ env.TEST_DIR }}/ollama/entrypoint.sh && echo "entrypoint.sh: IS FILE ✓" || echo "entrypoint.sh: NOT A FILE ✗"
          test -f ${{ env.TEST_DIR }}/config/zenoh_router_test.json5 && echo "zenoh_router_test.json5: IS FILE ✓" || echo "NOT A FILE ✗"
          echo "=== First 3 lines of entrypoint.sh ==="
          head -3 ${{ env.TEST_DIR }}/ollama/entrypoint.sh || true
          echo "=== Docker version ==="
          docker version --format 'Client: {{.Client.Version}}, Server: {{.Server.Engine.Version}}' 2>/dev/null || echo "Docker daemon not accessible (self-hosted runner may need docker start)"

      # ── Определить тег ─────────────────────────────────────────────────────
      - name: Determine image tag
        id: tag
        env:
          WORKFLOW_BRANCH: ${{ github.event.workflow_run.head_branch || github.ref_name }}
        run: |
          BRANCH="$WORKFLOW_BRANCH"
          case "$BRANCH" in
            main)                 TAG="latest" ;;
            develop)              TAG="dev" ;;
            feature/*|copilot/*) TAG="test" ;;
            *)                    TAG="local" ;;
          esac
          FULL_TAG="${{ env.ROS_DISTRO }}-${TAG}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "full_tag=${FULL_TAG}" >> "$GITHUB_OUTPUT"
          echo "Image tag: voice-assistant-${FULL_TAG}"

      # ── Подготовка ─────────────────────────────────────────────────────────
      - name: Prepare test config (copy to host-accessible path)
        run: |
          # Docker daemon на хосте не видит пути внутри runner-контейнера.
          # Копируем в /tmp/ — един для хоста и контейнера.
          # Важно: rm -rf перед cp, иначе при повторном запуске файлы
          # уходят в /tmp/test_config/config/ вместо /tmp/test_config/.
          rm -rf /tmp/test_config /tmp/test_scenarios /tmp/test_results
          cp -r ${{ env.TEST_DIR }}/config /tmp/test_config
          cp -r ${{ env.TEST_DIR }}/scenario_runner/scenarios /tmp/test_scenarios
          mkdir -p /tmp/test_results
          echo "Config copied:"
          cat /tmp/test_config/zenoh_router_test.json5
          echo "Scenarios:"
          ls -la /tmp/test_scenarios/

      - name: Prepare results directory
        run: mkdir -p ${{ env.TEST_DIR }}/results

      # ── Запуск тестов ──────────────────────────────────────────────────────
      # Образ берётся из локального registry (уже собран L-Build)
      - name: Run integration tests
        id: run_tests
        working-directory: ${{ env.TEST_DIR }}
        env:
          SERVICE_IMAGE_PREFIX: ${{ env.LOCAL_PREFIX }}
          # Compose уже добавляет ${ROS_DISTRO}- префикс — передаём только branch tag
          IMAGE_TAG: ${{ steps.tag.outputs.tag }}
          ROS_DISTRO: ${{ env.ROS_DISTRO }}
          PLATFORM: linux/arm64
        run: |
          # Монтируем конфиг/сценарии/результаты из /tmp/ — этот путь виден Docker daemon на хосте
          # (./config внутри runner-контейнера → /runner/_work/... — daemon не видит)
          sed -i 's|\./config|/tmp/test_config|g' docker-compose.test.yml
          sed -i 's|\./scenario_runner/scenarios|/tmp/test_scenarios|g' docker-compose.test.yml
          sed -i 's|\./results|/tmp/test_results|g' docker-compose.test.yml
          docker compose -f docker-compose.test.yml up \
            --build \
            --abort-on-container-exit \
            --exit-code-from scenario-runner \
            --timeout 300
        continue-on-error: true

      # ── Логи при падении — все контейнеры ──────────────────────────────
      - name: Show all container logs on failure
        if: steps.run_tests.outcome != 'success'
        working-directory: ${{ env.TEST_DIR }}
        run: |
          echo "=============================================="
          echo "  INTEGRATION TEST FAILURE — ALL CONTAINER LOGS"
          echo "=============================================="
          for svc in zenoh-router-test ollama voice-test scenario-runner; do
            echo ""
            echo "=== $svc (last 50 lines) ==="
            docker compose -f docker-compose.test.yml logs "$svc" --tail 50 2>/dev/null || echo "(no logs for $svc)"
          done
          echo ""
          echo "=== Container status at failure ==="
          docker compose -f docker-compose.test.yml ps 2>/dev/null || true

      # ── Остановка ─────────────────────────────────────────────────────────
      - name: Stop containers
        if: always()
        working-directory: ${{ env.TEST_DIR }}
        run: docker compose -f docker-compose.test.yml down --remove-orphans || true

      # ── Вывод результатов ─────────────────────────────────────────────────
      - name: Display results
        if: always()
        run: |
          if [ -f /tmp/test_results/test_results.json ]; then
            python3 -c "
          import json
          d = json.load(open('/tmp/test_results/test_results.json'))
          print(f\"Results: {d['passed']}/{d['total']} passed ({d['failed']} failed)\")
          for s in d['scenarios']:
              icon = '✓' if s['passed'] else '✗'
              print(f\"  {icon} {s['name']}\")
          "
          else
            echo "No results file found"
          fi

      # ── GitHub Step Summary ────────────────────────────────────────────────
      - name: Write job summary
        if: always()
        run: |
          echo "## 🤖 Integration Test Results (local runner)" >> "$GITHUB_STEP_SUMMARY"
          echo "**Image:** \`voice-assistant-${{ steps.tag.outputs.full_tag }}\` from \`${{ env.LOCAL_REGISTRY }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ -f /tmp/test_results/test_results.json ]; then
            python3 -c "
          import json, os
          d = json.load(open('/tmp/test_results/test_results.json'))
          summary = os.environ['GITHUB_STEP_SUMMARY']
          with open(summary, 'a') as f:
              f.write(f\"**{d['passed']}/{d['total']} passed**\n\n\")
              f.write('| Scenario | Status |\n|----------|--------|\n')
              for s in d['scenarios']:
                  icon = '✅' if s['passed'] else '❌'
                  f.write(f\"| {s['name']} | {icon} |\n\")
          "
          else
            echo "⚠️ No results file — tests may have crashed" >> "$GITHUB_STEP_SUMMARY"
          fi

      # ── Артефакты ─────────────────────────────────────────────────────────
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: integration-test-results-local-${{ steps.tag.outputs.full_tag }}
          path: /tmp/test_results/test_results.json
          retention-days: 30
          if-no-files-found: warn

      # ── Финал ─────────────────────────────────────────────────────────────
      - name: Fail if tests failed
        if: steps.run_tests.outcome != 'success'
        run: |
          echo "❌ Integration tests FAILED"
          exit 1
