name: "G: PR Contract-Drift Bot"

# ADR-0044: PR-comment bot — contract-drift vs rebase-candidate классификация
# красного CI. Ретро t_527e1231 → process-fix t_58c69473.
#
# ЗАЧЕМ: PR #1857 стоял MERGEABLE+UNSTABLE с единственным красным чеком
# «Unit Tests (ROS2 Humble)» — contract drift ВНУТРИ PR (реализация и тест
# разошлись в одном диффе). Процесс отреагировал rebase-карточкой
# (t_002aae48, assignee=default), которая rebase-ом не чинится: карточка
# провисела 1.6ч. Ретро t_6d19aace зафиксировала тот же класс — «contract
# drift после 9 rebase-циклов».
#
# ЧТО ДЕЛАЕТ: один информационный комментарий на PR с разбивкой красных
# чеков на contract-drift (лечить код) vs rebase-candidate (может помочь
# rebase). НЕ ставит метки, НЕ закрывает issues/PR, НЕ создаёт kanban-карточек
# (это territory merge-gate / e2e-process, ADR-0014 / ADR-0022).
#
# ДЕДУП: маркер <!-- contract-drift-bot --> в теле комментария; в окне
# DEDUP_HOURS существующий комментарий ОБНОВЛЯЕТСЯ (PATCH), а не дублируется.

on:
  workflow_run:
    workflows:
      - "G: Run Tests"
      - "G: Lint Code"
      - "G: TTS Provider Tests + Coverage"
    types:
      - completed
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number to classify (manual run / debug).
        required: true
        type: string

permissions:
  contents: read
  pull-requests: write
  actions: read

concurrency:
  # Один бот на PR (или на upstream-run для workflow_run) — параллельные
  # прогоны иначе постят два комментария до того, как дедуп их увидит.
  group: >-
    contract-drift-bot-${{ github.event.inputs.pr_number
      || github.event.workflow_run.pull_requests[0].number
      || github.event.workflow_run.head_branch
      || github.run_id }}
  cancel-in-progress: true

jobs:
  classify:
    name: Classify failing checks
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout (script only)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Resolve target PR
        id: target
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          INPUT_PR: ${{ github.event.inputs.pr_number }}
          RUN_PR: ${{ github.event.workflow_run.pull_requests[0].number }}
          RUN_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          # CRLF-санитизация workflow-инпутов (skill:
          # github-actions-crlf-input-sanitization) — GH может отдать \r.
          pr="$(printf '%s' "${INPUT_PR:-}" | tr -d '\r\n' | tr -cd '0-9')"
          if [ -z "$pr" ]; then
            pr="$(printf '%s' "${RUN_PR:-}" | tr -d '\r\n' | tr -cd '0-9')"
          fi
          if [ -z "$pr" ] && [ -n "${RUN_HEAD_BRANCH:-}" ]; then
            # workflow_run на fork/branch-push не отдаёт pull_requests[] —
            # ищем OPEN PR по head-ветке.
            branch="$(printf '%s' "$RUN_HEAD_BRANCH" | tr -d '\r\n')"
            pr="$(gh pr list --repo "$GH_REPO" --state open --head "$branch" \
              --json number --jq '.[0].number // ""' 2>/dev/null || echo '')"
          fi
          if [ -z "$pr" ]; then
            echo "no target PR resolved — nothing to classify (skip)"
            echo "pr=" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          echo "target PR: #${pr}"
          echo "pr=${pr}" >>"$GITHUB_OUTPUT"

      - name: Classify and comment
        if: steps.target.outputs.pr != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.target.outputs.pr }}
          DEDUP_HOURS: "6"
        run: |
          set -euo pipefail
          bash .github/scripts/pr_contract_drift_bot.sh
