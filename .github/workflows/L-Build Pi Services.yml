name: "L: Build Pi Services"
# run-name виден только у прямого запуска (workflow_dispatch); по нему
# "L: Integration Tests" (workflow_run) отличает сборку Sound Pi от прочих.
run-name: "L: Build Pi Services (${{ inputs.pi }})"

# Локальная сборка сервисов ОДНОГО Pi на self-hosted runner (ADR-0159 PR-3,
# решение В4 «унифицируем»). Был по workflow на Pi — "L-Build Vision Pi
# Services.yml" и "L-Build Main Pi Services.yml", две копии одного текста;
# Pi теперь — вход `pi`, а всё, чем Pi различаются, — данные:
#   * состав сборки, Dockerfile'ы, теги, build-args, порядок — docker/build-manifest.yaml
#     (pis.<pi>) через scripts/ci/gen_build_matrix.py --pi <pi>;
#   * какие файлы .image-versions.* обновить — те docker/<pi>/, где поле
#     объявлено (scripts/ci/write-image-versions.sh): PERCEPTION_TAG собирает
#     main, а читают и main, и sound (sensor-bridge, ADR-0159 §2.5);
#   * имя коммита — `ci: <pi> SHA tags → <тег>`.
# Порядок между Pi не нужен: depends_on допустим только внутри своего Pi
# (gen_build_matrix.load_manifest это проверяет), поэтому "L: Build All
# Services" зовёт этот workflow для трёх Pi параллельно.
on:
  workflow_dispatch:  # Ручной запуск
    inputs:
      pi:
        description: 'Какой Pi собрать (pis.<pi> в docker/build-manifest.yaml)'
        required: true
        type: choice
        options:
          - main
          - sound
          - vision
      push_to_registry:
        description: 'Push to local registry (localhost:5000)'
        required: false
        default: true
        type: boolean
  workflow_call:  # Вызов из "L: Build All Services"
    inputs:
      pi:
        description: 'Какой Pi собрать: main | sound | vision'
        required: true
        type: string
      push_to_registry:
        description: 'Push to local registry'
        required: false
        default: true
        type: boolean

permissions:
  contents: write  # Required for git push of .image-versions files

env:
  LOCAL_REGISTRY: localhost:5000
  IMAGE_PREFIX: ghcr.io/krikz/rob_box
  LOCAL_PREFIX: localhost:5000/krikz/rob_box
  ROS_DISTRO: humble
  PI: ${{ inputs.pi }}

jobs:
  # Определение тега
  prepare:
    runs-on: [self-hosted, rob-box]
    outputs:
      docker_tag: ${{ steps.set-config.outputs.docker_tag }}
      # Состав сборки — данные (docker/build-manifest.yaml), а не текст этого
      # файла (план §5 Phase 2): waves — волны сборки Pi (волна k зависит
      # только от волн < k), wave_count — их число, services — все сервисы Pi.
      waves: ${{ steps.gen-matrix.outputs.waves }}
      wave_count: ${{ steps.gen-matrix.outputs.wave_count }}
      services: ${{ steps.gen-matrix.outputs.services }}
    steps:
      - name: Clean stale submodules
        run: |
          rm -rf src/ros2leds src/vesc_nexus 2>/dev/null || true
          git sparse-checkout disable 2>/dev/null || true
          git checkout --force HEAD 2>/dev/null || true

      - name: Checkout repository
        # Нужен только ради scripts/ci/gen_build_matrix.py и
        # docker/build-manifest.yaml — субмодули здесь не требуются
        # (как в update-image-versions).
        uses: actions/checkout@v7
        with:
          submodules: false
          clean: true

      - name: Set build configuration
        id: set-config
        run: |
          # shellcheck disable=SC1083  # z-{e2e}/* и z-{agent}/* — фигурные скобки
          # здесь ЛИТЕРАЛЬНЫЕ символы паттерна bash, не подстановка (см. ниже).
          # Issue #1041: на refs/tags/vX.Y.Z... strip refs/heads/ даёт refs/tags/v...,
          # что не матчит ни одну ветку — попадает в else → DOCKER_TAG=local,
          # а файла docker/<pi>/.image-versions.local не существует.
          # Релизные теги v* мапим в latest (production), это согласовано с
          # L-Deploy and Verify.yml (production → IMAGE_TAG=latest).
          # РЕВЕРТ #1139 (13.08): SHA-теги снова коммитятся прямо в текущую ветку.
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]] && [[ "${GITHUB_REF_NAME}" == v* ]]; then
            DOCKER_TAG="latest"
          else
            BRANCH_NAME="${GITHUB_REF#refs/heads/}"
            if [ "$BRANCH_NAME" = "main" ]; then
              DOCKER_TAG="latest"
            elif [ "$BRANCH_NAME" = "develop" ]; then
              DOCKER_TAG="dev"
            # ⚠️ ЛОВУШКА (обнаружено при PR #2105, ветка
            # z-agent/2100-operator-tts-return-channel): паттерны
            # `z-{e2e}/*` и `z-{agent}/*` матчатся ДОСЛОВНО, фигурные
            # скобки — литеральные символы паттерна bash [[ == ]], а не
            # плейсхолдер. `{agent}` без запятой внутри НЕ проходит brace
            # expansion (для него нужны `,` или `..`), так что паттерн
            # реально требует ветку вида `z-{agent}/...` (буквально со
            # скобками в имени — это валидное имя ветки в git). Ветка,
            # названная `z-agent/...` (БЕЗ скобок, что выглядит естественнее
            # для человека) сюда не попадает и проваливается в `else` →
            # DOCKER_TAG=local. Тег `local` в registry НЕ публикуется
            # (см. update-image-versions ниже) → deploy этой ветки тихо
            # получает старый образ, без единой ошибки в логах. Именно это
            # произошло с PR #2105. Если заводишь новую агентскую ветку —
            # называй её `z-{agent}/...` (со скобками, см.
            # .agents/skills/github-issues-workflow/SKILL.md) либо
            # расширь этот паттерн (`z-agent/*` тоже) — сознательно НЕ
            # трогаем это здесь, чтобы не задеть уже работающий поток PR #2105.
            elif [[ "$BRANCH_NAME" == feature/* ]] || [[ "$BRANCH_NAME" == feat/* ]] || [[ "$BRANCH_NAME" == copilot/* ]] || [[ "$BRANCH_NAME" == z-{e2e}/* ]] || [[ "$BRANCH_NAME" == z-{agent}/* ]]; then
              DOCKER_TAG="test"
            else
              DOCKER_TAG="local"
            fi
          fi
          echo "docker_tag=${DOCKER_TAG}" >> "$GITHUB_OUTPUT"
          echo "Docker Tag: $DOCKER_TAG"

      - name: Ensure PyYAML (зависимость scripts/ci/gen_build_matrix.py)
        # Генератор читает YAML-манифест. На self-hosted раннере PyYAML обычно
        # стоит системным пакетом; если нет — ставим в --user и ФЕЙЛИМ шаг,
        # если и это не вышло. Молчаливый фолбэк здесь недопустим: пустая
        # matrix означала бы "собрано 0 сервисов" при зелёном workflow.
        run: |
          python3 -c "import yaml" 2>/dev/null && exit 0
          python3 -m pip install --quiet --no-cache-dir --user pyyaml \
            || python3 -m pip install --quiet --no-cache-dir --user --break-system-packages pyyaml \
            || true
          python3 -c "import yaml; print('PyYAML', yaml.__version__)"

      - name: Generate build waves from docker/build-manifest.yaml
        # docs/plans/2026-09-15-service-manifest.md §5 Phase 2. Состав сборки,
        # пути к Dockerfile'ам, формула тега и build-args НЕ живут в тексте
        # этого файла — они вычисляются из манифеста. Единственное место
        # правки при добавлении/удалении сервиса — docker/build-manifest.yaml
        # (guard scripts/ci/tests/test_service_manifest_sync.py следит, что
        # workflow действительно читает манифест, а не копию списка).
        id: gen-matrix
        env:
          DOCKER_TAG: ${{ steps.set-config.outputs.docker_tag }}
        run: |
          GEN=(python3 scripts/ci/gen_build_matrix.py
            --manifest docker/build-manifest.yaml
            --pi "$PI"
            --docker-tag "$DOCKER_TAG"
            --ros-distro "$ROS_DISTRO"
            --image-prefix "$IMAGE_PREFIX"
            --local-prefix "$LOCAL_PREFIX")
          WAVES="$("${GEN[@]}" --mode waves)"
          WAVE_COUNT="$(python3 -c 'import json, sys; print(len(json.load(sys.stdin)))' <<< "$WAVES")"
          SERVICES="$("${GEN[@]}" --mode services --format shell)"
          if [ "$WAVE_COUNT" -lt 1 ]; then
            echo "::error::pis.${PI}: в манифесте нет ни одного сервиса — собирать нечего" >&2
            exit 1
          fi
          {
            echo "waves=${WAVES}"
            echo "wave_count=${WAVE_COUNT}"
            echo "services=${SERVICES}"
          } >> "$GITHUB_OUTPUT"
          echo "Pi:                ${PI}"
          echo "Docker Tag:        ${DOCKER_TAG}"
          echo "Manifest services: ${SERVICES}"
          echo "Waves (${WAVE_COUNT}):     ${WAVES}"

  # ======================================================================
  # Сборка сервисов Pi волнами. Состав, Dockerfile'ы, build-args и формула тега —
  # docker/build-manifest.yaml (docs/plans/2026-09-15-service-manifest.md).
  # Волна k = уровень k топосортировки depends_on (gen_build_matrix.topo_layers):
  # `build` — волна 0 (всё, что ни от кого не зависит), `build-wave-1` ждёт
  # волну 0, `build-wave-2` — волну 1. Пример Sound Pi: voice-base и
  # supercollider → voice-assistant (FROM voice-base) → supervisor (FROM
  # voice-assistant): без needs: supervisor собрался бы раньше, чем
  # voice-assistant допушит свежий образ, и унаследовал бы СТАРЫЙ
  # rob_box_core (ModuleNotFoundError, гонка 09.09.2026). Цена волн против
  # прежних именованных job'ов — волна ждёт всю предыдущую волну, а не только
  # свою базу (voice-assistant ждёт и supercollider). Wave-job'ов ровно
  # столько, сколько волн у самого глубокого Pi манифеста (guard
  # test_service_manifest_sync сверяет); у Pi с меньшим числом волн лишние
  # job'ы пропускаются по `if:` (пустую matrix GitHub не принимает).
  # Тело у всех wave-job'ов — один и тот же шаблон шагов (guard сверяет их пошагово).
  #
  # Issue #2280: buildx-сборка — в composite ./.github/actions/l-build-service.
  # ВАЖНО (fix run #34366133083): composite — buildx-only, GitHub требует
  # checkout ДО вызова локального action (иначе "Did you forget to run
  # actions/checkout"). Поэтому каждый build-job: clean-stale + checkout →
  # опциональные pre-step'ы (source-hash, pre_build-хук) → composite. Внутри
  # composite: buildx --load (образ в daemon — нужен update-image-versions) +
  # docker push ТОЛЬКО локального registry; GHCR не пушим (issue #1503,
  # run #34368750126).
  #
  # fail-fast: false — падение одного сервиса волны НЕ отменяет остальные
  # (как было, когда каждый сервис был отдельным job'ом).
  # ======================================================================

  # Общий образ ROS-сообщений (src/rob_box_*_msgs) — до первой волны: сервисы
  # с `msgs_image: true` берут его build-arg'ом MSGS_IMAGE (тег — хэш пакетов,
  # тот же, что посчитал prepare). Из "L: Build All Services" сюда приходим,
  # когда образ уже собран один раз на все три Pi — job видит тег в registry
  # и пропускает сборку за секунды.
  msgs:
    uses: ./.github/workflows/L-Build Msgs Image.yml

  build:
    name: build-${{ matrix.name }}
    needs: [prepare, msgs]
    runs-on: [self-hosted, rob-box]
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.waves)[0] }}
    steps:
      - name: Clean stale submodules
        run: |
          rm -rf src/ros2leds src/vesc_nexus 2>/dev/null || true
          git sparse-checkout disable 2>/dev/null || true
          git checkout --force HEAD 2>/dev/null || true

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive
          clean: true

      - name: Compute sources hash (cache invalidation)
        # Пути/расширения — из docker/build-manifest.yaml (source_hash.groups),
        # формула — scripts/ci/source_hash.sh (одна на все сервисы, issue #2314).
        id: source-hash
        if: matrix.source_hash_arg != ''
        env:
          SOURCE_HASH_ARG: ${{ matrix.source_hash_arg }}
          SOURCE_HASH_SPEC: ${{ matrix.source_hash_spec }}
        run: |
          HASH="$(bash scripts/ci/source_hash.sh "$SOURCE_HASH_SPEC")"
          echo "  ${SOURCE_HASH_ARG}=${HASH}"
          echo "build_arg=${SOURCE_HASH_ARG}=${HASH}" >> "$GITHUB_OUTPUT"

      - name: Run pre_build hook ${{ matrix.pre_build }}
        # План §2.5: манифест хранит только ФАКТ наличия хука, логика — код
        # (scripts/ci/fetch_hailort_wheel.sh), а не данные.
        if: matrix.pre_build == 'fetch_hailort_wheel'
        run: bash scripts/ci/fetch_hailort_wheel.sh

      - name: Build ${{ matrix.name }}
        uses: ./.github/actions/l-build-service
        with:
          service-name: ${{ matrix.name }}
          dockerfile-path: ${{ matrix.dockerfile }}
          build-context: ${{ matrix.build_context }}
          compute-submodule-sha: ${{ matrix.submodule_sha }}
          tags: |
            ${{ matrix.tags }}
          build-args: |
            ${{ matrix.build_args }}
            ${{ steps.source-hash.outputs.build_arg }}

  build-wave-1:
    name: build-${{ matrix.name }}
    needs: [prepare, build]
    if: ${{ !cancelled() && !failure() && fromJSON(needs.prepare.outputs.wave_count) > 1 }}
    runs-on: [self-hosted, rob-box]
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.waves)[1] }}
    steps:
      - name: Clean stale submodules
        run: |
          rm -rf src/ros2leds src/vesc_nexus 2>/dev/null || true
          git sparse-checkout disable 2>/dev/null || true
          git checkout --force HEAD 2>/dev/null || true

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive
          clean: true

      - name: Compute sources hash (cache invalidation)
        # Пути/расширения — из docker/build-manifest.yaml (source_hash.groups),
        # формула — scripts/ci/source_hash.sh (одна на все сервисы, issue #2314).
        id: source-hash
        if: matrix.source_hash_arg != ''
        env:
          SOURCE_HASH_ARG: ${{ matrix.source_hash_arg }}
          SOURCE_HASH_SPEC: ${{ matrix.source_hash_spec }}
        run: |
          HASH="$(bash scripts/ci/source_hash.sh "$SOURCE_HASH_SPEC")"
          echo "  ${SOURCE_HASH_ARG}=${HASH}"
          echo "build_arg=${SOURCE_HASH_ARG}=${HASH}" >> "$GITHUB_OUTPUT"

      - name: Run pre_build hook ${{ matrix.pre_build }}
        # План §2.5: манифест хранит только ФАКТ наличия хука, логика — код
        # (scripts/ci/fetch_hailort_wheel.sh), а не данные.
        if: matrix.pre_build == 'fetch_hailort_wheel'
        run: bash scripts/ci/fetch_hailort_wheel.sh

      - name: Build ${{ matrix.name }}
        uses: ./.github/actions/l-build-service
        with:
          service-name: ${{ matrix.name }}
          dockerfile-path: ${{ matrix.dockerfile }}
          build-context: ${{ matrix.build_context }}
          compute-submodule-sha: ${{ matrix.submodule_sha }}
          tags: |
            ${{ matrix.tags }}
          build-args: |
            ${{ matrix.build_args }}
            ${{ steps.source-hash.outputs.build_arg }}

  build-wave-2:
    name: build-${{ matrix.name }}
    needs: [prepare, build-wave-1]
    if: ${{ !cancelled() && !failure() && fromJSON(needs.prepare.outputs.wave_count) > 2 }}
    runs-on: [self-hosted, rob-box]
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.waves)[2] }}
    steps:
      - name: Clean stale submodules
        run: |
          rm -rf src/ros2leds src/vesc_nexus 2>/dev/null || true
          git sparse-checkout disable 2>/dev/null || true
          git checkout --force HEAD 2>/dev/null || true

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive
          clean: true

      - name: Compute sources hash (cache invalidation)
        # Пути/расширения — из docker/build-manifest.yaml (source_hash.groups),
        # формула — scripts/ci/source_hash.sh (одна на все сервисы, issue #2314).
        id: source-hash
        if: matrix.source_hash_arg != ''
        env:
          SOURCE_HASH_ARG: ${{ matrix.source_hash_arg }}
          SOURCE_HASH_SPEC: ${{ matrix.source_hash_spec }}
        run: |
          HASH="$(bash scripts/ci/source_hash.sh "$SOURCE_HASH_SPEC")"
          echo "  ${SOURCE_HASH_ARG}=${HASH}"
          echo "build_arg=${SOURCE_HASH_ARG}=${HASH}" >> "$GITHUB_OUTPUT"

      - name: Run pre_build hook ${{ matrix.pre_build }}
        # План §2.5: манифест хранит только ФАКТ наличия хука, логика — код
        # (scripts/ci/fetch_hailort_wheel.sh), а не данные.
        if: matrix.pre_build == 'fetch_hailort_wheel'
        run: bash scripts/ci/fetch_hailort_wheel.sh

      - name: Build ${{ matrix.name }}
        uses: ./.github/actions/l-build-service
        with:
          service-name: ${{ matrix.name }}
          dockerfile-path: ${{ matrix.dockerfile }}
          build-context: ${{ matrix.build_context }}
          compute-submodule-sha: ${{ matrix.submodule_sha }}
          tags: |
            ${{ matrix.tags }}
          build-args: |
            ${{ matrix.build_args }}
            ${{ steps.source-hash.outputs.build_arg }}

  update-image-versions:
    # needs: все wave-job'ы. Пропущенная по `if:` волна (у Pi меньше волн) —
    # не ошибка, поэтому условие `!cancelled() && !failure()`, а не
    # success(): success() считает пропущенную зависимость поводом
    # пропустить и этот job.
    needs: [prepare, build, build-wave-1, build-wave-2]
    runs-on: [self-hosted, rob-box]
    if: ${{ !cancelled() && !failure() && inputs.push_to_registry != false }}
    # Issue #t_dd49849b: 2.7h+ hang observed on concurrent runs (round-224+225+develop)
    # when git pull --rebase / git push blocked indefinitely under ref contention.
    # Hard 10-min cap surfaces the failure visibly (instead of stuck-in_progress).
    timeout-minutes: 10
    steps:
      - name: Clean stale submodules
        run: |
          rm -rf src/ros2leds src/vesc_nexus 2>/dev/null || true
          git sparse-checkout disable 2>/dev/null || true
          git checkout --force HEAD 2>/dev/null || true

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: false
          clean: true
          fetch-depth: 0

      - name: Ensure PyYAML (зависимость scripts/ci/gen_build_matrix.py)
        run: |
          python3 -c "import yaml" 2>/dev/null && exit 0
          python3 -m pip install --quiet --no-cache-dir --user pyyaml \
            || python3 -m pip install --quiet --no-cache-dir --user --break-system-packages pyyaml \
            || true
          python3 -c "import yaml; print('PyYAML', yaml.__version__)"

      - name: Tag with SHA and update .image-versions
        # Bugfix issue #1482: вместо `git rev-parse --short HEAD` используем
        # `${GITHUB_SHA::7}` — это commit, который ТРИГГЕРНУЛ workflow run,
        # неизменный на всём протяжении run и равный round-ветке HEAD в момент
        # dispatch/call. Прежний подход брал локальный HEAD, который мог
        # сместиться после `git pull --rebase` внутри scripts/ci/push-image-versions.sh
        # → .image-versions.test указывал на несуществующий image (`docker compose pull`
        # failed → fallback на stale-83d4064f), робот не обновлялся (round-163).
        run: |
          DOCKER_TAG="${{ needs.prepare.outputs.docker_tag }}"
          SHORT_SHA="${GITHUB_SHA::7}"
          NEW_TAG="${DOCKER_TAG}-${SHORT_SHA}"

          # Какие образы получают SHA-тег и запись в .image-versions.* —
          # docker/build-manifest.yaml (Phase 3 плана
          # docs/plans/2026-09-15-service-manifest.md §5). Вывод: строка на
          # сервис, "<ИМЯ_ПЕРЕМЕННОЙ> <тег без префикса реестра>".
          # Сервисы с image_versions: false сюда не попадают.
          TAG_MAP="$(python3 scripts/ci/gen_build_matrix.py \
            --manifest docker/build-manifest.yaml \
            --pi "$PI" \
            --mode tags --format shell \
            --docker-tag "$DOCKER_TAG" \
            --ros-distro "$ROS_DISTRO")"
          if [ -z "$TAG_MAP" ]; then
            echo "::error::gen_build_matrix вернул пустой список тегов — нечего тегировать" >&2
            exit 1
          fi
          echo "Теги из манифеста:"
          echo "$TAG_MAP"

          # Tag and push SHA-immutable images to LOCAL registry only.
          # GHCR push убран — локальные develop/test сборки больше не публикуются
          # в ghcr.io (issue #1503 решён иначе: deploy читает из local registry
          # для develop/test, prod-push в GHCR — отдельный workflow на main).
          tag_and_push() {
            local LOCAL_TAG="$1"
            local LOCAL_SHA="${LOCAL_TAG}-${SHORT_SHA}"
            docker tag "$LOCAL_TAG" "$LOCAL_SHA" && docker push "$LOCAL_SHA"
            echo "✅ local  $LOCAL_SHA"
          }

          while read -r VERSION_VAR SERVICE_TAG; do
            [ -z "$VERSION_VAR" ] && continue
            tag_and_push "${LOCAL_PREFIX}:${SERVICE_TAG}"
          done <<< "$TAG_MAP"

          # Acceptance B (#1482): verify SHA-image is actually present in the
          # local registry BEFORE writing it to .image-versions. Если
          # .image-versions указывает на несуществующий tag → docker compose
          # pull падает → робот не обновляется (доказательства в issue #1482).
          # Тело проверки — scripts/ci/verify-image-in-registry.sh (одна копия
          # на все сборки, план docs/plans/2026-09-15-image-versions-seam.md §7.4).
          verify_in_registry() {
            bash scripts/ci/verify-image-in-registry.sh "${LOCAL_REGISTRY}" "$1"
          }

          # Проверяем КАЖДЫЙ service-tag, который пишем в .image-versions. Если
          # хотя бы один отсутствует → fail job, чтобы мерж-гейт поймал проблему
          # ДО того, как deploy потянет stale-тег.
          VERIFY_FAILED=0
          VERSION_VARS=()
          while read -r VERSION_VAR SERVICE_TAG; do
            [ -z "$VERSION_VAR" ] && continue
            VERSION_VARS+=("$VERSION_VAR")
            if ! verify_in_registry "${SERVICE_TAG}-${SHORT_SHA}"; then
              VERIFY_FAILED=1
            fi
          done <<< "$TAG_MAP"
          if [ "$VERIFY_FAILED" -eq 1 ]; then
            echo "❌ Registry verify failed для одного или нескольких SHA-тегов" >&2
            echo "   .image-versions.${DOCKER_TAG} НЕ будет обновлён (round останется на прежнем SHA)" >&2
            exit 1
          fi

          # Поля .image-versions.* — те же, что в TAG_MAP. Пишутся во ВСЕ
          # docker/*/.image-versions.${DOCKER_TAG}, где поле объявлено (поле в
          # файле Pi = этот Pi деплоит образ): PERCEPTION_TAG — в main и sound.
          # Скрипт печатает пути изменённых файлов. Phantom-поля (ADR-0094 §1.4)
          # не принадлежат ни одному сервису — их никто не переписывает.
          VERSIONS_FILES="$(bash scripts/ci/write-image-versions.sh "$DOCKER_TAG" "$NEW_TAG" "${VERSION_VARS[@]}")"
          if [ -z "$VERSIONS_FILES" ]; then
            echo "⚠️  docker/*/.image-versions.${DOCKER_TAG}: обновлять нечего"
            exit 0
          fi
          mapfile -t FILES <<< "$VERSIONS_FILES"

          git config user.email "ci@rob-box.local"
          git config user.name "Rob Box CI"
          git add "${FILES[@]}"
          if ! git diff --cached --quiet; then
            # 🔴 РЕВЕРТ #1244 (15.08, decision #1316): SHA-теги коммитим
            # ПРЯМО в текущую ветку (develop) — ci/image-versions-* ветки
            # НЕ работают (деплой при local не грузит .image-versions,
            # тянет голые dev-теги → роботы получают старые образы).
            #
            # Issue #1388: race между Pi — сборки коммитят в одну ветку.
            # scripts/ci/push-image-versions.sh делает pull --rebase перед push
            # и ФЕЙЛИТ job при невосстановимой ошибке (раньше job молча терял
            # коммит). Main и Sound правят один файл docker/sound/.image-versions.*
            # (разные строки, между ними строка-разделитель — rebase без конфликта).
            #
            # Issue #1826: round-ветки (z-{e2e}/test-round-*) — transient
            # branches для e2e-прогонов. SHA-tag push в round → agent-flow
            # видит новый HEAD → триггерит ещё build → loop (каждые ~3-4 мин).
            # SHA-теги нужны только для develop/main (deploy-flow читает из
            # .image-versions). На round-ветках deploy читает напрямую через
            # IMAGE_TAG, поэтому SHA-tag push в round НЕ нужен.
            CURRENT_BRANCH="$(git branch --show-current)"
            if [[ "${CURRENT_BRANCH}" =~ ^z-\{e2e\}/test-round- ]] || \
               [[ "${CURRENT_BRANCH}" =~ ^z-\{e2e\}/wip- ]]; then
              echo "⏭️  Issue #1826: skip SHA-tag push for round branch ${CURRENT_BRANCH}"
              echo "   (prevents infinite build loop — agent-flow would re-trigger on each SHA commit)"
              echo "   SHA-tag ${NEW_TAG} already pushed to local registry; deploy on round uses IMAGE_TAG directly"
            else
              git commit -m "ci: ${PI} SHA tags → ${NEW_TAG} [skip ci]"
              bash scripts/ci/push-image-versions.sh "$CURRENT_BRANCH" "$PI"
            fi
          fi

  # Итоговая сводка
  summary:
    needs: [prepare, build, build-wave-1, build-wave-2]
    runs-on: [self-hosted, rob-box]
    if: always()
    steps:
      - name: Build Summary
        env:
          SERVICES: ${{ needs.prepare.outputs.services }}
        run: |
          echo "🎉 ${PI} Pi Services Build Complete!"
          echo ""
          echo "Configuration:"
          echo "  Pi: ${PI}"
          echo "  Docker Tag: ${{ needs.prepare.outputs.docker_tag }}"
          echo "  Push to Registry: ${{ inputs.push_to_registry }}"
          echo "  Waves: ${{ needs.prepare.outputs.wave_count }}"
          echo ""
          echo "Services built:"
          # Список сервисов — из docker/build-manifest.yaml через prepare.
          for SVC in $SERVICES; do
            echo "  ✅ $SVC"
          done
