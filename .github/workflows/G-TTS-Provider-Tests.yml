name: "G: TTS Provider Tests + Coverage"

# Pure-Python test job for the MiniMax TTS provider (and any sibling
# TTS provider plugged into ``rob_box_llm``). Runs the conformance
# suite plus the provider-specific unit tests, enforces an 85% coverage
# gate on the MiniMax TTS module, and uploads the coverage report as a
# build artifact so reviewers can drill into missed lines without
# re-running pytest locally.
#
# Why a separate workflow from ``G-Run Tests.yml``:
#
# * The existing ``G-Run Tests.yml`` job boots ROS 2 Humble via colcon
#   to test the ROS-side packages. The MiniMax TTS provider is a
#   pure-Python module with zero ROS deps — booting the whole ROS
#   toolchain for it would add 3-5 minutes of overhead per CI run.
# * Coverage needs ``pytest-cov`` and the project-localised coverage
#   config in ``src/rob_box_llm/pytest.ini``. Wiring that through the
#   colcon invocation would muddle the existing test pipeline.
#
# Local equivalent (run from the repo root):
#
#     cd src/rob_box_llm && PYTHONPATH=. python3 -m pytest \
#         -k minimax \
#         --cov=rob_box_llm.providers.minimax_tts \
#         --cov-report=term-missing \
#         --cov-fail-under=85
#
# Or via the repo Makefile:
#
#     make test-tts

on:
  push:
    branches:
      - develop
      - main
      - 'feature/**'
    paths:
      - 'src/rob_box_llm/**.py'
      - 'src/rob_box_llm/rob_box_llm/**.py'
      - 'src/rob_box_llm/test/**.py'
      - 'src/rob_box_llm/pytest.ini'
      - 'src/rob_box_llm/setup.py'
      - '.github/workflows/G-TTS-Provider-Tests.yml'
  pull_request:
    branches:
      - develop
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tts-provider-tests:
    name: TTS Provider Tests (minimax + conformance)
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'src/rob_box_llm/setup.py'

      - name: Install rob_box_llm + dev extras
        working-directory: src/rob_box_llm
        run: |
          python -m pip install --upgrade pip
          # ``.[dev]`` pulls in pytest, pytest-asyncio, pytest-cov, respx —
          # the same matrix the conftest fixtures rely on.
          pip install -e .[dev]

      - name: Run TTS provider tests with coverage gate
        # Working directory is src/rob_box_llm so the local pytest.ini is
        # picked up (testpaths = test, asyncio_mode = auto, coverage
        # config pointing at rob_box_llm).
        working-directory: src/rob_box_llm
        env:
          # Wipe any pre-set MiniMax credentials on the runner. The
          # conftest's _scrub_minimax_env autouse fixture already
          # deletes these, but we belt-and-braces it here so the
          # logging tests' credential-leak guard has nothing real to
          # trip over.
          MINIMAX_API_KEY: ""
          MINIMAX_GROUP_ID: ""
        run: |
          PYTHONPATH=. python3 -m pytest \
            -k minimax \
            --cov=rob_box_llm.providers.minimax_tts \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-report=html:htmlcov \
            --cov-fail-under=85 \
            -v

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tts-coverage-report
          path: |
            src/rob_box_llm/coverage.xml
            src/rob_box_llm/htmlcov/
          retention-days: 30
          if-no-files-found: warn

      - name: Coverage gate summary
        if: always()
        # Surface coverage in the GitHub step summary so reviewers can
        # see the percentage without downloading the artifact.
        run: |
          if [ -f src/rob_box_llm/coverage.xml ]; then
            PCT=$(grep -oP 'line-rate="\K[0-9.]+' src/rob_box_llm/coverage.xml | head -n1)
            PCT_PCT=$(python3 -c "print(round(float('$PCT') * 100, 2))")
            echo "## 🎙️ TTS Provider Coverage" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| Provider | Coverage | Threshold | Status |" >> $GITHUB_STEP_SUMMARY
            echo "|----------|---------:|----------:|--------|" >> $GITHUB_STEP_SUMMARY
            echo "| rob_box_llm.providers.minimax_tts | ${PCT_PCT}% | 85% | ${{ job.status }} |" >> $GITHUB_STEP_SUMMARY
          else
            echo "## ⚠️ No coverage.xml produced" >> $GITHUB_STEP_SUMMARY
          fi
