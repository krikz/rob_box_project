name: "L: Auto Bug on Deploy Failure"

on:
  workflow_run:
    workflows:
      - "L: Deploy and Verify"
    types:
      - completed

permissions:
  contents: read
  issues: write
  actions: read

jobs:
  collect-deploy-failure:
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    runs-on: [self-hosted, rob-box]
    steps:
      - name: Checkout workflow revision
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1
          clean: true

      - name: Detect Docker startup crash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          FAILED_START_STEP="$(gh run view "${{ github.event.workflow_run.id }}" --repo "${{ github.repository }}" --json jobs --jq '.jobs[].steps[] | select(.conclusion == "failure") | .name' |
            grep -E '^\[(Vision|Main) Pi\] Start Containers$' | head -1 || true)"

          if [ -n "$FAILED_START_STEP" ]; then
            echo "DEPLOY_START_CRASH=true" >> "$GITHUB_ENV"
            if [[ "$FAILED_START_STEP" == "[Vision Pi] Start Containers" ]]; then
              echo "DEPLOY_START_NODE=vision_pi" >> "$GITHUB_ENV"
            else
              echo "DEPLOY_START_NODE=main_pi" >> "$GITHUB_ENV"
            fi
            echo "Detected failed startup step: $FAILED_START_STEP"
          else
            echo "DEPLOY_START_CRASH=false" >> "$GITHUB_ENV"
            echo "No Docker startup step failed; existing deploy issue handling remains authoritative."
          fi

      - name: Collect Vision Pi crash evidence
        if: env.DEPLOY_START_CRASH == 'true' && env.DEPLOY_START_NODE == 'vision_pi'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SSHPASS: ${{ secrets.ROBOT_SSH_PASS }}
          VISION_PI_IP: 10.1.1.11
          GITHUB_REF_NAME: ${{ github.event.workflow_run.head_branch }}
        run: |
          if [ -z "$SSHPASS" ]; then
            echo "ROBOT_SSH_PASS is not configured; creating fallback deploy issue without remote Docker evidence."
          fi

          bash scripts/ci/auto-bug-on-deploy-failure.sh \
            "${{ github.event.workflow_run.id }}" vision_pi - - \
            "${{ github.event.workflow_run.created_at }}" \
            "$(date -u '+%Y-%m-%dT%H:%M:%SZ')" \
            "${{ github.event.workflow_run.html_url }}"

      - name: Collect Main Pi crash evidence
        if: env.DEPLOY_START_CRASH == 'true' && env.DEPLOY_START_NODE == 'main_pi'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SSHPASS: ${{ secrets.ROBOT_SSH_PASS }}
          MAIN_PI_IP: 10.1.1.10
          GITHUB_REF_NAME: ${{ github.event.workflow_run.head_branch }}
        run: |
          if [ -z "$SSHPASS" ]; then
            echo "ROBOT_SSH_PASS is not configured; creating fallback deploy issue without remote Docker evidence."
          fi

          bash scripts/ci/auto-bug-on-deploy-failure.sh \
            "${{ github.event.workflow_run.id }}" main_pi - - \
            "${{ github.event.workflow_run.created_at }}" \
            "$(date -u '+%Y-%m-%dT%H:%M:%SZ')" \
            "${{ github.event.workflow_run.html_url }}"
