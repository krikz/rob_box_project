scene: s09_owner_passes_mask
description: владелец проходит перед маской — перекрытие
participants:
  - {label: owner, truth: Дэнчик, kind: person, known_before: true}
  - {label: mask, truth: Литвин, kind: mask, known_before: false, anchor_cx: [0.05, 0.40]}  # ПОДСТАВКА: сверить conductor.py --probe-anchor-s 10
steps:
  - say: "Начинаю сцену девять."
  - enter: owner
    say: "Дэнчик, войдите в кадр с маской."
    wait_s: 3
  - enter: mask
    say: "Поставьте маску на подставку."
    wait_s: 3
  - leave: owner
    say: "Дэнчик, выйдите из кадра. Маска остаётся."
  - enter: owner
    say: "Дэнчик, войдите в кадр справа и медленно пройдите перед маской налево."
    wait_s: 8
  - say: "Теперь пройдите обратно направо и остановитесь на метке полтора метра."
    wait_s: 10
  - speech: mask
    say: "Поднесите телефон к маске. Включите запись эс ноль девять, один."
    window_s: 8
    wait_s: 8
  - leave: owner
    say: "Дэнчик, выйдите из кадра."
