# Голос маски: /tmp/mask_voice/s07_*.mp3 на Vision Pi (стираются при
# перезагрузке) — заранее скопировать на телефон. Телефон держать у маски
# сбоку от подставки, самому оставаться ВНЕ кадра.
scene: s07_mask_introduces
description: маска «представляется» голосом с телефона
participants:
  - {label: owner, truth: Дэнчик, kind: person, known_before: true}
  - {label: mask, truth: Литвин, kind: mask, known_before: false, anchor_cx: [0.05, 0.40]}  # ПОДСТАВКА: сверить conductor.py --probe-anchor-s 10
steps:
  - say: "Начинаю сцену семь."
  - enter: owner
    say: "Дэнчик, войдите в кадр с маской."
    wait_s: 3
  - enter: mask
    say: "Поставьте маску на подставку."
    wait_s: 3
  - leave: owner
    say: "Дэнчик, выйдите из кадра. Маска остаётся."
  - say: "Встаньте сбоку от подставки вне кадра и поднесите телефон к маске."
    wait_s: 8
  - speech: mask
    say: "Включите запись эс ноль семь, один."
    window_s: 8
    wait_s: 5
  - speech: mask
    say: "Включите запись эс ноль семь, два."
    window_s: 10
    introduce: Литвин
    wait_s: 15
  - speech: mask
    say: "Включите запись эс ноль семь, три."
    window_s: 8
    wait_s: 15
