# ============================================================================
# agents_sleep_schedule.conf — расписание сна агентов (DeepSeek peak/off-peak).
# Source of truth: <repo>/scripts/agent_flow/agents_sleep_schedule.conf
# Правится ТОЛЬКО через PR (см. issue #1281, acceptance). Скрипт
# scripts/agent_flow/agents_sleep.sh читает этот файл (или рядом с собой,
# если разложен install.sh).
# ============================================================================
# Часы MSK (UTC+3), когда агенты СПЯТ (MAINTENANCE-флаг стоит в develop):
#   DeepSeek PEAK (100% цена): 01:00-04:00 + 06:00-10:00 UTC
#                            = 04:00-07:00 + 09:00-13:00 MSK
# Вне этих окон — OFF-PEAK (50% цены), агенты работают.
# Формат: "HH:MM-HH:MM,HH:MM-HH:MM" (MSK). Полуинтервал [start, end):
# в start ровно MAINTENANCE появляется, в end ровно снимается.
PEAK_HOURS="04:00-07:00,09:00-13:00"

# Справка: окна пика DeepSeek в UTC (действует с 16.08.2026).
DEEPSEEK_PEAK_UTC="01:00-04:00,06:00-10:00"
