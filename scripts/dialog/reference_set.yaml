# Эталонный набор фраз диалога (ADR-0150 §14 П2/A3/A15, решение О1; карточка #3684).
#
# ЧЕРНОВИК, НА УТВЕРЖДЕНИЕ товарищу Шифу: разметку `expected`/`must_not` читает и утверждает он (О1).
# Пока не утверждено, набор нельзя использовать как «зелёный» критерий приёмки.
#
# Поля записи:
#   id        — стабильный идентификатор (r01…);
#   text      — реплика ровно так, как её слышит STT (с вейком «Робот», если адресована; без — если нет);
#   source    — issue | log | marathon (откуда фраза; номер issue / строка лога 20.10 — в notes);
#   expected  — РОВНО ОДИН ключ:
#                 tier1: <имя>          — без LLM, код решает сам (0 вызовов LLM, A1);
#                 actions: [<тул/класс>, …] — ожидаемые действия (имена тулов v1 или классов ADR §5.1);
#                 speech_only: true     — только речь, действий нет;
#                 ask: <о чём>          — один уточняющий вопрос;
#                 silence: true         — расширение набора для A15/A31: фраза НЕ адресована, робот молчит.
#   must_not  — что считается провалом (метки: claim_without_tool / denial_without_attempt — как в honesty_audit.py;
#               tool:<имя> — вызов запрещён; speech:<подстрока> — в речи нет; llm_call — 0 вызовов LLM; …);
#   notes     — контекст, номер issue, строка лога, что неоднозначно и ждёт решения.
#
# Записи, где текст реконструирован по названию issue (оригинальной реплики в теле нет), помечены «реконструкция».

