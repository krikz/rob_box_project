# shellcheck shell=bash
# Настройки scripts/hil/hil.sh (эпик #4371). Любую можно переопределить переменной
# окружения до запуска или своим файлом: HIL_CONF=/путь/к/my.conf scripts/hil/hil.sh status.
# Схема сети и выбор адресов: docs/research/2026-11-04-hil-robot-on-gazebo-data.md §3.1, §8.

# ── ssh-цели (ключи, BatchMode; пароли не используются) ──
: "${HIL_MAIN_HOST:=ros2@10.1.1.10}"
: "${HIL_VISION_HOST:=ros2@10.1.1.21}"
# Управление песочницей — по её Wi-Fi-адресу (с машины оператора провод к ней не идёт).
: "${HIL_SANDBOX_HOST:=ros2@10.1.1.250}"

# ── Zenoh: провод робот ↔ песочница ──
# Адрес песочницы, который слушает её роутер и по которому её видят Pi.
# Провод: enp2s0 10.1.1.30/32 + маршруты /32 к .10/.11/.12 (04.11). Wi-Fi-запас: 10.1.1.250.
: "${HIL_SANDBOX_IP:=10.1.1.30}"
# Интерфейс, к которому привязаны исходящие линки роутера песочницы (#iface= в endpoint
# Zenoh). Провод пропал — линк не поднимется, а не уйдёт молча в Wi-Fi. Пусто — без привязки.
: "${HIL_SANDBOX_IFACE:=enp2s0}"
# eth0 Pi, к роутерам которых подключается песочница (Main, Vision, Sound).
: "${HIL_ROBOT_ROUTERS:=10.1.1.10 10.1.1.11 10.1.1.12}"
# ID робота; пусто — читается из .env Main Pi (ROBOT_ID=...).
: "${HIL_ROBOT_ID:=}"

# ── Робот ──
: "${HIL_MAIN_DIR:=/home/ros2/rob_box_project/docker/main}"
: "${HIL_VISION_DIR:=/home/ros2/rob_box_project/docker/vision}"
: "${HIL_LOCK:=/tmp/hil.lock}"
: "${HIL_REMOTE_DIR:=/tmp/hil}"
# Карта rtabmap в HIL (абсолютный путь на Main Pi). Не ./maps и не /data.
: "${HIL_MAPS_DIR:=/home/ros2/rob_box_hil/maps}"
: "${HIL_RTABMAP_MODE:=mapping}"

# ── Песочница ──
: "${HIL_SANDBOX_REPO:=/home/ros2/rob_box_hil}"
: "${HIL_SIM_IMAGE:=rob_box_sim:hil}"
: "${HIL_SIM_PROJECT:=rob_box_hil}"
: "${HIL_SIM_PREFIX:=rob-box-hil}"
: "${HIL_SIM_WORLD:=polygon}"
: "${HIL_SIM_DRI_CARD:=/dev/dri/card1}"
: "${HIL_SIM_DRI_RENDER:=/dev/dri/renderD128}"
# Сколько ждать «ровно один /controller_manager» после старта Gazebo, с.
: "${HIL_WAIT_CM_S:=180}"
