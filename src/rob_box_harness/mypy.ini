# mypy configuration for ``rob_box_harness``.
#
# Strategy:
#   * strict — every public class / function is annotated.
#   * ``ignore_missing_imports`` for rob_box_llm — that package
#     does not ship a py.typed marker, so mypy can't resolve it
#     by default. The trade-off: we don't get cross-package
#     checks against rob_box_llm, but we keep the strict check
#     locally. When rob_box_llm grows a ``py.typed`` marker, drop
#     the ignore.
#   * show_error_codes — friendlier CI logs.

[mypy]
strict = True
ignore_missing_imports = True
show_error_codes = True
pretty = True
plugins =
warn_unused_ignores = True
