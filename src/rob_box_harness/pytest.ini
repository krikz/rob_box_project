[pytest]
testpaths = test
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -ra --strict-markers --tb=short
markers =
    unit: fast unit tests
    harness: tests for the harness framework itself
    integration: integration tests requiring live network or hardware
    slow: tests taking >1 second
    asyncio: async test (auto-applied when pytest-asyncio plugin is installed)
# NOTE: asyncio_mode = auto is intentionally NOT set here. Harness tests use
# asyncio.run() explicitly — pytest-asyncio is optional.
[coverage:run]
source =
    rob_box_harness
omit =
    */test/*
    */tests/*
    */__pycache__/*
    */venv/*
    */build/*
    */install/*
[coverage:report]
show_missing = True
skip_covered = False
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod
