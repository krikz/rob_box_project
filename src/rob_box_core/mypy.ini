# mypy configuration for ``rob_box_core``.
#
# Mirrors the harness package: strict locally, ignore_missing_imports as a
# permissive fallback for cross-package imports during the P0/P1 ramp-up.
# Drop the ignore once ``rob_box_llm`` ships a ``py.typed`` marker.

[mypy]
strict = True
ignore_missing_imports = True
show_error_codes = True
pretty = True
plugins =
warn_unused_ignores = True
