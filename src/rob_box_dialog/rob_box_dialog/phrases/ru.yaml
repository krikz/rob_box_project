# Каталог фраз робота (ADR-0150 §5.4, ADR-0148): фразу об исполнении строит код по событию владельца.
#
# Ключ: {класс}.{статус}[.{причина}] (классы — rob_box_dialog.knowledge.ACTION_CLASSES) или особый ключ.
# Значение — 1–3 варианта; слоты {name} заполняет код из данных события. Фигурные скобки — только слоты.
# Один и тот же текст двух ключей — якорь YAML (&имя / *имя), а не копия.
# Покрытие всех (класс, статус) держит test/test_phrases.py.

# --- понимание и ход ---------------------------------------------------------------------------------------
understand.invalid: ["Не понял, повтори, пожалуйста."]
understand.timeout: ["Что-то я долго думаю — повтори, пожалуйста."]

# --- провайдеры (§8): одна фраза на смену состояния ----------------------------------------------------------
provider.exhausted.quota: ["Всё, братан, приплыли — у {subject} кончились деньги. {next}"]
provider.exhausted.network: ["У {subject} пропала сеть. {next}"]
provider.exhausted.timeout: ["{subject} не отвечает. {next}"]
provider.exhausted.auth: ["{subject} меня не пускает — ключ не подходит. {next}"]
provider.exhausted.error: ["У {subject} ошибка. {next}"]
provider.switched: ["Переключаюсь на {provider}."]
provider.switched.stt: ["Перехожу на {provider} для распознавания речи."]
# Кто именно сломался: вид называется, чтобы отказ распознавания не звучал как отказ мозга (#3755).
provider.subject.llm: ["{provider}"]
provider.subject.stt: ["{provider} (распознавание речи)"]
provider.subject.tts: ["{provider} (озвучка)"]
provider.subject.music_gen: ["{provider} (генерация музыки)"]
voice.applied: ["Говорю голосом {voice}."]
voice.unavailable: ["Голос {requested} недоступен, остаюсь на {applied}."]
voice.rejected: ["Не получилось сменить голос: провайдер {provider} не подходит."]
voice.timeout: ["Не дождался подтверждения смены голоса, не знаю, какой сейчас."]
provider.no_fallback: ["Запасного нет — потерпи, пока вернётся."]

