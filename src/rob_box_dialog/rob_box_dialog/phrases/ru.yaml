identity.renamed: ["Хорошо, теперь зову тебя {name}."]
identity.name_same: ["Я и так зову тебя {name}."]
identity.template: ["Меня зовут {name}, и это мой голос, запомни его."]
identity.say_template: ["По короткой фразе голос не узнаю. Скажи целиком: «{template}»"]
