# Каталог фраз робота (ADR-0150 §5.4, ADR-0148): фразу об исполнении строит код по событию владельца.
#
# Ключ: {класс}.{статус}[.{причина}] (классы — rob_box_dialog.knowledge.ACTION_CLASSES) или особый ключ.
# Значение — 1–3 варианта; слоты {name} заполняет код из данных события. Фигурные скобки — только слоты.
# Один и тот же текст двух ключей — якорь YAML (&имя / *имя), а не копия.
# Покрытие всех (класс, статус) держит test/test_phrases.py.

# --- понимание и ход ---------------------------------------------------------------------------------------
understand.timeout: ["Что-то я долго думаю — повтори, пожалуйста."]
# В31 (решение Шифу 23.10): ход ждёт живого провайдера; ~6 с тишины — одна промежуточная фраза за ход.
understand.progress: ["Секунду, думаю.", "Сейчас, соображаю.", "Дай подумать.", "Минутку, обдумываю."]
media.progress: ["Секунду, музыка запускается."]
# Потолок хода истёк, провайдер ещё молчит / цепочка провайдеров отказала: имя провайдера называет код.
understand.ceiling: ["{provider} так и не ответил — я перестал ждать. Повтори, пожалуйста."]
understand.provider_failed: ["{provider} не ответил — повтори, пожалуйста."]
# Модель выбрала «промолчать» на адресованную реплику (решение Шифу 22.10): роботу не молчать, а промычать.
understand.nothing_to_say: ["Хм… не знаю, что сказать.", "Не расслышал, повтори?", "Эээ… даже не знаю, что ответить.",
                            "Хм, я задумался и ничего не придумал. Повтори?"]
# Модель и после повтора ответила только анимацией (её не слышно) на адресованную реплику (#3995): анимация
# исполнена, а код говорит коротко — не молчание. Выбор кодом, без повтора подряд.
understand.silent_answer: ["Угу, я тут.", "Слышу, я здесь.", "Ага, я на связи."]
# Tier-1 «новая сессия» подтверждается вслух (решение Шифу 22.10); выбор кодом, без повтора подряд.
tier1.new_session: ["Ок, забыл всё — начинаем сначала!", "Память чиста, как свежий лист. Поехали!",
                    "Стёр всё подчистую. Привет, незнакомец!", "Был разговор — и нет разговора. Начнём заново!",
                    "Всё забыл, хоть режь. Слушаю!", "Ctrl+Z на всю беседу. Что дальше?",
                    "Перезагрузил голову. Давай по новой!", "Ничего не помню, и это прекрасно. Начинаем!"]
# Tier-1 «повтори» (#4028): повторять нечего - в этой сессии робот ещё ничего не сказал вслух.
tier1.repeat_nothing: ["Я пока ничего не говорил — повторять нечего."]

# --- провайдеры (§8): одна фраза на смену состояния ----------------------------------------------------------
provider.exhausted.quota: ["Всё, братан, приплыли — у {subject} кончились деньги. {next}"]
provider.exhausted.network: ["У {subject} пропала сеть. {next}"]
provider.exhausted.timeout: ["{subject} не отвечает. {next}"]
provider.exhausted.auth: ["{subject} меня не пускает — ключ не подходит. {next}"]
provider.exhausted.error: ["У {subject} ошибка. {next}"]
provider.switched: ["Переключаюсь на {provider}."]
provider.switched.stt: ["Перехожу на {provider} для распознавания речи."]
# Кто именно сломался: вид называется, чтобы отказ распознавания не звучал как отказ мозга (#3755).
provider.subject.llm: ["{provider}"]
provider.subject.stt: ["{provider} (распознавание речи)"]
provider.subject.tts: ["{provider} (озвучка)"]
provider.subject.music_gen: ["{provider} (генерация музыки)"]
# Смена голоса (knowledge.VOICE_DONE / VOICE_FAILED): слоты строит тул из каталога голосов - название вслух, не id
voice.applied: ["Говорю голосом {voice_name}."]
voice.applied_default: ["Говорю своим обычным голосом."]
voice.unavailable: ["Голос {requested_name} недоступен, остаюсь на {voice_name}."]
voice.unavailable_default: ["Голос {requested_name} недоступен, остаюсь на обычном."]
voice.rejected: ["Не получилось сменить голос: провайдер {provider_label} не подходит."]
voice.already_default: ["Я и так говорю своим обычным голосом."]
voice.provider_same: ["Я уже говорю через {provider_label}."]
voice.timeout: ["Не дождался подтверждения смены голоса, не знаю, какой сейчас."]
provider.no_fallback: ["Запасного нет — потерпи, пока вернётся."]

# --- классы действий (§5.1) ----------------------------------------------------------------------------------
query.rejected: ["Не нашёл ответа."]
# отказ ЧТЕНИЯ памяти кодом до владельца (memory_search/memory_context, knowledge.UNBOUND_REASONS, ревью #4053): на
# «что ты обо мне помнишь?» - не «запоминать не буду» записи и не «не нашёл ответа»
query.rejected.no_person: ["Не узнаю твой голос, поэтому не знаю, что о тебе помню."]
query.rejected.voice_unconfirmed: ["Голос знакомый, но не уверен чей — не буду гадать, что помню."]
# ...у чата Telegram и ТАРС (knowledge.NO_PERSON_UNVOICED_REASON, ревью PR #4121): их голос никто не узнаёт - без «голоса»
query.rejected.no_person_unvoiced: ["Не знаю, кто ты, поэтому не знаю, что о тебе помню."]
# отказ ЧТЕНИЯ по причине тула (#4025, #4026): поиск в интернете не ответил - это не «ничего не нашёл»; info по
# выдуманному id трека (update/delete того же - music.library_fail.unknown_track, один текст)
query.rejected.search_unavailable: ["Не смог проверить в интернете: поиск сейчас не ответил."]
query.rejected.unknown_track: &unknown_track ["Не знаю такого трека в библиотеке. Попроси показать список или найти по названию."]
query.timeout: ["Не дождался ответа — поиск не успел."]
# Страховка от молчания (#3883): запрос выполнен, речь модели не прошла проверку и после повтора — говорит код.
query.voices_summary: ["Голосов у меня так: {summary}. Назвать какие-нибудь?"]
# ...по данным списка библиотеки (music_library list, #4069 п.3): число и 2–3 названия, а не общая фраза
query.library_summary: ["Треков в библиотеке: {total}. Например: {names}."]
# ...по данным памяти (memory_search/memory_context, #4157): 2–3 факта как есть, а не общая фраза
query.memory_facts: ["Вот что нашёл в памяти: {facts}."]
# ...по данным каталога звуков (get_sound_info без аргументов, #4157): сколько звуков и по каким категориям
query.sounds_summary: ["Звуков у меня {total}: {names}. Назвать какие-нибудь?"]
# ...по данным поиска в сети (search_web, #4157 n908): текст первой строки выдачи как есть (ужимает fit_speech)
query.web_found: ["Вот что нашёл в сети: {text}."]
# Данные получены, слов по ним нет: причины фраза не называет («слишком длинно» - только command.too_long, #4137)
query.fallback_generic: ["Данные получил, а ответ у меня не сложился. Спроси ещё раз?"]
# Команда модели невалидна и после повтора (#3953): исполнять нечего - честная фраза, а не тишина на адресованное.
command.invalid_generic: ["Не понял, как это сделать. Скажи ещё раз?"]
# ...по причине: модель поняла, но ответ длиннее предела (#3883) - «не понял» было бы неправдой. Одну длинную речь
# сюда не доводят: ход компактнее, потом её ужимает код (#4137); здесь - сегмент выступления или речь рядом с другим
# нарушением.
command.too_long: ["Ответ вышел слишком длинным — спроси покороче, пожалуйста."]
# Речь, оборванную кодом посреди предложения (#4137, перечень голосов), кончает эта пометка: названо не всё.
command.speech_cut: ["и так далее."]

local.done: &done ["Готово."]
local.rejected: ["Не вышло."]
local.timeout: ["Не дождался подтверждения — не знаю, вышло ли."]
# память о людях (knowledge.PERSON_SCOPED_TOOLS / DONE_EVIDENCE): отказ без собеседника и успех без saved
local.rejected.no_person: ["Не узнаю твой голос, поэтому не запомню."]
# ...у чата Telegram и ТАРС (knowledge.NO_PERSON_UNVOICED_REASON, ревью PR #4121): их голос никто не узнаёт - без «голоса»
local.rejected.no_person_unvoiced: ["Не знаю, кто ты, поэтому не запомню."]
# голос узнан, а чей - не подтверждено (спор/гипотеза, speaker_wire.NAME_UNCONFIRMED, #3993): без вопроса «ты Саша?»
# (решение Шифу 26.10) и без неправды «не узнаю голос»
local.rejected.voice_unconfirmed: ["Голос знакомый, но не уверен чей — запоминать не буду."]
local.rejected.speaker_changed: ["Говорил другой человек, поэтому не запомню."]
local.rejected.no_evidence: ["Память не подтвердила запись, так что не запомнил."]
# set_speed / set_pitch (#4022, PR #4039): у активного провайдера нет такой регулировки - тул отказал с причиной
# {speed,pitch}_unsupported, голос не менялся; без этих ключей говорилось общее «Не вышло.»
local.rejected.speed_unsupported: ["У этого голоса скорость не регулируется — речь не изменилась."]
local.rejected.pitch_unsupported: ["У этого голоса тон не регулируется — голос не изменился."]
# «Говори нормально» (Tier-1 prosody_normal, knowledge.PROSODY_NORMAL_KIND): оба сброса удались - одна фраза; один
# отказал - фразы исходов тулов (speed.normal / pitch.normal для удавшегося, local.rejected.* для отказавшего)
prosody.normal: ["Говорю как обычно."]
speed.normal: ["Скорость речи обычная."]
pitch.normal: ["Тон голоса обычный."]
# Шаг темпа и тона (#4074, Tier-1 voice_step и тот же тул из LLM): фраза по действию из результата тула; ось уже на
# границе (причина at_limit, записи не было) - так и говорим, а не «Говорю быстрее» без перемены
speed.faster: ["Говорю быстрее."]
speed.slower: ["Говорю медленнее."]
pitch.lower: ["Говорю ниже."]
pitch.higher: ["Говорю выше."]
speed.faster.at_limit: ["Быстрее уже некуда — скорость на пределе."]
speed.slower.at_limit: ["Медленнее уже некуда — скорость на пределе."]
pitch.lower.at_limit: ["Ниже уже некуда — голос и так самый низкий."]
pitch.higher.at_limit: ["Выше уже некуда — голос и так самый высокий."]

