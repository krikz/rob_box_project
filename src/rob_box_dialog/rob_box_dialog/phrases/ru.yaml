identity.done: ["Запомнил тебя, {name}."]
# #3793: исход register_speaker по SpeakerResult владельца — причина в ключе, нет ключа — общая фраза.
identity.done.already_known: ["Я тебя и так знаю, {name}."]
# #4054 (решение Шифу 27.10): голос уверенно узнан, человек назвался другим именем — второго профиля нет, профиль
# переименован (register_speaker done{renamed}). Мы знакомы; тон по настроению — вариант выбирает код. Старое имя не
# звучит: похожий голос может быть чужим, а чужое имя вслух - утечка.
identity.done.renamed: ["Мы знакомы — я тебя узнал по голосу. Буду звать тебя {name}.",
                        "А мы ведь уже знакомы: голос твой я помню. Теперь зову тебя {name}.",
                        "Голос-то знакомый — мы уже встречались. Хорошо, теперь ты у меня {name}.",
                        "Новое имя, а голос знакомый — меня не проведёшь! Ладно, буду звать тебя {name}.",
                        "Узнал по голосу — мы знакомы. Имя поправил: теперь ты {name}."]
identity.rejected: ["Не смог запомнить голос."]
identity.rejected.too_short: ["Голос не запомнил: фраза слишком короткая."]
# #2925 + #4054: гейт register_speaker - голос уверенно узнан, а имя в реплике человек себе не давал («запомни, что Саша
# любит чай» голосом Нины). Профиль не тронут. Чьим голосом сказано, вслух не называем (как у renamed).
identity.rejected.not_self_introduction: ["Имя {received} к твоему голосу не записываю: себя ты так не называл, а голос твой я уже знаю."]
# #4095: переименование по old_name (register_speaker(old_name=…)) - голос уверенно узнан, а просят переименовать ДРУГУЮ
# запись («зови меня Тамара» голосом Нины + old_name=Саша). Профиль не тронут; имена вслух не звучат: чужое имя - утечка.
identity.rejected.not_own_profile: ["Чужую запись не переименовываю: по голосу ты другой человек."]
identity.timeout: ["Не дождался, пока голос запишется."]
identity.ask_name: ["Как тебя зовут?"]
identity.confirm: ["{name}, это ты?"]
identity.merged: ["Понял, это ты. Объединил записи — в памяти ты {name}."]
identity.kept_apart: ["Понял, вы разные люди. Запомню обоих."]
identity.merge_unclear: ["Не понял ответ — пока оставлю записи раздельно."]
identity.retry_voice: ["Только голос твой я запомнить не успел — скажи, пожалуйста, ещё пару слов."]
# #3993 (решение Шифу 26.10): на «ты меня узнал?» отвечает код по голосу ЭТОЙ фразы (knowledge.RECOGNIZED_PHRASE,
# #4141): ключ — speaker.recognized.<состояние имени speaker_wire.NAME_*> или .unheard (SpeakerResult фразы не пришёл).
# Спорный голос и гипотеза — без вопроса «ты Саша?» и без имени кандидата.
# Без «да»/«нет» в начале: на «ты меня НЕ узнал?» они двусмысленны (ревью PR #4121).
speaker.recognized.confirmed: ["Узнал — ты {name}."]
speaker.recognized.tentative: &recognized_unconfirmed ["Голос знакомый, но не уверен, чей."]
speaker.recognized.contested: *recognized_unconfirmed
speaker.recognized.nameless: ["Голос твой помню, а имени не знаю."]
speaker.recognized.unknown: ["По голосу пока не узнаю."]
speaker.recognized.unheard: ["Пока не уверен, кто ты: голос этой фразы не успел разобрать."]
# #3801 (решение Шифу 21.10): один голос — одна личность; имя меняется фразой; подтверждение — шаблоном нормальной длины.
identity.same_voice: ["Не обманывай — по голосу ты {known}. Хочешь, чтобы я звал тебя иначе, скажи: «зови меня {name}»."]
identity.one_voice: ["Голос-то один и тот же — значит, и человек один, второй записи не будет. Хочешь другое имя — скажи: «зови меня {name}»."]
