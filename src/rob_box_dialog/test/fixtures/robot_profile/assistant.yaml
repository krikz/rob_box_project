# Тестовый профиль продукта «робот» для тестов ядра (ADR-0167 Ш1б): копия профиля робота
# docker/sound/config/assistant.yaml, его таблицы вейков и персоны. Ядро вейков и имени робота не знает (нейтральные
# умолчания); тесты правил над речью робота грузят этот профиль фикстурой (test/conftest.py, test/robot_wake_fixture.py).
# Копию сверяет с настоящим профилем робота tests/unit/dialog/test_robot_profile_fixture_0167.py.
format: 4
name: РОББОКС
wake_words: wake_words.yaml
persona: persona.txt
# Персона агента-оператора ТАРС (Ш1б-4): кто он и откуда им управляют, заключительный абзац - в основу правил
# оператора ядра (rob_box_dialog/prompts/operator.txt). Чат Telegram берёт имя продукта из name.
operator_persona: operator_persona.txt
# Владельцы тулов (Ш1в): у робота есть все порты ядра (rob_box_dialog.owners.TOOL_OWNERS). Тул владельца, которого
# здесь нет, модель не видит ни в одном срезе - колонка, например, не перечислит navigation, mapping, people.
owners:
  - speech
  - hearing
  - memory
  - clock
  - web
  - music
  - sound
  - face
  - speaker_id
  - people
  - navigation
  - mapping
  - battery
  - perception
  - faq
  - telemetry
  - ros
  - vesc
