# Размеченный набор музыкальных реплик (ADR-0157 §4.1, PR-3 #3560).
#
# Каждая строка — реплика человека дословно (как пришла из STT/Telegram, с опечатками) и что код должен из неё
# выделить: mode (piece | set | stop | theme_switch | none), work (composer / title / key — латиницей, как в каталоге),
# instrument (ключ knowledge.INSTRUMENTS), style (ключ knowledge.STYLES). top — чем должен быть первый кандидат выбора
# по каталогу RTTTL: подстроки названия/автора (title_has / artist_has) и чего в нём быть не должно (not_title).
# needs_shifu: true — разметку по ADR/логам однозначно поставить нельзя, решает товарищ Шифу.
# context: set_running — реплика имеет смысл только посреди сета (офлайн-грамматикой без состояния не проверяется).
# known_gap — разметка верна, а код сегодня с ней расходится (известная дыра, тест требует, чтобы расхождение было
# именно здесь: закрыли дыру — снять метку).
#
# Источники: run_0910 — лог voice-assistant 09.10 07:31–07:58 UTC (ADR-0157 §1.1, artifacts_live_check_2026-10-09);
# s7 — приёмка стилей 08.10 (docs/music/acceptance_styles_2026-10-08.md §1); issue#N — фразы закрытых issue;
# pr3 — фразы живой проверки этой карточки.

