# pytest configuration for rob_box_supervisor package (AV-2 skeleton)
# Mirrors src/rob_box_voice/pytest.ini — keeps collection behaviour identical
# across rob_box_* packages so future AV-3..AV-6 tests can plug in without
# surprises. Sourced from ADR-0028 §4.6 (test layout) and rob_box_voice.

[tool:pytest]
# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Directories to search for tests.
#   test/unit/**  — pure unit tests (mocks only, no ROS2 services).
#                   Always safe to run in CI.
testpaths = test/unit
norecursedirs = test/scripts integration benchmarks e2e .* *.egg-info __pycache__

# Command line options
addopts =
    --verbose
    --strict-markers
    --tb=short
    --color=yes
    -ra

# Markers for organising tests
markers =
    unit: Unit tests (fast, no external dependencies)
    integration: Integration tests (may require ROS2 services)
    hardware: Tests requiring physical hardware
    slow: Tests that take > 1 second

[junit_family]
family = xunit1
