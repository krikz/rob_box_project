[develop]
script_dir=$base/lib/rob_box_supervisor
[install]
install_scripts=$base/lib/rob_box_supervisor

[flake8]
# Mirror rob_box_perception: focus the gate on pycodestyle/pyflakes; the
# third-party plugins (blind-except/import-order/docstrings/quotes) live in
# the global flake8 env but their rules are outside the ROS 2 ament style
# contract, and ament_pep257 already owns docstrings separately.
#
# CNL100 (blank line before class def) and WPS — both are pre-existing in
# this codebase (conftest stubs follow each other without blank lines for
# brevity), and we don't enforce the WPS rules globally.
ignore = B902,CNL100,D,I,Q,WPS
max-complexity = 10
max-line-length = 120
exclude = __pycache__,*.egg-info,build,install,.venv
