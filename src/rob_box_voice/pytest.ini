# pytest configuration for rob_box_voice package
# Used by colcon test and pytest

[tool:pytest]
# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Directories to search for tests.
# Two layers:
#   test/unit/**  — pure unit tests (mocks only, no ROS2 services, no opt deps).
#                   Always safe to run in CI.
#   test/*.py     — integration / smoke tests (import rclpy, sounddevice, grpc,
#                   nav2_msgs, std_msgs.Int32, etc.) — require a full workstation
#                   with audio hardware, Yandex Cloud creds, and ROS2 services.
#                   Excluded from default CI run; run them on the robot manually.
# pytest 9.x treats `test/test_*.py` as `test.<name>` module shadows. Scoping
# to test/unit avoids the namespace collision and the import-time ModuleNotFound
# on optional deps.
testpaths = test/unit

# Command line options
addopts = 
    --verbose
    --strict-markers
    --tb=short
    --color=yes
    -ra

# Markers for organizing tests
markers =
    unit: Unit tests (fast, no external dependencies)
    integration: Integration tests (may require ROS2 services)
    hardware: Tests requiring physical hardware (audio devices, etc)
    slow: Tests that take > 1 second
    api: Tests that call external APIs (DeepSeek, Yandex)

# Coverage settings
[coverage:run]
source = rob_box_voice
omit = 
    */test/*
    */tests/*
    */__pycache__/*
    */venv/*
    */build/*
    */install/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod
