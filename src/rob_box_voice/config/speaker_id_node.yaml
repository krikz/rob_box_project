# speaker_id_node.yaml — голосовая биометрия (issue #1077, resemblyzer d-vectors)
#
# speaker_id_node подписывается на /audio/speech_audio (audio_node), вычисляет
# d-vector голоса (resemblyzer), идентифицирует говорящего по /data/speakers.db
# и публикует /voice/speaker/result. dialogue_node использует результат для
# префикса [Говорит <имя>] / [Говорит: незнакомец] — робот различает
# собеседников по голосу, а не только по Yandex speaker_tag (который
# присваивается per-session и не стабилен между сессиями).

speaker_id_node:
  ros__parameters:
    metrics_port: 9112  # issue #1160 — Prometheus metrics endpoint
    enabled: true
    db_path: "/data/speakers.db"
    # Issue #2348/#2440 — пороги калиброваны по /data/speakers.db и должны
    # совпадать с speaker_embeddings.IDENTIFY_THRESHOLD /
    # REGISTER_MATCH_THRESHOLD (тест test_yaml_param_consistency.py).
    identify_threshold: 0.72
    # Issue #2809 -- называть имя вслух (LLM) можно уверенно
    # (band_high) ИЛИ в полосе неопределённости при явном разрыве до
    # конкурента с другим именем (min_gap) -- плоский порог 0.85
    # (первая версия фикса) резал живых людей наравне с импостором,
    # откачен по ревью координатора. is_known/эпитет работают уже от
    # identify_threshold. См. speaker_id_node.py (is_name_confident,
    # _gap_to_other_name, _publish_result) и
    # dialogue_node._apply_speaker_identity.
    name_confidence_band_high: 0.80
    name_confidence_min_gap: 0.15
    register_match_threshold: 0.75
    # Issue #2747 — растущая галерея БЕЗ адаптивного порога. Первая версия
    # этой правки смягчала identify_threshold по размеру галереи — ОТКАЧЕНО
    # после проверки на реальных данных робота (speakers.db.bak-20260921):
    # same-voice и cross-voice cosine пересекаются целиком (same p50=0.786,
    # cross p50=0.536, cross >= 0.45 у 90% пар) — акустического порога,
    # который отделял бы «своего» от «чужого» на одиночном эмбеддинге, не
    # существует. Вместо порога — растим галерею по непрерывности диалога:
    # gallery_warmup_size — потолок числа эмбеддингов за одну growth-сессию,
    # gallery_growth_session_gap_sec — максимальный разрыв между репликами
    # внутри неё. Подробности — speaker_embeddings.GALLERY_WARMUP_SIZE,
    # speaker_id_node._apply_growth_session.
    gallery_warmup_size: 5
    gallery_growth_session_gap_sec: 30.0
    # Issue #2440 — harness-БД фактов для склейки профилей через шов
    # идентичности (тот же файл, что sqlite_db_path у dialogue_node).
    memory_db_path: "/data/harness_voice.db"
    # Issue #2751 — второй писатель фактов (MCP memory_save, таблица
    # voice_facts) — без этого пути merge() терял бы живые факты, см.
    # docstring VoiceIdentitySeam.__init__ и ADR-0128.
    voice_facts_db_path: "/data/voice_memory.db"
    # Issue #2750 — изолированная БД для E2E-акта «Знакомство»; узел
    # переключается на неё только параметром e2e_mode ниже, боевую
    # db_path выше это не трогает. См.
    # speaker_id_node.py:parameters_callback / _apply_e2e_mode.
    e2e_db_path: "/data/speakers.e2e.db"
    # Issue #2750 — переключатель боевая/E2E БД (см. e2e_db_path выше).
    # false — дефолт мастерской. Меняется на роботе ТОЛЬКО E2E-харнессом:
    # ros2 param set /speaker_id_node e2e_mode true|false (тот же приём,
    # что barge_in_policy у dialogue_node). Ручной ssh cp+DELETE FROM по
    # боевой speakers.db, который этот параметр заменяет, — issue #2750.
    e2e_mode: false
    # Issue #2609 — defer resemblyzer warm-load to first real embed_audio.
    # Default False: cold-load is 2-3 s on first inference, acceptable for
    # the biometric cold path (зарегистрироваться / опознать нового
    # собеседника). Eager warm-load at startup costs ~70 MB RSS (CPU-only
    # wheel) on every container restart even when nobody speaks. Set True
    # only if you want the legacy "always-hot model" behaviour.
    resemblyzer_warmup_on_start: false
    sample_rate: 16000
