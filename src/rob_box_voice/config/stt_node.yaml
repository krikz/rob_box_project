# stt_node.yaml — per-node ROS2 config (issue #1004 fix)
#
# Формат — стандартный ROS2: верхний ключ = имя ноды (должно совпадать с
# Node(name=...) в launch), под ним ros__parameters: с плоскими параметрами.
# get_parameter("foo") в ноде находит foo БЕЗ префикса.
#
# Все ключи соответствуют declare_parameter() в stt_node.py 1:1.
# (Ключи vad_timeout/min_speech_duration/provider/language/whisper_* были
# удалены — код их НЕ читает; YAML молча игнорировался, issue #1004.)

stt_node:
  ros__parameters:
    metrics_port: 9111  # issue #1160 — Prometheus metrics endpoint
    model_path: /models/vosk-model-small-ru-0.22
    sample_rate: 16000
    # ===== Fallback/retry/short-phrase (issue #979) =====
    yandex_timeout_s: 5.0
    yandex_max_retries: 1
    retry_backoff_s: 1.0
    min_text_chars: 3
    unclear_phrase: Не расслышал, скажи ещё раз
    unclear_cooldown_s: 5.0
    tts_grace_s: 2.5
