# dialogue_node.yaml — per-node ROS2 config (issue #1004 fix)
#
# Сгенерировано из voice_assistant.yaml при разделении на per-node файлы.
# Меняйте именно этот файл (или src/rob_box_voice/config/<node>.yaml для
# других нод), НЕ voice_assistant.yaml — он остаётся как легаси/источник
# правды для совместимости с тестами test_dialogue_shell.
#
# Формат — стандартный ROS2: верхний ключ = имя ноды (должно совпадать с
# Node(name=...) в launch), под ним ros__parameters: с плоскими параметрами.
# get_parameter("foo") в ноде находит foo БЕЗ префикса.

dialogue_node:
  ros__parameters:
    wake_words:
    - робок
    - робот
    - роббокс
    - робокос
    - роббос
    - робокс
    silence_commands:
    - помолч
    - замолч
    - хватит
    - закрой
    - заткн
    - не меша
    silence_timeout: 3.5
    max_question_time: 20.0
    llm_provider: minimax
    base_url: https://api.minimax.io/v1
    model: MiniMax-M3
    system_prompt_file: master_prompt_compact.txt
    history_max_turns: 20
    dialogue_timeout: 300.0
    faq_mode_enabled: false
    faq_event_config_file: ''
    streaming: false
    sentence_split: true
    tool_provider: ros_mcp
    # Дополнительные ключи для переопределения оператором:
    # (все имеют default в коде — здесь выставляем «безопасные» значения)
    temperature: 0.7
    max_tokens: 500
    agent_max_turns: 20
    enable_mcp_tools: true
    llm_timeout_sec: 90.0
    verbose_llm: true
    llm_streaming: true
    history_excluded_tools:
    - handle_navigation
    sqlite_db_path: ~/.rob_box/voice.db
    # Startup greeting (issue #1003, редизайн 06.08): dialogue_node сам
    # говорит приветствие через N секунд после старта (отдельная нода
    # убрана — теряла фразу из-за гонки с инициализацией tts_node).
    startup_greeting_sec: 12.0
    startup_greeting_text: "Я на связи, все системы в норме!"
    # api_key — пусто → fallback на ENV (DEEPSEEK_API_KEY / MINIMAX_API_KEY / YANDEX_API_KEY).
    # Секреты не хранятся в YAML.
    api_key: ''