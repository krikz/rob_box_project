# Voice Assistant Configuration for ROBBOX
#
# ⚠️ СТРУКТУРА (issue #1004, ADR-0004):
# Стандартный ROS 2 формат: верхний ключ = ИМЯ НОДЫ, под ним
# ``ros__parameters:`` с ПЛОСКИМИ параметрами. get_parameter("foo") в ноде
# находит foo БЕЗ префикса.
#
# ❌ НЕЛЬЗЯ: "/**: ros__parameters: <node>: <param>" — ROS 2 Humble
# превращает вложенность в dotted-имена (dialogue_node.llm_provider),
# которые код не читает → YAML молча игнорируется (именно этот баг
# описывал issue #1004: «поменял строку — не применилось»).
#
# ЖИВЫЕ конфиги — per-node файлы в этой же директории:
#   audio_node.yaml, stt_node.yaml, tts_node.yaml, dialogue_node.yaml,
#   sound_node.yaml, led_node.yaml, command_node.yaml, speaker_id_node.yaml
# Launch грузит каждый файл в свою ноду. Этот файл — человекочитаемая
# сводка (single source of truth для документации/тестов); править для
# продакшена нужно per-node файлы (или docker/vision/config/voice_assistant/
# в docker-деплое — он монтируется в /config/voice_assistant и
# подхватывается launch через config_dir:=).
#
# Все ключи ниже соответствуют declare_parameter() в коде 1:1.

audio_node:
  ros__parameters:
    sample_rate: 16000          # Hz (ReSpeaker max)
    channels: 6                 # 6-канальный RAW-режим (Ch1 = DSP-processed ASR)
    mix_channels: [0]           # Только Ch1 (beamformed+AEC+NS+AGC), issue #1117 round-2
    # chunk_size = frames per buffer (issue #1050). 4096 = 256ms —
    # при 1024 Python-callback не успевал за периодом → paInputOverflow.
    chunk_size: 4096            # frames per buffer
    vad_threshold: 3.5          # dB (GAMMAVAD_SR parameter)
    publish_rate: 10            # Hz для VAD/DOA topics
    device_index: -1            # -1 = auto-detect ReSpeaker
    device_name: "ReSpeaker 4 Mic Array"
    # VAD настройки для определения конца фразы
    speech_continuation: 3.0    # Секунды после окончания речи до публикации
    speech_prefetch: 1.5        # Pre-roll перед началом речи (секунды)
    speech_min_duration: 0.3    # Минимальная длительность фразы (секунды)
    speech_max_duration: 12.0   # Максимальная длительность фразы (секунды)
    # Issue 989 (эхо-петля): grace-период после TTS, не считаем эхо речью.
    tts_grace_s: 2.5
    # music_vad_threshold/min_db — VAD-гейты при активной музыке (strict mode).
    music_vad_threshold: 6.0
    music_vad_min_db: -35.0
    # DSP настройки XVF-3000 (issue #1117 round-2), опциональны.
    dsp_apply_on_start: true
    hpf_on: 1                   # 0=OFF, 1=70Hz, 2=125Hz, 3=180Hz (default firmware)

stt_node:
  ros__parameters:
    # Vosk settings (Phase 3)
    model_path: "/models/vosk-model-small-ru-0.22"
    sample_rate: 16000          # Hz (должен совпадать с audio_node)
    # ===== Fallback/retry/short-phrase (issue #979) =====
    yandex_timeout_s: 5.0       # soft-timeout на один gRPC-streaming вызов Yandex
    yandex_max_retries: 1       # retry на primary перед падением на Vosk
    retry_backoff_s: 1.0        # пауза перед retry
    min_text_chars: 3           # порог для is_short_phrase() (отсечь эхо-мусор)
    unclear_phrase: "Не расслышал, скажи ещё раз"
    unclear_cooldown_s: 5.0     # анти-петля «не расслышал»
    tts_grace_s: 2.5            # grace period после TTS (эхо собственного голоса)
    # Issue #1251 — ранний «бульк» (сигнал «услышал, wake word есть»):
    # как только partial/final STT содержит wake word, публикуем триггер
    # на /voice/sound/trigger → sound_node играет короткий «бульк» через
    # ~2-3с после конца фразы (а не ~8с, когда закончатся LLM+TTS).
    early_boop_enabled: true
    early_boop_trigger: boop

tts_node:
  ros__parameters:
    provider: "minimax"         # "yandex", "silero" или "minimax" — одна строка
    # Параметры для кода (плоские, без вложенности)
    silero_speaker: "aidar"     # Голоса Silero v5: aidar (М), baya (М), kseniya (Ж), xenia (Ж), eugene (М)
    silero_sample_rate: 48000   # Hz (v5)
    normalize_text: true
    chipmunk_mode: false        # Отключено (06.08) — голос шипел/бурундучил
    pitch_shift: 1.0            # Нормальная скорость (1.0x)
    volume_db: -3.0             # Громкость (-3dB = 70%)
    # Silero v5: флаги расстановки ударений
    silero_put_accent: true
    silero_put_yo: true
    silero_put_stress_homo: true
    silero_put_yo_homo: true
    # Yandex TTS settings
    yandex_voice: "anton"       # Мужской голос (оригинальный ROBBOX!)
    yandex_speed: 1.0           # Скорость речи (0.1-3.0)
    # ===== Per-provider TTS chunking (issue #933) =====
    chunk_max_chars_yandex: 250
    chunk_max_chars_silero: 800
    chunk_max_chars_minimax: 5000
    chunk_max_retries: 3
    chunk_min_chars: 50
    # ===== MiniMax TTS (ADR-0003) — секреты из ENV MINIMAX_API_KEY / MINIMAX_GROUP_ID =====
    minimax_voice: "male-qn-qingse"
    minimax_model: "speech-02-hd"
    minimax_language: "ru"
    minimax_speed: 1.0
    minimax_sample_rate: 32000
    minimax_format: "pcm"
    minimax_timeout: 30.0
    minimax_max_retries: 2
    minimax_retry_backoff_ms: 500
    minimax_streaming: false
    # ROS audio bridge
    audio_topic: "/voice/audio/speech"
    audio_output_sample_rate: 16000
    audio_qos_reliability: "best_effort"
    audio_qos_depth: 10
    # Пул синтеза
    synthesis_max_workers: 2
    synthesis_max_queue: 16

dialogue_node:
  ros__parameters:
    # Wake Words - слова для активации голосового ассистента
    wake_words:
      - "робок"
      - "робот"
      - "роббокс"
      - "робокос"
      - "роббос"
      - "робокс"
      - "роберт"
      - "рыбок"
      - "рома"
      - "бот"
      - "робо"
      - "роб"
      - "робик"
    # Таймауты
    dialogue_timeout: 300.0     # Таймаут сессии: 5 минут без wake word → IDLE
    # LLM — приоритетная цепочка провайдеров (issue #1089):
    # первый = primary, остальные = fallbacks. Одна строка для смены.
    llm_providers: "minimax,deepseek"   # minimax | deepseek | mimo | qwen
    # Per-provider секции (опционально; пусто → well-known defaults,
    # см. _LLM_PROVIDER_REGISTRY в dialogue_node.py). Секреты — в ENV.
    system_prompt_file: "master_prompt_compact.txt"
    # История
    history_max_turns: 20       # Скользящее окно: 20 пар user/assistant
    # FAQ mode for events
    faq_mode_enabled: false
    faq_event_config_file: ""   # Например: /config/voice_assistant/event_mode.yaml
    # LLM настройки
    temperature: 0.7
    max_tokens: 500
    agent_max_turns: 20
    enable_mcp_tools: true
    llm_timeout_sec: 90.0
    verbose_llm: true
    llm_streaming: false        # Потоковый вывод LLM
    history_excluded_tools:
      - "handle_navigation"
    sqlite_db_path: "~/.rob_box/voice.db"
    # Issue #1077 — голосовая биометрия
    speaker_id_enabled: true
    speaker_db_path: "/data/speakers.db"
    # Startup greeting (issue #1003)
    startup_greeting_sec: 12.0
    startup_greeting_text: "Я на связи, все системы в норме!"
    # W5a: tool-provider backend (ros_mcp | fake | none)
    tool_provider: "ros_mcp"

sound_node:
  ros__parameters:
    sound_pack_dir: "/ws/sound_pack"
    volume_db: -12.0            # Громкость (dB adjustment)
    trigger_animations: true
    animation_topic: "/animations/trigger"

led_node:
  ros__parameters:
    brightness: 16              # 0-31 (0x00-0x1F)
    auto_mode: true             # Автосмена по /voice/state
    # Цвета для режимов (RGB, 0-255)
    colors:
      idle: [0, 0, 0]           # Выключен
      listening: [0, 255, 0]    # Зелёный
      thinking: [0, 0, 255]     # Синий
      speaking: [0, 255, 255]   # Голубой
      error: [255, 0, 0]        # Красный

command_node:
  ros__parameters:
    confidence_threshold: 0.7   # Минимальная уверенность
    enable_navigation: true     # Nav2 команды
    enable_follow: false        # Следование (Phase 6)
    enable_vision: false        # Зрение (Phase 6)

speaker_id_node:
  ros__parameters:
    enabled: true
    db_path: "/data/speakers.db"
    identify_threshold: 0.75
    sample_rate: 16000
