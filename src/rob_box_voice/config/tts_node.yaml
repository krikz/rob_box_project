# tts_node.yaml — per-node ROS2 config (issue #1004 fix)
#
# Сгенерировано из voice_assistant.yaml при разделении на per-node файлы.
# Меняйте именно этот файл (или src/rob_box_voice/config/<node>.yaml для
# других нод), НЕ voice_assistant.yaml — он остаётся как легаси/источник
# правды для совместимости с тестами test_dialogue_shell.
#
# Формат — стандартный ROS2: верхний ключ = имя ноды (должно совпадать с
# Node(name=...) в launch), под ним ros__parameters: с плоскими параметрами.
# get_parameter("foo") в ноде находит foo БЕЗ префикса.

tts_node:
  ros__parameters:
    provider: minimax
    silero_speaker: aidar
    silero_sample_rate: 48000
    synthesis_max_workers: 2
    synthesis_max_queue: 16
    # minimax_api_key / minimax_group_id — пусто → fallback на ENV
    # (MINIMAX_API_KEY / MINIMAX_GROUP_ID). Секреты не хранятся в YAML.
    minimax_api_key: ''
    minimax_group_id: ''
    prosody_pitch: medium
    normalize_text: true
    chipmunk_mode: false
    pitch_shift: 1.0
    volume_db: -3.0
    silero_put_accent: true
    silero_put_yo: true
    silero_put_stress_homo: true
    silero_put_yo_homo: true
    yandex_api_key: ''
    yandex_voice: anton
    yandex_speed: 1.0
    yandex:
      voice: anton
      speed: 1.0
      emotion: neutral
    chunk_max_chars_yandex: 250
    chunk_max_chars_silero: 800
    chunk_max_chars_minimax: 5000
    chunk_max_retries: 3
    chunk_min_chars: 50
    minimax_voice: male-qn-qingse
    minimax_model: speech-02-hd
    minimax_language: ru
    minimax_speed: 1.0
    minimax_sample_rate: 32000
    minimax_format: pcm
    minimax_timeout: 30.0
    minimax_max_retries: 2
    minimax_retry_backoff_ms: 500
    minimax_streaming: false
    audio_topic: /voice/audio/speech
    audio_output_sample_rate: 16000
    audio_qos_reliability: best_effort
    audio_qos_depth: 10
    cache_dir: ~/.cache/rob_box_voice/tts
    pregenerate: true
    cache_enabled: true