# stt_chain.yaml — STT provider chain configuration (issue #2365, PoC).
#
# Format: plain YAML, read by the future Phase 2 wiring in
# ``stt_node._recognize_with_fallback``. Until then this file is
# documentation-only — the MiniMax provider is shipped but NOT yet
# inserted into the chain (see ADR planned for Phase 2).
#
# Чейн (Phase 2 design, не подключено в Phase 1 PoC):
#
#     vosk  →  minimax  →  yandex
#
# Rationale:
#
# 1. vosk — offline, CPU, всегда доступен, без интернета и квот.
#    Минимальная стоимость, минимальная latency. Слаб для шумных
#    фраз → идём дальше.
# 2. minimax — облачный, дополнительный streaming/diarization.
#    Дешевле Yandex (см. MiniMax pricing в MiniMax-M3 pricing page);
#    даёт speaker-diarization, которая нужна для #2348.
# 3. yandex — primary по качеству для ru-RU; оставлен последним как
#    дорогой, но самый точный fallback.
#
# Phase 2 откроет ROS-параметры ``minimax_stt_enabled`` (default False
# до parity-прогона) и ``minimax_stt_position`` (default ``"between``") в
# stt_node.yaml; см. ``docs/adr/0090-stt-minimax-provider.md`` (TBD).

providers:
  vosk:
    # offline, CPU. Всегда enabled (если модель существует).
    # Текущий параметр: ``model_path`` в stt_node.yaml.
    enabled: true
    position: first

  minimax:
    # PoC: shipped, но chain НЕ подключён. Phase 2 wiring привяжет к
    # ``select_recognition`` через ``MiniMaxSTTProvider.maybe_from_env``.
    enabled: false  # default until parity proven
    position: between  # between vosk and yandex
    api_key_env: MINIMAX_API_KEY
    base_url: https://api.minimax.io
    model: asr-1.0
    language: ru
    timeout_s: 5.0  # per-call, под мягкий yandex_timeout_s
    # diarization / streaming — отложено в Phase 2 (нужен ADR для
    # нового поля в /voice/stt/result — issue #1077).

  yandex:
    # primary в Phase 1, fallback после MiniMax в Phase 2.
    # Текущие параметры: ``yandex_api_key``, ``yandex_language``,
    # ``yandex_model`` в stt_node.yaml.
    enabled: true
    position: last