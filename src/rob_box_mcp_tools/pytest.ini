# pytest configuration for rob_box_mcp_tools package
# Used by colcon test and pytest

[tool:pytest]
# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Directories to search for tests
testpaths = test

# Minimum version of pytest required
minversion = 6.0

# Command line options
addopts = 
    --verbose
    --strict-markers
    --tb=short
    --color=yes
    -ra
    --cov=rob_box_mcp_tools
    --cov-report=term-missing
    --cov-report=html:test/htmlcov
    --cov-report=xml:test/coverage.xml

# Markers for organizing tests
markers =
    unit: Unit tests (fast, no external dependencies, use mocks)
    integration: Integration tests (require ROS2 running)
    llm_api: Tests that call real LLM APIs (require API keys)
    slow: Tests that take > 1 second
    tool_execution: Tests that execute actual tools

# Coverage settings
[coverage:run]
source = rob_box_mcp_tools
omit = 
    */test/*
    */tests/*
    */__pycache__/*
    */venv/*
    */build/*
    */install/*
    */examples/*
    */deepseek_adapter.py

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod
    @abc.abstractmethod

# Minimum coverage percentage
fail_under = 80
