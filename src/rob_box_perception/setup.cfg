[develop]
script_dir=$base/lib/rob_box_perception
[install]
install_scripts=$base/lib/rob_box_perception

[flake8]
# ament_flake8 loads every globally installed flake8 plugin.  The CI image
# carries opinionated third-party plugins (blind-except/import-order/docstrings)
# whose rules are outside the ROS 2 ament style contract.  Keep the gate focused
# on pycodestyle/pyflakes while the matching ament_pep257 test owns docstrings.
ignore = B902,D,I,Q
