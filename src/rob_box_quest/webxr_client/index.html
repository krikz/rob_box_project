<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>rob_box_quest — Captain Bridge</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <canvas id="scene"></canvas>
    <div id="hud">
      <div id="status" class="status status--connecting">CONNECTING…</div>
      <div id="voice-indicator" class="voice-indicator voice-indicator--offline">Voice: unknown</div>
      <div id="panel-info" class="panel-info"></div>
    </div>
    <div id="pin-overlay" class="pin-overlay">
      <form id="pin-form" class="pin-form" autocomplete="off">
        <h1>rob_box_quest</h1>
        <p class="pin-hint">Enter the 6-digit PIN from <code>docker logs rob_box_quest</code></p>
        <input
          id="pin-input"
          type="password"
          inputmode="numeric"
          pattern="[0-9]{6}"
          maxlength="6"
          minlength="6"
          placeholder="123456"
          required
        />
        <button type="submit">Connect</button>
        <p id="pin-error" class="pin-error" hidden>Wrong PIN. Ask the operator.</p>
      </form>
    </div>
    <script type="module" src="/src/entry.ts"></script>
  </body>
</html>
