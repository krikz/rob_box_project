[pytest]
testpaths = test
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -ra --strict-markers --tb=short
markers =
    unit: fast unit tests
    minimax: tests for the MiniMax TTS provider (T2A v2 HTTP)
    integration: integration tests requiring live network or hardware
    slow: tests taking >1 second
asyncio_mode = auto
# Coverage for the MiniMax provider module — failure here means a refactor
# silently dropped branches. Threshold is intentionally a touch below the
# overall project target so a single new test getting skipped doesn't
# red-flag the suite. Bump it as coverage grows.
[coverage:run]
source =
    rob_box_llm
omit =
    */test/*
    */tests/*
    */__pycache__/*
    */venv/*
    */build/*
    */install/*
[coverage:report]
show_missing = True
skip_covered = False
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod
[coverage:report:rob_box_llm.providers.minimax_tts]
# Module-specific threshold. We require 80% minimum — anything less
# almost certainly means a regression in an error-path that was
# previously exercised by tests.
fail_under = 80
