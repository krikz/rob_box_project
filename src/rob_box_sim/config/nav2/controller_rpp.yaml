# Контроллер Regulated Pure Pursuit (nav2_regulated_pure_pursuit_controller,
# Humble) для сравнения в симе, шаг 6. Лимиты те же, что у DWB робота
# (nav2_params.yaml: max_vel_x 0.15, max_vel_theta 0.8, acc_lim_theta 1.0),
# чтобы сравнивать поведение, а не скорость. Параметры DWB в FollowPath
# остаются от базового файла, RPP их не читает.
controller_server:
  ros__parameters:
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.15
      lookahead_dist: 0.6
      min_lookahead_dist: 0.3
      max_lookahead_dist: 0.9
      lookahead_time: 1.5
      use_velocity_scaled_lookahead_dist: false
      transform_tolerance: 0.5
      min_approach_linear_velocity: 0.05
      approach_velocity_scaling_dist: 0.6
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: true
      cost_scaling_dist: 0.3
      cost_scaling_gain: 1.0
      inflation_cost_scaling_factor: 3.0
      regulated_linear_scaling_min_radius: 0.9
      regulated_linear_scaling_min_speed: 0.05
      use_rotate_to_heading: true
      rotate_to_heading_angular_vel: 0.6
      rotate_to_heading_min_angle: 0.785
      max_angular_accel: 1.0
      allow_reversing: false
      max_robot_pose_search_dist: 10.0
      use_interpolation: true
