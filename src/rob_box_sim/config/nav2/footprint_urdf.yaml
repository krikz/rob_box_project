# Габарит — прямоугольник из URDF вместо круга 0.45 (опыт шага 6, на роботе НЕТ).
# Корпус и колёса в плане: x −0.3036…+0.3064, y ±0.27
# (src/rob_box_sim/rob_box_sim/geometry2d.py: ROBOT_FOOTPRINT). Вписанный радиус
# 0.27 м против 0.45 у круга: в проходе 1.2 м полоса, где центр робота не в
# зоне inscribed, — 0.66 м вместо 0.30 м. Настоящие габариты робота (бампер,
# выступы; в nav2_params.yaml «макс. диагональ 0.90 м») надо мерить рулеткой.
local_costmap:
  local_costmap:
    ros__parameters:
      footprint: "[[0.31, 0.27], [0.31, -0.27], [-0.31, -0.27], [-0.31, 0.27]]"
      footprint_padding: 0.0
global_costmap:
  global_costmap:
    ros__parameters:
      footprint: "[[0.31, 0.27], [0.31, -0.27], [-0.31, -0.27], [-0.31, 0.27]]"
      footprint_padding: 0.0
