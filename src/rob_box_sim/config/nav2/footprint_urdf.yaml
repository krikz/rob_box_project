# Габарит — как на роботе: прямоугольник по замеру рулеткой (Шифу 04.11)
# 0.61 м вдоль хода × 0.605 м поперёк, то же, что в боевом nav2_params.yaml.
# Меш base_link.stl в плане: x −0.3036…+0.3064, y ±0.303 — совпадает с замером
# до 1 мм; центр корпуса на 1.4 мм впереди base_footprint
# (src/rob_box_sim/rob_box_sim/geometry2d.py: ROBOT_FOOTPRINT).
# Имя «urdf» оставлено ради SIM_FOOTPRINT=urdf в скриптах стенда.
local_costmap:
  local_costmap:
    ros__parameters:
      footprint: "[[0.3064, 0.3025], [0.3064, -0.3025], [-0.3036, -0.3025], [-0.3036, 0.3025]]"
      footprint_padding: 0.03
global_costmap:
  global_costmap:
    ros__parameters:
      footprint: "[[0.3064, 0.3025], [0.3064, -0.3025], [-0.3036, -0.3025], [-0.3036, 0.3025]]"
      footprint_padding: 0.03
# MPPI (SIM_CONTROLLER=mppi): проверять столкновение по прямоугольнику, а не по
# клетке под центром — иначе углы заходят в стену (серия mppi-urdf: 4 касания из 5
# на turn90). DWB и RPP этот параметр не читают.
controller_server:
  ros__parameters:
    FollowPath:
      ObstaclesCritic:
        consider_footprint: true
