# Контроллер DWB — как на роботе (FollowPath в nav2_params.yaml). Оверлей
# только называет плагин явно, чтобы три профиля сравнения были однотипны:
# SIM_CONTROLLER=dwb|rpp|mppi в docker/sim/compose.yaml.
controller_server:
  ros__parameters:
    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
