# Стенд локализации после перезапуска (#4346, вариант D; #4468 блок «Локализация»).
# Читает rob_box_sim.loc_bench (шаги пробы) и docker/sim/run_loc_bench.sh (поза спавна).
#
# Карта снимается картированием мира со спавна (0, 0, 0) по scenarios/mapping.yaml:
# система map rtabmap = мир Gazebo. Маршрут кончается дома (цель home, курс π),
# и rtabmap при остановке сохраняет в базе последнюю позу (RGBD/StartAtOrigin=false →
# после перезапуска робот встаёт в неё).
#
# spawn_offset — спавн после «перезапуска» относительно истинной позы робота в конце
#   картирования (dx, dy в мире, м; dyaw, рад). (0, 0, 0) — робот не трогали.
# spawn_abs    — спавн в абсолютной позе мира (x, y, yaw).
# event        — от чего считать метрики: restart (старт стека) | kidnap (телепорт).
# probe        — шаги: wait <с> | spin [угол, рад; скорость, рад/с] | kidnap [x, y, yaw].
#                Всё по sim time. Поворот на месте — через twist_mux (cmd_vel_web).

defaults:
  event: restart
  probe: standard
  tolerance:
    pos_tol_m: 0.15
    yaw_tol_deg: 5.0
    hold_s: 5.0
    final_window_s: 5.0
    jump_m: 0.25

probes:
  # 20 с стоит (rtabmap успевает локализоваться по скану), круг влево, круг вправо.
  standard:
    - wait: 20
    - spin: [6.2832, 0.5]
    - wait: 10
    - spin: [-6.2832, 0.5]
    - wait: 15
  # Стоит локализованный, «похищение» в другую часть комнаты, потом та же проба.
  kidnap:
    - wait: 20
    - kidnap: [0.5, -1.5, 1.5708]
    - wait: 15
    - spin: [6.2832, 0.5]
    - wait: 10
    - spin: [-6.2832, 0.5]
    - wait: 15

scenarios:
  # (а) своя база, робот там же, где был при остановке.
  restart_same:
    spawn_offset: [0.0, 0.0, 0.0]
  # (б) своя база, робот сдвинут на 0.5 м (то, что видит Шифу: «дрейф на полметра»).
  restart_shift05:
    spawn_offset: [0.5, 0.0, 0.0]
  # (б') сдвиг 0.5 м и поворот 30°.
  restart_shift05_turn30:
    spawn_offset: [0.4, 0.3, 0.5236]
  # (б'') робот в другой комнате полигона (5 м от сохранённой позы): глобальная локализация.
  restart_far:
    spawn_abs: [5.0, 0.0, 0.0]
  # (в) чужая база (карта другого мира), робот там же, где «был» по базе, и в другом месте.
  foreign_same:
    spawn_offset: [0.0, 0.0, 0.0]
  foreign_far:
    spawn_abs: [5.0, 0.0, 0.0]
  # (г) похищение посреди работы.
  kidnap:
    spawn_offset: [0.0, 0.0, 0.0]
    event: kidnap
    probe: kidnap
