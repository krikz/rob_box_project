# =============================================================================
# Корневой pytest.ini для rob_box_project
# =============================================================================
# Сфокусирован на пакете rob_box_harness (см. src/rob_box_harness/). Другие
# ROS2-пакеты собираются/тестируются через colcon (см. .github/workflows/
# G-Run Tests.yml). Этот файл нужен, чтобы:
#
#   1. Развести сетевые (`network`) и несетевые (`unit`, `harness`) тесты —
#      default-CI запускает только несетевые.
#   2. Дать coverage-гейт >=85% по модулям harness/ и harness/providers/minimax/
#      (соответствует pytest-cov source=rob_box_harness).
#   3. Зафиксировать asyncio_mode=auto, потому что harness async-end-to-end.
# =============================================================================

[pytest]
# Где искать тесты. По умолчанию pytest идёт от корня, что в моно-репо с
# src/* подтянет в выборку вообще всё. Ограничиваемся harness-пакетом.
# Две ветки:
#   * src/rob_box_harness/test         — реализация (с Echo/Upper/etc.).
#   * tests/unit/harness               — поведенческие контракты
#     (фейк-классы, без сети, изолированы от bundled harnesses).
testpaths =
    src/rob_box_harness/test
    tests/unit/harness
# На ROS2-узлах часто встречаются не-pytest test_*.py; ограничиваем шаблон
# явно, чтобы colcon-launch / ament_cmake_pytest не вмешивались.
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# --strict-markers падает, если в коде встретился незарегистрированный маркер.
# Это страховка от опечаток (`@pytest.mark.networks`).
addopts =
    -ra
    --strict-markers
    --tb=short
    --cov=rob_box_harness
    --cov-report=term-missing
    --cov-fail-under=85

# Маркеры. `network` — для тестов, которые стучатся в MiniMax / любой
# внешний сервис. В CI без секретов они skip-аются (см. ниже conftest).
# `integration` оставлен для обратной совместимости с уже существующими
# тестами (например test_integration_offline.py в t_ff5dbbd6): он шире,
# чем network (включает hardware/ROS2), но в CI по умолчанию skip-ается
# тем же механизмом.
markers =
    unit: fast unit tests (no I/O, no network, no hardware)
    harness: tests for the harness framework itself
    integration: integration tests requiring live network or hardware
    network: tests that need real network access (MiniMax, etc.)
    slow: tests taking >1 second
    asyncio: async test (auto-applied when pytest-asyncio plugin is installed)

# `asyncio_mode = auto` is set ONLY when pytest-asyncio plugin is present
# (CI's system pytest from ament_cmake_pytest does not include it).
# The harness test suite uses `asyncio.run()` explicitly so the plugin is
# optional — see harness/README for the rationale.

# Минимальная фильтрация шумных депрекейшенов pytest-asyncio в стектрейсах.
filterwarnings =
    ignore::DeprecationWarning:pytest_asyncio\..*
    ignore::DeprecationWarning:asyncio\..*

# -----------------------------------------------------------------------------
# Coverage
# -----------------------------------------------------------------------------
# Источник покрытия — пакет rob_box_harness. Это включает и
# rob_box_harness/providers/minimax.py. По требованию ТЗ: гейт 85%.
# -----------------------------------------------------------------------------

[coverage:run]
# Считаем только rob_box_harness — вне этого пакета pytest-cov всё равно
# не пойдёт, но фиксируем явно для предсказуемости.
source =
    rob_box_harness
branch = false
# Не считаем тесты, venv, build-артефакты, сгенерированные stub-ы.
omit =
    */test/*
    */tests/*
    */__pycache__/*
    */venv/*
    */build/*
    */install/*
    */.tox/*

[coverage:report]
# Показываем непокрытые строки, чтобы было видно, что дотянуть до 85%.
show_missing = true
skip_covered = false
# `exclude_lines` — стандартный набор NO_COVER-паттернов из pytest-cov docs
# + пара наших. Это исключения из coverage, которые не считаются «не
# покрытыми» (raise NotImplementedError, абстрактные методы и т.д.).
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod
    \.\.\.
# Файлы целиком вне отчёта (если появятся).
exclude_also =
    raise ImportError
# Минимальный порог — дублируем addopts на случай, если кто-то запустит
# `coverage report` без pytest-обёртки.
fail_under = 85
# Показывать точность до 2 знаков для coverage badge.
precision = 2
