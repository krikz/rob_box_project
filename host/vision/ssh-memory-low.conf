# ROBBOX Vision Pi — ssh.service drop-in (MemoryLow/MemoryHigh)
#
# Скопировать в /etc/systemd/system/ssh.service.d/10-robbox-memory-low.conf
# затем `systemctl daemon-reload && systemctl restart ssh.service`.
#
# ADR: docs/adr/0111-vision-pi-zram-swap-and-container-limits.md §2.2
# Issue: #2621 (предложение #2)
#
# Зачем:
#   На Vision Pi под нагрузкой MemAvailable падает до ~400 MB и sshd
#   теряет память → "робот недоступен". MemoryLow/MemoryHigh даёт sshd
#   гарантированный минимум: когда cgroup memory pressure появится, sshd
#   получит notification последним (то есть выживет дольше, чем прикладные
#   контейнеры).
#
# Размеры:
#   MemoryLow=128M   — мягкий лимит, при нехватке sshd не трогают первым
#   MemoryHigh=256M  — жёсткий лимит reclaim, при превышении sshd замедлится,
#                      но НЕ будет OOM-killed (для этого MemoryMax, мы не
#                      хотим убивать ssh намеренно)
#
# Это НЕ MemoryMax (который бы kill'ал sshd при превышении). Семантика
# противоположная задаче.

[Service]
MemoryLow=128M
MemoryHigh=256M