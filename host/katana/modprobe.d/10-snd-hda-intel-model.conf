# snd-hda-intel model override for MSi Katana GF66 (ALC3266)
#
# Symptom: kernel autoconfig reports speaker_outs=0 for codec ALC3266,
#          so the speaker path is never created in the HDA mixer tree.
#          paplay runs (sink RUNNING), but physical speaker is silent.
#
# Theory: the default `alc269-auto` parser mis-categorises Node 0x17 as
#         line_out (type:speaker) but fails to wire speaker_outs, leaving
#         the speaker amplifier muted. Forcing a known-good pin table
#         for the ALC269 family lets the kernel build the right path.
#
# When to apply:  sudo cp <this> /etc/modprobe.d/ && sudo update-initramfs -u && reboot
# Rollback:       sudo rm /etc/modprobe.d/10-snd-hda-intel-model.conf && sudo update-initramfs -u && reboot
#
# See: docs/fixes/KATANA_SPEAKER_FIX_2026-08-30.md
# Issue: https://github.com/krikz/rob_box_project/issues/1732

options snd-hda-intel model=alc269vb-headset-intel
