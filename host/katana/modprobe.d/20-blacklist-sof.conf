# Blacklist Intel SOF (Sound Open Firmware) HDA driver stack for MSi Katana GF66
#
# Symptom: with snd_sof loaded, hda-verb writes return value=0x0 even with
#          sudo — the DSP intercepts HDA verb ioctls. The kernel autoconfig
#          output (`speaker_outs=0` for ALC3266) only appears when SOF is
#          active; the legacy snd-hda-intel driver builds a working speaker
#          path on the same codec.
#
# Loading the legacy driver stack:
#   - snd_hda_intel          (HDA controller)
#   - snd_hda_codec_realtek  (ALC3266 codec parser)
#   - snd_hda_codec_generic  (fallback parser)
#
# Side effects:
#   - Removes DSP effects (no echo cancellation, no microphone beamforming
#     for Intel SoC built-in mics). External USB / 3.5mm mics are unaffected.
#   - If you later need Intel HDA DSP on another machine, remove this file
#     and rerun `sudo update-initramfs -u`.
#
# When to apply:  sudo cp <this> /etc/modprobe.d/ && sudo update-initramfs -u && reboot
# Rollback:       sudo rm /etc/modprobe.d/20-blacklist-sof.conf && sudo update-initramfs -u && reboot
#
# See: docs/fixes/KATANA_SPEAKER_FIX_2026-08-30.md
# Issue: https://github.com/krikz/rob_box_project/issues/1732

blacklist snd_sof
blacklist snd_sof_pci_intel_cnl
blacklist snd_sof_pci_intel_tplg
blacklist snd_sof_intel_hda_common
blacklist snd_sof_pci
blacklist snd_sof_xtensa_dsp
blacklist snd_sof_intel_hda
blacklist soundwire_intel
blacklist snd_soc_acpi_intel_match
blacklist snd_intel_dspcfg
